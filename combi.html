<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unfallatlas – Webkarte (City + FitBounds + Cluster + Heatmap)</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9IIN+0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- MarkerCluster -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    crossorigin=""
  ></script>

  <!-- Heatmap plugin -->
  <script
    src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"
    crossorigin=""
  ></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; }

    .panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 10px 12px; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.18);
      font: 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 380px;
    }

    .panelHeader{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .panelTitle { font-weight: 800; }
    .panelSub { color:#666; font-weight:600; }

    .collapseBtn{
      border: 1px solid rgba(0,0,0,.15);
      background: rgba(250,250,250,.72);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      user-select:none;
      font-weight:700;
      line-height: 1;
    }

    .panelBody { margin-top: 8px; }
    .panel.collapsed .panelBody { display:none; }
    .panel.collapsed { padding-bottom: 8px; }

    .row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin-top: 8px; }
    label { font-weight: 600; }
    select, input {
      width: 100%; padding: 6px 8px;
      border: 1px solid #ddd; border-radius: 8px;
      font: inherit;
      background: rgba(255,255,255,.76);
    }

    .toggles { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: rgba(250,250,250,.76);
      cursor: pointer;
      user-select: none;
      text-align: center;
      font-weight: 700;
    }
    .btn.active { background: rgba(233,242,255,.82); border-color: rgba(183,212,255,.95); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      border: 1px solid #ddd;
      background: rgba(255,255,255,.76);
      border-radius: 999px;
      padding: 6px 10px;
      user-select: none;
    }
    .chip input { width: auto; }
    .chip span { font-weight: 700; }

    .muted { color: #666; font-size: 12px; margin-top: 8px; }
    .stat { margin-top: 8px; font-size: 12px; color: #333; white-space: pre-wrap; }
    code { background: rgba(243,243,243,.82); padding: 1px 4px; border-radius: 6px; }

    .debugBox {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px dashed rgba(0,0,0,.25);
      border-radius: 10px;
      background: rgba(255,255,255,.62);
      font-size: 12px;
      color:#333;
      white-space: pre-wrap;
    }

    /* === Dual Range === */
    .rangeWrap { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .rangeLabel { font-size: 12px; color: #333; display:flex; justify-content:space-between; }
    .dualRange { position: relative; height: 26px; }
    .dualRange input[type="range"]{
      position: absolute;
      left: 0; right: 0;
      top: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      height: 26px;
    }
    .dualRange input[type="range"]::-webkit-slider-thumb{
      pointer-events: auto;
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.25);
      background: rgba(255,255,255,.95);
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    .dualRange input[type="range"]::-moz-range-thumb{
      pointer-events: auto;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.25);
      background: rgba(255,255,255,.95);
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }

    .dualRangeTrack{
      position:absolute; left:0; right:0;
      top: 50%; transform: translateY(-50%);
      height: 6px; border-radius: 999px;
      background: rgba(0,0,0,.12);
    }
    .dualRangeFill{
      position:absolute;
      top: 50%; transform: translateY(-50%);
      height: 6px; border-radius: 999px;
      background: rgba(120,170,255,.75);
      left: 0%; right: 0%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel" id="panel">
    <div class="panelHeader">
      <div>
        <div class="panelTitle">Unfallatlas</div>
        <div class="panelSub" id="panelSub">(Viewport-Render)</div>
      </div>
      <div class="collapseBtn" id="collapseBtn" title="Ein-/Ausklappen">▾</div>
    </div>

    <div class="panelBody" id="panelBody">
      <div class="row">
        <label for="year">Jahr</label>
        <select id="year">
          <option value="all">Alle</option>
        </select>
      </div>

      <div class="row">
        <label for="kat">Kategorie</label>
        <select id="kat">
          <option value="all">Alle</option>
          <option value="1">1 (Getötete)</option>
          <option value="2">2 (Schwer)</option>
          <option value="3">3 (Leicht)</option>
        </select>
      </div>

      <div style="margin-top:10px; font-weight:800;">Beteiligung</div>
      <div class="chips" aria-label="Beteiligung Filter">
        <label class="chip"><input type="checkbox" id="tRad" checked> <span>🚲 Rad</span></label>
        <label class="chip"><input type="checkbox" id="tFuss" checked> <span>🚶 Fuß</span></label>
        <label class="chip"><input type="checkbox" id="tPKW" checked> <span>🚗 PKW</span></label>
        <label class="chip"><input type="checkbox" id="tKrad"> <span>🏍️ Krad</span></label>
      </div>

      <div class="toggles" aria-label="Beteiligungsmodus">
        <div id="modeOr" class="btn active" title="Mindestens eine der ausgewählten Beteiligungen muss zutreffen">ODER</div>
        <div id="modeAnd" class="btn" title="Alle ausgewählten Beteiligungen müssen zutreffen">UND</div>
        <div id="modeSolo" class="btn" title="Genau eine Beteiligungsart insgesamt (Rad/Fuß/PKW/Krad) – passend zu den Häkchen">Alleinunfall</div>
      </div>

      <div style="margin-top:10px; font-weight:800;">Zeit & Bedingungen</div>

      <div class="row">
        <label>Stunde</label>
        <div class="rangeWrap">
          <div class="rangeLabel">
            <span>von: <strong id="hFromLbl">0</strong></span>
            <span>bis: <strong id="hToLbl">23</strong></span>
          </div>

          <div class="dualRange" aria-label="Stundenbereich">
            <div class="dualRangeTrack"></div>
            <div class="dualRangeFill" id="hourFill"></div>
            <input id="hFrom" type="range" min="0" max="23" step="1" value="0" />
            <input id="hTo" type="range" min="0" max="23" step="1" value="23" />
          </div>

          <div class="muted" style="margin-top:0;">
            (Kein Wrap-around mehr: Start ist immer ≤ Ende.)
          </div>
        </div>
      </div>

      <div class="row">
        <label for="weekend">Wochenende</label>
        <select id="weekend" title="UWOCHENTAG: Sa/So vs. Mo–Fr">
          <option value="all">Alle</option>
          <option value="weekend">Nur Wochenende (Sa/So)</option>
          <option value="weekday">Nur Werktag (Mo–Fr)</option>
        </select>
      </div>

      <div class="row">
        <label for="strz">Straßenzustand</label>
        <select id="strz" title="STRZUSTAND: 0 trocken, 1 nass/feucht, 2 winterglatt">
          <option value="all">Alle</option>
        </select>
      </div>

      <div class="row">
        <label for="maxn">Max Punkte</label>
        <input id="maxn" type="number" min="500" step="500" value="40000" />
      </div>

      <div class="row">
        <label for="pad">Viewport-Padding</label>
        <input id="pad" type="number" min="0" max="100" step="5" value="20" />
      </div>

      <div class="row">
        <label for="heatR">Heat Radius</label>
        <input id="heatR" type="number" min="5" max="60" step="1" value="25" />
      </div>

      <div class="toggles">
        <div id="toggleCluster" class="btn active">Cluster</div>
        <div id="toggleHeat" class="btn active">Heatmap</div>
      </div>

      <div class="stat" id="stat">Lade Daten…</div>

      <div class="debugBox" id="debugBox" style="display:none;"></div>

      <div class="muted">
        Quelle: <code id="dataSourceCode">—</code><br/>
        Rendert nur Punkte im Kartenausschnitt (plus Padding).
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    // ---------- Helpers (keine optional chaining / kein replaceAll) ----------
    function safeStr(x){ return (x === null || x === undefined) ? '' : String(x); }

    function normKey(s){
      var t = safeStr(s).toLowerCase();
      t = t.split('ä').join('ae').split('ö').join('oe').split('ü').join('ue').split('ß').join('ss');
      t = t.replace(/[^a-z0-9]+/g, "_").replace(/_+/g, "_").replace(/^_/, "").replace(/_$/, "");
      return t;
    }

    function setText(el, txt){ if (el) el.textContent = safeStr(txt); }

    function escHtml(s) {
      return safeStr(s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // ---------- DOM ----------
    var statEl = document.getElementById('stat');
    var debugBox = document.getElementById('debugBox');

    function dbg(msg){
      debugBox.style.display = "block";
      debugBox.textContent += safeStr(msg) + "\n";
    }

    // ---------- Map: sofort initialisieren (damit du IMMER eine Basiskarte siehst) ----------
    if (!window.L) {
      setText(statEl, "FEHLER: Leaflet (L) ist nicht verfügbar. Prüfe Script-Load / SRI / Netzwerk.");
      return;
    }

    var map = L.map('map', { preferCanvas: true }).setView([52.3759, 9.7320], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap-Mitwirkende'
    }).addTo(map);

    // ---------- City / Data URL ----------
    var DEFAULT_CITY = "Hannover";
    var u = new URL(window.location.href);
    var cityRaw = (u.searchParams.get("city") || DEFAULT_CITY).trim() || DEFAULT_CITY;
    var citySuffix = normKey(cityRaw);

    var DATA_URL = "out/output_all_years_" + citySuffix + ".geojson";

    setText(document.getElementById("panelSub"), "(Viewport-Render) – Stadt: " + cityRaw);
    setText(document.getElementById("dataSourceCode"), DATA_URL);

    // ---------- UI Elements ----------
    var yearEl = document.getElementById('year');
    var katEl = document.getElementById('kat');
    var maxEl = document.getElementById('maxn');
    var padEl = document.getElementById('pad');
    var heatREl = document.getElementById('heatR');
    var btnCluster = document.getElementById('toggleCluster');
    var btnHeat = document.getElementById('toggleHeat');

    var tRadEl = document.getElementById('tRad');
    var tFussEl = document.getElementById('tFuss');
    var tPKWEl = document.getElementById('tPKW');
    var tKradEl = document.getElementById('tKrad');

    var btnModeOr = document.getElementById('modeOr');
    var btnModeAnd = document.getElementById('modeAnd');
    var btnModeSolo = document.getElementById('modeSolo');
    var involvementMode = "or";

    var hFromEl = document.getElementById('hFrom');
    var hToEl = document.getElementById('hTo');
    var hFromLbl = document.getElementById('hFromLbl');
    var hToLbl = document.getElementById('hToLbl');
    var hourFill = document.getElementById('hourFill');

    var weekendEl = document.getElementById('weekend');
    var strzEl = document.getElementById('strz');

    var panelEl = document.getElementById('panel');
    var collapseBtn = document.getElementById('collapseBtn');

    function setCollapsed(on){
      panelEl.classList.toggle('collapsed', on);
      collapseBtn.textContent = on ? "▸" : "▾";
      try { localStorage.setItem("ua_panel_collapsed", on ? "1" : "0"); } catch (e) {}
    }
    try {
      var saved = localStorage.getItem("ua_panel_collapsed");
      if (saved === "1") setCollapsed(true);
    } catch (e) {}
    collapseBtn.addEventListener('click', function(){ setCollapsed(!panelEl.classList.contains('collapsed')); });

    var WEEKEND_SET = { "1": true, "7": true }; // Sonntag + Samstag
    var STRZ_LABEL = { "0":"0 – trocken","1":"1 – nass/feucht","2":"2 – winterglatt","":"— unbekannt" };

    function strzText(code) {
      var k = safeStr(code);
      return (k in STRZ_LABEL) ? STRZ_LABEL[k] : ("Code " + k);
    }

    function involvementText(p) {
      var tags = [];
      if (safeStr(p.istrad) === "1") tags.push("🚲 Rad");
      if (safeStr(p.istfuss) === "1") tags.push("🚶 Fuß");
      if (safeStr(p.istpkw) === "1") tags.push("🚗 PKW");
      if (safeStr(p.istkrad) === "1") tags.push("🏍️ Krad");
      return tags.length ? tags.join(", ") : "—";
    }

    function popupHtml(p) {
      return ''
        + '<div style="font: 14px/1.25 system-ui;">'
        + '<div><strong>' + escHtml(p.name) + '</strong></div>'
        + '<div>Jahr: ' + escHtml(p.year) + '</div>'
        + '<div>Kategorie: ' + escHtml(p.ukategorie) + '</div>'
        + '<div>Beteiligung: ' + escHtml(involvementText(p)) + '</div>'
        + '<div>Uhrzeit: ' + escHtml(p.ustunde) + ' / Wochentag: ' + escHtml(p.uwochentag) + ' / Monat: ' + escHtml(p.umonat) + '</div>'
        + '<div>Straßenzustand: ' + escHtml(strzText(p.strzustand)) + '</div>'
        + '<div>Licht: ' + escHtml(p.ulichtverh) + '</div>'
        + '<div>Straße: ' + escHtml(p.strasse) + '</div>'
        + '</div>';
    }

    function setBtnState(btn, on) { btn.classList.toggle('active', !!on); }

    function syncHourUI(changed){
      var a = parseInt(hFromEl.value, 10);
      var b = parseInt(hToEl.value, 10);

      if (changed === "from" && a > b) { b = a; hToEl.value = String(b); }
      if (changed === "to"   && b < a) { a = b; hFromEl.value = String(a); }

      hFromLbl.textContent = String(a);
      hToLbl.textContent = String(b);

      var min = parseInt(hFromEl.min,10);
      var max = parseInt(hFromEl.max,10);
      var span = (max - min) || 1;

      var leftPct = ((a - min) / span) * 100;
      var rightPct = 100 - ((b - min) / span) * 100;

      hourFill.style.left = leftPct + "%";
      hourFill.style.right = rightPct + "%";
    }

    function buildYearOptions(features) {
      var years = {};
      for (var i=0; i<features.length; i++) {
        var y = features[i] && features[i].properties ? features[i].properties.year : null;
        if (y !== null && y !== undefined && y !== "") years[String(y)] = true;
      }
      var keys = Object.keys(years).sort();
      for (var k=0; k<keys.length; k++){
        var opt = document.createElement('option');
        opt.value = keys[k];
        opt.textContent = keys[k];
        yearEl.appendChild(opt);
      }
    }

    function buildStrzOptions(points) {
      var codes = { "": true };
      for (var i=0; i<points.length; i++){
        var v = points[i] && points[i].props ? points[i].props.strzustand : "";
        v = safeStr(v);
        codes[v] = true;
      }
      var sorted = Object.keys(codes).sort(function(a,b){
        var ai = (a === "" ? 999 : parseInt(a,10));
        var bi = (b === "" ? 999 : parseInt(b,10));
        return ai - bi;
      });
      for (var j=0; j<sorted.length; j++){
        var c = sorted[j];
        var opt = document.createElement('option');
        opt.value = (c === "" ? "__unknown__" : c);
        opt.textContent = strzText(c);
        strzEl.appendChild(opt);
      }
    }

    function extractPoints(geojson) {
      var pts = [];
      var feats = geojson && geojson.features ? geojson.features : [];
      for (var i=0; i<feats.length; i++){
        var f = feats[i];
        if (!f || !f.geometry || f.geometry.type !== "Point") continue;
        var coord = f.geometry.coordinates;
        if (!coord || coord.length < 2) continue;
        var lon = coord[0], lat = coord[1];
        if (typeof lat !== "number" || typeof lon !== "number") continue;
        pts.push({ lat: lat, lon: lon, props: f.properties || {} });
      }
      return pts;
    }

    function computeBounds(pts){
      if (!pts.length) return null;
      var minLat=  999, maxLat= -999, minLon=  999, maxLon= -999;
      for (var i=0; i<pts.length; i++){
        var p = pts[i];
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      }
      if (minLat > maxLat || minLon > maxLon) return null;
      return L.latLngBounds([minLat, minLon], [maxLat, maxLon]);
    }

    function getPaddedBounds() {
      var padPct = Math.max(0, Math.min(100, parseInt(padEl.value || "20", 10))) / 100.0;
      var b = map.getBounds();
      var latSpan = b.getNorth() - b.getSouth();
      var lonSpan = b.getEast() - b.getWest();
      var dLat = latSpan * padPct;
      var dLon = lonSpan * padPct;
      return L.latLngBounds(
        [b.getSouth() - dLat, b.getWest() - dLon],
        [b.getNorth() + dLat, b.getEast() + dLon]
      );
    }

    // ---------- State ----------
    var showCluster = true;
    var showHeat = true;

    var all = null;
    var allPts = [];
    var filteredGlobal = [];
    var viewportPts = [];

    var clusterLayer = null;
    var heatLayer = null;

    function setMode(next){
      involvementMode = next;
      setBtnState(btnModeOr, next === "or");
      setBtnState(btnModeAnd, next === "and");
      setBtnState(btnModeSolo, next === "solo");
      applyGlobalFilter();
      applyViewportFilter();
      renderLayers();
    }

    function applyGlobalFilter() {
      if (!all) return;

      var wantYear = yearEl.value;
      var wantKat = katEl.value;
      var wantStrz = strzEl.value;

      var maxN = Math.max(500, parseInt(maxEl.value || "40000", 10));

      var hFrom = parseInt(hFromEl.value || "0", 10);
      var hTo   = parseInt(hToEl.value || "23", 10);

      var weekendMode = weekendEl.value;

      var sRad  = tRadEl.checked;
      var sFuss = tFussEl.checked;
      var sPKW  = tPKWEl.checked;
      var sKrad = tKradEl.checked;
      var anySelected = sRad || sFuss || sPKW || sKrad;

      var out = [];
      for (var i=0; i<allPts.length; i++) {
        var p = allPts[i];
        var pr = p.props || {};

        if (wantYear !== "all" && safeStr(pr.year) !== wantYear) continue;
        if (wantKat !== "all" && safeStr(pr.ukategorie) !== wantKat) continue;

        if (wantStrz !== "all") {
          var z = safeStr(pr.strzustand);
          if (wantStrz === "__unknown__") {
            if (z !== "" && z !== "null" && z !== "undefined") continue;
          } else {
            if (z !== safeStr(wantStrz)) continue;
          }
        }

        if (weekendMode !== "all") {
          var wd = safeStr(pr.uwochentag);
          var isWeekend = !!WEEKEND_SET[wd];
          if (weekendMode === "weekend" && !isWeekend) continue;
          if (weekendMode === "weekday" && isWeekend) continue;
        }

        var h = parseInt(pr.ustunde, 10);
        if (isNaN(h)) continue;
        if (h < hFrom || h > hTo) continue;

        var isRad  = safeStr(pr.istrad)  === "1";
        var isFuss = safeStr(pr.istfuss) === "1";
        var isPKW  = safeStr(pr.istpkw)  === "1";
        var isKrad = safeStr(pr.istkrad) === "1";

        if (!anySelected) continue;

        if (involvementMode === "or") {
          var ok =
            (sRad  && isRad)  ||
            (sFuss && isFuss) ||
            (sPKW  && isPKW)  ||
            (sKrad && isKrad);
          if (!ok) continue;
        } else if (involvementMode === "and") {
          if (sRad  && !isRad)  continue;
          if (sFuss && !isFuss) continue;
          if (sPKW  && !isPKW)  continue;
          if (sKrad && !isKrad) continue;
        } else if (involvementMode === "solo") {
          var involvedCount = (isRad?1:0)+(isFuss?1:0)+(isPKW?1:0)+(isKrad?1:0);
          if (involvedCount !== 1) continue;
          var ok2 =
            (sRad  && isRad)  ||
            (sFuss && isFuss) ||
            (sPKW  && isPKW)  ||
            (sKrad && isKrad);
          if (!ok2) continue;
        }

        out.push(p);
        if (out.length >= maxN) break;
      }

      filteredGlobal = out;
    }

    function applyViewportFilter() {
      var vb = getPaddedBounds();
      var out = [];
      for (var i=0; i<filteredGlobal.length; i++) {
        var p = filteredGlobal[i];
        if (vb.contains([p.lat, p.lon])) out.push(p);
      }
      viewportPts = out;
    }

    function renderLayers() {
      if (clusterLayer) { clusterLayer.remove(); clusterLayer = null; }
      if (heatLayer) { heatLayer.remove(); heatLayer = null; }

      var pts = viewportPts;

      if (showCluster) {
        clusterLayer = L.markerClusterGroup({
          chunkedLoading: true,
          chunkInterval: 200,
          spiderfyOnMaxZoom: true,
          showCoverageOnHover: false
        });

        for (var i=0; i<pts.length; i++) {
          var p = pts[i];
          var m = L.circleMarker([p.lat, p.lon], { radius: 4 });
          m.bindPopup(popupHtml(p.props));
          clusterLayer.addLayer(m);
        }
        clusterLayer.addTo(map);
      }

      if (showHeat) {
        var r = Math.max(5, Math.min(60, parseInt(heatREl.value || "25", 10)));
        var heatPts = [];
        for (var j=0; j<pts.length; j++){
          var pp = pts[j];
          var k = safeStr((pp.props||{}).ukategorie);
          var w = (k === "1") ? 1.0 : (k === "2") ? 0.7 : (k === "3") ? 0.4 : 0.5;
          heatPts.push([pp.lat, pp.lon, w]);
        }

        heatLayer = L.heatLayer(heatPts, { radius: r, blur: 18, maxZoom: 17 }).addTo(map);
      }

      var activeTypes = [];
      if (tRadEl.checked) activeTypes.push("Rad");
      if (tFussEl.checked) activeTypes.push("Fuß");
      if (tPKWEl.checked) activeTypes.push("PKW");
      if (tKradEl.checked) activeTypes.push("Krad");

      var modeLabel = (involvementMode === "or") ? "ODER" : (involvementMode === "and") ? "UND" : "Alleinunfall";

      setText(statEl,
        "Stadt: " + cityRaw + " | " +
        "Gesamt geladen: " + allPts.length.toLocaleString() + " | " +
        "Nach Filter: " + filteredGlobal.length.toLocaleString() + " | " +
        "Im Viewport: " + viewportPts.length.toLocaleString() + " | " +
        "Beteiligung: " + (activeTypes.length ? activeTypes.join(", ") : "—") + " | " +
        "Modus: " + modeLabel + " | " +
        "Stunden: " + hFromEl.value + "–" + hToEl.value
      );
    }

    var moveTimer = null;
    function scheduleViewportUpdate() {
      if (!all) return;
      if (moveTimer) clearTimeout(moveTimer);
      moveTimer = setTimeout(function(){
        applyViewportFilter();
        renderLayers();
      }, 150);
    }

    // ---------- Main ----------
    function main() {
      setText(statEl, "Lade Daten…\n" + DATA_URL);
      dbg("Starting load: " + DATA_URL);

      // Optional: Cache-Busting (falls Pages aggressiv cached)
      var url = DATA_URL + "?v=" + Date.now();

      return fetch(url, { cache: "no-store" }).then(function(resp){
        dbg("HTTP status: " + resp.status);
        if (!resp.ok) throw new Error("GeoJSON konnte nicht geladen werden (" + resp.status + "). Erwartet: " + DATA_URL);
        return resp.text().then(function(txt){
          // JSON parse mit besserer Fehlermeldung
          try {
            return JSON.parse(txt);
          } catch (e) {
            var head = txt.slice(0, 300);
            var tail = txt.slice(Math.max(0, txt.length - 300));
            throw new Error("JSON.parse failed: " + e + "\n---HEAD---\n" + head + "\n---TAIL---\n" + tail);
          }
        });
      }).then(function(geo){
        all = geo;

        var feats = (all && all.features) ? all.features : [];
        buildYearOptions(feats);

        allPts = extractPoints(all);
        buildStrzOptions(allPts);

        // FitBounds auf komplette Daten (einmalig beim Laden)
        var b = computeBounds(allPts);
        if (b) {
          map.fitBounds(b, { padding: [20,20] });
          dbg("fitBounds applied.");
        } else {
          dbg("fitBounds skipped (no bounds).");
        }

        syncHourUI();

        applyGlobalFilter();
        applyViewportFilter();
        renderLayers();

        // Listeners
        var simpleEls = [yearEl, katEl, maxEl, strzEl, weekendEl];
        for (var i=0; i<simpleEls.length; i++){
          simpleEls[i].addEventListener('change', function(){
            applyGlobalFilter(); applyViewportFilter(); renderLayers();
          });
        }

        hFromEl.addEventListener('input', function(){
          syncHourUI("from");
          applyGlobalFilter(); applyViewportFilter(); renderLayers();
        });
        hToEl.addEventListener('input', function(){
          syncHourUI("to");
          applyGlobalFilter(); applyViewportFilter(); renderLayers();
        });

        var chkEls = [tRadEl, tFussEl, tPKWEl, tKradEl];
        for (var j=0; j<chkEls.length; j++){
          chkEls[j].addEventListener('change', function(){
            applyGlobalFilter(); applyViewportFilter(); renderLayers();
          });
        }

        btnModeOr.addEventListener('click', function(){ setMode("or"); });
        btnModeAnd.addEventListener('click', function(){ setMode("and"); });
        btnModeSolo.addEventListener('click', function(){ setMode("solo"); });
        setMode("or");

        padEl.addEventListener('change', function(){ applyViewportFilter(); renderLayers(); });
        heatREl.addEventListener('change', function(){ renderLayers(); });

        btnCluster.addEventListener('click', function(){
          showCluster = !showCluster;
          setBtnState(btnCluster, showCluster);
          renderLayers();
        });
        btnHeat.addEventListener('click', function(){
          showHeat = !showHeat;
          setBtnState(btnHeat, showHeat);
          renderLayers();
        });

        setBtnState(btnCluster, showCluster);
        setBtnState(btnHeat, showHeat);

        map.on('moveend zoomend', scheduleViewportUpdate);

      }).catch(function(err){
        // Fehler sichtbar machen (UI + console)
        console.error(err);
        setText(statEl, "FEHLER:\n" + err);
        dbg("ERROR: " + err);
      });
    }

    // Start
    syncHourUI();
    main();

  })();
  </script>
</body>
</html>
