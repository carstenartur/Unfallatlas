<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unfallwerkbank – Showcase</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0; padding: 0;
      font: 14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #1a1c22;
      color: #eee;
    }

    /* ── Layout ─────────────────────────────────── */
    .wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ── Header / Controls ───────────────────────── */
    .header {
      flex-shrink: 0;
      background: rgba(30, 32, 42, 0.97);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,.1);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      z-index: 10;
    }

    .headerTitle {
      font-weight: 900;
      font-size: 15px;
      white-space: nowrap;
    }
    .headerTitle a {
      color: #8bc4ff;
      text-decoration: none;
    }
    .headerTitle a:hover { text-decoration: underline; }

    .progressInfo {
      flex: 1;
      min-width: 160px;
    }
    .progressLabel {
      font-size: 13px;
      font-weight: 700;
      color: #cde;
    }
    .progressSub {
      font-size: 11px;
      color: rgba(200,220,255,.55);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progressBar {
      height: 3px;
      background: rgba(255,255,255,.12);
      border-radius: 999px;
      margin-top: 4px;
      overflow: hidden;
    }
    .progressFill {
      height: 100%;
      background: rgba(99,179,255,.85);
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ctrlBtn {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.18);
      color: #eee;
      padding: 7px 13px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
      line-height: 1;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .ctrlBtn:hover { background: rgba(255,255,255,.2); }
    .ctrlBtn.active {
      background: rgba(60,130,255,.35);
      border-color: rgba(100,170,255,.5);
    }

    .speedSel {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      color: #eee;
      padding: 7px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .speedSel option { background: #222; }

    /* ── Dot indicators ───────────────────────────── */
    .dotRow {
      flex-basis: 100%;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.22);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      flex-shrink: 0;
    }
    .dot.active {
      background: rgba(99,179,255,.9);
      transform: scale(1.4);
    }
    .dot:hover { background: rgba(99,179,255,.6); }

    /* ── iframe ────────────────────────────────────── */
    .frameWrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .frameWrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .frameLoading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(26,28,34,.7);
      font-size: 14px;
      color: rgba(200,220,255,.7);
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .frameLoading.hidden { opacity: 0; }

    /* ── Open-link overlay ─────────────────────────── */
    .openLink {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(30,32,42,.88);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      color: #8bc4ff;
      text-decoration: none;
      backdrop-filter: blur(6px);
      z-index: 5;
      font-weight: 700;
    }
    .openLink:hover { background: rgba(50,60,90,.9); }

    /* ── Responsive ────────────────────────────────── */
    @media (max-width: 560px) {
      .header { padding: 6px 10px; gap: 6px 10px; }
      .headerTitle { font-size: 13px; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="headerTitle">
      <a href="werkbank_v2.html" title="Zur interaktiven Werkbank">🗺️ Unfallwerkbank</a>
      &nbsp;–&nbsp; Showcase
    </div>

    <div class="progressInfo">
      <div class="progressLabel" id="progressLabel">1 / 5 – Startansicht</div>
      <div class="progressSub" id="progressSub">Bonn – Übersicht</div>
      <div class="progressBar"><div class="progressFill" id="progressFill" style="width:20%"></div></div>
    </div>

    <div class="controls">
      <button class="ctrlBtn" id="btnPrev" title="Vorheriges Beispiel">◀</button>
      <button class="ctrlBtn active" id="btnPlayPause" title="Play / Pause">⏸</button>
      <button class="ctrlBtn" id="btnNext" title="Nächstes Beispiel">▶</button>
      <select class="speedSel" id="speedSel" title="Anzeigedauer pro Beispiel">
        <option value="8000">8 s</option>
        <option value="12000" selected>12 s</option>
        <option value="20000">20 s</option>
        <option value="30000">30 s</option>
      </select>
    </div>

    <div class="dotRow" id="dotRow"></div>
  </div>

  <div class="frameWrap">
    <iframe id="showcaseFrame" title="Unfallwerkbank Beispiel" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
    <div class="frameLoading" id="frameLoading">Lade…</div>
    <a class="openLink" id="openLink" href="#" target="_blank" rel="noopener" title="Beispiel in neuem Tab öffnen">↗ In neuem Tab öffnen</a>
  </div>
</div>

<script>
  "use strict";

  const BASE = "werkbank_v2.html";

  // Example URLs derived from README
  const EXAMPLES = [
    {
      label: "Stadtübersicht Bonn",
      sub: "Alle Unfälle – Startansicht",
      url: BASE + "?city=Bonn&severity=all&dayType=all&roadCondition=all&hourFrom=0&hourTo=23" +
           "&includeCyclist=1&includePedestrian=1&includeCar=1&includeMotorcycle=0" +
           "&involvementMode=or&showCluster=1&showHeatmap=0&showOnlyAboveAverage=0" +
           "&centerLat=50.7360&centerLon=7.1000&zoom=12"
    },
    {
      label: "Rad + Auto am Bonner Hbf",
      sub: "🚲+🚗 UND-Modus, Heatmap – Rad-PKW-Kollisionen",
      url: BASE + "?city=Bonn&includeCyclist=1&includePedestrian=0&includeCar=1&includeMotorcycle=0" +
           "&involvementMode=and&showCluster=0&showHeatmap=1&showOnlyAboveAverage=0" +
           "&severity=all&dayType=all&roadCondition=all&hourFrom=0&hourTo=23" +
           "&centerLat=50.7326&centerLon=7.0963&zoom=16" +
           "&selSouth=50.7300&selWest=7.0910&selNorth=50.7355&selEast=7.1010"
    },
    {
      label: "Fahrrad-Alleinunfälle",
      sub: "🚲 Alleinunfall-Modus – Infrastrukturmängel erkennen",
      url: BASE + "?city=Bonn&includeCyclist=1&includePedestrian=0&includeCar=0&includeMotorcycle=0" +
           "&involvementMode=solo&showCluster=1&showHeatmap=0&showOnlyAboveAverage=0" +
           "&severity=all&dayType=all&roadCondition=all&hourFrom=0&hourTo=23" +
           "&centerLat=50.7350&centerLon=7.1000&zoom=13"
    },
    {
      label: "Schulwegsicherheit",
      sub: "🚲+🚶 ODER-Modus, 6–18 Uhr – POIs sichtbar (Schulen/Kitas)",
      url: BASE + "?city=Bonn&includeCyclist=1&includePedestrian=1&includeCar=0&includeMotorcycle=0" +
           "&involvementMode=or&showCluster=1&showHeatmap=0&showOnlyAboveAverage=0" +
           "&severity=all&dayType=all&roadCondition=all&hourFrom=6&hourTo=18" +
           "&centerLat=50.7350&centerLon=7.0950&zoom=16"
    },
    {
      label: "Heatmap – Häufungszonen",
      sub: "🚲 Alleinunfall, Heatmap aktiv – Unfallschwerpunkte",
      url: BASE + "?city=Bonn&includeCyclist=1&includePedestrian=0&includeCar=0&includeMotorcycle=0" +
           "&involvementMode=solo&showCluster=1&showHeatmap=1&showOnlyAboveAverage=0" +
           "&severity=all&dayType=all&roadCondition=all&hourFrom=0&hourTo=23" +
           "&centerLat=50.7390&centerLon=7.1160&zoom=15"
    }
  ];

  let currentIndex = 0;
  let isPlaying = true;
  let timer = null;
  let intervalMs = 12000;

  const frame = document.getElementById("showcaseFrame");
  const loading = document.getElementById("frameLoading");
  const progLabel = document.getElementById("progressLabel");
  const progSub = document.getElementById("progressSub");
  const progFill = document.getElementById("progressFill");
  const dotRow = document.getElementById("dotRow");
  const openLink = document.getElementById("openLink");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnPP = document.getElementById("btnPlayPause");
  const speedSel = document.getElementById("speedSel");

  // Build dot indicators
  EXAMPLES.forEach((_, i) => {
    const dot = document.createElement("div");
    dot.className = "dot" + (i === 0 ? " active" : "");
    dot.title = EXAMPLES[i].label;
    dot.addEventListener("click", () => goTo(i));
    dotRow.appendChild(dot);
  });

  function getDots() {
    return dotRow.querySelectorAll(".dot");
  }

  function updateUI() {
    const ex = EXAMPLES[currentIndex];
    progLabel.textContent = `${currentIndex + 1} / ${EXAMPLES.length} – ${ex.label}`;
    progSub.textContent = ex.sub;
    progFill.style.width = `${((currentIndex + 1) / EXAMPLES.length) * 100}%`;
    openLink.href = ex.url;

    const dots = getDots();
    dots.forEach((d, i) => d.classList.toggle("active", i === currentIndex));
  }

  function loadExample(index) {
    currentIndex = index;
    const ex = EXAMPLES[index];
    loading.classList.remove("hidden");

    frame.onload = () => {
      loading.classList.add("hidden");
    };
    frame.src = ex.url;
    updateUI();

    if (isPlaying) scheduleNext();
  }

  function scheduleNext() {
    cancelTimer();
    timer = setTimeout(() => {
      const next = (currentIndex + 1) % EXAMPLES.length;
      loadExample(next);
    }, intervalMs);
  }

  function cancelTimer() {
    if (timer !== null) { clearTimeout(timer); timer = null; }
  }

  function goTo(index) {
    cancelTimer();
    loadExample(index);
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    btnPP.textContent = isPlaying ? "⏸" : "▶";
    btnPP.classList.toggle("active", isPlaying);
    if (isPlaying) scheduleNext();
    else cancelTimer();
  }

  btnPrev.addEventListener("click", () => {
    cancelTimer();
    const prev = (currentIndex - 1 + EXAMPLES.length) % EXAMPLES.length;
    loadExample(prev);
  });

  btnNext.addEventListener("click", () => {
    cancelTimer();
    const next = (currentIndex + 1) % EXAMPLES.length;
    loadExample(next);
  });

  btnPP.addEventListener("click", togglePlay);

  speedSel.addEventListener("change", () => {
    intervalMs = Number(speedSel.value) || 12000;
    if (isPlaying) scheduleNext(); // reset timer with new interval
  });

  // Keyboard navigation
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowDown") {
      btnNext.click();
    } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
      btnPrev.click();
    } else if (e.key === " " || e.key === "p") {
      e.preventDefault();
      togglePlay();
    }
  });

  // Start
  loadExample(0);
</script>
</body>
</html>
