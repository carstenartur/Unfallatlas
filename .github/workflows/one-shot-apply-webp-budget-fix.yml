name: One-shot apply WebP budget fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

# The 2fps candidate was correctly rejected because it could miss the short
# same-frame composite slope/traffic witness. Kept only as an auditable record;
# this control PR is never a product merge candidate.
jobs:
  apply:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Rejected 2fps WebP candidate is retired.'
