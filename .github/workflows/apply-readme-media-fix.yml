name: Bootstrap README media visibility repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-readme-media-fix.yml'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: readme-media-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    name: Generate, validate and promote readable documentation media
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure the generated commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git branch --show-current)" = '${{ github.event.pull_request.head.ref }}'
          test -z "$(git status --porcelain)"

      - name: Assemble and apply the fail-closed media repair
        run: |
          cat scripts/.apply-readme-media-fix.part-* > scripts/apply-readme-media-fix.cjs
          node --check scripts/apply-readme-media-fix.cjs
          node scripts/apply-readme-media-fix.cjs apply

      - name: Generate and validate current documentation media
        shell: bash
        env:
          DOCUMENTATION_APP_BASE_URL: http://localhost:8000
        run: |
          set -o pipefail
          mkdir -p out/qa
          mvn -B -ntp verify -Pdocumentation-live -Ddocumentation.liveLinks=true \
            | tee out/qa/bootstrap-documentation-live.log

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-media-bootstrap-diagnostics-${{ github.run_id }}
          path: |
            out/qa/
            playwright-report/
            test-results/
            docs/screenshots/*.png
            _site/build-manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the exact reviewed screenshot candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-media-repair-${{ github.run_id }}
          path: |
            docs/screenshots/*.png
            out/qa/screenshot-readiness/*.json
            out/qa/screenshot-evidence.json
            out/qa/live-cartography-evidence.json
            out/qa/documentation-media.json
            out/qa/documentation-live-links/
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Resolve uploaded artifact metadata
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="readme-media-repair-${GITHUB_RUN_ID}"
          metadata="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"${name}\") | [.id, .digest] | @tsv")"
          test -n "$metadata"
          IFS=$'\t' read -r artifact_id artifact_digest <<< "$metadata"
          artifact_digest="${artifact_digest#sha256:}"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$artifact_digest" =~ ^[a-f0-9]{64}$ ]]
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Promote the exact candidate and its evidence
        shell: bash
        env:
          SCREENSHOT_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_digest }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          SCREENSHOT_ARTIFACT_NAME: readme-media-repair-${{ github.run_id }}
        run: |
          set -o pipefail
          node scripts/apply-readme-media-fix.cjs promote 2>&1 \
            | tee out/qa/bootstrap-promote.log

      - name: Upload promotion diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-media-promotion-diagnostics-${{ github.run_id }}
          path: out/qa/bootstrap-promote.log
          if-no-files-found: warn
          retention-days: 14

      - name: Remove the generated bootstrap script and parts
        run: |
          node scripts/apply-readme-media-fix.cjs cleanup
          rm -f scripts/.apply-readme-media-fix.part-*

      - name: Validate the final promoted repository state
        run: |
          npm run validate:media -- --report out/qa/readme-media-strict.json
          npm test -- --runInBand \
            tests/unit/featuredDocumentationMediaContract.test.js \
            tests/unit/documentationDeepLinkContract.test.js \
            tests/integration/documentationDeepLinkRepositoryContract.test.js \
            tests/unit/docMediaPolicy.test.js \
            tests/unit/screenshotPdfEmbeddedScript.test.js \
            tests/unit/liveDocumentationScreenshots.test.js \
            tests/unit/workflowMavenOwnership.test.js

      - name: Commit the reviewed media, contracts and durable evidence
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Repair produced no changes'; exit 1; }
          git commit -m 'fix(docs): make README accident evidence visible'
          git push origin HEAD:'${{ github.event.pull_request.head.ref }}'
