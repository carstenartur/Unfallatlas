name: Align context fallback with canonical city slugs

on:
  push:
    branches:
      - agent/resilient-context-refresh
    paths:
      - '.github/workflows/patch-context-slug.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/resilient-context-refresh
          persist-credentials: true

      - name: Use the same slug contract as the context generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path('scripts/run-context-enrichment.js')
          text = script.read_text(encoding='utf-8')
          old_import = "const { validateAll: validateContextDatasets } = require('./check-context-datasets');\n"
          new_import = old_import + "const { slugify } = require('./lib/static-data-validation');\n"
          if old_import not in text or "require('./lib/static-data-validation')" in text:
              raise SystemExit('expected validator import anchor not found or patch already applied')
          text = text.replace(old_import, new_import, 1)
          old_function = """function citySlug(value) {
            return String(value || '')
              .toLowerCase()
              .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');
          }
          """
          new_function = """function citySlug(value) {
            return slugify(value);
          }
          """
          if old_function not in text:
              raise SystemExit('expected citySlug implementation not found')
          script.write_text(text.replace(old_function, new_function, 1), encoding='utf-8')

          test = Path('tests/unit/runContextEnrichment.test.js')
          test_text = test.read_text(encoding='utf-8')
          test_text = test_text.replace(
              "expect(enrichment.citySlug('Frankfurt am Main')).toBe('frankfurt-am-main');",
              "expect(enrichment.citySlug('Frankfurt am Main')).toBe('frankfurt_am_main');",
          )
          test.write_text(test_text, encoding='utf-8')
          PY

      - name: Commit the canonical slug fix
        shell: bash
        run: |
          set -euo pipefail
          git add -- scripts/run-context-enrichment.js tests/unit/runContextEnrichment.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use canonical city slugs for stale context validation'
          git push origin HEAD:agent/resilient-context-refresh
