name: Format validated source manifest

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-source-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source-manifest branch
        uses: actions/checkout@v7
        with:
          ref: feat/source-manifest-core
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format validated implementation
        run: npx --yes prettier@3.6.2 --write js/ua.source_manifest.js tests/unit/sourceManifest.test.js
      - name: Verify syntax and focused contract
        run: |
          node --check js/ua.source_manifest.js
          npx jest --runInBand tests/unit/sourceManifest.test.js
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ua.source_manifest.js tests/unit/sourceManifest.test.js
          git commit -m 'style: format source-manifest contract'
          git push origin HEAD:feat/source-manifest-core
