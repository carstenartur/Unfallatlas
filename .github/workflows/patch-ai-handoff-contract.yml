name: Harden complete AI handoff contract

on:
  push:
    branches:
      - agent/complete-ai-handoff
    paths:
      - '.github/workflows/patch-ai-handoff-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/complete-ai-handoff
          persist-credentials: true

      - name: Enforce expected graphics and explicit hash scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          source = Path('js/ua.ai_handoff.js')
          text = source.read_text(encoding='utf-8')
          text = replace_once(text, '''    if (typeof UA._captureClusterMaps === "function") {
                notify("Erzeuge Clusterkarten …");
                const clusters = await UA._captureClusterMaps(ctx, options);
                let index = 0;
                for (const cluster of clusters || []) {
          ''', '''    if (typeof UA._captureClusterMaps === "function") {
                let clusterPoints = (ctx?.viewportPts && ctx.viewportPts.length)
                  ? ctx.viewportPts
                  : (ctx?.allPts || []);
                if (ctx?.selectionBounds && typeof ctx.selectionBounds.contains === "function") {
                  clusterPoints = clusterPoints.filter(point =>
                    Number.isFinite(point?.lat) &&
                    Number.isFinite(point?.lon) &&
                    ctx.selectionBounds.contains([point.lat, point.lon])
                  );
                }
                const expectedTargets = typeof UA.computeClusterMapTargets === "function"
                  ? UA.computeClusterMapTargets(clusterPoints)
                  : null;
                notify("Erzeuge Clusterkarten …");
                const clusters = await UA._captureClusterMaps(ctx, options);
                if (expectedTargets && expectedTargets.length !== (clusters || []).length) {
                  fail(
                    "missing_cluster_graphics",
                    `Es wurden ${(clusters || []).length} von ${expectedTargets.length} erwarteten Clusterkarten erzeugt`,
                    {
                      expected: expectedTargets.map(target => ({
                        label: target.label,
                        total: target.total,
                        latitude: target.lat,
                        longitude: target.lon,
                      })),
                      captured: (clusters || []).map(cluster => ({
                        label: cluster?.label || null,
                        total: cluster?.total ?? null,
                        latitude: cluster?.lat ?? null,
                        longitude: cluster?.lon ?? null,
                      })),
                    }
                  );
                }
                let index = 0;
                for (const cluster of clusters || []) {
          ''', 'cluster capture')
          text = replace_once(text, '''        if (visible != null && Number.isFinite(total) && visible !== total) {
                    fail("cluster_count_mismatch", `Clusterkarte ${cluster?.label || index + 1} zeigt ${visible} statt ${total} Unfallpunkte`, {
                      label: cluster?.label || null,
                      visible,
                      total,
                    });
                  }
                  if (!cluster?.image) fail("missing_cluster_image", `Clusterkarte ${cluster?.label || index + 1} enthält kein Bild`);
          ''', '''        if (visible != null && Number.isFinite(total) && visible !== total) {
                    fail("cluster_count_mismatch", `Clusterkarte ${cluster?.label || index + 1} zeigt ${visible} statt ${total} Unfallpunkte`, {
                      label: cluster?.label || null,
                      visible,
                      total,
                    });
                  }
                  const expected = expectedTargets ? expectedTargets[index] : null;
                  if (expected && (
                    String(cluster?.label || "") !== String(expected.label || "") ||
                    Number(cluster?.total) !== Number(expected.total)
                  )) {
                    fail("cluster_target_mismatch", `Clusterkarte ${index + 1} gehört nicht zum erwarteten Analyseziel`, {
                      expected: { label: expected.label, total: expected.total },
                      captured: { label: cluster?.label || null, total: cluster?.total ?? null },
                    });
                  }
                  if (!cluster?.image) fail("missing_cluster_image", `Clusterkarte ${cluster?.label || index + 1} enthält kein Bild`);
          ''', 'cluster consistency')
          text = replace_once(
              text,
              '      "- `manifest.json` enthält SHA-256, Dateigröße, Rolle und Bildmetadaten.",\n',
              '      "- `manifest.json` enthält SHA-256, Dateigröße, Rolle und Bildmetadaten für jede andere Paketdatei; das Manifest selbst ist wegen der unvermeidbaren Selbstreferenz ausdrücklich vom Hashumfang ausgenommen.",\n',
              'README hash scope',
          )
          text = replace_once(text, '''      completeness: "complete",
                privacyNote: "Lokal erzeugt; Übermittlung erst durch expliziten Upload der Nutzer:innen.",
                uploadContract: {
          ''', '''      completeness: "complete",
                privacyNote: "Lokal erzeugt; Übermittlung erst durch expliziten Upload der Nutzer:innen.",
                hashScope: {
                  algorithm: "SHA-256",
                  coveredFiles: "all ZIP payload files except manifest.json",
                  excluded: [{
                    path: "manifest.json",
                    reason: "A manifest cannot contain its own final hash without becoming self-referential.",
                  }],
                },
                uploadContract: {
          ''', 'manifest')
          source.write_text(text, encoding='utf-8')

          test = Path('tests/unit/ua.ai_handoff.test.js')
          tests = test.read_text(encoding='utf-8')
          tests = replace_once(tests, '''    UA._captureClusterMaps = jest.fn(async () => [{
                label: 'Cluster A', image: PNG, total: 2, points: [{}, {}], lat: 50.7, lon: 7.1, zoom: 17,
              }]);
              UA.trend = { renderTrendSVG: jest.fn(() => '<svg aria-label="Mehrjahres-Trend"></svg>') };
          ''', '''    UA._captureClusterMaps = jest.fn(async () => [{
                label: 'Cluster A', image: PNG, total: 2, points: [{}, {}], lat: 50.7, lon: 7.1, zoom: 17,
              }]);
              UA.computeClusterMapTargets = jest.fn(() => [{
                label: 'Cluster A', total: 2, points: [{}, {}], lat: 50.7, lon: 7.1, zoom: 17,
              }]);
              UA.trend = { renderTrendSVG: jest.fn(() => '<svg aria-label="Mehrjahres-Trend"></svg>') };
          ''', 'test runtime')
          tests = replace_once(tests, '''    expect(pkg.manifest.uploadContract.requiredFiles).toContain('manifest.json');
              expect(pkg.manifest.files.every(file => /^[a-f0-9]{64}$/.test(file.sha256))).toBe(true);
          ''', '''    expect(pkg.manifest.uploadContract.requiredFiles).toContain('manifest.json');
              expect(pkg.manifest.hashScope).toEqual(expect.objectContaining({
                algorithm: 'SHA-256',
                coveredFiles: 'all ZIP payload files except manifest.json',
              }));
              expect(pkg.manifest.hashScope.excluded).toContainEqual(expect.objectContaining({ path: 'manifest.json' }));
              expect(pkg.manifest.files.every(file => /^[a-f0-9]{64}$/.test(file.sha256))).toBe(true);
          ''', 'manifest assertion')
          marker = "  test('fails closed when a cluster image count disagrees with its stated total', async () => {\n"
          addition = '''  test('fails closed when an expected cluster graphic was silently omitted', async () => {
              UA.computeClusterMapTargets = jest.fn(() => [
                { label: 'Cluster A', total: 2, lat: 50.7, lon: 7.1 },
                { label: 'Cluster B', total: 2, lat: 50.8, lon: 7.2 },
              ]);

              await expect(UA.aiHandoff.generatePackage(UA, { exportOptions: {} }))
                .rejects.toMatchObject({ code: 'missing_cluster_graphics' });
              expect(UA.zip.createStoredZip).not.toHaveBeenCalled();
            });

          '''
          tests = replace_once(tests, marker, addition + marker, 'missing cluster test')
          test.write_text(tests, encoding='utf-8')

          docs = Path('docs/user-owned-ai-prompt.md')
          doc = docs.read_text(encoding='utf-8')
          doc = replace_once(
              doc,
              '- Jede beigefügte Datei erhält einen SHA-256-Eintrag im Manifest.\n',
              '- Jede Nutzdatei außer `manifest.json` erhält einen SHA-256-Eintrag. Das Manifest dokumentiert seine eigene Ausnahme ausdrücklich, weil ein finaler Selbsthash rekursiv wäre.\n',
              'documentation hash scope',
          )
          docs.write_text(doc, encoding='utf-8')
          PY

      - name: Commit hardened contract
        shell: bash
        run: |
          set -euo pipefail
          git add -- js/ua.ai_handoff.js tests/unit/ua.ai_handoff.test.js docs/user-owned-ai-prompt.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fail closed on missing AI handoff graphics'
          git push origin HEAD:agent/complete-ai-handoff
