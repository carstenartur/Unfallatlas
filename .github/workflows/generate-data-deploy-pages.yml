name: Generate Data and Deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

concurrency:
  group: pages-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Maven cache
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          problem-matcher: true
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Optional CI acceleration only. The producer and QA logic live in the
      # Maven profiles and are executable from every checkout.
      - name: Restore context producer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .enrichment-cache
          key: pages-context-${{ runner.os }}-${{ hashFiles('scripts/producers/*.js', 'scripts/generate-context-city.js') }}-${{ github.run_id }}
          restore-keys: |
            pages-context-${{ runner.os }}-${{ hashFiles('scripts/producers/*.js', 'scripts/generate-context-city.js') }}-
            pages-context-${{ runner.os }}-
          save-always: true

      - name: Restore RIS source cache
        id: ris-source-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ris-sources
          key: ris-sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ris-sources-v1-${{ runner.os }}-

      - name: Generate data and verify Pages through Maven
        env:
          CARTO_BASEMAPS_KEY: ${{ secrets.CARTO_BASEMAPS_KEY }}
          PAGES_REFRESH_RIS: '1'
        run: mvn -B -ntp clean verify -Ppages-regenerated

      # Preserve completed source downloads when an import or later QA fails.
      - name: Save RIS source cache
        if: always() && steps.ris-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ris-sources
          key: ris-sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Maven Pages QA evidence
        if: ${{ always() && hashFiles('_site/build-manifest.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-documentation-media-report
          path: |
            out/qa/pages-maven-documentation-media.json
            out/qa/pages-maven-profile.sha256
            out/qa/pages-maven-server.log
            _site/build-manifest.json
            _site/vendor/third-party-notices.json
            _site/vendor/public-preview-sbom.cdx.json
            playwright-report
            test-results
            analysis-service/target/surefire-reports
            analysis-service/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # Pages source selection is repository configuration. Scheduled and
      # manual deployments only publish verified artifacts and never require
      # repository-administration permissions.
      - name: Configure Pages deployment
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy Maven-verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
