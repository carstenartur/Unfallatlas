name: Generate Data and Deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

concurrency:
  group: pages-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK and Maven cache
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Data producers are existing checkout tools. The final artifact build,
      # all frontend tests and the browser gate are owned by Maven below.
      - name: Set up Node.js for data producers
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked producer dependencies
        run: npm ci

      - name: Prepare build dirs
        run: |
          rm -rf .build _site
          mkdir -p .build/raw .build/enriched

      - name: Generate raw accident data
        shell: bash
        run: |
          set -euo pipefail
          CITY_ARGS=()
          while IFS= read -r city; do
            city="$(echo "$city" | sed 's/#.*$//' | xargs)"
            [[ -z "$city" ]] && continue
            CITY_ARGS+=(--city "$city")
          done < cities.txt
          chmod +x ./convertAmt2gmaps.sh
          ./convertAmt2gmaps.sh \
            --outdir .build/raw \
            --limit 0 \
            "${CITY_ARGS[@]}" \
            --rad "" --pkw "" --fuss "" --krad ""

      - name: Validate raw accident data for all cities
        run: node scripts/check-data-paths.js --dir .build/raw --min-features 10

      - name: Restore context producer cache
        uses: actions/cache@v6
        with:
          path: .enrichment-cache
          key: pages-context-${{ runner.os }}-${{ hashFiles('scripts/producers/*.js', 'scripts/generate-context-city.js') }}-${{ github.run_id }}
          restore-keys: |
            pages-context-${{ runner.os }}-${{ hashFiles('scripts/producers/*.js', 'scripts/generate-context-city.js') }}-
            pages-context-${{ runner.os }}-
          save-always: true

      - name: Generate verified context data from scratch inputs
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r city; do
            city="$(echo "$city" | sed 's/#.*$//' | xargs)"
            [[ -z "$city" ]] && continue
            node scripts/generate-context-city.js \
              --city "$city" \
              --input-dir .build/raw \
              --output-dir .build/enriched
          done < cities.txt

      - name: Build verified gzip-only accident tiles
        run: |
          node scripts/build-accident-tiles.js \
            --input-dir .build/enriched \
            --output-dir .build/enriched

      - name: Run the checkout-reproducible Maven Pages build
        run: >-
          mvn -B -ntp clean verify -Ppages
          -Dpages.inputDir=.build/enriched
          -Dpages.poiDir=out

      - name: Upload Maven Pages QA evidence
        if: ${{ always() && hashFiles('_site/build-manifest.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-documentation-media-report
          path: |
            out/qa/pages-maven-documentation-media.json
            out/qa/pages-maven-profile.sha256
            out/qa/pages-maven-server.log
            _site/build-manifest.json
            _site/vendor/third-party-notices.json
            _site/vendor/public-preview-sbom.cdx.json
            playwright-report
            test-results
            analysis-service/target/surefire-reports
            analysis-service/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Pin Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          test "$build_type" = workflow

      - name: Configure Pages deployment
        uses: actions/configure-pages@v6

      - name: Deploy Maven-verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
