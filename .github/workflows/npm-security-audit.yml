name: npm Security Audit Evidence

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Pinned npm audit evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install the Maven-pinned Node and npm runtime from the lockfile
        run: mvn -B -ntp clean generate-resources -DskipTests -Dskip.pages.qa=true

      - name: Generate production and complete npm audit evidence
        shell: bash
        run: |
          set -euo pipefail
          node_bin='target/frontend/node/node'
          npm_cli='target/frontend/node/node_modules/npm/bin/npm-cli.js'
          test -x "$node_bin"
          test -f "$npm_cli"
          "$node_bin" scripts/run-npm-security-audit.js \
            --npm-cli "$npm_cli" \
            --out-dir out/qa/npm-security/baseline

      - name: Generate a minimal patched lockfile candidate and prove the zero-High threshold
        shell: bash
        run: |
          set -euo pipefail
          node_bin='target/frontend/node/node'
          npm_cli='target/frontend/node/node_modules/npm/bin/npm-cli.js'

          "$node_bin" <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.overrides = {
            ...(packageJson.overrides || {}),
            '@grpc/grpc-js': '1.14.4',
            'ip-address': '10.3.1',
            'nanoid': '5.1.16',
            'protobufjs': '7.6.5'
          };
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`, 'utf8');
          NODE

          "$node_bin" "$npm_cli" install --package-lock-only --ignore-scripts
          rm -rf node_modules
          "$node_bin" "$npm_cli" ci --ignore-scripts
          "$node_bin" scripts/run-npm-security-audit.js \
            --npm-cli "$npm_cli" \
            --out-dir out/qa/npm-security/remediated \
            --enforce-runtime-high-zero \
            --enforce-all-high-zero
          cp package.json out/qa/npm-security/candidate-package.json
          cp package-lock.json out/qa/npm-security/candidate-package-lock.json

      - name: Commit the exact audited package files to this maintenance branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'fix/npm-audit-release-gate'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Exact audited package files are already committed.'
            exit 0
          fi
          git commit -m 'fix(deps): pin patched transitive npm versions'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Add normalized audit reports to the workflow summary
        if: always()
        shell: bash
        run: |
          for report in \
            out/qa/npm-security/baseline/npm-audit-report.md \
            out/qa/npm-security/remediated/npm-audit-report.md; do
            if [[ -f "$report" ]]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [[ ! -f out/qa/npm-security/baseline/npm-audit-report.md ]]; then
            printf '%s\n' 'npm audit evidence was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable npm audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-security-audit-${{ github.sha }}
          path: out/qa/npm-security/
          if-no-files-found: error
          retention-days: 30
