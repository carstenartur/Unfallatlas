name: Apply central filing readiness integration

on:
  push:
    branches:
      - agent/central-filing-readiness-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/central-filing-readiness-gate

      - name: Integrate central gate
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-central-filing-readiness-gate.py
          node --check js/ua.filing_readiness.js
          node --check js/ua.ai_visual_research_ui.js
          node --check tests/unit/ua.filing_readiness.test.js
          node --check tests/unit/ua.ai_investigation.test.js
          python -m json.tool schemas/filing-readiness.schema.json >/dev/null
          python -m json.tool schemas/ai-investigation-result.schema.json >/dev/null
          git diff --check

      - name: Commit focused integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate central filing readiness gate"
          git push origin HEAD:agent/central-filing-readiness-gate
