name: Apply central filing readiness gate

on:
  push:
    branches:
      - agent/central-filing-readiness-gate
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply focused readiness hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return source.replace(old, new, 1)

          path = Path('js/ua.ai_visual_research_ui.js')
          source = path.read_text(encoding='utf-8')

          source = replace_once(
              source,
              """  const READY_STATUSES = new Set(['ready', 'conditional']);
  const COMPLETE_POLITICAL_STATUSES = new Set([
    'results-found', 'searched-no-results', 'completed', 'complete',
  ]);
  const OPENED_RESOURCE_STATUSES = new Set(['opened', 'read', 'accessed', 'verified']);""",
              """  const READY_STATUSES = new Set(['ready', 'conditional']);
  const COMPLETE_POLITICAL_STATUSES = new Set(['results-found', 'completed', 'complete']);
  const CONDITIONAL_POLITICAL_STATUSES = new Set(['searched-no-results']);
  const BLOCKING_POLITICAL_STATUSES = new Set([
    'not-searched', 'failed', 'unavailable', 'not-searchable', 'unsupported',
  ]);
  const IGNORED_PATTERN_STATUSES = new Set([
    'not-detected', 'not_detected', 'irrelevant', 'dismissed',
  ]);
  const OPENED_RESOURCE_STATUSES = new Set(['opened', 'read', 'accessed', 'verified']);""",
              'status constants',
          )

          source = replace_once(
              source,
              "  const unique = values => [...new Set(list(values).map(clean).filter(Boolean))];\n",
              """  const unique = values => [...new Set(list(values).map(clean).filter(Boolean))];

  function normaliseResourceUrl(value) {
    try {
      const url = new URL(clean(value), 'https://unfallwerkbank.invalid/');
      url.hash = '';
      const sorted = [...url.searchParams.entries()]
        .sort(([aKey, aValue], [bKey, bValue]) =>
          aKey.localeCompare(bKey) || aValue.localeCompare(bValue));
      url.search = '';
      sorted.forEach(([key, item]) => url.searchParams.append(key, item));
      return url.href;
    } catch (_) {
      return clean(value);
    }
  }

  function expectedInspectionViews(facts) {
    const structured = facts?.structured || {};
    const candidates = [
      facts?.visualSceneAnalysisContract?.inspectionViews,
      structured?.visualSceneAnalysisContract?.inspectionViews,
      facts?.aiResearchHandoff?.visualSceneAnalysisContract?.inspectionViews,
    ];
    const views = candidates.find(candidate => list(candidate).length) || [];
    return new Map(list(views)
      .map(view => [clean(view?.mapMode).toLowerCase(), normaliseResourceUrl(view?.url)])
      .filter(([mode, url]) => mode && url));
  }

  function linkedPoliticalEvidence(political) {
    return [...list(political?.proceedings), ...list(political?.projects)]
      .filter(item => clean(item?.sourceUrl || item?.url || item?.link));
  }

  function classifyPoliticalResearch(political) {
    const status = clean(political?.status).toLowerCase();
    const linked = linkedPoliticalEvidence(political);
    const alternativeVerificationCompleted = political?.alternativeVerificationCompleted === true
      || political?.manualVerificationCompleted === true;

    if (status === 'results-found') {
      return linked.length
        ? { status: 'complete', sourceStatus: status, linkedCount: linked.length }
        : { status: 'blocked', sourceStatus: status, linkedCount: 0,
          reason: 'Politische Treffer wurden behauptet, aber kein direkt verlinkter Vorgang oder Verwaltungsprojekt übergeben.' };
    }
    if (status === 'completed' || status === 'complete') {
      return (linked.length || alternativeVerificationCompleted)
        ? { status: 'complete', sourceStatus: status, linkedCount: linked.length,
          alternativeVerificationCompleted }
        : { status: 'blocked', sourceStatus: status, linkedCount: 0,
          reason: 'Die Recherche wurde als vollständig bezeichnet, ohne verlinkte Treffer oder dokumentierte alternative Verifikation.' };
    }
    if (CONDITIONAL_POLITICAL_STATUSES.has(status)) {
      return { status: 'conditional', sourceStatus: status, linkedCount: 0,
        reason: 'Ein Nulltreffer ist kein Nachweis fehlender politischer Vorbefassung; eine alternative Portal- oder manuelle Prüfung bleibt erforderlich.' };
    }
    if (!status || BLOCKING_POLITICAL_STATUSES.has(status)) {
      return { status: 'blocked', sourceStatus: status || 'missing', linkedCount: 0,
        reason: `Politische Recherche ist nicht belastbar abgeschlossen (${status || 'Status fehlt'}).` };
    }
    return { status: 'blocked', sourceStatus: status, linkedCount: linked.length,
      reason: `Unbekannter politischer Recherchestatus: ${status}.` };
  }

  function buildEvidenceRegistry(result) {
    const ids = new Set();
    const add = value => { const id = clean(value); if (id) ids.add(id); };
    list(result?.accessedResources).forEach(item => { add(item?.id); add(item?.url); });
    list(result?.mapObservations).forEach(item => add(item?.id));
    list(result?.patternEvaluations).forEach(item => { add(findingId(item)); add(item?.detectorId); });
    list(result?.accidentBackgroundResearch?.results).forEach(item => { add(item?.id); add(item?.sourceUrl); });
    [...list(result?.politicalAdministrativeResearch?.proceedings),
      ...list(result?.politicalAdministrativeResearch?.projects)]
      .forEach(item => { add(item?.id); add(item?.sourceUrl || item?.url || item?.link); });
    return ids;
  }

  function unresolvedEvidenceRefs(refs, registry) {
    return unique(refs).filter(ref => !registry.has(ref));
  }
""",
              'readiness helpers',
          )

          start = source.index('    const resources = list(result.accessedResources);')
          end = source.index('    const observations = list(result.mapObservations);', start)
          if start < 0 or end < 0:
              raise SystemExit('resource validation anchors not found')
          source = source[:start] + """    const resources = list(result.accessedResources);
    const expectedViews = expectedInspectionViews(facts || {});
    for (const mode of REQUIRED_MAP_MODES) {
      const opened = resources.filter(resource =>
        OPENED_RESOURCE_STATUSES.has(clean(resource?.status).toLowerCase())
        && clean(resource?.mapMode).toLowerCase() === mode);
      if (!opened.length) {
        fail(`map-mode-${mode}`, `Kartenmodus ${mode} wurde nicht als geöffnet protokolliert.`);
        continue;
      }
      pass(`map-mode-${mode}`, `Kartenmodus ${mode} geöffnet.`);
      const expectedUrl = expectedViews.get(mode);
      if (!expectedUrl) {
        warn(`map-url-contract-${mode}`, `Für Kartenmodus ${mode} fehlt eine gebundene Soll-URL im Faktenpaket.`);
        continue;
      }
      const matchesExpected = opened.some(resource =>
        normaliseResourceUrl(resource?.url) === expectedUrl);
      if (!matchesExpected) {
        fail(`map-url-${mode}`, `Kartenmodus ${mode} wurde nicht mit der für diesen Analysesnapshot gebundenen URL geöffnet.`, {
          expectedUrl,
          observedUrls: opened.map(resource => normaliseResourceUrl(resource?.url)),
        });
      } else pass(`map-url-${mode}`, `Kartenmodus ${mode} ist an die erwartete Analyse-URL gebunden.`);
    }
    if (!resources.some(resource => clean(resource?.url))) {
      fail('resource-log', 'Kein tatsächlich aufgerufener Ressourcen-Link dokumentiert.');
    }

""" + source[end:]

          source = replace_once(
              source,
              """    const expectedPatterns = collectPatternFindings(facts || {})
      .filter(item => ['detected', 'not-assessable', 'supported', 'candidate'].includes(item.status));""",
              """    const expectedPatterns = collectPatternFindings(facts || {})
      .filter(item => !IGNORED_PATTERN_STATUSES.has(clean(item.status).toLowerCase()));""",
              'pattern coverage statuses',
          )

          start = source.index('    const political = object(result.politicalAdministrativeResearch);')
          end = source.index('    const insights = list(result.crossLayerInsights);', start)
          if start < 0 or end < 0:
              raise SystemExit('political validation anchors not found')
          source = source[:start] + """    const political = object(result.politicalAdministrativeResearch);
    const politicalStatus = clean(political.status).toLowerCase();
    if (!politicalStatus) fail('political-status', 'Status der politischen/administrativen Recherche fehlt.');
    const politicalGate = classifyPoliticalResearch(political);
    if (politicalGate.status === 'blocked') {
      fail('political-research-blocked', politicalGate.reason, politicalGate);
    } else if (politicalGate.status === 'conditional') {
      warn('political-research-conditional', politicalGate.reason, politicalGate);
    } else {
      pass('political-research-complete', `Politische Recherche ist nachvollziehbar abgeschlossen (${politicalGate.linkedCount} verlinkte Treffer).`);
    }

    const readiness = object(result.filingReadiness);
    const readinessStatus = clean(readiness.status).toLowerCase();
    if (!['ready', 'conditional', 'blocked'].includes(readinessStatus)) {
      fail('readiness-status', 'filingReadiness.status muss ready, conditional oder blocked sein.');
    }
    if (readinessStatus === 'ready' && politicalGate.status !== 'complete') {
      warn('model-readiness-overstated', 'Die KI hat „ready“ angegeben; das lokale Gate stuft wegen unvollständiger politischer Evidenz strenger ein.');
    }

""" + source[end:]

          source = replace_once(
              source,
              """    const insights = list(result.crossLayerInsights);
    if (insights.length < 3) fail('cross-layer-count', 'Mindestens drei schichtenübergreifende Einsichten sind erforderlich.');
    insights.forEach((insight, index) => {
      if (!clean(insight?.statement) || list(insight?.evidenceRefs).filter(Boolean).length < 2) {
        fail(`cross-layer-${index + 1}`, `Einsicht ${index + 1} braucht eine Aussage und mindestens zwei Evidenzreferenzen.`);
      }
    });""",
              """    const evidenceRegistry = buildEvidenceRegistry(result);
    const insights = list(result.crossLayerInsights);
    if (insights.length < 3) fail('cross-layer-count', 'Mindestens drei schichtenübergreifende Einsichten sind erforderlich.');
    insights.forEach((insight, index) => {
      if (!clean(insight?.statement) || list(insight?.evidenceRefs).filter(Boolean).length < 2) {
        fail(`cross-layer-${index + 1}`, `Einsicht ${index + 1} braucht eine Aussage und mindestens zwei Evidenzreferenzen.`);
      }
      const unresolved = unresolvedEvidenceRefs(insight?.evidenceRefs, evidenceRegistry);
      if (unresolved.length) {
        fail(`cross-layer-evidence-${index + 1}`, `Einsicht ${index + 1} verweist auf unbekannte Evidenz: ${unresolved.join(', ')}.`);
      }
    });""",
              'evidence registry for insights',
          )

          source = replace_once(
              source,
              """      if (!list(measure?.findingRefs).length) missing.push('findingRefs');
      if (!list(measure?.successIndicators).length) missing.push('successIndicators');
      if (missing.length) fail(`measure-${index + 1}`, `Maßnahmenkandidat ${index + 1} unvollständig: ${missing.join(', ')}.`);""",
              """      if (!list(measure?.findingRefs).length) missing.push('findingRefs');
      if (!list(measure?.successIndicators).length) missing.push('successIndicators');
      if (missing.length) fail(`measure-${index + 1}`, `Maßnahmenkandidat ${index + 1} unvollständig: ${missing.join(', ')}.`);
      const unresolved = unresolvedEvidenceRefs(measure?.findingRefs, evidenceRegistry);
      if (unresolved.length) {
        fail(`measure-evidence-${index + 1}`, `Maßnahmenkandidat ${index + 1} verweist auf unbekannte Befunde: ${unresolved.join(', ')}.`);
      }""",
              'measure evidence binding',
          )

          start = source.index('    const passed = errors.length === 0;')
          end = source.index('\n  function buildApplicationPrompt', start)
          if start < 0 or end < 0:
              raise SystemExit('final readiness anchors not found')
          source = source[:start] + """    const politicalErrorCodes = new Set(['political-status', 'political-research-blocked']);
    const politicalWarningCodes = new Set(['political-research-conditional', 'model-readiness-overstated']);
    const analysisErrors = errors.filter(error => !politicalErrorCodes.has(error.code));
    const analysisWarnings = warnings.filter(warning => !politicalWarningCodes.has(warning.code));
    const analysisQaStatus = analysisErrors.length
      ? 'blocked'
      : (analysisWarnings.length ? 'conditional' : 'ready');
    const politicalResearchStatus = politicalGate.status;

    let filingReadinessStatus = analysisErrors.length || politicalResearchStatus === 'blocked'
      ? 'blocked'
      : (analysisWarnings.length || politicalResearchStatus === 'conditional' ? 'conditional' : 'ready');
    // The model may make the local result stricter, but can never upgrade it.
    if (readinessStatus === 'blocked') filingReadinessStatus = 'blocked';
    else if (readinessStatus === 'conditional' && filingReadinessStatus === 'ready') {
      filingReadinessStatus = 'conditional';
    }

    const passed = errors.length === 0;
    const readyForApplication = passed && READY_STATUSES.has(filingReadinessStatus);
    const filingReady = passed && filingReadinessStatus === 'ready';
    const possible = Math.max(1, checks.length);
    const successful = checks.filter(check => check.passed).length;
    return {
      schemaVersion: VALIDATION_SCHEMA,
      validatedAt: new Date().toISOString(),
      passed,
      readyForApplication,
      filingReady,
      analysisQaStatus,
      politicalResearchStatus,
      filingReadinessStatus,
      modelFilingReadinessStatus: readinessStatus || 'blocked',
      score: Math.round((successful / possible) * 100),
      deterministicFacts: expectedFacts,
      expectedPatternIds: expectedPatterns.map(item => item.id),
      errors, warnings, checks, result,
    };
  }
""" + source[end:]

          source = replace_once(
              source,
              """      validation: {
        score: check.score,
        filingReadinessStatus: check.filingReadinessStatus,
        warnings: check.warnings,
      },""",
              """      validation: {
        score: check.score,
        analysisQaStatus: check.analysisQaStatus,
        politicalResearchStatus: check.politicalResearchStatus,
        filingReadinessStatus: check.filingReadinessStatus,
        modelFilingReadinessStatus: check.modelFilingReadinessStatus,
        warnings: check.warnings,
      },""",
              'application validation status payload',
          )

          source = replace_once(
              source,
              """          `Einreichungsstatus: ${lastValidation.filingReadinessStatus}`,
          ...lastValidation.errors.map(error => `FEHLER: ${error.message}`),""",
              """          `Analyse-QA: ${lastValidation.analysisQaStatus}`,
          `Politische Recherche: ${lastValidation.politicalResearchStatus}`,
          `Lokaler Einreichungsstatus: ${lastValidation.filingReadinessStatus}`,
          ...lastValidation.errors.map(error => `FEHLER: ${error.message}`),""",
              'validation UI statuses',
          )

          path.write_text(source, encoding='utf-8')

          test_path = Path('tests/unit/ua.ai_investigation.test.js')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              """    structured: {
      meta: { city: 'Hannover' },""",
              """    visualSceneAnalysisContract: {
      inspectionViews: ['standard', 'hybrid', 'orthophoto', 'analysis'].map(mapMode => ({
        mapMode,
        url: `https://example.test/werkbank_v2.html?mapMode=${mapMode}`,
      })),
    },
    structured: {
      meta: { city: 'Hannover' },""",
              'test inspection views',
          )
          tests = replace_once(
              tests,
              """    politicalAdministrativeResearch: {
      status: 'results-found', queries: [], proceedings: [], projects: [], gaps: [],
    },""",
              """    politicalAdministrativeResearch: {
      status: 'results-found',
      queries: [{ query: 'Hannover Schiene Antrag', sourceType: 'official-ris' }],
      proceedings: [{
        id: 'political-1', title: 'Verkehrssicherheit im Untersuchungsbereich',
        sourceUrl: 'https://example.test/ris/political-1',
      }],
      projects: [], gaps: [],
    },""",
              'linked political fixture',
          )
          tests = replace_once(
              tests,
              """      'official-fact-total', 'map-mode-orthophoto', 'political-readiness-conflict',
    ]));""",
              """      'official-fact-total', 'map-mode-orthophoto', 'political-research-blocked',
    ]));""",
              'updated failure codes',
          )

          insertion = """

  test('derives a conditional local filing status for political null results', () => {
    const api = loadModule(makeWindow());
    const result = validResult(api);
    result.politicalAdministrativeResearch = {
      status: 'searched-no-results',
      queries: [
        { query: 'Hannover Schiene Antrag', sourceType: 'official-ris' },
        { query: 'Hannover Schiene Beschluss', sourceType: 'official-oparl' },
      ],
      proceedings: [], projects: [], gaps: ['Alternative Portalprüfung offen'],
    };
    result.filingReadiness = { status: 'ready', blockers: [], conditions: [], rationale: 'Modell hält es für fertig' };

    const validation = api.validateInvestigationResult(result, factsFixture());
    expect(validation).toMatchObject({
      passed: true,
      readyForApplication: true,
      filingReady: false,
      analysisQaStatus: 'ready',
      politicalResearchStatus: 'conditional',
      filingReadinessStatus: 'conditional',
      modelFilingReadinessStatus: 'ready',
    });
    expect(validation.warnings.map(warning => warning.code)).toEqual(expect.arrayContaining([
      'political-research-conditional', 'model-readiness-overstated',
    ]));
  });

  test('binds every opened map mode to the expected analysis URL', () => {
    const api = loadModule(makeWindow());
    const result = validResult(api);
    result.accessedResources.find(item => item.mapMode === 'hybrid').url =
      'https://example.test/werkbank_v2.html?mapMode=hybrid&city=Other';

    const validation = api.validateInvestigationResult(result, factsFixture());
    expect(validation.passed).toBe(false);
    expect(validation.errors.map(error => error.code)).toContain('map-url-hybrid');
  });

  test('requires browser findings with observed and warning status to be evaluated', () => {
    const api = loadModule(makeWindow());
    const facts = factsFixture();
    facts.structured.patternDetection.findings.push(
      { patternId: 'crossing-observed', status: 'observed', detector: { id: 'crossing-detector' } },
      { patternId: 'data-warning', status: 'warning', detector: { id: 'quality-detector' } },
    );

    const validation = api.validateInvestigationResult(validResult(api), facts);
    expect(validation.passed).toBe(false);
    expect(validation.errors.map(error => error.code)).toEqual(expect.arrayContaining([
      'pattern-crossing-observed', 'pattern-data-warning',
    ]));
  });

  test('rejects invented evidence references in synthesis and measures', () => {
    const api = loadModule(makeWindow());
    const result = validResult(api);
    result.crossLayerInsights[0].evidenceRefs = ['map-hybrid', 'invented-source'];
    result.candidateMeasures[0].findingRefs = ['invented-pattern'];

    const validation = api.validateInvestigationResult(result, factsFixture());
    expect(validation.passed).toBe(false);
    expect(validation.errors.map(error => error.code)).toEqual(expect.arrayContaining([
      'cross-layer-evidence-1', 'measure-evidence-1',
    ]));
  });
"""
          marker = "\n  test('repairs the pre-involvement count from the original runtime context', () => {"
          if tests.count(marker) != 1:
              raise SystemExit('test insertion marker not found exactly once')
          tests = tests.replace(marker, insertion + marker, 1)
          test_path.write_text(tests, encoding='utf-8')

          schema_path = Path('schemas/ai-investigation-result.schema.json')
          schema = schema_path.read_text(encoding='utf-8')
          schema = replace_once(
              schema,
              '        "gaps": { "type": "array", "items": { "type": "string" } }',
              '        "gaps": { "type": "array", "items": { "type": "string" } },\n        "alternativeVerificationCompleted": { "type": "boolean" },\n        "manualVerificationCompleted": { "type": "boolean" }',
              'political verification schema',
          )
          schema_path.write_text(schema, encoding='utf-8')

          Path('.github/workflows/apply-central-filing-readiness-gate.yml').unlink()
          PY

          node --check js/ua.ai_visual_research_ui.js
          node --check tests/unit/ua.ai_investigation.test.js
          python -m json.tool schemas/ai-investigation-result.schema.json >/dev/null
          git diff --check

      - name: Commit central gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ua.ai_visual_research_ui.js tests/unit/ua.ai_investigation.test.js \
            schemas/ai-investigation-result.schema.json \
            .github/workflows/apply-central-filing-readiness-gate.yml
          git commit -m "feat: derive filing readiness from local evidence gates"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${TARGET_BRANCH}"
