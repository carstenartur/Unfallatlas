name: PR 433 final video diagnostic

on:
  pull_request:
    branches:
      - split/405-2-accessibility-task-surface

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate Playwright Docker coupling
        run: node scripts/check-playwright-docker-version.js
      - name: Install dependencies
        run: npm ci
      - name: Run video Testcontainers test with complete log
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 40m npm run test:integration:tc 2>&1 | tee video-test.log
          status=${PIPESTATUS[0]}
          {
            echo '## Exact video Testcontainers result'
            echo
            echo '```text'
            tail -n 260 video-test.log
            echo '```'
          } > video-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file video-comment.md
          exit "$status"
      - name: Collect Docker diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '## docker ps -a'
            docker ps -a || true
            echo
            echo '## docker images'
            docker images || true
            echo
            echo '## docker info'
            docker info || true
          } > docker-diagnostics.log 2>&1
      - name: Upload video diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-433-video-final-diagnostic
          path: |
            video-test.log
            docker-diagnostics.log
          if-no-files-found: warn
          retention-days: 14
