name: Run Pages fallback materializer from feature branch

on:
  push:
    branches: [fix/canonical-bast-cost-source]
    paths:
      - '.github/workflows/run-pages-fallback-materializer.yml'

permissions:
  contents: write

concurrency:
  group: materialize-pages-branch-fallback
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Extract and execute repository materializer
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/materialize-pages-branch-fallback.yml').read_text(encoding='utf-8')
          start_marker = "          node <<'NODE'\n"
          end_marker = "          NODE\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/materialize-pages-branch-fallback.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/materialize-pages-branch-fallback.js
          node /tmp/materialize-pages-branch-fallback.js
          rm -f .github/workflows/run-materialize-pages-branch-fallback.yml

      - name: Verify generated JavaScript and focused contracts
        run: |
          node --check js/ua.vendor_bootstrap.js
          node --check pages-fallback/vendor-style.js
          node --check pages-fallback/vendor-runtime.js
          for file in pages-fallback/vendor-source-*.js; do node --check "$file"; done
          npx jest \
            tests/unit/pagesBranchFallback.test.js \
            tests/unit/publicPagesProfile.test.js \
            tests/unit/siteBuildContract.test.js \
            --runInBand

      - name: Verify full and reduced site builds
        run: |
          npm run build:site -- --input-dir out --poi-dir out --output-dir _site
          npm run validate:media
          npm run build:pages-profile -- --site _site
          npm run validate:pages-profile -- --site _site
          test ! -e _site/pages-fallback

      - name: Commit verified fallback to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep legacy Pages publishing inside public profile'
          git push origin HEAD:main

      - name: Remove this temporary feature-branch workflow
        if: ${{ always() }}
        run: |
          git fetch origin fix/canonical-bast-cost-source
          git checkout -B cleanup-pages-runner origin/fix/canonical-bast-cost-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/run-pages-fallback-materializer.yml
          git commit -m 'ci: remove Pages fallback materializer runner'
          git push origin HEAD:fix/canonical-bast-cost-source
