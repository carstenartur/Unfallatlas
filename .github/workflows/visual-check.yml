name: Visual Check (PR Screenshots)

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: visual-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare clean candidate directory
        run: |
          find docs/screenshots -maxdepth 1 -type f -name '*.png' -delete
          mkdir -p out/qa/screenshot-readiness
          find out/qa/screenshot-readiness -maxdepth 1 -type f -name '*.json' -delete
          rm -rf out/qa/documentation-live-links

      - name: Generate review screenshots with real cartographic basemaps
        id: generate_screenshots
        run: node scripts/run-live-documentation-screenshots.cjs

      - name: Audit README screenshot links against published application
        id: validate_live_links
        run: npm run qa:live-documentation-links

      - name: Validate one-to-one screenshot evidence
        id: validate_evidence
        run: npm run validate:screenshot-evidence -- --report out/qa/screenshot-evidence.json

      - name: Validate durable live cartography evidence
        id: validate_cartography
        run: node scripts/validate-live-cartography-evidence.cjs --report out/qa/live-cartography-evidence.json

      - name: Validate candidate dimensions, budgets and references
        id: validate_media
        run: npm run validate:media -- --candidate-screenshots --report out/qa/documentation-media.json

      - name: Upload published-application deep-link evidence
        uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('out/qa/documentation-live-links/*') != '' }}
        with:
          name: pr-live-documentation-links-${{ github.event.pull_request.number }}
          path: out/qa/documentation-live-links/
          if-no-files-found: error
          retention-days: 30

      - name: Upload PR screenshots as artifact
        uses: actions/upload-artifact@v7
        if: ${{ steps.validate_media.outcome == 'success' && steps.validate_evidence.outcome == 'success' && steps.validate_cartography.outcome == 'success' && steps.validate_live_links.outcome == 'success' }}
        with:
          name: pr-live-map-screenshots-${{ github.event.pull_request.number }}
          path: |
            docs/screenshots/*.png
            out/qa/screenshot-readiness/*.json
            out/qa/screenshot-evidence.json
            out/qa/live-cartography-evidence.json
            out/qa/documentation-live-links/
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload media QA report
        uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('out/qa/documentation-media.json', 'out/qa/screenshot-evidence.json', 'out/qa/live-cartography-evidence.json', 'out/qa/screenshot-readiness/*.json', 'out/qa/documentation-live-links/*', 'test-results/**', 'playwright-report/**') != '' }}
        with:
          name: pr-media-report-${{ github.event.pull_request.number }}
          path: |
            out/qa/documentation-media.json
            out/qa/screenshot-evidence.json
            out/qa/live-cartography-evidence.json
            out/qa/screenshot-readiness/
            out/qa/documentation-live-links/
            _site/build-manifest.json
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 30

      - name: Write PR summary
        run: |
          echo "## рџ“ё Visual Check вЂ“ Screenshots und README-Deep-Links" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Der Lauf akzeptiert nur erfolgreich geladen reale OSM-/WMS-/Orthofoto-Bildantworten." >> "$GITHUB_STEP_SUMMARY"
          echo "Synthetische SVG-Kacheln bleiben ausschlieГџlich in der hermetischen E2E-Testsuite." >> "$GITHUB_STEP_SUMMARY"
          echo "Die Sidecars binden jeden Karten-Screenshot an Provider-URL, HTTP-Status und Raster-MIME-Typ." >> "$GITHUB_STEP_SUMMARY"
          echo "ZusГ¤tzlich werden die anklickbaren README-Screenshots in der verГ¶ffentlichten GitHub-Pages-Anwendung geГ¶ffnet und gegen ihren UI-/Kartenvertrag geprГјft." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
