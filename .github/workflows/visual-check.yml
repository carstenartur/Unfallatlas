name: Visual Check (PR Screenshots)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'README.md'
      - 'pom.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/DOKUMENTATION.md'
      - 'docs/documentation-live-link-qa.md'
      - 'docs/media-manifest.json'
      - 'docs/screenshots/**'
      - 'qa/accept-screenshot-candidate.json'
      - 'qa/screenshot-evidence/**'
      - 'werkbank_v2.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/documentation-deeplink-contract.cjs'
      - 'scripts/run-live-documentation-screenshots.cjs'
      - 'scripts/run-live-documentation-links.cjs'
      - 'scripts/run-live-documentation-qa.js'
      - 'scripts/validate-live-cartography-evidence.cjs'
      - 'scripts/validate-doc-media.js'
      - 'scripts/validate-screenshot-evidence.js'
      - 'tests/e2e/documentation-deeplinks.live.spec.js'
      - 'tests/e2e/screenshots*.spec.js'
      - 'tests/integration/documentationDeepLinkRepositoryContract.test.js'
      - 'tests/unit/documentationDeepLinkContract.test.js'
      - '.github/workflows/visual-check.yml'

permissions:
  contents: read

concurrency:
  group: visual-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      candidate_name: ${{ steps.candidate_metadata.outputs.name }}
      candidate_artifact_id: ${{ steps.candidate_upload.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.candidate_upload.outputs.artifact-digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate and validate candidate documentation and deep links
        env:
          DOCUMENTATION_APP_BASE_URL: 'http://localhost:8000'
        run: mvn -B -ntp verify -Pdocumentation-live -Ddocumentation.liveLinks=true

      - name: Upload candidate deep-link evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('out/qa/documentation-live-links/*') != '' }}
        with:
          name: pr-candidate-documentation-links-${{ github.event.pull_request.number }}
          path: out/qa/documentation-live-links/
          if-no-files-found: error
          retention-days: 30

      - name: Resolve immutable candidate artifact name
        id: candidate_metadata
        shell: bash
        run: echo "name=pr-live-map-screenshots-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Upload PR screenshots as artifact
        id: candidate_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate_metadata.outputs.name }}
          path: |
            docs/screenshots/*.png
            out/qa/screenshot-readiness/*.json
            out/qa/screenshot-evidence.json
            out/qa/live-cartography-evidence.json
            out/qa/documentation-live-links/
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload media QA report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('out/qa/documentation-media.json', 'out/qa/screenshot-evidence.json', 'out/qa/live-cartography-evidence.json', 'out/qa/screenshot-readiness/*.json', 'out/qa/documentation-live-links/*') != '' }}
        with:
          name: pr-media-report-${{ github.event.pull_request.number }}
          path: |
            out/qa/documentation-media.json
            out/qa/screenshot-evidence.json
            out/qa/live-cartography-evidence.json
            out/qa/screenshot-readiness/
            out/qa/documentation-live-links/
            out/qa/live-documentation-screenshots.log
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Write PR summary
        run: |
          echo '## Visual Check – Kandidatenartefakt, Screenshots und Dokumentations-Deep-Links' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'Dieser PR-Lauf prüft ausschließlich das lokal gebaute Kandidatenartefakt unter http://localhost:8000.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Die tatsächlich veröffentlichte GitHub-Pages-Anwendung wird getrennt nach jedem Deployment und täglich geprüft.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Karten-Screenshots bleiben an Provider-URL, HTTP-Status und Raster-MIME-Typ gebunden.' >> "$GITHUB_STEP_SUMMARY"

  accept-reviewed-screenshots:
    name: Accept explicitly reviewed screenshot candidate
    needs: pr-screenshots
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'carstenartur'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      ACCEPTANCE_MARKER: qa/accept-screenshot-candidate.json
      ARTIFACT_NAME: ${{ needs.pr-screenshots.outputs.candidate_name }}
      ARTIFACT_ID: ${{ needs.pr-screenshots.outputs.candidate_artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.pr-screenshots.outputs.candidate_artifact_digest }}
      EVIDENCE_REVISION: ${{ github.sha }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout exact pull-request head with write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Detect explicit acceptance marker
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$ACCEPTANCE_MARKER" ]]; then
            echo 'requested=true' >> "$GITHUB_OUTPUT"
          else
            echo 'requested=false' >> "$GITHUB_OUTPUT"
            echo 'No explicit screenshot acceptance marker is present.'
          fi

      - name: Download immutable candidate from this exact workflow run
        if: steps.acceptance.outputs.requested == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.pr-screenshots.outputs.candidate_name }}
          path: accepted-candidate

      - name: Verify and apply candidate with durable provenance
        if: steps.acceptance.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil

          root = pathlib.Path.cwd().resolve()
          marker_path = root / os.environ['ACCEPTANCE_MARKER']
          candidate = root / 'accepted-candidate'
          marker = json.loads(marker_path.read_text(encoding='utf-8'))
          expected_artifact = os.environ['ARTIFACT_NAME']
          pr_number = int(os.environ['PR_NUMBER'])
          if marker.get('schemaVersion') != 1 or marker.get('accept') is not True:
              raise SystemExit('invalid screenshot acceptance marker')
          if marker.get('pullRequest') != pr_number:
              raise SystemExit('acceptance marker belongs to another pull request')
          if marker.get('artifactName') != expected_artifact:
              raise SystemExit('acceptance marker names another artifact')

          summary_path = candidate / 'out/qa/screenshot-evidence.json'
          cartography_path = candidate / 'out/qa/live-cartography-evidence.json'
          readiness_dir = candidate / 'out/qa/screenshot-readiness'
          screenshots_dir = candidate / 'docs/screenshots'
          build_path = candidate / '_site/build-manifest.json'
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          cartography = json.loads(cartography_path.read_text(encoding='utf-8'))
          if summary.get('schemaVersion') != 1 or summary.get('valid') is not True or summary.get('errors'):
              raise SystemExit('candidate screenshot summary is not valid')
          if cartography.get('schemaVersion') != 3 or cartography.get('valid') is not True or cartography.get('errors'):
              raise SystemExit('candidate live-cartography evidence is not valid schema 3')
          if summary.get('revision') != os.environ['EVIDENCE_REVISION']:
              raise SystemExit('candidate summary is not bound to this workflow revision')
          if len(summary.get('screenshots') or []) != 21:
              raise SystemExit('candidate does not contain the complete canonical screenshot set')
          totals = cartography.get('totals') or {}
          if totals.get('screenshots') != 21 or totals.get('validCartographic') != 20 or totals.get('exempt') != 1:
              raise SystemExit('candidate cartography totals are incomplete')

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          current_build = root / '_site/build-manifest.json'
          if not current_build.is_file() or sha256(current_build) != sha256(build_path):
              raise SystemExit('candidate build manifest differs from the reviewed repository build')
          build = summary.get('build') or {}
          if build.get('sha256') != sha256(build_path):
              raise SystemExit('candidate summary build hash is inconsistent')

          sidecars = sorted(readiness_dir.glob('*.json'))
          if len(sidecars) != 21:
              raise SystemExit('candidate readiness sidecar set is incomplete')
          for entry in summary['screenshots']:
              relative = pathlib.PurePosixPath(entry['path'])
              if relative.is_absolute() or '..' in relative.parts or relative.parts[:2] != ('docs', 'screenshots'):
                  raise SystemExit(f'unsafe screenshot path: {relative}')
              source = candidate.joinpath(*relative.parts)
              if not source.is_file() or source.stat().st_size != entry['bytes'] or sha256(source) != entry['sha256']:
                  raise SystemExit(f'candidate screenshot hash/size mismatch: {relative}')
              sidecar_name = pathlib.PurePosixPath(entry['evidence']).name
              sidecar = readiness_dir / sidecar_name
              if not sidecar.is_file():
                  raise SystemExit(f'missing candidate sidecar: {sidecar_name}')
              sidecar_data = json.loads(sidecar.read_text(encoding='utf-8'))
              shot = sidecar_data.get('screenshot') or {}
              if sidecar_data.get('revision') != summary['revision'] or shot.get('path') != entry['path'] or shot.get('sha256') != entry['sha256'] or shot.get('bytes') != entry['bytes']:
                  raise SystemExit(f'candidate sidecar binding mismatch: {sidecar_name}')

          destination_shots = root / 'docs/screenshots'
          destination_readiness = root / 'qa/screenshot-evidence/readiness'
          shutil.rmtree(destination_shots)
          shutil.copytree(screenshots_dir, destination_shots)
          shutil.rmtree(destination_readiness)
          shutil.copytree(readiness_dir, destination_readiness)
          destination_summary = root / 'qa/screenshot-evidence/summary.json'
          destination_cartography = root / 'qa/screenshot-evidence/live-cartography.json'
          shutil.copyfile(summary_path, destination_summary)
          shutil.copyfile(cartography_path, destination_cartography)

          entries = [
              {'path': row['path'], 'sha256': row['sha256'], 'bytes': row['bytes']}
              for row in summary['screenshots']
          ]
          entries_digest = hashlib.sha256(''.join(
              f"{row['path']}\t{row['sha256']}\t{row['bytes']}\n" for row in entries
          ).encode()).hexdigest()
          readiness = []
          for sidecar in sorted(destination_readiness.glob('*.json')):
              readiness.append((sidecar.name, sha256(sidecar), sidecar.stat().st_size))
          readiness_digest = hashlib.sha256(''.join(
              f'{name}\t{digest}\t{size}\n' for name, digest, size in readiness
          ).encode()).hexdigest()
          artifact_digest = os.environ['ARTIFACT_DIGEST']
          if artifact_digest.startswith('sha256:'):
              artifact_digest = artifact_digest.split(':', 1)[1]
          if len(artifact_digest) != 64:
              raise SystemExit('workflow artifact digest is unavailable or malformed')
          artifact_id = int(os.environ['ARTIFACT_ID'])
          provenance = {
              'schemaVersion': 1,
              'purpose': 'Durable checked-in binding for the explicitly reviewed, fully rendered map screenshots generated by the Visual Check workflow.',
              'source': {
                  'artifactName': expected_artifact,
                  'artifactId': artifact_id,
                  'artifactZipSha256': artifact_digest,
                  'evidenceRevision': summary['revision'],
                  'evidenceStatus': 'valid',
                  'evidenceCount': len(entries),
              },
              'build': {
                  'manifestSha256': build['sha256'],
                  'fingerprint': build['fingerprint'],
                  'applicationFingerprint': build['applicationFingerprint'],
                  'dataFingerprint': build['dataFingerprint'],
              },
              'summary': {
                  'path': 'qa/screenshot-evidence/summary.json',
                  'sha256': sha256(destination_summary),
                  'entriesSha256': entries_digest,
              },
              'cartography': {
                  'path': 'qa/screenshot-evidence/live-cartography.json',
                  'sha256': sha256(destination_cartography),
                  'schemaVersion': cartography['schemaVersion'],
                  'validCartographic': totals['validCartographic'],
                  'exempt': totals['exempt'],
              },
              'readiness': {
                  'directory': 'qa/screenshot-evidence/readiness',
                  'files': len(readiness),
                  'bytes': sum(size for _, _, size in readiness),
                  'entriesSha256': readiness_digest,
              },
          }
          (root / 'qa/screenshot-evidence/provenance.json').write_text(
              json.dumps(provenance, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY

      - name: Revalidate accepted bytes and every cartography sidecar
        if: steps.acceptance.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-doc-media.js --report out/qa/accepted-documentation-media.json
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { validateCartographyRecord } = require('./scripts/validate-live-cartography-evidence.cjs');
          const summary = JSON.parse(fs.readFileSync('qa/screenshot-evidence/summary.json', 'utf8'));
          const errors = [];
          for (const entry of summary.screenshots) {
            if (path.basename(entry.path) === '15-export-pdf-rendered.png') continue;
            const sidecar = JSON.parse(fs.readFileSync(
              path.join('qa/screenshot-evidence/readiness', path.basename(entry.evidence)), 'utf8'
            ));
            errors.push(...validateCartographyRecord(sidecar.cartography, entry.path));
          }
          if (errors.length) {
            for (const error of errors) console.error(`ERROR\t${error}`);
            process.exit(1);
          }
          console.log('[accepted-cartography] 20/20 map screenshots retain complete live-tile evidence');
          NODE

      - name: Refuse stale acceptance and commit the exact reviewed candidate
        if: steps.acceptance.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${HEAD_REF}"
          remote_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "Pull-request head moved: expected $EXPECTED_HEAD_SHA, found $remote_head" >&2
            exit 1
          fi
          git rm "$ACCEPTANCE_MARKER"
          git add docs/screenshots qa/screenshot-evidence
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Acceptance produced no reviewed media change.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: accept fully rendered map screenshots'
          git push origin "HEAD:${HEAD_REF}"
