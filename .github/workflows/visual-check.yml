name: Visual Check (PR Screenshots)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'README.md'
      - 'pom.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/media-manifest.json'
      - 'docs/screenshots/**'
      - 'werkbank_v2.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/run-live-documentation-screenshots.cjs'
      - 'scripts/run-live-documentation-links.cjs'
      - 'scripts/run-live-documentation-qa.js'
      - 'scripts/validate-live-cartography-evidence.cjs'
      - 'scripts/validate-doc-media.js'
      - 'scripts/validate-screenshot-evidence.js'
      - 'tests/e2e/screenshots*.spec.js'
      - '.github/workflows/visual-check.yml'

permissions:
  contents: read

concurrency:
  group: visual-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate and validate candidate documentation and deep links
        env:
          DOCUMENTATION_APP_BASE_URL: 'http://localhost:8000'
        run: mvn -B -ntp verify -Pdocumentation-live -Ddocumentation.liveLinks=true

      - name: Upload candidate deep-link evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ always() && hashFiles('out/qa/documentation-live-links/*') != '' }}
        with:
          name: pr-candidate-documentation-links-${{ github.event.pull_request.number }}
          path: out/qa/documentation-live-links/
          if-no-files-found: error
          retention-days: 30

      - name: Upload PR screenshots as artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr-live-map-screenshots-${{ github.event.pull_request.number }}
          path: |
            docs/screenshots/*.png
            out/qa/screenshot-readiness/*.json
            out/qa/screenshot-evidence.json
            out/qa/live-cartography-evidence.json
            out/qa/documentation-live-links/
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload media QA report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ always() && hashFiles('out/qa/documentation-media.json', 'out/qa/screenshot-evidence.json', 'out/qa/live-cartography-evidence.json', 'out/qa/screenshot-readiness/*.json', 'out/qa/documentation-live-links/*') != '' }}
        with:
          name: pr-media-report-${{ github.event.pull_request.number }}
          path: |
            out/qa/documentation-media.json
            out/qa/screenshot-evidence.json
            out/qa/live-cartography-evidence.json
            out/qa/screenshot-readiness/
            out/qa/documentation-live-links/
            out/qa/live-documentation-screenshots.log
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Write PR summary
        run: |
          echo '## Visual Check – Kandidatenartefakt, Screenshots und README-Deep-Links' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'Dieser PR-Lauf prüft ausschließlich das lokal gebaute Kandidatenartefakt unter http://localhost:8000.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Die tatsächlich veröffentlichte GitHub-Pages-Anwendung wird getrennt nach jedem Deployment und täglich geprüft.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Karten-Screenshots bleiben an Provider-URL, HTTP-Status und Raster-MIME-Typ gebunden.' >> "$GITHUB_STEP_SUMMARY"
