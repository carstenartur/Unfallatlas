name: Visual Check (PR Screenshots)

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  actions: read
  contents: write

concurrency:
  group: visual-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare clean candidate directory
        run: |
          find docs/screenshots -maxdepth 1 -type f -name '*.png' -delete
          mkdir -p out/qa/screenshot-readiness
          find out/qa/screenshot-readiness -maxdepth 1 -type f -name '*.json' -delete

      - name: Generate screenshots
        run: npx playwright test tests/e2e/screenshots.spec.js --project=chromium

      - name: Validate one-to-one screenshot evidence
        id: validate_evidence
        run: npm run validate:screenshot-evidence -- --report out/qa/screenshot-evidence.json

      - name: Validate candidate dimensions, budgets and references
        id: validate_media
        run: npm run validate:media -- --candidate-screenshots --report out/qa/documentation-media.json

      - name: Upload PR screenshots as artifact
        uses: actions/upload-artifact@v7
        if: ${{ steps.validate_media.outcome == 'success' && steps.validate_evidence.outcome == 'success' }}
        with:
          name: pr-screenshots-${{ github.event.pull_request.number }}
          path: |
            docs/screenshots/*.png
            out/qa/screenshot-readiness/*.json
            out/qa/screenshot-evidence.json
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload media QA report
        uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('out/qa/documentation-media.json', 'out/qa/screenshot-evidence.json', 'out/qa/screenshot-readiness/*.json') != '' }}
        with:
          name: pr-media-report-${{ github.event.pull_request.number }}
          path: |
            out/qa/documentation-media.json
            out/qa/screenshot-evidence.json
            out/qa/screenshot-readiness/
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Write PR summary
        run: |
          echo "## 📸 Visual Check – Screenshots" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots wurden als Artefakt hochgeladen:" >> "$GITHUB_STEP_SUMMARY"
          echo "**pr-screenshots-${{ github.event.pull_request.number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Enthaltene Map-Mode-Szenarien:" >> "$GITHUB_STEP_SUMMARY"
          echo '- 21-mapmode-standard.png (`standard`)' >> "$GITHUB_STEP_SUMMARY"
          echo '- 22-mapmode-orthophoto.png (`orthophoto`)' >> "$GITHUB_STEP_SUMMARY"
          echo '- 23-mapmode-hybrid.png (`hybrid`)' >> "$GITHUB_STEP_SUMMARY"
          echo '- 24-mapmode-analysis.png (`analysis`)' >> "$GITHUB_STEP_SUMMARY"
          echo "- 25-mapmode-orthophoto-fallback.png (Orthofoto-Ausfall → Standard-Fallback)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bitte die Screenshots unter *Actions → dieser Workflow-Run → Artifacts* prüfen." >> "$GITHUB_STEP_SUMMARY"

      - name: Report rejected candidate
        if: failure()
        run: |
          echo "## 📸 Visual Check fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Es wurde bewusst kein Screenshot-Kandidat veröffentlicht. Bitte den fehlgeschlagenen Schritt prüfen." >> "$GITHUB_STEP_SUMMARY"

  adopt-reviewed-map-context-evidence:
    if: github.event.pull_request.number == 409
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download and verify reviewed exact-head artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '8443620798'
          ARTIFACT_SHA256: '0ee8f4d10e3e5974b36d8f0e85092b231a0d0261bff401a2fc84ecddc1d61e7c'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/pr-screenshots-409.zip
          echo "${ARTIFACT_SHA256}  /tmp/pr-screenshots-409.zip" | sha256sum --check --strict
          rm -rf /tmp/pr-screenshots-409
          mkdir -p /tmp/pr-screenshots-409
          unzip -q /tmp/pr-screenshots-409.zip -d /tmp/pr-screenshots-409

      - name: Adopt screenshots and durable evidence
        run: |
          set -euo pipefail
          cp -a /tmp/pr-screenshots-409/docs/screenshots/*.png docs/screenshots/
          rm -rf qa/screenshot-evidence/readiness
          mkdir -p qa/screenshot-evidence/readiness
          cp -a /tmp/pr-screenshots-409/out/qa/screenshot-readiness/*.json qa/screenshot-evidence/readiness/
          cp /tmp/pr-screenshots-409/out/qa/screenshot-evidence.json qa/screenshot-evidence/summary.json
          cat > qa/screenshot-evidence/provenance.json <<'JSON'
          {
            "schemaVersion": 1,
            "purpose": "Durable, checked-in binding for the reviewed screenshot artifact adopted on 2026-07-19.",
            "source": {
              "artifactName": "pr-screenshots-409",
              "artifactId": 8443620798,
              "artifactZipSha256": "0ee8f4d10e3e5974b36d8f0e85092b231a0d0261bff401a2fc84ecddc1d61e7c",
              "evidenceRevision": "c51bee7d74c5b0af10e1900c7aa4b8c0c867b560",
              "evidenceStatus": "valid",
              "evidenceCount": 21
            },
            "build": {
              "manifestSha256": "e9dc9f7a5862ef31fc3154f8cb6b7c020e36f1aef435955922104c8d77d71c58",
              "fingerprint": "6cee4c965d0a8b5627c49e71ad000f6dbc1237d0db97aa01572acc459e67c651",
              "applicationFingerprint": "db6c4a65d416318613683f89aa5f84ebfa7e47e13ad6bd1f66741608a2cc866c",
              "dataFingerprint": "e6c0454efd018e0ea56cca78056a16228ca47ed56f644ed75370462120ae8c37"
            },
            "summary": {
              "path": "qa/screenshot-evidence/summary.json",
              "sha256": "9340eb997b83cef91d2a5ba700af90bb4218a7defb4a75ed3746f96e76c18171",
              "entriesSha256": "cfbee600c873feb43abb38de69146341105b3e98571908078007920f5b34887d"
            },
            "readiness": {
              "directory": "qa/screenshot-evidence/readiness",
              "files": 21,
              "bytes": 43018,
              "entriesSha256": "4537e557cf09a95094cafd425bf27a6b78aa7f30ddc89ef8db78855234837eac"
            }
          }
          JSON

      - name: Update media QA record
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('docs/media-qa-2026-07-19.md')
          text = path.read_text()
          replacements = {
            'Workflow-Artefakt `pr-screenshots-405` (Artefakt-ID `8443391659`,\nEvidence-Revision `be3664f039612d320c356b7c581a2de1fd4182db`).':
              'Workflow-Artefakt `pr-screenshots-409` (Artefakt-ID `8443620798`,\nEvidence-Revision `c51bee7d74c5b0af10e1900c7aa4b8c0c867b560`).',
            '`8f831c6941238414750fbdb00c859a28163e2938d0b26964418d792a60b1a78a`,':
              '`6cee4c965d0a8b5627c49e71ad000f6dbc1237d0db97aa01572acc459e67c651`,',
            '`3a6785762ed8854d714cd6b0718fdcd1d03dd10a16e2778d59a81bf20b467732`':
              '`db6c4a65d416318613683f89aa5f84ebfa7e47e13ad6bd1f66741608a2cc866c`',
            '`bc4d1ebc07ce61b32fb6764188c6e877f17e05ba16108897b009f58df0169ed8`.':
              '`0ee8f4d10e3e5974b36d8f0e85092b231a0d0261bff401a2fc84ecddc1d61e7c`.',
            'von 15.967.064 auf 5.614.992 Byte\n  (−10.352.072 Byte beziehungsweise −64,8 %).':
              'von 15.967.064 auf 5.829.427 Byte\n  (−10.137.637 Byte beziehungsweise −63,5 %).',
            'von 24.920.792 auf\n  14.568.720 Byte (−41,5 %);':
              'von 24.920.792 auf\n  14.783.155 Byte (−40,7 %);',
            '| `02-stadtauswahl.png` | 199.380 | 87.795 | −111.585 |':
              '| `02-stadtauswahl.png` | 199.380 | 163.810 | −35.570 |',
            '| `03-filter.png` | 200.425 | 88.446 | −111.979 |':
              '| `03-filter.png` | 200.425 | 150.511 | −49.914 |',
            '| `06-legende.png` | 1.220.527 | 181.214 | −1.039.313 |':
              '| `06-legende.png` | 1.220.527 | 182.907 | −1.037.620 |',
            '| `08-stundenfilter.png` | 199.747 | 85.417 | −114.330 |':
              '| `08-stundenfilter.png` | 199.747 | 160.105 | −39.642 |',
            '| `15-export-pdf-rendered.png` | 105.545 | 128.864 | +23.319 |':
              '| `15-export-pdf-rendered.png` | 105.545 | 128.838 | +23.293 |',
            '| **Screenshots gesamt** | **15.967.064** | **5.614.992** | **−10.352.072** |':
              '| **Screenshots gesamt** | **15.967.064** | **5.829.427** | **−10.137.637** |',
            'Die 17 Desktopansichten wurden als Gesamtübersicht sowie in Originalauflösung\nauf Datenpunkte, Cluster, Heatmap, Legende, Filterzustände, Auswahlrechteck,\nKartenmodi und Exportdialog geprüft. Die drei 440×620-Panelansichten wurden\nseparat in Originalauflösung auf Lesbarkeit, border-box-konforme Breite,\nTouch-Zielabstände und die für den jeweiligen Belegzweck relevanten Inhalte\ngeprüft.':
              'Die 20 Desktopansichten wurden als Gesamtübersicht sowie in Originalauflösung\nauf Datenpunkte, Cluster, Heatmap, Legende, Filterzustände, Auswahlrechteck,\nKartenmodi und Exportdialog geprüft. Die bedienfeldorientierten Ansichten 02, 03\nund 08 zeigen nun zusätzlich die Karte mit positivem Unfall-Layer, sodass Auswahl,\nFilterzustand und räumliches Ergebnis gemeinsam belegt werden.'
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Restore workflow, validate and commit
        run: |
          set -euo pipefail
          git fetch --depth=1 origin fix/professional-qa-hardening
          git checkout FETCH_HEAD -- .github/workflows/visual-check.yml
          node scripts/validate-doc-media.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots qa/screenshot-evidence docs/media-qa-2026-07-19.md .github/workflows/visual-check.yml
          git diff --cached --stat
          git commit -m 'Adopt reviewed map-context screenshot evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
