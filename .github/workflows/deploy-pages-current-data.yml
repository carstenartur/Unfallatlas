name: Build and Deploy Current Pages Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages-current-data.yml'
      - '.github/workflows/generate-data-deploy-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'cities.txt'
      - '*.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/build-site.js'
      - 'scripts/build-static-data.js'
      - 'scripts/validate-static-data.js'
      - 'scripts/build-public-pages-profile.js'
      - 'scripts/validate-public-pages-profile.js'
      - 'out/**'
      - 'data/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages-current-data.yml'
      - '.github/workflows/generate-data-deploy-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'cities.txt'
      - '*.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/build-site.js'
      - 'scripts/build-static-data.js'
      - 'scripts/validate-static-data.js'
      - 'scripts/build-public-pages-profile.js'
      - 'scripts/validate-public-pages-profile.js'
      - 'out/**'
      - 'data/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: pages-profile-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Build canonical site from checked-in verified data
        run: npm run build:site -- --input-dir out --poi-dir out --output-dir _site

      - name: Materialize provenance-complete public Pages profile
        run: npm run build:pages-profile -- --site _site

      - name: Validate public Pages artifact
        run: |
          node scripts/validate-static-data.js \
            --dir _site/out \
            --gzip-only \
            --require-cities-file cities.txt \
            --min-features 10
          node scripts/check-context-datasets.js _site
          npm run validate:media -- --report out/qa/pages-current-documentation-media.json
          npm run validate:pages-profile -- --site _site

      - name: Upload public-profile QA evidence
        if: ${{ always() && hashFiles('_site/build-manifest.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-current-profile-evidence
          path: |
            out/qa/pages-current-documentation-media.json
            _site/build-manifest.json
            _site/vendor/third-party-notices.json
            _site/vendor/public-preview-sbom.cdx.json
          if-no-files-found: error

      - name: Configure Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
