name: "04 · Aktuelle Daten veröffentlichen"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages-current-data.yml'
      - 'pom.xml'
      - 'analysis-service/**'
      - 'package.json'
      - 'package-lock.json'
      - 'cities.txt'
      - '*.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'out/**'
      - 'data/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: pages-current-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Maven cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run the checkout-reproducible Maven build
        run: mvn -B -ntp clean verify -Ppages

      - name: Upload Maven Pages QA evidence
        if: ${{ always() && hashFiles('_site/build-manifest.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-current-profile-evidence
          path: |
            out/qa/pages-maven-documentation-media.json
            out/qa/pages-maven-profile.sha256
            out/qa/pages-maven-server.log
            _site/build-manifest.json
            _site/vendor/third-party-notices.json
            _site/vendor/public-preview-sbom.cdx.json
            playwright-report
            test-results
            analysis-service/target/surefire-reports
            analysis-service/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # The repository-level Pages source is configuration, not deployment
      # state. It must be set to "GitHub Actions" once in repository settings;
      # deployment jobs deliberately do not mutate repository administration.
      - name: Configure Pages deployment
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy Maven-verified artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
