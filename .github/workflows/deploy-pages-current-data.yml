name: "04 · Aktuelle Daten veröffentlichen"

on:
  workflow_dispatch:
    inputs:
      hannover_checkpoint_retry:
        description: Revalidate retained Hannover checkpoints without any official source requests
        type: boolean
        default: false
      ris_source_cache_key:
        description: Exact existing ris-sources-v1-Linux-RUN-ATTEMPT cache key (required for checkpoint retry)
        type: string
        default: ''
      ris_min_records:
        description: Minimum published Hannover record count required by this recovery
        type: number
        default: 674
  schedule:
    # Continue bounded RIS detail acquisition and renewal daily. Sunday's
    # existing full data workflow supplies the remaining weekly run.
    - cron: '17 4 * * 1-6'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages-current-data.yml'
      - 'pom.xml'
      - 'analysis-service/**'
      - 'package.json'
      - 'package-lock.json'
      - 'cities.txt'
      - '*.html'
      - 'css/**'
      - 'js/**'
      - 'server/political-context/**'
      - 'config/ris-locations/**'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'out/**'
      - 'data/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  # Both deployment workflows restore snapshots from the current Pages site.
  group: pages-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Maven cache
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          problem-matcher: true
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Validate manual Hannover checkpoint retry
        id: ris-checkpoint-retry
        env:
          RIS_RETRY_ENABLED: ${{ inputs.hannover_checkpoint_retry || false }}
          RIS_RETRY_EVENT: ${{ github.event_name }}
          RIS_RETRY_CACHE_KEY: ${{ inputs.ris_source_cache_key }}
          RIS_RETRY_MIN_RECORDS: ${{ inputs.ris_min_records }}
        shell: bash
        run: |
          case "$RIS_RETRY_ENABLED" in
            false|'') printf 'enabled=false\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
            true) ;;
            *) echo 'Invalid checkpoint retry mode' >&2; exit 1 ;;
          esac
          if [[ "$RIS_RETRY_EVENT" != workflow_dispatch ||
                ! "$RIS_RETRY_CACHE_KEY" =~ ^ris-sources-v1-Linux-[1-9][0-9]*-[1-9][0-9]*$ ||
                ${#RIS_RETRY_CACHE_KEY} -gt 128 ||
                ! "$RIS_RETRY_MIN_RECORDS" =~ ^[1-9][0-9]*$ ||
                ${#RIS_RETRY_MIN_RECORDS} -gt 16 ]]; then
            echo 'Checkpoint retry requires a manual event, exact cache key and positive minimum record count' >&2
            exit 1
          fi
          if [[ ${#RIS_RETRY_MIN_RECORDS} -eq 16 && "$RIS_RETRY_MIN_RECORDS" > 9007199254740991 ]]; then
            echo 'Checkpoint retry minimum exceeds the safe integer range' >&2
            exit 1
          fi
          printf 'enabled=true\ncache-key=%s\nmin-records=%s\n' "$RIS_RETRY_CACHE_KEY" "$RIS_RETRY_MIN_RECORDS" >> "$GITHUB_OUTPUT"

      - name: Restore exact Hannover checkpoint source cache
        if: steps.ris-checkpoint-retry.outputs.enabled == 'true'
        id: ris-checkpoint-source-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ris-sources
          key: ${{ steps.ris-checkpoint-retry.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore RIS source cache
        if: steps.ris-checkpoint-retry.outputs.enabled != 'true'
        id: ris-source-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ris-sources
          key: ris-sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ris-sources-v1-${{ runner.os }}-

      - name: Run the checkout-reproducible Maven build
        env:
          CARTO_BASEMAPS_KEY: ${{ secrets.CARTO_BASEMAPS_KEY }}
          PAGES_REFRESH_RIS: '1'
          PAGES_RIS_CHECKPOINT_RETRY: ${{ steps.ris-checkpoint-retry.outputs.enabled }}
          PAGES_RIS_SOURCE_CACHE_KEY: ${{ steps.ris-checkpoint-retry.outputs.cache-key }}
          PAGES_RIS_MIN_RECORDS: ${{ steps.ris-checkpoint-retry.outputs.min-records }}
          PAGES_RIS_CACHE_HIT: ${{ steps.ris-checkpoint-source-cache.outputs.cache-hit }}
        run: mvn -B -ntp clean verify -Ppages

      # Preserve completed source downloads when an import or later QA fails.
      - name: Save RIS source cache
        if: always() && steps.ris-source-cache.outputs.cache-hit != 'true' && steps.ris-checkpoint-retry.outputs.enabled == 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ris-sources
          key: ris-sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Maven Pages QA evidence
        if: ${{ always() && hashFiles('_site/build-manifest.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-current-profile-evidence
          path: |
            out/qa/pages-maven-documentation-media.json
            out/qa/pages-maven-profile.sha256
            out/qa/pages-maven-server.log
            _site/build-manifest.json
            _site/vendor/third-party-notices.json
            _site/vendor/public-preview-sbom.cdx.json
            playwright-report
            test-results
            analysis-service/target/surefire-reports
            analysis-service/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # The repository-level Pages source is configuration, not deployment
      # state. It must be set to "GitHub Actions" once in repository settings;
      # deployment jobs deliberately do not mutate repository administration.
      - name: Configure Pages deployment
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy Maven-verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
