name: Restore traffic provider 493

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/restore-traffic-provider-493.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebased PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/traffic-provider-core
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Restore durable provider files and reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/backup-traffic-provider-493
          git checkout origin/automation/backup-traffic-provider-493 -- \
            docs/adr/traffic-evidence-types.md \
            js/ua.traffic_provider.js \
            tests/unit/trafficProvider.test.js
          git show origin/automation/backup-traffic-provider-493:.github/workflows/finalize-traffic-provider-v2.yml > /tmp/traffic-v2.yml
          awk '
            /^          from pathlib import Path$/ { capture=1 }
            /^      - name: Format and test$/ { capture=0 }
            capture { sub(/^          /, ""); print }
          ' /tmp/traffic-v2.yml > /tmp/traffic-provider-patch.py
          python /tmp/traffic-provider-patch.py
      - name: Install, format and test
        run: |
          npm ci
          npx --yes prettier@3.6.2 --write \
            docs/adr/traffic-evidence-types.md \
            js/ua.traffic_provider.js \
            tests/unit/trafficProvider.test.js
          node --check js/ua.traffic_provider.js
          npx jest --runInBand tests/unit/sourceManifest.test.js tests/unit/trafficProvider.test.js
      - name: Commit restored provider
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/adr/traffic-evidence-types.md \
            js/ua.traffic_provider.js \
            tests/unit/trafficProvider.test.js
          git commit -m 'feat: add hardened traffic evidence provider core'
          git push origin HEAD:feat/traffic-provider-core
