name: Materialize PR 524 CI repair

on:
  push:
    branches: [fix/pragmatic-public-browser-profile]
    paths:
      - '.github/workflows/materialize-pr524-ci-repair.yml'
      - '.github/pr524-ci-repair.trigger'

permissions:
  contents: write

concurrency:
  group: materialize-pr524-ci-repair
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pragmatic-public-browser-profile
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply deterministic CI contract repair
        run: |
          python scripts/fix-pr524-ci-contracts.py
          node --check tests/e2e/documentation-deeplinks.live.spec.js

      - name: Verify focused policy and build contracts
        run: |
          npm ci
          npx jest \
            tests/unit/publicPagesProfile.test.js \
            tests/unit/videoExportPublicProfile.test.js \
            tests/unit/vendorLicenseEvidence.test.js \
            tests/unit/siteBuildContract.test.js \
            --runInBand
          npm run build:site -- --input-dir out --poi-dir out --output-dir _site
          npm run build:pages-profile -- --site _site
          npm run validate:pages-profile -- --site _site

      - name: Persist verified non-workflow changes and workflow payloads
        run: |
          mkdir -p .github/generated-pr524
          cp .github/workflows/deploy-pages-current-data.yml .github/generated-pr524/deploy-pages-current-data.yml.txt
          cp .github/workflows/generate-data-deploy-pages.yml .github/generated-pr524/generate-data-deploy-pages.yml.txt
          cp .github/workflows/visual-check.yml .github/generated-pr524/visual-check.yml.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/unit/siteBuildContract.test.js \
            tests/e2e/documentation-deeplinks.live.spec.js \
            .github/generated-pr524/
          git commit -m 'test: align PR 524 CI contracts'
          git push origin HEAD:fix/pragmatic-public-browser-profile
