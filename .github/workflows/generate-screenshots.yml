name: Generate Documentation Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-documentation-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate and validate live documentation candidates
        run: mvn -B -ntp verify -Pdocumentation-live -Ddocumentation.liveLinks=false

      - name: Upload reviewed screenshot candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: documentation-screenshots-live-map-${{ github.sha }}
          path: |
            docs/screenshots/*.png
            out/qa/screenshot-readiness/*.json
            out/qa/screenshot-evidence.json
            out/qa/live-cartography-evidence.json
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload media QA report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ always() && hashFiles('out/qa/documentation-media.json', 'out/qa/screenshot-evidence.json', 'out/qa/live-cartography-evidence.json', 'out/qa/screenshot-readiness/*.json') != '' }}
        with:
          name: documentation-media-report-${{ github.sha }}
          path: |
            out/qa/documentation-media.json
            out/qa/screenshot-evidence.json
            out/qa/live-cartography-evidence.json
            out/qa/screenshot-readiness/
            out/qa/live-documentation-screenshots.log
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Write review instructions
        run: |
          {
            echo "## Dokumentations-Screenshots"
            echo
            echo "Die Kandidaten wurden ausschließlich nach erfolgreichen echten OSM/WMS-/Orthofoto-Antworten erzeugt."
            echo "Abstrakte SVG-Testkacheln sind in diesem Workflow nicht als Grundkarte zulässig."
            echo "Jeder Karten-Screenshot besitzt eine dauerhafte Sidecar-Evidenz mit Provider-URL, HTTP-Status und Raster-MIME-Typ."
            echo
            echo "Die validierten Kandidaten wurden als Artifact hochgeladen."
            echo "Sie werden bewusst nicht direkt nach \`main\` geschrieben."
            echo "Bitte Unterschiede prüfen und gewünschte Medien über einen normalen Review-PR übernehmen."
          } >> "$GITHUB_STEP_SUMMARY"
