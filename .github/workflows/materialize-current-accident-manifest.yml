name: Materialize current accident manifest candidate

on:
  push:
    branches:
      - copilot/prepare-release
    paths:
      - '.github/workflows/materialize-current-accident-manifest.yml'

permissions:
  contents: write

concurrency:
  group: materialize-current-accident-manifest
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: copilot/prepare-release
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Materialize and verify the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/qa .build
          cp data/accident-data-release.json .build/previous-accident-data-release.json
          node --max-old-space-size=4096 scripts/validate-accident-publication.js \
            --write-manifest \
            --previous-manifest .build/previous-accident-data-release.json \
            --report out/qa/accident-publication-materialized.json
          node --max-old-space-size=4096 scripts/validate-accident-publication.js \
            --report out/qa/accident-publication-materialized-verified.json

      - name: Commit only the regenerated release oracle
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/accident-data-release.json
          if git diff --cached --quiet; then
            echo 'Release oracle already matches all published aggregate bytes.'
            exit 0
          fi
          git diff --cached --name-only | grep -Fx 'data/accident-data-release.json'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bind accident release manifest to enriched public data'
          git push origin HEAD:copilot/prepare-release
