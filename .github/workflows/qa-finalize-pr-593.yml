name: Finalize PR 593 QA fixes
# Produce byte-exact detached blobs; the workflow token never creates a tree or updates a ref.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-finalize-pr-593.yml'

permissions:
  contents: write

concurrency:
  group: qa-finalize-pr-593
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact staging commit without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Apply the reviewed patch and run source-level gates
        shell: bash
        run: |
          set -euo pipefail

          cat .qa-transfer/part-* | base64 --decode | gzip -d > /tmp/qa-finalize.patch
          echo '330d54a432a9459a2170a424d08961650d40aa9de1ba0a291afd260080e939a7  /tmp/qa-finalize.patch' | sha256sum --check --strict
          git apply --index --whitespace=error-all \
            --exclude=.github/workflows/deploy-release.yml \
            --exclude=server/start.js \
            /tmp/qa-finalize.patch

          cat .qa-transfer/overlay-* | base64 --decode > /tmp/qa-overlay.tar.gz
          echo 'a439ec4b55dcc6fa1020d6243fba127b72709bde5d1d0fce27e580411fa05fe2  /tmp/qa-overlay.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/qa-overlay.tar.gz -C .
          git add .github/workflows/deploy-release.yml server/start.js

          git rm -r .qa-transfer
          for file in \
            .github/workflows/qa-source-snapshot.yml \
            .github/workflows/qa-finalize-pr-593.yml; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              git rm "$file"
            fi
          done

          while IFS= read -r file; do
            [[ -n "$file" ]] && node --check "$file"
          done < <(git diff --cached --name-only --diff-filter=ACM | grep -E '\.([cm]?js)$' || true)
          python3 -m json.tool package.json >/dev/null
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |file| YAML.load_file(file) }'
          node scripts/validate-action-pins.js
          git diff --cached --check

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "fix(qa): close publication, export and accessibility gaps"

      - name: Create a verified clean-tree handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/qa-handoff
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import tarfile

          ROOT = pathlib.Path('.').resolve()
          OUT = ROOT / '.build' / 'qa-handoff'

          def changed(filter_code):
              raw = subprocess.check_output([
                  'git', 'diff', '--name-only', '-z', f'--diff-filter={filter_code}', 'HEAD^', 'HEAD'
              ])
              return [item.decode('utf-8') for item in raw.split(b'\0') if item]

          files = changed('ACM')
          deleted = changed('D')
          entries = []
          archive = OUT / 'clean-files.tar.gz'
          with tarfile.open(archive, 'w:gz', format=tarfile.PAX_FORMAT) as tar:
              for relative in files:
                  path = ROOT / relative
                  data = path.read_bytes()
                  mode = subprocess.check_output([
                      'git', 'ls-tree', 'HEAD', '--', relative
                  ], text=True).split()[0]
                  entries.append({
                      'path': relative,
                      'mode': mode,
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
                  info = tar.gettarinfo(str(path), arcname=relative)
                  info.uid = 0
                  info.gid = 0
                  info.uname = ''
                  info.gname = ''
                  with path.open('rb') as stream:
                      tar.addfile(info, stream)

          manifest = {
              'schemaVersion': 1,
              'contract': 'unfallwerkbank-clean-tree-handoff/v1',
              'targetParent': '1c98efe89a4eba863c572ba655112b492718b85c',
              'validatedCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'files': entries,
              'deleted': deleted,
          }
          manifest_path = OUT / 'manifest.json'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          checksums = {
              name: hashlib.sha256((OUT / name).read_bytes()).hexdigest()
              for name in ['clean-files.tar.gz', 'manifest.json']
          }
          (OUT / 'SHA256SUMS').write_text(
              ''.join(f"{digest}  {name}\n" for name, digest in checksums.items()),
              encoding='ascii',
          )
          PY
          (cd .build/qa-handoff && sha256sum --check --strict SHA256SUMS)

      - name: Upload detached Git blobs from the verified handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          root = pathlib.Path('.').resolve()
          handoff = root / '.build' / 'qa-handoff'
          manifest = json.loads((handoff / 'manifest.json').read_text(encoding='utf-8'))
          parent = manifest['targetParent']

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'Unfallwerkbank-QA-finalizer',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          parent_commit = request('GET', f'/git/commits/{parent}')
          blobs = []
          for entry in manifest['files']:
              path = root / entry['path']
              data = path.read_bytes()
              blob = request('POST', '/git/blobs', {
                  'content': base64.b64encode(data).decode('ascii'),
                  'encoding': 'base64',
              })
              blobs.append({
                  'path': entry['path'],
                  'mode': entry['mode'],
                  'type': 'blob',
                  'sha': blob['sha'],
                  'sha256': entry['sha256'],
                  'bytes': entry['bytes'],
              })

          result = {
              'schemaVersion': 1,
              'contract': 'unfallwerkbank-detached-git-blobs/v1',
              'parentSha': parent,
              'baseTreeSha': parent_commit['tree']['sha'],
              'blobs': blobs,
              'deleteIfPresent': ['.github/workflows/qa-source-snapshot.yml'],
          }
          (handoff / 'git-blobs.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'contract': result['contract'],
              'parentSha': parent,
              'baseTreeSha': result['baseTreeSha'],
              'blobCount': len(blobs),
          }, indent=2))
          PY

      - name: Upload the clean-tree handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-clean-tree-handoff-${{ github.event.pull_request.head.sha }}
          path: .build/qa-handoff/
          if-no-files-found: error
          retention-days: 1
