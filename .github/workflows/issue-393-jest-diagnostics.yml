name: Issue 393 App Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: issue-393-app-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-empty-viewport-guard:
    if: github.head_ref == 'feat/issue-393-live-accident-tiles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch empty viewport scheduling guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('js/ua.app_v2.js')
          source = path.read_text(encoding='utf-8')
          old = "    if (!ctx.allPts?.length) return;"
          new = "    if (!ctx.allPts?.length && ctx.accidentDataMode !== 'viewport') return;"
          count = source.count(old)
          if count == 0:
              print('Guard already patched; no change required.')
          elif count == 1:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
              print('Patched empty viewport scheduling guard.')
          else:
              raise SystemExit(f'Expected one guard, found {count}')
          PY

      - name: Commit patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- js/ua.app_v2.js; then
            echo "No patch commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ua.app_v2.js
          git commit -m "Allow tile loading from empty viewports"
          git push origin HEAD:${{ github.head_ref }}
