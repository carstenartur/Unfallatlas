name: Issue 393 Jest Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: issue-393-jest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture affected Jest results
        shell: bash
        run: |
          set +e
          npx jest --runInBand --json --outputFile=issue-393-jest-results.json \
            tests/unit/ua.accident_viewport_controller.test.js \
            tests/unit/ua.accident_provider_live.test.js \
            tests/unit/ua.map_store_accident_viewport.test.js \
            tests/unit/ua.data_v2_live_viewport.test.js \
            tests/unit/buildAccidentTiles.test.js \
            tests/unit/staticDataAccessArchitecture.test.js \
            tests/unit/ua.accident_provider.test.js \
            tests/unit/uaAccidentViewportMode.test.js \
            tests/unit/ua.architecture_integration.test.js \
            tests/unit/ua.map_store.test.js
          status=$?
          printf '%s\n' "$status" > issue-393-jest-status.txt
          exit 0

      - name: Upload diagnostic results
        uses: actions/upload-artifact@v7
        with:
          name: issue-393-jest-diagnostics
          path: |
            issue-393-jest-results.json
            issue-393-jest-status.txt
