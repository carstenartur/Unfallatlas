name: QA source snapshot

on:
  push:
    branches: [fix/restore-core-data-media-contracts]
    paths:
      - '.github/workflows/qa-source-snapshot.yml'

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch without credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Create source and publication-data archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t accident_files < <(git ls-files \
            'out/output_all_years_*.csv.gz' \
            'out/output_all_years_*.geojson.gz')
          test "${#accident_files[@]}" -gt 0
          git archive --format=zip --output=qa-source-snapshot.zip HEAD -- \
            README.md package.json pom.xml SECURITY.md TESTING.md ARCHITECTURE.md \
            .github/workflows scripts tests js css werkbank_v2.html \
            qa-system-tests server/cities data docs \
            "${accident_files[@]}"

      - name: Upload source snapshot
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: qa-source-snapshot-${{ github.sha }}
          path: qa-source-snapshot.zip
          if-no-files-found: error
          retention-days: 1

      - name: Publish artifact identifier for the active QA repair
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh pr comment 593 --body "Temporary QA source snapshot artifact: ${ARTIFACT_ID} (commit ${{ github.sha }})."
