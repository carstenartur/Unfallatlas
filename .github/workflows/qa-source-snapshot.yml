name: QA bootstrap accident release manifest

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-source-snapshot.yml'

permissions:
  contents: write

jobs:
  bootstrap-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact pull-request head without credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Generate and independently verify the deterministic manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/qa
          node --max-old-space-size=4096 scripts/validate-accident-publication.js \
            --write-manifest \
            --report out/qa/accident-publication.json
          node --max-old-space-size=4096 scripts/validate-accident-publication.js \
            --report out/qa/accident-publication-verification.json
          test "$(jq -r '.passed' out/qa/accident-publication-verification.json)" = true

      - name: Commit only the generated manifest through the Contents API
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- data/accident-data-release.json)" ]]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/data/accident-data-release.json?ref=${HEAD_SHA}" \
              --jq '.sha' 2>/dev/null || true
          )"
          export EXISTING_SHA="$existing_sha"
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          payload = {
              "message": "data: bind the reviewed 2016–2025 accident release",
              "content": base64.b64encode(
                  Path("data/accident-data-release.json").read_bytes()
              ).decode("ascii"),
              "branch": os.environ["HEAD_REF"],
          }
          if os.environ.get("EXISTING_SHA"):
              payload["sha"] = os.environ["EXISTING_SHA"]
          Path("manifest-request.json").write_text(
              json.dumps(payload), encoding="utf-8"
          )
          PY
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/data/accident-data-release.json" \
            --input manifest-request.json \
            --jq '.commit.sha'
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accident-release-manifest-bootstrap-${{ github.event.pull_request.head.sha }}
          path: |
            data/accident-data-release.json
            out/qa/accident-publication.json
            out/qa/accident-publication-verification.json
          if-no-files-found: error
          retention-days: 1
