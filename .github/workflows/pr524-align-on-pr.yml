name: PR 524 policy alignment

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr524-policy-alignment
  cancel-in-progress: true

jobs:
  align:
    if: github.head_ref == 'fix/pragmatic-public-browser-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pragmatic-public-browser-profile
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply the reviewed alignment program
        run: |
          set +e
          python - <<'PY' > /tmp/pr524-alignment.log 2>&1
          from pathlib import Path
          import json
          import re

          workflow = Path('.github/workflows/apply-pr524-policy-alignment.yml')
          source = workflow.read_text(encoding='utf-8')
          match = re.search(
              r"python - <<'PY'\n(?P<body>.*?)\n\s{10}PY\n",
              source,
              flags=re.DOTALL,
          )
          if not match:
              raise SystemExit('alignment program not found')
          program = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group('body').splitlines()
          )

          try:
              exec(compile(program, str(workflow), 'exec'), {'__name__': '__main__'})
          except SystemExit as error:
              if 'capability asset probes' not in str(error):
                  raise

              capability_assets = [
                  'vendor/leaflet.heat/leaflet-heat.js',
                  'vendor/leaflet-draw/leaflet.draw.js',
                  'vendor/leaflet-image/leaflet-image.js',
                  'vendor/export/docx.js',
                  'vendor/export/pdfmake.js',
                  'vendor/export/pdfmake-fonts.js',
                  'vendor/export/file-saver.js',
              ]
              slash = '\\'

              for workflow_name in [
                  '.github/workflows/deploy-pages-current-data.yml',
                  '.github/workflows/generate-data-deploy-pages.yml',
              ]:
                  workflow_path = Path(workflow_name)
                  text = workflow_path.read_text(encoding='utf-8')
                  text = text.replace(
                      'Materialize provenance-complete public Pages profile',
                      'Materialize public browser profile with declared provenance gaps',
                  )
                  text = text.replace('exact reduced artifact', 'exact public browser artifact')
                  text = text.replace('exact reduced Pages artifact', 'exact public browser Pages artifact')
                  text = text.replace('_site/vendor/public-preview-sbom.cdx.json', '_site/vendor/sbom.cdx.json')
                  text = text.replace('exclusions_ok=false', 'capabilities_ok=false')
                  text, marker_count = re.subn(
                      r"(?m)^              if ! grep -Eq 'vendor/\(export\|leaflet\\\.heat\|leaflet-draw\|leaflet-image\)/' \"\$html_file\"; then\n"
                      r"                exclusions_ok=true\n"
                      r"              fi$",
                      "              if grep -Fq 'vendor/leaflet.heat/leaflet-heat.js' \"$html_file\" && " + slash + "\n"
                      "                 grep -Fq 'vendor/leaflet-draw/leaflet.draw.js' \"$html_file\" && " + slash + "\n"
                      "                 grep -Fq 'vendor/leaflet-image/leaflet-image.js' \"$html_file\"; then\n"
                      "                capabilities_ok=true\n"
                      "              fi",
                      text,
                      count=1,
                  )
                  if marker_count != 1 and 'capabilities_ok=true' not in text:
                      raise SystemExit(f'{workflow_name}: public capability marker missing')
                  text = text.replace(
                      'if [[ "$profile_ok" == true && "$exclusions_ok" == true && "$assets_ok" == true ]]; then',
                      'if [[ "$profile_ok" == true && "$capabilities_ok" == true && "$assets_ok" == true ]]; then',
                  )

                  runtime_marker = (
                      '                 curl --fail --silent --show-error --location ' + slash + '\n'
                      '                   --connect-timeout 10 --max-time 30 ' + slash + '\n'
                      '                   "${base}/js/ua.public-preview.js?${query}" >/dev/null; then'
                  )
                  if 'vendor/export/docx.js?${query}' not in text:
                      extra_probes = ''.join(
                          '                 curl --fail --silent --show-error --location ' + slash + '\n'
                          '                   --connect-timeout 10 --max-time 30 ' + slash + '\n'
                          f'                   "${{base}}/{asset}?${{query}}" >/dev/null && ' + slash + '\n'
                          for asset in capability_assets
                      )
                      if text.count(runtime_marker) != 1:
                          raise SystemExit(f'{workflow_name}: public runtime probe missing')
                      text = text.replace(runtime_marker, extra_probes + runtime_marker, 1)

                  list_marker = (
                      '            vendor/leaflet.markercluster/leaflet.markercluster.js ' + slash + '\n'
                      '            js/ua.public-preview.js; do'
                  )
                  if '            vendor/export/docx.js ' + slash not in text:
                      replacement = (
                          '            vendor/leaflet.markercluster/leaflet.markercluster.js ' + slash + '\n' +
                          ''.join(f'            {asset} {slash}\n' for asset in capability_assets) +
                          '            js/ua.public-preview.js; do'
                      )
                      if text.count(list_marker) != 1:
                          raise SystemExit(f'{workflow_name}: diagnostic asset list missing')
                      text = text.replace(list_marker, replacement, 1)
                  workflow_path.write_text(text, encoding='utf-8')

              site_test_path = Path('tests/unit/siteBuildContract.test.js')
              site_test = site_test_path.read_text(encoding='utf-8')
              site_test = site_test.replace(
                  "test('vendor notice inventories delivered assets and blocks release while component evidence is incomplete'",
                  "test('vendor notice inventories assets and declares component-level hardening gaps honestly'",
              )
              site_test = site_test.replace(
                  "        'leaflet-image-embedded-d3-queue',\n        'leaflet-draw-license-text',",
                  "        'leaflet-image-embedded-d3-queue',",
              )
              site_test_path.write_text(site_test, encoding='utf-8')

              policy_path = Path('vendor/provenance-policy.json')
              policy = json.loads(policy_path.read_text(encoding='utf-8'))
              for gap in policy['unresolvedAssets']:
                  if gap['id'] in {'docx-opaque-upstream-bundle', 'pdfmake-opaque-upstream-bundle'}:
                      gap['missingEvidence'] = [
                          'proof that the detected component and license inventory is exhaustive'
                          if item == 'full license and copyright evidence for every embedded component'
                          else item
                          for item in gap['missingEvidence']
                      ]
              policy_path.write_text(
                  json.dumps(policy, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              workflow.unlink()
          PY
          status=$?
          cat /tmp/pr524-alignment.log
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          set -e

          node --check scripts/documentation-deeplink-contract.cjs
          node --check tests/e2e/documentation-deeplinks.live.spec.js
          node --check tests/e2e/smoke.spec.js

      - name: Persist alignment failure diagnostics
        if: failure()
        run: |
          cp /tmp/pr524-alignment.log .github/pr524-alignment-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/pr524-alignment-error.txt
          git commit -m 'ci: persist PR 524 alignment failure' || true
          git push origin HEAD:fix/pragmatic-public-browser-profile

      - name: Verify focused contracts
        run: |
          npm ci
          npx jest \
            tests/unit/publicPagesProfile.test.js \
            tests/unit/videoExportPublicProfile.test.js \
            tests/unit/vendorLicenseEvidence.test.js \
            tests/unit/siteBuildContract.test.js \
            --runInBand
          npm run build:site -- --input-dir out --poi-dir out --output-dir _site
          npm run build:pages-profile -- --site _site
          npm run validate:pages-profile -- --site _site

      - name: Commit verified alignment and remove one-shot machinery
        run: |
          rm -f \
            .github/workflows/pr524-align-on-pr.yml \
            .github/workflows/run-pr524-alignment.yml \
            .github/pr524-policy-alignment.trigger \
            .github/pr524-alignment-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align public browser scope and provenance policy'
          git push origin HEAD:fix/pragmatic-public-browser-profile
