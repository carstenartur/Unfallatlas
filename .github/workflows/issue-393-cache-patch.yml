name: Issue 393 Cache Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: issue-393-cache-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-commit-driven-cache-eviction:
    if: github.head_ref == 'feat/issue-393-live-accident-tiles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact cache patch
        run: node scripts/apply-issue-393-cache-patch.js

      - name: Commit patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- js/ua.accident_provider.js js/ua.accident_viewport_controller.js; then
            echo "No patch commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ua.accident_provider.js js/ua.accident_viewport_controller.js
          git commit -m "Protect committed viewport tiles during cache eviction"
          git push origin HEAD:${{ github.head_ref }}
