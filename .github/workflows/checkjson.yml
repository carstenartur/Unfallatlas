name: Validate GeoJSON
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "out/**/*.geojson"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate all GeoJSON files + print stats
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating GeoJSON files..."

          mapfile -t files < <(find out -type f -name '*.geojson' -print | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: No .geojson files found under ./out"
            echo "Repo root content:"
            ls -la
            echo "./out content:"
            ls -la out || true
            exit 2
          fi

          echo
          echo "== Validation =="
          for f in "${files[@]}"; do
            echo "→ $f"
            jq -e . "$f" > /dev/null
          done
          echo "✅ All GeoJSON files are valid JSON."

          echo
          echo "== Stats (feature counts) =="
          for f in "${files[@]}"; do
            n=$(jq -r '.features | length' "$f")
            echo "→ $f: $n"
          done

          echo
          echo "== Stats (per file: years + categories) =="
          for f in "${files[@]}"; do
            echo
            echo "----------------------------------------"
            echo "File: $f"
            echo "Features: $(jq -r '.features | length' "$f")"

            echo
            echo "Years (count):"
            jq -r '
              (.features // [])
              | map(.properties.year)
              | map(tostring)
              | group_by(.)
              | map({year: .[0], count: length})
              | sort_by(.year)
              | .[]
              | "\(.year)\t\(.count)"
            ' "$f" || true

            echo
            echo "Categories ukategorie (count):"
            jq -r '
              (.features // [])
              | map(.properties.ukategorie)
              | map(tostring)
              | group_by(.)
              | map({kat: .[0], count: length})
              | sort_by(.kat)
              | .[]
              | "kat=\(.kat)\t\(.count)"
            ' "$f" || true

            echo
            echo "Bounding box (min/max lon/lat):"
            jq -r '
              (.features // [])
              | map(.geometry.coordinates)
              | {minLon: (map(.[0])|min),
                 maxLon: (map(.[0])|max),
                 minLat: (map(.[1])|min),
                 maxLat: (map(.[1])|max)}
            ' "$f" || true
          done