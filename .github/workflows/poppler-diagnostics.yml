name: Poppler diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/poppler-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Poppler branch
        uses: actions/checkout@v7
        with:
          ref: feat/poppler-rendered-document-adapter
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and Poppler
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Prepare current audit core
        run: |
          git fetch origin feat/rendered-document-audit-core
          git show origin/feat/rendered-document-audit-core:scripts/rendered-document-audit.js > scripts/rendered-document-audit.js
          git show origin/feat/rendered-document-audit-core:tests/unit/renderedDocumentAudit.test.js > tests/unit/renderedDocumentAudit.test.js
      - name: Capture focused unit-test output
        shell: bash
        run: |
          mkdir -p out/poppler-diagnostics
          set +e
          npx jest --runInBand \
            tests/unit/renderedDocumentAudit.test.js \
            tests/unit/popplerRenderedDocument.test.js \
            tests/unit/popplerRenderedDocument.security.test.js \
            --json --outputFile=out/poppler-diagnostics/jest-results.json \
            2>&1 | tee out/poppler-diagnostics/jest-output.txt
          echo "${PIPESTATUS[0]}" > out/poppler-diagnostics/jest-exit-code.txt
          exit 0
      - name: Capture native PDF audit output
        shell: bash
        run: |
          set +e
          npm run generate:sample-pdf 2>&1 | tee out/poppler-diagnostics/generate-pdf.txt
          node scripts/poppler-rendered-document.js \
            --pdf out/ci-render-gate.pdf \
            --out-dir out/poppler-model \
            --document-id ci-native-sample-pdf \
            2>&1 | tee out/poppler-diagnostics/poppler-audit.txt
          echo "${PIPESTATUS[0]}" > out/poppler-diagnostics/poppler-exit-code.txt
          cp -R out/poppler-model out/poppler-diagnostics/model 2>/dev/null || true
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: poppler-diagnostics
          path: out/poppler-diagnostics
          if-no-files-found: error
