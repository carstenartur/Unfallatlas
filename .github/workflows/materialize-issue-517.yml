name: Materialize issue 517 implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: materialize-issue-517
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.ref == 'fix/canonical-bast-cost-source' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the controlled same-repository branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply the canonical source contract
        shell: bash
        run: |
          cp .github/workflows/issue-517-bootstrap.yml /tmp/issue-517-bootstrap.yml
          cp .github/workflows/issue-517-pr-apply.yml /tmp/issue-517-pr-apply.yml
          python - <<'PY'
          from pathlib import Path

          legacy = "https://www.bast.de" + "/DE/Statistik/Unfaelle/volkswirtschaftliche_kosten.html"
          canonical = "https://www.bast.de/DE/Publikationen/Statistik/Unfaelle/volkswirtschaftliche_kosten.html"
          expected = {
              "docs/credits.md": 1,
              "data/cost_factors_de.json": 1,
              "js/ua.costs.js": 1,
              "js/ua.export_v2.js": 2,
              "templates/references_global.json": 1,
          }

          for relative, count in expected.items():
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              actual = text.count(legacy)
              if actual != count:
                  raise SystemExit(f"{relative}: expected {count} legacy URI occurrence(s), found {actual}")
              path.write_text(text.replace(legacy, canonical), encoding="utf-8")

          bootstrap_path = Path('.github/workflows/issue-517-bootstrap.yml')
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          start_marker = "          cat > tests/integration/bastCostSourceContract.test.js <<'EOF'\n"
          end_marker = "\n          EOF\n"
          start = bootstrap.find(start_marker)
          if start < 0:
              raise SystemExit('test contract start marker missing')
          start += len(start_marker)
          end = bootstrap.find(end_marker, start)
          if end < 0:
              raise SystemExit('test contract end marker missing')
          lines = bootstrap[start:end].splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('unexpected test contract indentation')
          test_source = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          test_path = Path('tests/integration/bastCostSourceContract.test.js')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(test_source, encoding='utf-8')

          legacy_path = "/DE/Statistik/Unfaelle/volkswirtschaftliche_kosten.html"
          canonical_path = "/DE/Publikationen/Statistik/Unfaelle/volkswirtschaftliche_kosten.html"
          for helper in (bootstrap_path, Path('.github/workflows/issue-517-pr-apply.yml')):
              helper.write_text(helper.read_text(encoding='utf-8').replace(legacy_path, canonical_path), encoding='utf-8')
          PY

          node --check js/ua.costs.js
          node --check js/ua.export_v2.js
          node --check tests/integration/bastCostSourceContract.test.js
          python -m json.tool data/cost_factors_de.json >/dev/null
          python -m json.tool templates/references_global.json >/dev/null
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Verify repository and binary-artifact contracts
        run: npx jest tests/integration/bastCostSourceContract.test.js --runInBand

      - name: Restore bootstrap files and commit the verified final implementation
        shell: bash
        run: |
          cp /tmp/issue-517-bootstrap.yml .github/workflows/issue-517-bootstrap.yml
          cp /tmp/issue-517-pr-apply.yml .github/workflows/issue-517-pr-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/credits.md \
            data/cost_factors_de.json \
            js/ua.costs.js \
            js/ua.export_v2.js \
            templates/references_global.json \
            tests/integration/bastCostSourceContract.test.js
          git commit -m 'fix: canonicalize BASt cost source'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
