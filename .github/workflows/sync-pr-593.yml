name: Sync PR 593 with main

on:
  push:
    branches:
      - fix/restore-core-data-media-contracts

permissions:
  contents: write

concurrency:
  group: sync-pr-593
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/restore-core-data-media-contracts
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and preserve hardened contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ ${#conflicts[@]} -eq 0 ]]; then
              echo '::error::Merge failed without resolvable file conflicts.'
              exit "$merge_status"
            fi
            printf 'Resolving conflicts with the reviewed PR side:\n'
            printf ' - %s\n' "${conflicts[@]}"
            for path in "${conflicts[@]}"; do
              git checkout --ours -- "$path"
            done
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'actions/setup-java': 'actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0',
              'actions/upload-artifact': 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1',
          }
          for workflow in Path('.github/workflows').glob('*.yml'):
              text = workflow.read_text(encoding='utf-8')
              updated = text
              for action, replacement in replacements.items():
                  updated = re.sub(
                      rf'{re.escape(action)}@[^\s#]+(?:\s+#\s+v[^\s]+)?',
                      replacement,
                      updated,
                  )
              if updated != text:
                  workflow.write_text(updated, encoding='utf-8')
          PY

          git add -A
          git rm -- .github/workflows/sync-pr-593.yml
          git commit -m 'Merge current main into release-blocker branch'
          git push origin HEAD:fix/restore-core-data-media-contracts
