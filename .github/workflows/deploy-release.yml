name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      next_development_version:
        description: 'Optional exact next version (X.Y.Z-SNAPSHOT); leave empty to use the increment choice'
        required: false
        type: string
        default: ''
      next_version_increment:
        description: 'Select the conventional next version when no exact version is supplied'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: 'Skip test execution during the release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate and build everything but do not push, tag, publish or open PRs'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish and prepare next development version
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch tags
        run: git fetch --tags --force --prune origin

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Determine release versions from repository state
        id: versions
        env:
          EXACT_NEXT_VERSION: ${{ inputs.next_development_version }}
          NEXT_VERSION_INCREMENT: ${{ inputs.next_version_increment }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(python3 .github/scripts/project-version.py get)
          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::Current project version must use X.Y.Z-SNAPSHOT, but was $CURRENT_VERSION"
            exit 1
          fi

          RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          EXACT_NEXT_VERSION=$(python3 - <<'PY'
          import os
          print(os.environ.get('EXACT_NEXT_VERSION', '').strip())
          PY
          )
          if [[ -n "$EXACT_NEXT_VERSION" ]]; then
            if ! [[ "$EXACT_NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::next_development_version must use X.Y.Z-SNAPSHOT"
              exit 1
            fi
            NEXT_VERSION="$EXACT_NEXT_VERSION"
            NEXT_VERSION_SOURCE=exact
          else
            IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
            case "$NEXT_VERSION_INCREMENT" in
              patch) NEXT_VERSION="${major}.${minor}.$((patch + 1))-SNAPSHOT" ;;
              minor) NEXT_VERSION="${major}.$((minor + 1)).0-SNAPSHOT" ;;
              major) NEXT_VERSION="$((major + 1)).0.0-SNAPSHOT" ;;
              *)
                echo "::error::Unsupported next_version_increment '$NEXT_VERSION_INCREMENT'"
                exit 1
                ;;
            esac
            NEXT_VERSION_SOURCE="$NEXT_VERSION_INCREMENT"
          fi

          RELEASE_VERSION="$RELEASE_VERSION" NEXT_VERSION="$NEXT_VERSION" python3 - <<'PY'
          import os
          release = tuple(map(int, os.environ['RELEASE_VERSION'].split('.')))
          next_version = tuple(
              map(int, os.environ['NEXT_VERSION'].removesuffix('-SNAPSHOT').split('.'))
          )
          if next_version <= release:
              raise SystemExit(
                  f"::error::Next development version {os.environ['NEXT_VERSION']} "
                  f"must be newer than release {os.environ['RELEASE_VERSION']}"
              )
          PY

          if git ls-remote --tags origin | grep -q "refs/tags/v${RELEASE_VERSION}$"; then
            echo "::error::Tag v${RELEASE_VERSION} already exists on remote"
            exit 1
          fi

          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_branch=main" >> "$GITHUB_OUTPUT"

          {
            echo "## Release version plan"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Current project version | \`$CURRENT_VERSION\` |"
            echo "| Release version | \`$RELEASE_VERSION\` |"
            echo "| Next development version | \`$NEXT_VERSION\` |"
            echo "| Next-version source | \`$NEXT_VERSION_SOURCE\` |"
            echo "| Dry run | \`${{ inputs.dry_run }}\` |"
            echo "| Skip tests | \`${{ inputs.skip_tests }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set release versions and metadata
        run: |
          set -euo pipefail
          RELEASE_VERSION='${{ steps.versions.outputs.release }}'
          python3 .github/scripts/project-version.py set "$RELEASE_VERSION"
          python3 .github/scripts/update-release-metadata.py "$RELEASE_VERSION" --release

      - name: Verify release metadata and POM state
        env:
          EXPECTED_VERSION: ${{ steps.versions.outputs.release }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ['EXPECTED_VERSION']
          citation = Path('CITATION.cff').read_text(encoding='utf-8')
          version_match = re.search(r'^version: "([^"]+)"$', citation, flags=re.MULTILINE)
          if not version_match or version_match.group(1) != expected:
              raise SystemExit(f'CITATION.cff version does not match {expected!r}')
          if not re.search(r'^date-released: ', citation, flags=re.MULTILINE):
              raise SystemExit('CITATION.cff date-released is missing')

          for filename, version_key, date_key in [
              ('.zenodo.json', 'version', 'publication_date'),
              ('codemeta.json', 'version', 'datePublished'),
          ]:
              data = json.loads(Path(filename).read_text(encoding='utf-8'))
              if data.get(version_key) != expected:
                  raise SystemExit(f'{filename} version does not match {expected!r}')
              if date_key not in data:
                  raise SystemExit(f'{filename} lacks {date_key}')

          for pom in Path('.').rglob('pom.xml'):
              if 'target' in pom.parts:
                  continue
              text = pom.read_text(encoding='utf-8')
              if 'SNAPSHOT' in text:
                  raise SystemExit(f'SNAPSHOT reference remains in {pom}')
          PY

      - name: Commit release version changes
        run: |
          git add -A -- ':!.github/workflows/'
          git commit -m "Release version ${{ steps.versions.outputs.release }}" || \
            echo "Nothing to commit (version was already set)."

      - name: Run the canonical release build and publication gates
        shell: bash
        run: |
          set -euo pipefail
          MAVEN_ARGS=()
          if [[ '${{ inputs.skip_tests }}' == 'true' ]]; then
            MAVEN_ARGS+=("-DskipTests=true" "-Dmaven.test.skip=true")
          fi
          mvn -B -ntp clean verify -Prelease-site "${MAVEN_ARGS[@]}"

      - name: Upload Maven test reports on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-maven-test-reports
          path: |
            analysis-service/target/surefire-reports/
            analysis-service/target/failsafe-reports/
            coverage/
            out/qa/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release media QA evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ always() && hashFiles('out/qa/release-documentation-media.json') != '' }}
        with:
          name: release-documentation-media-report
          path: |
            out/qa/release-documentation-media.json
            _site/build-manifest.json
            _site/vendor/THIRD_PARTY_NOTICES.json
            _site/vendor/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Create deterministic website bundle ZIP
        run: |
          set -euo pipefail
          VERSION='${{ steps.versions.outputs.release }}'
          ZIP_NAME="unfallatlas-website-${VERSION}.zip"
          rm -f -- "$ZIP_NAME"
          (
            cd _site
            export TZ=UTC
            find . -type f -exec touch -t 198001010000 {} +
            find . -type f -print | LC_ALL=C sort | zip -X "../$ZIP_NAME" -@
          )
          echo "Created website bundle: $ZIP_NAME ($(du -sh "$ZIP_NAME" | cut -f1))"

      - name: Push release commit to remote
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          BASE_BRANCH='${{ steps.versions.outputs.base_branch }}'
          COMMIT_SHA=$(git rev-parse HEAD)
          TEMP_BRANCH="release-temp-${{ steps.versions.outputs.release }}"
          TEMP_PUSHED=false
          trap '[[ $TEMP_PUSHED == true ]] && git push origin ":refs/heads/${TEMP_BRANCH}" || true' EXIT
          git push origin ":refs/heads/${TEMP_BRANCH}" || true
          git push origin "HEAD:refs/heads/${TEMP_BRANCH}"
          TEMP_PUSHED=true
          gh api "repos/${{ github.repository }}/git/refs/heads/${BASE_BRANCH}" \
            --method PATCH -f sha="$COMMIT_SHA"

      - name: Dry run – skip pushing release commit
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run – would push release commit $(git rev-parse HEAD)"

      - name: Create annotated Git tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          RELEASE_VERSION='${{ steps.versions.outputs.release }}'
          COMMIT_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/tags" \
            --method POST \
            -f tag="v${RELEASE_VERSION}" \
            -f message="Release version ${RELEASE_VERSION}" \
            -f object="$COMMIT_SHA" \
            -f type="commit" \
            --jq '.sha')
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f ref="refs/tags/v${RELEASE_VERSION}" \
            -f sha="$TAG_SHA"

      - name: Create maintenance branch
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          RELEASE_VERSION='${{ steps.versions.outputs.release }}'
          MAJOR_MINOR=$(echo "$RELEASE_VERSION" | sed 's/\.[^.]*$//')
          BRANCH_NAME="maintenance/${MAJOR_MINOR}.x"
          if ! git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              -f ref="refs/heads/${BRANCH_NAME}" \
              -f sha="$(git rev-parse HEAD)"
          fi

      - name: Create draft GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v${{ steps.versions.outputs.release }}" \
            --draft \
            --title "Release ${{ steps.versions.outputs.release }}" \
            --generate-notes

      - name: Upload JAR and website bundle to draft release
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          JAR_FILE=$(find analysis-service/target \
            -name "unfallatlas-analysis-service-*.jar" \
            -not -name "*sources*" \
            | head -1)
          if [[ -z "$JAR_FILE" || ! -f "$JAR_FILE" ]]; then
            echo "::error::No analysis-service release JAR found"
            exit 1
          fi
          ZIP_NAME="unfallatlas-website-${{ steps.versions.outputs.release }}.zip"
          gh release upload "v${{ steps.versions.outputs.release }}" "$JAR_FILE" "$ZIP_NAME" --clobber

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release edit "v${{ steps.versions.outputs.release }}" --draft=false --latest

      - name: Dry run – show assets that would be uploaded
        if: ${{ inputs.dry_run }}
        run: |
          find analysis-service/target -name "unfallatlas-analysis-service-*.jar" -not -name "*sources*" -print || true
          ls -lh "unfallatlas-website-${{ steps.versions.outputs.release }}.zip" || true

      - name: Bump to next SNAPSHOT version and metadata
        run: |
          set -euo pipefail
          NEXT_VERSION='${{ steps.versions.outputs.next }}'
          python3 .github/scripts/project-version.py set "$NEXT_VERSION"
          python3 .github/scripts/update-release-metadata.py "$NEXT_VERSION"

      - name: Commit next development version
        run: |
          NEXT_VERSION='${{ steps.versions.outputs.next }}'
          NEXT_VERSION_BRANCH="release/prepare-next-${NEXT_VERSION}"
          git switch -C "$NEXT_VERSION_BRANCH"
          git add -A -- ':!.github/workflows/'
          git commit -m "Prepare next development version $NEXT_VERSION" || echo "Nothing to commit."
          echo "NEXT_VERSION_BRANCH=$NEXT_VERSION_BRANCH" >> "$GITHUB_ENV"

      - name: Push next development branch and open PR
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          NEXT_VERSION='${{ steps.versions.outputs.next }}'
          BASE_BRANCH='${{ steps.versions.outputs.base_branch }}'
          RELEASE_VERSION='${{ steps.versions.outputs.release }}'
          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/${NEXT_VERSION_BRANCH}" | awk '{print $1}')
          if [[ -n "$REMOTE_SHA" ]]; then
            git push --force-with-lease="refs/heads/${NEXT_VERSION_BRANCH}:${REMOTE_SHA}" origin "HEAD:refs/heads/${NEXT_VERSION_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${NEXT_VERSION_BRANCH}"
          fi
          cat > /tmp/next-development-pr.md <<EOF
          Automated follow-up after release ${RELEASE_VERSION}.

          ## Changes
          - Synchronize root, Analysis Service and QA Maven versions to ${NEXT_VERSION}
          - Synchronize package.json/package-lock.json to ${NEXT_VERSION%-SNAPSHOT}
          - Update citation and archive metadata

          ## Release
          https://github.com/${{ github.repository }}/releases/tag/v${RELEASE_VERSION}
          EOF
          EXISTING_PR=$(gh pr list --base "$BASE_BRANCH" --head "$NEXT_VERSION_BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" \
              --title "Prepare next development version ${NEXT_VERSION}" \
              --body-file /tmp/next-development-pr.md
          else
            gh pr create \
              --title "Prepare next development version ${NEXT_VERSION}" \
              --body-file /tmp/next-development-pr.md \
              --base "$BASE_BRANCH" \
              --head "$NEXT_VERSION_BRANCH"
          fi

      - name: Release status summary
        if: always()
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release }}
          NEXT_VERSION: ${{ steps.versions.outputs.next }}
          BASE_BRANCH: ${{ steps.versions.outputs.base_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          {
            echo "## Release Status Summary"
            echo
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Release version | \`${RELEASE_VERSION:-unknown}\` |"
            echo "| Next development version | \`${NEXT_VERSION:-unknown}\` |"
            echo "| Base branch | \`${BASE_BRANCH:-unknown}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
            echo "| Skip tests | \`${SKIP_TESTS}\` |"
            echo
            echo "The release build used the single repository command \`mvn clean verify -Prelease-site\`."
          } >> "$GITHUB_STEP_SUMMARY"
