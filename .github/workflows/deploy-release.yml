name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 0.1.0) – must match X.Y.Z semver'
        required: true
        type: string
        default: '0.1.0'
      skip_tests:
        description: 'Skip tests during release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run – validate and build everything but do not push, tag or create a Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Preflight
  # Validates inputs and current repository state before touching anything.
  # ──────────────────────────────────────────────────────────────────────────
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.version.outputs.current }}
      suggested_release: ${{ steps.version.outputs.suggested_release }}
      suggested_next: ${{ steps.version.outputs.suggested_next }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Extract current version from pom.xml
        id: version
        run: |
          CURRENT=$(mvn -f analysis-service/pom.xml help:evaluate \
            -Dexpression=project.version -q -DforceStdout)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          if [[ "$CURRENT" == *-SNAPSHOT ]]; then
            RELEASE="${CURRENT%-SNAPSHOT}"
            echo "suggested_release=$RELEASE" >> $GITHUB_OUTPUT

            IFS='.' read -r major minor patch <<< "$RELEASE"
            NEXT_PATCH=$((patch + 1))
            echo "suggested_next=${major}.${minor}.${NEXT_PATCH}-SNAPSHOT" >> $GITHUB_OUTPUT
          else
            echo "::error::Current version '$CURRENT' in analysis-service/pom.xml is not a SNAPSHOT version. Please set the version to X.Y.Z-SNAPSHOT (e.g. 0.1.0-SNAPSHOT) before running the release workflow."
            exit 1
          fi

      - name: Validate release version format
        run: |
          INPUT_VERSION="${{ inputs.release_version }}"
          SUGGESTED="${{ steps.version.outputs.suggested_release }}"

          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$INPUT_VERSION' (expected: X.Y.Z)"
            exit 1
          fi

          if [[ "$INPUT_VERSION" != "$SUGGESTED" ]]; then
            echo "::warning::Input version $INPUT_VERSION differs from suggested $SUGGESTED"
          fi

      - name: Check that release tag does not yet exist
        run: |
          VERSION="${{ inputs.release_version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "::error::Tag v${VERSION} already exists on remote!"
            exit 1
          fi

      - name: Validate Maven configuration
        run: |
          mvn -f analysis-service/pom.xml validate -q || {
            echo "::error::Maven validation failed for analysis-service/pom.xml"
            exit 1
          }

      - name: Preflight step summary
        run: |
          INPUT_VERSION="${{ inputs.release_version }}"
          IFS='.' read -r major minor patch <<< "$INPUT_VERSION"
          NEXT_PATCH=$((patch + 1))
          ACTUAL_NEXT="${major}.${minor}.${NEXT_PATCH}-SNAPSHOT"

          echo "## Preflight Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Current Version | \`${{ steps.version.outputs.current }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Version | \`${{ inputs.release_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Next Dev Version | \`${ACTUAL_NEXT}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag exists | No ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Maven valid | Yes ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run mode | ${{ inputs.dry_run }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skip tests | ${{ inputs.skip_tests }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SUGGESTED="${{ steps.version.outputs.suggested_release }}"
          if [[ "$INPUT_VERSION" != "$SUGGESTED" ]]; then
            echo "⚠️ **Warning:** Release version ($INPUT_VERSION) differs from suggested ($SUGGESTED)." >> $GITHUB_STEP_SUMMARY
            echo "Next SNAPSHOT will be based on the release version: **${ACTUAL_NEXT}**" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Release
  # Bumps versions, builds artefacts, pushes the release commit and tag,
  # creates the GitHub Release and finally opens the next-SNAPSHOT PR.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Build and Release
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      # 1. Full checkout of the triggering ref (main or a maintenance branch)
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Fetch tags
        run: git fetch --tags --force --prune origin

      - name: Record base branch
        id: base
        run: |
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "Releasing from branch: ${{ github.ref_name }}"

      # 2. Tool setup
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # 3. Bump versions
      - name: Set Maven release version
        run: |
          echo "Setting analysis-service version to ${{ inputs.release_version }}"
          mvn -f analysis-service/pom.xml versions:set \
            -DnewVersion=${{ inputs.release_version }} \
            -DgenerateBackupPoms=false
          echo "Maven version updated."

      - name: Verify no SNAPSHOT references remain in pom.xml
        run: |
          REMAINING=$(grep -r "SNAPSHOT" --include="pom.xml" analysis-service/ \
            | grep -v "target/" \
            || true)
          if [ -n "$REMAINING" ]; then
            echo "::error::SNAPSHOT references still found in analysis-service/pom.xml after version update:"
            echo "$REMAINING"
            exit 1
          fi
          echo "✓ No SNAPSHOT references remain in analysis-service/pom.xml"

      - name: Sync package.json version (if version field present)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.version ? 0 : 1)" 2>/dev/null; then
            echo "Syncing package.json version to ${{ inputs.release_version }}"
            npm version ${{ inputs.release_version }} --no-git-tag-version --allow-same-version
            echo "package.json version updated."
          else
            echo "No version field in package.json – skipping."
          fi

      # 4. Commit version changes
      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit version changes
        run: |
          git add -A -- ':!.github/workflows/'
          git commit -m "Release version ${{ inputs.release_version }}" || \
            echo "Nothing to commit (version was already set)."

      # 5. Build & Verify
      - name: Build and verify (Maven)
        run: |
          if [[ "${{ inputs.skip_tests }}" == "true" ]]; then
            TEST_FLAG="-DskipTests"
          else
            TEST_FLAG=""
          fi
          mvn -f analysis-service/pom.xml clean verify $TEST_FLAG

      - name: Run Node tests
        if: ${{ !inputs.skip_tests }}
        run: |
          npm ci
          npm test

      # 6. Build website bundle
      - name: Create website bundle ZIP
        run: |
          VERSION="${{ inputs.release_version }}"
          ZIP_NAME="unfallatlas-website-${VERSION}.zip"

          # Static HTML pages
          FILES=(
            index.html
            combi.html
            showcase.html
            werkbank.html
            werkbank_v2.html
            unfallwerkbank.html
            usage.md
          )

          # Static asset directories (exclude out/ – contains large GeoJSON/CSV
          # data files totalling ~350 MB; data consumers should download those
          # separately via the generate-and-commit workflow artefacts)
          DIRS=(css js tours templates)

          ZIP_ARGS=()
          for f in "${FILES[@]}"; do
            [ -f "$f" ] && ZIP_ARGS+=("$f")
          done
          for d in "${DIRS[@]}"; do
            [ -d "$d" ] && ZIP_ARGS+=("$d")
          done

          zip -r "$ZIP_NAME" "${ZIP_ARGS[@]}"
          echo "Created website bundle: $ZIP_NAME ($(du -sh "$ZIP_NAME" | cut -f1))"

      # 7. Push release commit to remote (temp-branch → fast-forward main)
      - name: Push release commit to remote
        if: ${{ !inputs.dry_run }}
        run: |
          set -e
          BASE_BRANCH="${{ steps.base.outputs.branch }}"
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Pushing release commit $COMMIT_SHA to branch ${BASE_BRANCH}..."

          TEMP_BRANCH="release-temp-${{ inputs.release_version }}"
          TEMP_PUSHED=false

          trap '[[ $TEMP_PUSHED == true ]] && \
            git push origin ":refs/heads/${TEMP_BRANCH}" || true' EXIT

          git push origin ":refs/heads/${TEMP_BRANCH}" || true
          git push origin "HEAD:refs/heads/${TEMP_BRANCH}"
          TEMP_PUSHED=true
          echo "Pushed commit to temporary branch ${TEMP_BRANCH}"

          gh api "repos/${{ github.repository }}/git/refs/heads/${BASE_BRANCH}" \
            --method PATCH \
            -f sha="$COMMIT_SHA"
          echo "Fast-forwarded ${BASE_BRANCH} to $COMMIT_SHA"

      - name: Dry run – skip pushing release commit
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run – would push release commit $(git rev-parse HEAD) to ${{ steps.base.outputs.branch }} via temp-branch + API fast-forward"

      # 8. Create annotated tag
      - name: Create and push Git tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -e
          COMMIT_SHA=$(git rev-parse HEAD)

          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/tags" \
            --method POST \
            -f tag="v${{ inputs.release_version }}" \
            -f message="Release version ${{ inputs.release_version }}" \
            -f object="$COMMIT_SHA" \
            -f type="commit" \
            --jq '.sha')

          if [ -z "$TAG_SHA" ]; then
            echo "::error::Failed to create tag object (empty SHA returned)"
            exit 1
          fi

          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f ref="refs/tags/v${{ inputs.release_version }}" \
            -f sha="$TAG_SHA"

          echo "Created annotated tag v${{ inputs.release_version }}"

      - name: Dry run – skip tag creation
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run – would create annotated tag v${{ inputs.release_version }}"

      # 9. Create maintenance branch
      - name: Create maintenance branch
        if: ${{ !inputs.dry_run }}
        run: |
          set -e
          MAJOR_MINOR=$(echo "${{ inputs.release_version }}" | sed 's/\.[^.]*$//')
          BRANCH_NAME="maintenance/${MAJOR_MINOR}.x"

          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH_NAME} already exists – skipping."
          else
            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              -f ref="refs/heads/${BRANCH_NAME}" \
              -f sha="$(git rev-parse HEAD)"
            echo "Created maintenance branch: ${BRANCH_NAME}"
          fi

      - name: Dry run – skip maintenance branch creation
        if: ${{ inputs.dry_run }}
        run: |
          MAJOR_MINOR=$(echo "${{ inputs.release_version }}" | sed 's/\.[^.]*$//')
          echo "::notice::Dry run – would create maintenance branch maintenance/${MAJOR_MINOR}.x"

      # 10. Create GitHub Release
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v${{ inputs.release_version }}" \
            --title "Release ${{ inputs.release_version }}" \
            --generate-notes
          echo "Created GitHub release v${{ inputs.release_version }}"

      - name: Dry run – skip GitHub Release creation
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run – would create GitHub release v${{ inputs.release_version }} with auto-generated release notes"
          echo "Release notes will be auto-generated by GitHub based on merged PRs and commits since the previous tag."

      # 11. Upload release assets
      - name: Upload JAR to release
        if: ${{ !inputs.dry_run }}
        run: |
          JAR_FILE=$(find analysis-service/target \
            -name "unfallatlas-analysis-service-*.jar" \
            -not -name "*sources*" \
            | head -1)
          if [ -z "$JAR_FILE" ] || [ ! -f "$JAR_FILE" ]; then
            echo "::error::No unfallatlas-analysis-service-*.jar found in analysis-service/target – the release cannot continue without the Spring Boot artefact"
            exit 1
          fi
          echo "Uploading $(basename $JAR_FILE) to release..."
          gh release upload "v${{ inputs.release_version }}" "$JAR_FILE" --clobber
          echo "✓ JAR uploaded: $(basename $JAR_FILE)"

      - name: Upload website bundle to release
        if: ${{ !inputs.dry_run }}
        run: |
          ZIP_NAME="unfallatlas-website-${{ inputs.release_version }}.zip"
          if [ -f "$ZIP_NAME" ]; then
            gh release upload "v${{ inputs.release_version }}" "$ZIP_NAME" --clobber
            echo "✓ Website bundle uploaded: $ZIP_NAME"
          else
            echo "::warning::Website bundle $ZIP_NAME not found"
          fi

      - name: Dry run – show assets that would be uploaded
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run – the following assets would be uploaded to release v${{ inputs.release_version }}:"
          JAR_FILE=$(find analysis-service/target \
            -name "unfallatlas-analysis-service-*.jar" \
            -not -name "*sources*" \
            | head -1 || echo "")
          if [ -f "$JAR_FILE" ]; then
            echo "  $(basename $JAR_FILE) ($(du -sh "$JAR_FILE" | cut -f1))"
          else
            echo "  JAR: NOT FOUND in analysis-service/target"
          fi
          ZIP_NAME="unfallatlas-website-${{ inputs.release_version }}.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "  $ZIP_NAME ($(du -sh "$ZIP_NAME" | cut -f1))"
          else
            echo "  $ZIP_NAME: NOT FOUND"
          fi

      # 12. Bump to next SNAPSHOT version and open PR
      - name: Bump to next SNAPSHOT version
        run: |
          RELEASED_VERSION="${{ inputs.release_version }}"
          IFS='.' read -r major minor patch <<< "$RELEASED_VERSION"
          NEXT_PATCH=$((patch + 1))
          NEXT_VERSION="${major}.${minor}.${NEXT_PATCH}-SNAPSHOT"
          echo "Bumping analysis-service to ${NEXT_VERSION}"
          mvn -f analysis-service/pom.xml versions:set \
            -DnewVersion="${NEXT_VERSION}" \
            -DgenerateBackupPoms=false

          # Also sync package.json if it has a version field.
          # npm uses plain semver (no -SNAPSHOT suffix); Maven uses X.Y.Z-SNAPSHOT.
          # Both point to the same next patch iteration; the difference is intentional.
          if node -e "const p=require('./package.json'); process.exit(p.version ? 0 : 1)" 2>/dev/null; then
            NEXT_RELEASE_VERSION="${NEXT_VERSION%-SNAPSHOT}"
            if npm version "${NEXT_RELEASE_VERSION}" --no-git-tag-version --allow-same-version; then
              echo "package.json version synced to ${NEXT_RELEASE_VERSION} (npm plain semver, Maven uses ${NEXT_VERSION})"
            else
              echo "::warning::Failed to sync package.json version to ${NEXT_RELEASE_VERSION} – continuing anyway"
            fi
          fi
          echo "Versions bumped to ${NEXT_VERSION}"

      - name: Create PR for next development iteration
        run: |
          RELEASED_VERSION="${{ inputs.release_version }}"
          IFS='.' read -r major minor patch <<< "$RELEASED_VERSION"
          NEXT_PATCH=$((patch + 1))
          NEXT_VERSION="${major}.${minor}.${NEXT_PATCH}-SNAPSHOT"

          NEXT_VERSION_BRANCH="release/prepare-next-${NEXT_VERSION}"
          git checkout -b "${NEXT_VERSION_BRANCH}"

          git add -A -- ':!.github/workflows/'
          git commit -m "Prepare for next development iteration ${NEXT_VERSION}" || \
            echo "Nothing to commit."

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "::notice::Dry run – would push branch ${NEXT_VERSION_BRANCH} and open PR 'Prepare for next development iteration ${NEXT_VERSION}'"
          else
            git push origin "${NEXT_VERSION_BRANCH}"

            NEXT_RELEASE_VERSION="${NEXT_VERSION%-SNAPSHOT}"
            cat > /tmp/pr_body.md << EOF
          Automated PR to bump version to ${NEXT_VERSION} after release ${RELEASED_VERSION}.

          ## Changes
          - Bump \`analysis-service/pom.xml\` version to \`${NEXT_VERSION}\`
          - Sync \`package.json\` version to \`${NEXT_RELEASE_VERSION}\` (npm uses plain semver; Maven uses the \`-SNAPSHOT\` suffix — both refer to the same next development iteration)

          ## Release Notes

          See full release notes: https://github.com/${{ github.repository }}/releases/tag/v${RELEASED_VERSION}
          EOF

            gh pr create \
              --title "Prepare for next development iteration ${NEXT_VERSION}" \
              --body-file /tmp/pr_body.md \
              --base "${{ steps.base.outputs.branch }}" \
              --head "${NEXT_VERSION_BRANCH}"

            echo "✓ PR created for next development iteration ${NEXT_VERSION}"
          fi
