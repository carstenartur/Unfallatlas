name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version without leading v, for example 2.1.1. Must match the current analysis-service SNAPSHOT base.'
        required: true
        type: string
      next_development_version:
        description: 'Next development version, for example 2.1.2-SNAPSHOT. Leave empty to increment patch.'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests during release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate and build everything but do not push, tag, publish or open PRs'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish and prepare next development version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Fetch tags
        run: git fetch --tags --force --prune origin

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Determine release versions
        id: versions
        run: |
          set -euo pipefail
          RELEASE_VERSION='${{ inputs.release_version }}'
          NEXT_VERSION_INPUT='${{ inputs.next_development_version }}'

          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_version must use X.Y.Z without a leading v"
            exit 1
          fi

          CURRENT_VERSION=$(mvn -f analysis-service/pom.xml help:evaluate \
            -Dexpression=project.version -q -DforceStdout)
          if [[ "$CURRENT_VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Current analysis-service version must be a SNAPSHOT, but was $CURRENT_VERSION"
            exit 1
          fi

          CURRENT_BASE="${CURRENT_VERSION%-SNAPSHOT}"
          if [[ "$CURRENT_BASE" != "$RELEASE_VERSION" ]]; then
            if [[ '${{ inputs.dry_run }}' == 'true' ]]; then
              echo "::warning::Release $RELEASE_VERSION does not match current SNAPSHOT base $CURRENT_BASE"
            else
              echo "::error::Release $RELEASE_VERSION does not match current SNAPSHOT base $CURRENT_BASE"
              exit 1
            fi
          fi

          if [[ -n "$NEXT_VERSION_INPUT" ]]; then
            NEXT_VERSION="$NEXT_VERSION_INPUT"
          else
            IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
            NEXT_VERSION="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          fi
          if ! [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::next_development_version must use X.Y.Z-SNAPSHOT"
            exit 1
          fi

          if git ls-remote --tags origin | grep -q "refs/tags/v${RELEASE_VERSION}$"; then
            echo "::error::Tag v${RELEASE_VERSION} already exists on remote"
            exit 1
          fi

          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

          echo "## Release version plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Current analysis-service version | \`$CURRENT_VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release version | \`$RELEASE_VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Next development version | \`$NEXT_VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | \`${{ inputs.dry_run }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Skip tests | \`${{ inputs.skip_tests }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Maven configuration
        run: mvn -f analysis-service/pom.xml validate -q

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set release versions and metadata
        run: |
          set -euo pipefail
          RELEASE_VERSION='${{ steps.versions.outputs.release }}'

          echo "Setting analysis-service version to $RELEASE_VERSION"
          mvn -f analysis-service/pom.xml versions:set \
            -DnewVersion="$RELEASE_VERSION" \
            -DgenerateBackupPoms=false

          if node -e "const p=require('./package.json'); process.exit(p.version ? 0 : 1)" 2>/dev/null; then
            echo "Syncing package.json version to $RELEASE_VERSION"
            npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          else
            echo "No version field in package.json – skipping."
          fi

          python3 .github/scripts/update-release-metadata.py "$RELEASE_VERSION" --release

      - name: Verify release metadata
        env:
          EXPECTED_VERSION: ${{ steps.versions.outputs.release }}
          RELEASE_MODE: 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ['EXPECTED_VERSION']
          release_mode = os.environ['RELEASE_MODE'] == 'true'

          citation = Path('CITATION.cff').read_text(encoding='utf-8')
          version_match = re.search(r'^version: "([^"]+)"$', citation, flags=re.MULTILINE)
          if not version_match or version_match.group(1) != expected:
              raise SystemExit(f'CITATION.cff version does not match {expected!r}')
          has_date_released = bool(re.search(r'^date-released: ', citation, flags=re.MULTILINE))
          if release_mode and not has_date_released:
              raise SystemExit('CITATION.cff date-released is missing')

          with open('.zenodo.json', encoding='utf-8') as handle:
              zenodo = json.load(handle)
          if zenodo.get('version') != expected:
              raise SystemExit(f'.zenodo.json version {zenodo.get("version")!r} != {expected!r}')
          if release_mode and 'publication_date' not in zenodo:
              raise SystemExit('.zenodo.json publication_date is missing')

          with open('codemeta.json', encoding='utf-8') as handle:
              codemeta = json.load(handle)
          if codemeta.get('version') != expected:
              raise SystemExit(f'codemeta.json version {codemeta.get("version")!r} != {expected!r}')
          if release_mode and 'datePublished' not in codemeta:
              raise SystemExit('codemeta.json datePublished is missing')
          PY

      - name: Verify no SNAPSHOT references remain in release POMs
        run: |
          REMAINING=$(grep -r "SNAPSHOT" --include="pom.xml" analysis-service/ \
            | grep -v "target/" \
            || true)
          if [[ -n "$REMAINING" ]]; then
            echo "::error::SNAPSHOT references still found in analysis-service/pom.xml after version update:"
            echo "$REMAINING"
            exit 1
          fi

      - name: Commit release version changes
        run: |
          git add -A -- ':!.github/workflows/'
          git commit -m "Release version ${{ steps.versions.outputs.release }}" || \
            echo "Nothing to commit (version was already set)."

      - name: Build and verify analysis service
        run: |
          if [[ '${{ inputs.skip_tests }}' == 'true' ]]; then
            TEST_FLAG='-DskipTests'
          else
            TEST_FLAG=''
          fi
          mvn -f analysis-service/pom.xml clean verify $TEST_FLAG

      - name: Run Node tests
        if: ${{ !inputs.skip_tests }}
        run: |
          npm ci
          npm test

      - name: Create website bundle ZIP
        run: |
          set -euo pipefail
          VERSION='${{ steps.versions.outputs.release }}'
          ZIP_NAME="unfallatlas-website-${VERSION}.zip"

          FILES=(
            index.html
            combi.html
            showcase.html
            werkbank.html
            werkbank_v2.html
            unfallwerkbank.html
            usage.md
            README.md
            CITATION.cff
            .zenodo.json
            codemeta.json
          )

          # Exclude out/ because it contains large generated GeoJSON/CSV data.
          # Data consumers should fetch those data artefacts separately according
          # to their source-data licences and provenance.
          DIRS=(css js tours templates docs)

          ZIP_ARGS=()
          for f in "${FILES[@]}"; do
            [[ -f "$f" ]] && ZIP_ARGS+=("$f")
          done
          for d in "${DIRS[@]}"; do
            [[ -d "$d" ]] && ZIP_ARGS+=("$d")
          done

          zip -r "$ZIP_NAME" "${ZIP_ARGS[@]}"
          echo "Created website bundle: $ZIP_NAME ($(du -sh "$ZIP_NAME" | cut -f1))"

      - name: Push release commit to remote
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          BASE_BRANCH='${{ steps.versions.outputs.base_branch }}'
          COMMIT_SHA=$(git rev-parse HEAD)
          TEMP_BRANCH="release-temp-${{ steps.versions.outputs.release }}"
          TEMP_PUSHED=false

          trap '[[ $TEMP_PUSHED == true ]] && git push origin ":refs/heads/${TEMP_BRANCH}" || true' EXIT

          git push origin ":refs/heads/${TEMP_BRANCH}" || true
          git push origin "HEAD:refs/heads/${TEMP_BRANCH}"
          TEMP_PUSHED=true

          gh api "repos/${{ github.repository }}/git/refs/heads/${BASE_BRANCH}" \
            --method PATCH \
            -f sha="$COMMIT_SHA"

      - name: Dry run – skip pushing release commit
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run – would push release commit $(git rev-parse HEAD) to ${{ steps.versions.outputs.base_branch }}"

      - name: Create annotated Git tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          RELEASE_VERSION='${{ steps.versions.outputs.release }}'
          COMMIT_SHA=$(git rev-parse HEAD)

          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/tags" \
            --method POST \
            -f tag="v${RELEASE_VERSION}" \
            -f message="Release version ${RELEASE_VERSION}" \
            -f object="$COMMIT_SHA" \
            -f type="commit" \
            --jq '.sha')

          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f ref="refs/tags/v${RELEASE_VERSION}" \
            -f sha="$TAG_SHA"

      - name: Dry run – skip tag creation
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run – would create annotated tag v${{ steps.versions.outputs.release }}"

      - name: Create maintenance branch
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          RELEASE_VERSION='${{ steps.versions.outputs.release }}'
          MAJOR_MINOR=$(echo "$RELEASE_VERSION" | sed 's/\.[^.]*$//')
          BRANCH_NAME="maintenance/${MAJOR_MINOR}.x"

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch $BRANCH_NAME already exists – skipping."
          else
            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              -f ref="refs/heads/${BRANCH_NAME}" \
              -f sha="$(git rev-parse HEAD)"
          fi

      - name: Dry run – skip maintenance branch creation
        if: ${{ inputs.dry_run }}
        run: |
          MAJOR_MINOR=$(echo '${{ steps.versions.outputs.release }}' | sed 's/\.[^.]*$//')
          echo "::notice::Dry run – would create maintenance branch maintenance/${MAJOR_MINOR}.x"

      - name: Create draft GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v${{ steps.versions.outputs.release }}" \
            --draft \
            --title "Release ${{ steps.versions.outputs.release }}" \
            --generate-notes

      - name: Dry run – skip draft GitHub Release creation
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run – would create draft GitHub release v${{ steps.versions.outputs.release }}"

      - name: Upload JAR to draft release
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          JAR_FILE=$(find analysis-service/target \
            -name "unfallatlas-analysis-service-*.jar" \
            -not -name "*sources*" \
            | head -1)
          if [[ -z "$JAR_FILE" || ! -f "$JAR_FILE" ]]; then
            echo "::error::No unfallatlas-analysis-service-*.jar found in analysis-service/target"
            exit 1
          fi
          gh release upload "v${{ steps.versions.outputs.release }}" "$JAR_FILE" --clobber

      - name: Upload website bundle to draft release
        if: ${{ !inputs.dry_run }}
        run: |
          ZIP_NAME="unfallatlas-website-${{ steps.versions.outputs.release }}.zip"
          if [[ -f "$ZIP_NAME" ]]; then
            gh release upload "v${{ steps.versions.outputs.release }}" "$ZIP_NAME" --clobber
          else
            echo "::warning::Website bundle $ZIP_NAME not found"
          fi

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release edit "v${{ steps.versions.outputs.release }}" \
            --draft=false \
            --latest
          echo "Published release v${{ steps.versions.outputs.release }}. Zenodo can now archive the final release metadata."

      - name: Dry run – show assets that would be uploaded
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run – release assets that would be uploaded:"
          find analysis-service/target -name "unfallatlas-analysis-service-*.jar" -not -name "*sources*" -print || true
          ls -lh "unfallatlas-website-${{ steps.versions.outputs.release }}.zip" || true

      - name: Bump to next SNAPSHOT version and metadata
        run: |
          set -euo pipefail
          NEXT_VERSION='${{ steps.versions.outputs.next }}'
          NEXT_RELEASE_VERSION="${NEXT_VERSION%-SNAPSHOT}"

          mvn -f analysis-service/pom.xml versions:set \
            -DnewVersion="$NEXT_VERSION" \
            -DgenerateBackupPoms=false

          if node -e "const p=require('./package.json'); process.exit(p.version ? 0 : 1)" 2>/dev/null; then
            npm version "$NEXT_RELEASE_VERSION" --no-git-tag-version --allow-same-version
          fi

          python3 .github/scripts/update-release-metadata.py "$NEXT_VERSION"

      - name: Commit next development version
        run: |
          NEXT_VERSION='${{ steps.versions.outputs.next }}'
          NEXT_VERSION_BRANCH="release/prepare-next-${NEXT_VERSION}"
          git switch -C "$NEXT_VERSION_BRANCH"
          git add -A -- ':!.github/workflows/'
          git commit -m "Prepare next development version $NEXT_VERSION" || \
            echo "Nothing to commit."
          echo "branch=$NEXT_VERSION_BRANCH" >> "$GITHUB_ENV"

      - name: Push next development branch and open PR
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          NEXT_VERSION='${{ steps.versions.outputs.next }}'
          NEXT_VERSION_BRANCH="$branch"
          BASE_BRANCH='${{ steps.versions.outputs.base_branch }}'
          RELEASE_VERSION='${{ steps.versions.outputs.release }}'
          NEXT_RELEASE_VERSION="${NEXT_VERSION%-SNAPSHOT}"

          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/${NEXT_VERSION_BRANCH}" | awk '{print $1}')
          if [[ -n "$REMOTE_SHA" ]]; then
            git push --force-with-lease="refs/heads/${NEXT_VERSION_BRANCH}:${REMOTE_SHA}" origin "HEAD:refs/heads/${NEXT_VERSION_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${NEXT_VERSION_BRANCH}"
          fi

          cat > /tmp/next-development-pr.md <<EOF
          Automated follow-up after release ${RELEASE_VERSION}.

          ## Changes
          - Bump analysis-service Maven version to ${NEXT_VERSION}
          - Sync package.json/package-lock.json to ${NEXT_RELEASE_VERSION} (npm uses plain semver)
          - Update CITATION.cff to ${NEXT_VERSION}
          - Update .zenodo.json to ${NEXT_VERSION}
          - Update codemeta.json to ${NEXT_VERSION}
          - Remove release-only date metadata from the development snapshot

          ## Release
          https://github.com/${{ github.repository }}/releases/tag/v${RELEASE_VERSION}
          EOF

          EXISTING_PR=$(gh pr list --base "$BASE_BRANCH" --head "$NEXT_VERSION_BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" \
              --title "Prepare next development version ${NEXT_VERSION}" \
              --body-file /tmp/next-development-pr.md
          else
            gh pr create \
              --title "Prepare next development version ${NEXT_VERSION}" \
              --body-file /tmp/next-development-pr.md \
              --base "$BASE_BRANCH" \
              --head "$NEXT_VERSION_BRANCH"
          fi

      - name: Dry run – skip next development PR
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run – would push $branch and open/update a next-development PR"
