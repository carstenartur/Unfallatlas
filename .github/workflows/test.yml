name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  # During active PR development, obsolete matrices consume seven runners each
  # and delay the only result that matters: the current head commit.
  cancel-in-progress: true

jobs:
  unit-and-integration-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate Playwright Docker coupling
        run: node scripts/check-playwright-docker-version.js

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --runInBand

      - name: Run integration tests
        run: npm run test:integration

      - name: Run performance tests
        run: npm run test:performance

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/

  video-export-integration:
    # Testcontainers-based end-to-end test for POST /api/export-video.
    # Verifies the full Express + Playwright + ffmpeg pipeline that lives
    # inside the Dockerfile — a coverage gap the in-process unit tests
    # cannot fill (they never invoke the ffmpeg binary).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate Playwright Docker coupling
        run: node scripts/check-playwright-docker-version.js

      - name: Decide video export image source
        id: video_image
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "use_prebuilt=false"
            echo "reason=push-or-sensitive-checkout"
          } >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Video export image source: local Docker build because this is not a pull request."
            exit 0
          fi

          base_ref="${{ github.base_ref }}"
          git fetch --no-tags origin "$base_ref"
          if ! changed_files="$(git diff --name-only "origin/$base_ref"...HEAD)"; then
            echo "Warning: could not compute changed files; defaulting to local Docker build."
            echo "reason=diff-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files considered for video image decision:"
          printf '%s\n' "$changed_files"

          sensitive_re='^(Dockerfile|package\.json|package-lock\.json|\.github/workflows/test\.yml|server/(index|video-export)\.js|tests/integration/.+|scripts/(regen-context-assets|check-playwright-docker-version)\.js)$'
          if printf '%s\n' "$changed_files" | grep -E "$sensitive_re" >/dev/null; then
            echo "Video export image source: local Docker build because this PR changes Docker/package/video-export-sensitive files."
            echo "reason=sensitive-files-changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "use_prebuilt=true"
            echo "reason=pr-without-sensitive-files"
          } >> "$GITHUB_OUTPUT"
          echo "Video export image source: pre-built GHCR image is allowed for this PR."

      - name: Install dependencies
        run: npm ci

      - name: Try to pull pre-built image
        if: github.event_name == 'pull_request' && steps.video_image.outputs.use_prebuilt == 'true'
        id: pull
        continue-on-error: true
        run: |
          expected_playwright="$(node -e "const lock = require('./package-lock.json'); const v = lock.packages?.['node_modules/@playwright/test']?.version || lock.dependencies?.['@playwright/test']?.version; if (!v) { throw new Error('Could not resolve @playwright/test from package-lock.json'); } process.stdout.write(String(v));")"
          docker pull ghcr.io/carstenartur/unfallatlas:latest
          actual_playwright="$(docker run --rm --entrypoint node ghcr.io/carstenartur/unfallatlas:latest -e "const v = require('@playwright/test/package.json').version; if (!v) { throw new Error('Could not resolve @playwright/test in image'); } process.stdout.write(String(v));")"

          if [ "$actual_playwright" != "$expected_playwright" ]; then
            echo "Pre-built image Playwright version mismatch (image=$actual_playwright, checkout=$expected_playwright). Falling back to local Docker build."
            exit 0
          fi

          echo "image=ghcr.io/carstenartur/unfallatlas:latest" >> "$GITHUB_OUTPUT"

      - name: Run testcontainers integration test
        env:
          UNFALLATLAS_IMAGE: ${{ steps.pull.outputs.image }}
        run: npm run test:integration:tc

  location-brief-golden-qa:
    # Issue #296: real Bonn/Hannover data must pass through the deterministic
    # Node analysis, the Analysis Service persistence API and the Spring Batch
    # city ranking.  The npm command is the canonical entry point and can be
    # run from any checkout with Docker; this job only supplies a CI runtime.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install dependencies
        run: npm ci

      - name: Build Analysis Service test JAR
        run: mvn -q -f analysis-service/pom.xml -DskipTests package

      - name: Run Docker-free golden-case preflight
        run: npm run qa:location-brief-golden

      - name: Run Bonn/Hannover golden-case QA
        env:
          GOLDEN_CASE_QA_ARTIFACT_PATH: out/qa/location-brief-golden-cases.json
        run: npm run test:location-brief-golden:tc

      - name: Upload golden-case quality report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: location-brief-golden-case-qa
          path: out/qa/
          if-no-files-found: warn

  pdf-render-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Poppler and Ghostscript
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils ghostscript

      - name: Generate sample PDF
        run: npm run generate:sample-pdf

      - name: Run PDF render gate
        run: npm run test:render-gate -- --pdf out/ci-render-gate.pdf --timeout-per-page 30

  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Normalize data artifacts to gzip-only
        run: node scripts/gzip-static-data.js --replace-raw

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run accessibility tests
        run: npx playwright test tests/e2e/accessibility.spec.js --project=chromium --reporter=line

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test videos
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-videos
          path: test-results/

      - name: Upload documentation screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: documentation-screenshots
          path: docs/screenshots/

  firefox-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Normalize data artifacts to gzip-only
        run: node scripts/gzip-static-data.js --replace-raw

      - name: Run Firefox smoke tests
        run: npx playwright test --project=firefox-smoke

      - name: Upload Firefox smoke report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-firefox-smoke
          path: playwright-report/

  webkit-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Normalize data artifacts to gzip-only
        run: node scripts/gzip-static-data.js --replace-raw

      - name: Run WebKit smoke tests
        run: npx playwright test --project=webkit-smoke

      - name: Upload WebKit smoke report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-webkit-smoke
          path: playwright-report/

  analysis-service-maven-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run Maven clean verify
        id: mvn
        run: mvn -f analysis-service/pom.xml clean verify

      - name: Upload Surefire / Failsafe reports on failure
        uses: actions/upload-artifact@v7
        if: failure() && steps.mvn.conclusion == 'failure'
        with:
          name: analysis-service-test-reports
          path: |
            analysis-service/target/surefire-reports/
            analysis-service/target/failsafe-reports/
          if-no-files-found: ignore

      - name: Summarise Maven failure
        if: failure() && steps.mvn.conclusion == 'failure'
        run: |
          echo "## ❌ analysis-service Maven build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d analysis-service/target/surefire-reports ] || [ -d analysis-service/target/failsafe-reports ]; then
            echo "Test reports have been uploaded as the **analysis-service-test-reports** artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Maven failed **before any test reports were generated** (e.g. compile error or dependency resolution failure)." >> "$GITHUB_STEP_SUMMARY"
            echo "Check the **Run Maven clean verify** step log above for details." >> "$GITHUB_STEP_SUMMARY"
          fi
