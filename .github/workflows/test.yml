name: One-shot QA split refinement

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refine-split-405
  cancel-in-progress: true

jobs:
  refine:
    if: github.head_ref == 'automation/refine-split-405'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROL_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Split runtime/accessibility and build/provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Unfallwerkbank QA"
          git config user.email "3164220+carstenartur@users.noreply.github.com"
          git fetch origin \
            main \
            split/405-1-lifecycle-accessibility \
            split/405-2-canonical-build-provenance \
            split/405-3-video-export-contract \
            split/405-4-media-validation \
            split/405-5-reviewed-media-evidence \
            --prune

          SOURCE_RUNTIME=origin/split/405-1-lifecycle-accessibility
          SOURCE_BUILD=origin/split/405-2-canonical-build-provenance
          BASE_RUNTIME=$(git merge-base origin/main "$SOURCE_RUNTIME")
          BASE_BUILD="$SOURCE_RUNTIME"
          CORE_BRANCH=split/405-1-lifecycle-export-readiness
          BUILD_BRANCH=split/405-3-canonical-build

          apply_changed_paths() {
            local source=$1 compare_base=$2
            shift 2
            local status path new_path
            while IFS= read -r -d '' status; do
              IFS= read -r -d '' path
              case "$status" in
                D*) git rm -f --ignore-unmatch -- "$path" ;;
                R*|C*)
                  IFS= read -r -d '' new_path
                  git rm -f --ignore-unmatch -- "$path"
                  git checkout "$source" -- "$new_path"
                  ;;
                *) git checkout "$source" -- "$path" ;;
              esac
            done < <(git diff --name-status -z "$compare_base" "$source" -- "$@")
          }

          git checkout -B "$CORE_BRANCH" origin/main
          apply_changed_paths "$SOURCE_RUNTIME" "$BASE_RUNTIME" \
            README.md TESTING.md WERKBANK_V2.md \
            docs/architecture.md docs/qa.md \
            js/ua.app_v2.js js/ua.context_road_layer.js js/ua.core.js \
            js/ua.export_v2.js js/ua.lifecycle.js js/ua.map_v2.js \
            js/ua.osm_context.js js/ua.political-context.js js/ua.popup_context.js \
            js/ua.priorities.js js/ua.report_v2.js js/ua.utils.js \
            playwright.config.js \
            tests/e2e/context-data-render.spec.js tests/e2e/fixtures \
            tests/e2e/helpers.js tests/e2e/popup-context.spec.js \
            tests/e2e/smoke.spec.js tests/e2e/url-hydration-berlin-slope.spec.js \
            tests/e2e/url-hydration-bonn.spec.js tests/e2e/werkbank.spec.js \
            tests/unit/ua.lifecycle.test.js tests/unit/ua.map_v2.contextOverlays.test.js \
            tests/unit/ua.map_v2.lazyPopup.test.js tests/unit/ua.modalController.test.js \
            tests/unit/ua.osm_context.test.js \
            tests/unit/ua.political-context.buildSearchTerms.test.js \
            tests/unit/ua.popup_context.test.js tests/unit/ua.priorities.test.js \
            tests/unit/ua.report_v2.pdfQA.test.js tests/unit/ua.report_v2.test.js \
            tests/unit/uaContextRoadLayer.test.js
          git add -A
          git commit -m "qa: isolate lifecycle and fail-closed export readiness"
          git push --force-with-lease origin "$CORE_BRANCH"

          git checkout -B "$BUILD_BRANCH" "$SOURCE_RUNTIME"
          apply_changed_paths "$SOURCE_BUILD" "$BASE_BUILD" \
            .dockerignore .gitignore package.json package-lock.json \
            scripts/build-site.js scripts/build-static-data.js scripts/serve-site.js \
            server/lib/safeStaticPath.js server/lib/staticDataOverlay.js \
            tests/unit/assetVersioning.test.js tests/unit/buildStaticData.test.js \
            tests/unit/safeStaticPath.test.js tests/unit/siteBuildContract.test.js \
            tests/unit/staticDataOverlay.test.js \
            docs/site-build.md docs/docker.md
          git add -A
          git commit -m "build: isolate canonical deterministic site artifact"
          git push --force-with-lease origin "$BUILD_BRANCH"

          cat > /tmp/core.md <<'EOF'
          ## Scope
          First part of the reviewed replacement for oversized PR #405.

          This PR contains the runtime lifecycle contract, deterministic state/readiness reporting, fail-closed map and document-export behavior, context-layer correctness and their focused tests.

          It deliberately excludes responsive/accessibility presentation, build/release infrastructure, dependency provenance, video export and documentation media.

          ## Review order
          1 of 7. Merge this PR first.

          Relates to #397, #400 and #407. Supersedes the corresponding subset of #405.
          EOF

          cat > /tmp/accessibility.md <<EOF
          ## Scope
          Second part of the reviewed replacement for oversized PR #405.

          This PR contains the responsive task surface, native control semantics, focus behavior, touch targets, accessibility-specific UI changes and their browser/unit tests.

          ## Stack
          Base: \`$CORE_BRANCH\`

          Merge after the first split PR and then retarget to \`main\`.

          Relates to #402. Supersedes the accessibility subset of #405.
          EOF

          cat > /tmp/build.md <<EOF
          ## Scope
          Third part of the reviewed replacement for oversized PR #405.

          This PR introduces the canonical deterministic site artifact, safe static paths, reproducible static-data assembly and focused build tests.

          It deliberately excludes publication workflows and vendor/license policy, which are reviewed in the following PR.

          ## Stack
          Base: \`split/405-1-lifecycle-accessibility\`

          Relates to #403. Supersedes the canonical-build subset of #405.
          EOF

          cat > /tmp/provenance.md <<EOF
          ## Scope
          Fourth part of the reviewed replacement for oversized PR #405.

          This PR contains vendor/license provenance collection, policy validation, publication gates, release documentation and focused provenance tests.

          ## Stack
          Base: \`$BUILD_BRANCH\`

          Merge after the canonical-build PR and then retarget to \`main\`.

          Relates to #406. Supersedes the provenance subset of #405.
          EOF

          create_or_update_pr() {
            local head=$1 base=$2 title=$3 body=$4
            local number
            number=$(gh pr list --state open --head "$head" --json number --jq '.[0].number // empty')
            if [[ -z "$number" ]]; then
              gh pr create --draft --head "$head" --base "$base" --title "$title" --body-file "$body"
            else
              gh pr edit "$number" --base "$base" --title "$title" --body-file "$body"
              gh pr view "$number" --json url --jq .url
            fi
          }

          CORE_PR=$(create_or_update_pr "$CORE_BRANCH" main \
            "QA split 1/7: lifecycle and fail-closed export readiness" /tmp/core.md)
          BUILD_PR=$(create_or_update_pr "$BUILD_BRANCH" split/405-1-lifecycle-accessibility \
            "QA split 3/7: canonical deterministic site build" /tmp/build.md)

          gh pr edit 416 --base "$CORE_BRANCH" \
            --title "QA split 2/7: accessibility and responsive task surface" \
            --body-file /tmp/accessibility.md
          gh pr edit 417 --base "$BUILD_BRANCH" \
            --title "QA split 4/7: vendor and license provenance gates" \
            --body-file /tmp/provenance.md
          gh pr edit 418 --title "QA split 5/7: video export request and evidence contract"
          gh pr edit 425 --title "QA split 6/7: documentation media validation tooling"
          gh pr edit 426 --title "QA split 7/7: reviewed media assets and durable evidence"

          SUMMARY=$(cat <<EOF
          The replacement for #405 is now a seven-part review chain:

          1. $CORE_PR
          2. https://github.com/carstenartur/Unfallatlas/pull/416
          3. $BUILD_PR
          4. https://github.com/carstenartur/Unfallatlas/pull/417
          5. https://github.com/carstenartur/Unfallatlas/pull/418
          6. https://github.com/carstenartur/Unfallatlas/pull/425
          7. https://github.com/carstenartur/Unfallatlas/pull/426

          The existing combined branch heads remain unchanged, so the previously completed path-by-path losslessness checks against #405/#409 still apply. Only their review bases were narrowed.
          EOF
          )
          gh pr comment 405 --body "$SUMMARY"
          gh issue comment 397 --body "$SUMMARY"

          gh pr close "$CONTROL_PR" || true
          git push origin --delete automation/refine-split-405 || true
