name: One-shot linearize QA split

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: linearize-split-405
  cancel-in-progress: true

jobs:
  linearize:
    if: github.head_ref == 'automation/rebase-split-405'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROL_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild exact linear seven-PR chain
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Unfallwerkbank QA"
          git config user.email "3164220+carstenartur@users.noreply.github.com"
          git fetch origin --prune

          # Immutable, already reviewed source trees before rewriting the public branches.
          RUNTIME_SOURCE=7c06738c84010eecc0fb03250823f8070f7de7f1
          BUILD_SOURCE=57f0cded80ba7c50e5198ad83091958f33331595
          VIDEO_SOURCE=03e4a8fad445c180697eb9ec43c5f34c29748ee0
          MEDIA_SOURCE=83b51ddb88486a0d9d921be7167bd7d9f3204fd9
          FINAL_SOURCE=9b0559e4021defc7902c75675f500e1ef3974d27
          RUNTIME_BASE=$(git merge-base origin/main "$RUNTIME_SOURCE")

          A=split/405-1-lifecycle-export-readiness
          B=split/405-1-lifecycle-accessibility
          C=split/405-3-canonical-build
          D=split/405-2-canonical-build-provenance
          E=split/405-3-video-export-contract
          F=split/405-4-media-validation
          G=split/405-5-reviewed-media-evidence

          apply_changed_paths() {
            local source=$1 compare_base=$2
            shift 2
            local status path new_path
            while IFS= read -r -d '' status; do
              IFS= read -r -d '' path
              case "$status" in
                D*) git rm -f --ignore-unmatch -- "$path" ;;
                R*|C*)
                  IFS= read -r -d '' new_path
                  git rm -f --ignore-unmatch -- "$path"
                  git checkout "$source" -- "$new_path"
                  ;;
                *) git checkout "$source" -- "$path" ;;
              esac
            done < <(git diff --name-status -z "$compare_base" "$source" -- "$@")
          }

          # A already contains the reviewed core subset and is based directly on main.
          git checkout -B "$A" origin/$A
          git merge-base --is-ancestor origin/main "$A"

          # B: add only accessibility/responsive presentation to A.
          git checkout -B "$B" "$A"
          apply_changed_paths "$RUNTIME_SOURCE" "$RUNTIME_BASE" \
            combi.html css/ua.css index.html \
            js/ua.tour.js js/ua.ui.js \
            tests/e2e/accessibility.spec.js tests/e2e/task-surface.spec.js \
            tests/unit/ua.accessibilityBaseline.test.js \
            tests/unit/ua.tour.dialogA11y.test.js \
            unfallwerkbank.html werkbank.html werkbank_v2.html
          git add -A
          git commit -m "ui: isolate accessibility and responsive task surface"
          git diff --exit-code --quiet "$RUNTIME_SOURCE"
          git push --force-with-lease origin "$B"

          # C: canonical deterministic site build only.
          git checkout -B "$C" "$B"
          apply_changed_paths "$BUILD_SOURCE" "$RUNTIME_SOURCE" \
            .dockerignore .gitignore package.json package-lock.json \
            scripts/build-site.js scripts/build-static-data.js scripts/serve-site.js \
            server/lib/safeStaticPath.js server/lib/staticDataOverlay.js \
            tests/unit/assetVersioning.test.js tests/unit/buildStaticData.test.js \
            tests/unit/safeStaticPath.test.js tests/unit/siteBuildContract.test.js \
            tests/unit/staticDataOverlay.test.js \
            docs/site-build.md docs/docker.md
          git add -A
          git commit -m "build: isolate canonical deterministic site artifact"
          git push --force-with-lease origin "$C"

          # D: publication workflows and vendor/license provenance.
          git checkout -B "$D" "$C"
          apply_changed_paths "$BUILD_SOURCE" "$RUNTIME_SOURCE" \
            .github/workflows/deploy-release.yml \
            .github/workflows/docker-publish.yml \
            .github/workflows/generate-data-deploy-pages.yml \
            docs/RELEASING.md docs/THIRD_PARTY_NOTICES.md docs/release-checklist.md \
            scripts/validate-vendor-provenance.js scripts/vendor-provenance.js \
            tests/unit/vendorProvenance.test.js vendor/provenance-policy.json
          git add -A
          git commit -m "build: isolate vendor and license provenance gates"
          git diff --exit-code --quiet "$BUILD_SOURCE"
          git push --force-with-lease origin "$D"

          # E: video-export contract and integration.
          git checkout -B "$E" "$D"
          apply_changed_paths "$VIDEO_SOURCE" "$BUILD_SOURCE" .
          git add -A
          git commit -m "export: isolate video request and evidence contract"
          git diff --exit-code --quiet "$VIDEO_SOURCE"
          git push --force-with-lease origin "$E"

          # F: documentation-media tooling and validators.
          git checkout -B "$F" "$E"
          apply_changed_paths "$MEDIA_SOURCE" "$VIDEO_SOURCE" .
          git add -A
          git commit -m "qa: isolate documentation media validation tooling"
          git diff --exit-code --quiet "$MEDIA_SOURCE"
          git push --force-with-lease origin "$F"

          # G: reviewed media bytes and durable evidence only.
          git checkout -B "$G" "$F"
          apply_changed_paths "$FINAL_SOURCE" "$MEDIA_SOURCE" .
          git add -A
          git commit -m "docs: adopt reviewed media assets and durable evidence"
          git diff --exit-code --quiet "$FINAL_SOURCE"
          git push --force-with-lease origin "$G"

          # The public review chain must be true ancestry, not merely similar trees.
          git merge-base --is-ancestor "$A" "$B"
          git merge-base --is-ancestor "$B" "$C"
          git merge-base --is-ancestor "$C" "$D"
          git merge-base --is-ancestor "$D" "$E"
          git merge-base --is-ancestor "$E" "$F"
          git merge-base --is-ancestor "$F" "$G"

          cat > /tmp/video.md <<EOF
          ## Scope
          Fifth part of the reviewed replacement for oversized PR #405.

          This PR contains only the canonical video-export request contract, browser/server state verification, fail-closed validation and the real testcontainers integration.

          ## Stack
          Base: \`$D\`

          Merge after #417 and then retarget to \`main\`.

          Relates to #407 and #408. Supersedes the corresponding subset of #405.
          EOF

          cat > /tmp/media-tools.md <<EOF
          ## Scope
          Sixth part of the reviewed replacement for oversized PR #405.

          This PR contains only the documentation-media policy, deterministic screenshot/regeneration tooling, evidence validators, workflow safety changes and focused tests. It does **not** contain regenerated PNG/GIF files or the checked-in evidence ledger.

          ## Stack
          Base: \`$E\`

          Merge after #418 and then retarget to \`main\`.

          Relates to #397, #400, #404 and #407.
          EOF

          cat > /tmp/media-assets.md <<EOF
          ## Scope
          Seventh and final part of the reviewed replacement for oversized PRs #405 and #409.

          This PR contains the actually reviewed documentation images, complete map-and-panel control screenshots, durable readiness sidecars, the provenance ledger and documentation describing those artifacts.

          It deliberately excludes validator implementation, which is reviewed independently in #425.

          ## Stack
          Base: \`$F\`

          Merge after #425 and then retarget to \`main\`.

          Relates to #397, #400, #404 and #407. Supersedes #409 and the asset/evidence portion of #419.
          EOF

          gh pr edit 418 --base "$D" \
            --title "QA split 5/7: video export request and evidence contract" \
            --body-file /tmp/video.md
          gh pr edit 425 --base "$E" \
            --title "QA split 6/7: documentation media validation tooling" \
            --body-file /tmp/media-tools.md
          gh pr edit 426 --base "$F" \
            --title "QA split 7/7: reviewed media assets and durable evidence" \
            --body-file /tmp/media-assets.md

          SUMMARY=$(cat <<EOF
          The seven replacement PRs now form a true linear Git ancestry:

          #429 → #416 → #430 → #417 → #418 → #425 → #426

          Tree-equality gates passed at every former reviewed boundary:
          runtime/accessibility, build/provenance, video export, media tooling and final reviewed media. The final #426 tree is byte-for-byte equal to the previously verified final source tree.
          EOF
          )
          gh pr comment 405 --body "$SUMMARY"
          gh issue comment 397 --body "$SUMMARY"

          gh pr close "$CONTROL_PR" || true
          git push origin --delete automation/rebase-split-405 || true
