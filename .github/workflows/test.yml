name: One-shot cleanup PR 405 split branches

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.head_ref == 'automation/cleanup-pr405-split-final'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROL_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Remove only obsolete automation and superseded split branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            automation/refine-split-405
            automation/refine-split-405-trigger
            automation/refine-split-405-trigger-2
            automation/rebase-split-405
            automation/cleanup-pr405-split-final
            split/405-1-lifecycle-export-readiness
            split/405-1-lifecycle-accessibility
            split/405-2-canonical-build-provenance
            split/405-3-video-export-contract
            split/405-4-media-validation
            split/405-5-reviewed-media-evidence
          )
          gh pr close "$CONTROL_PR" || true
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch" 2>/dev/null || true
          done
