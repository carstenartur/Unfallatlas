name: One-shot visual split seam repair

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  repair:
    if: startsWith(github.head_ref, 'automation/fix-visual-split-seam-trigger')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Load and execute reviewed repair script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/fix-visual-split-seam
          git show origin/automation/fix-visual-split-seam:scripts/fix-visual-split-seam.sh > /tmp/fix-visual-split-seam.sh
          bash -n /tmp/fix-visual-split-seam.sh
          bash /tmp/fix-visual-split-seam.sh
