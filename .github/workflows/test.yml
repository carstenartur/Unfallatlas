name: One-shot accessibility split seam repair

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  repair:
    if: startsWith(github.head_ref, 'automation/move-a11y-seam-to-pr2-trigger')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Load and execute reviewed repair script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/move-a11y-seam-to-pr2
          git show origin/automation/move-a11y-seam-to-pr2:scripts/move-a11y-seam-to-pr2.sh > /tmp/move-a11y-seam-to-pr2.sh
          bash -n /tmp/move-a11y-seam-to-pr2.sh
          bash /tmp/move-a11y-seam-to-pr2.sh
