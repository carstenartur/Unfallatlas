name: One-shot export runtime boundary repair

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  repair:
    if: startsWith(github.head_ref, 'automation/move-export-runtime-to-build-trigger')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Load and execute reviewed repair script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/move-export-runtime-to-build
          git show origin/automation/move-export-runtime-to-build:scripts/move-export-runtime-to-build.sh > /tmp/move-export-runtime-to-build.sh
          bash -n /tmp/move-export-runtime-to-build.sh
          bash /tmp/move-export-runtime-to-build.sh
