name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  # During active PR development, obsolete matrices consume seven runners each
  # and delay the only result that matters: the current head commit.
  cancel-in-progress: true

jobs:
  unit-and-integration-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate Playwright Docker coupling
        run: node scripts/check-playwright-docker-version.js

      - name: Install dependencies
        run: npm ci

      - name: Build canonical static site
        run: npm run build:site

      - name: Validate documentation media and durable evidence
        id: validate_checked_media
        run: npm run validate:media -- --report out/qa/documentation-media.json

      - name: Upload checked-in media policy report
        uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('out/qa/documentation-media.json') != '' }}
        with:
          name: checked-documentation-media-report
          path: |
            out/qa/documentation-media.json
            _site/build-manifest.json
          if-no-files-found: error

      - name: Run unit tests
        run: |
          mkdir -p out/qa
          npm run test:unit -- --runInBand --json --outputFile=out/qa/jest-unit-results.json

      - name: Upload unit test diagnostics
        uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('out/qa/jest-unit-results.json') != '' }}
        with:
          name: unit-test-diagnostics
          path: out/qa/jest-unit-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Run integration tests
        run: npm run test:integration

      - name: Run performance tests
        run: npm run test:performance

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/

  video-export-integration:
    # Testcontainers-based end-to-end test for POST /api/export-video.
    # Verifies the full Express + Playwright + ffmpeg pipeline that lives
    # inside the Dockerfile — a coverage gap the in-process unit tests
    # cannot fill (they never invoke the ffmpeg binary).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate Playwright Docker coupling
        run: node scripts/check-playwright-docker-version.js

      - name: Install dependencies
        run: npm ci

      - name: Run testcontainers integration test
        run: npm run test:integration:tc

  location-brief-golden-qa:
    # Issue #296: real Bonn/Hannover data must pass through the deterministic
    # Node analysis, the Analysis Service persistence API and the Spring Batch
    # city ranking.  The npm command is the canonical entry point and can be
    # run from any checkout with Docker; this job only supplies a CI runtime.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install dependencies
        run: npm ci

      - name: Build Analysis Service test JAR
        working-directory: analysis-service
        run: |
          mkdir -p ../out/qa/location-brief-golden
          set -o pipefail
          mvn -B -ntp -DskipTests package 2>&1 \
            | tee ../out/qa/location-brief-golden/maven-package.log

      - name: Run Docker-free golden-case preflight
        run: npm run qa:location-brief-golden -- --preflight

      - name: Run Bonn/Hannover golden-case QA
        run: npm run test:location-brief-golden:tc

      - name: Upload golden-case quality report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: location-brief-golden-report
          path: out/qa/location-brief-golden/
          if-no-files-found: error

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare clean screenshot candidate directory
        run: |
          find docs/screenshots -maxdepth 1 -type f -name '*.png' -delete
          mkdir -p out/qa/screenshot-readiness
          find out/qa/screenshot-readiness -maxdepth 1 -type f -name '*.json' -delete

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Validate one-to-one screenshot evidence
        id: validate_evidence
        run: npm run validate:screenshot-evidence -- --report out/qa/screenshot-evidence.json

      - name: Validate generated documentation media candidate
        id: validate_media
        run: npm run validate:media -- --candidate-screenshots --report out/qa/documentation-media.json

      - name: Run accessibility tests
        run: npx playwright test tests/e2e/accessibility.spec.js --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

      - name: Upload test videos
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-videos
          path: test-results/**/*.webm
          if-no-files-found: ignore

      - name: Upload documentation screenshots
        uses: actions/upload-artifact@v7
        if: ${{ steps.validate_media.outcome == 'success' && steps.validate_evidence.outcome == 'success' }}
        with:
          name: documentation-screenshots
          path: |
            docs/screenshots/*.png
            out/qa/screenshot-readiness/*.json
            out/qa/screenshot-evidence.json
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated media QA report
        uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('out/qa/documentation-media.json', 'out/qa/screenshot-evidence.json', 'out/qa/screenshot-readiness/*.json') != '' }}
        with:
          name: generated-documentation-media-report
          path: |
            out/qa/documentation-media.json
            out/qa/screenshot-evidence.json
            out/qa/screenshot-readiness/
            _site/build-manifest.json
          if-no-files-found: error
          retention-days: 14

  firefox-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Run Firefox smoke tests
        run: npx playwright test --project=firefox-smoke

      - name: Upload Firefox smoke report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firefox-smoke-report
          path: |
            playwright-report/
            test-results/

  webkit-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run WebKit smoke tests
        run: npx playwright test --project=webkit-smoke

      - name: Upload WebKit smoke report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webkit-smoke-report
          path: |
            playwright-report/
            test-results/

  analysis-service-maven-verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: analysis-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('analysis-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven clean verify
        run: |
          mkdir -p ../out/qa/analysis-service
          set -o pipefail
          mvn -B -ntp clean verify 2>&1 \
            | tee ../out/qa/analysis-service/maven-verify.log

      - name: Upload Maven diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: analysis-service-maven-diagnostics
          path: |
            out/qa/analysis-service/maven-verify.log
            analysis-service/target/surefire-reports/
            analysis-service/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Summarise Maven failure
        if: failure()
        run: |
          echo '## Analysis Service Maven verify failed' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 ../out/qa/analysis-service/maven-verify.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  pdf-render-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Poppler and Ghostscript
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript

      - name: Generate sample PDF
        run: npm run generate:sample-pdf

      - name: Run PDF render gate
        run: |
          mkdir -p out/qa
          set -o pipefail
          npm run test:render-gate 2>&1 | tee out/qa/pdf-render-gate.log

      - name: Upload PDF render diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-render-gate-diagnostics
          path: |
            out/qa/pdf-render-gate.log
            out/qa/pdf-render/
          if-no-files-found: error
          retention-days: 14
