name: One-shot PR 405 split

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  split:
    if: github.head_ref == 'automation/split-pr-405'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Load and execute reviewed split script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/split-pr-405
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          text = subprocess.check_output([
              'git', 'show',
              'origin/automation/split-pr-405:.github/workflows/split-pr-405.yml'
          ], text=True)
          marker = '        run: |\n'
          if marker not in text:
              raise SystemExit('split run block not found')
          block = text.split(marker, 1)[1]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ) + '\n'
          Path('/tmp/split-pr-405.sh').write_text(script)
          PY
          bash -n /tmp/split-pr-405.sh
          bash /tmp/split-pr-405.sh
