name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  unit-and-integration-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          set -o pipefail
          npm run test:unit -- --runInBand 2>&1 | tee unit-test.log

      - name: Upload unit test log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-log
          path: unit-test.log

      - name: Run integration tests
        run: npm run test:integration

      - name: Run performance tests
        run: npm run test:performance

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/

  video-export-integration:
    # Testcontainers-based end-to-end test for POST /api/export-video.
    # Verifies the full Express + Playwright + ffmpeg pipeline that lives
    # inside the Dockerfile — a coverage gap the in-process unit tests
    # cannot fill (they never invoke the ffmpeg binary).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Try to pull pre-built image
        if: github.event_name == 'push'
        id: pull
        continue-on-error: true
        run: |
          docker pull ghcr.io/carstenartur/unfallatlas:latest
          echo "image=ghcr.io/carstenartur/unfallatlas:latest" >> "$GITHUB_OUTPUT"

      - name: Run testcontainers integration test
        env:
          UNFALLATLAS_IMAGE: ${{ steps.pull.outputs.image }}
        run: npm run test:integration:tc

  pdf-render-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Poppler and Ghostscript
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils ghostscript

      - name: Generate sample PDF
        run: npm run generate:sample-pdf

      - name: Run PDF render gate
        run: npm run test:render-gate -- --pdf out/ci-render-gate.pdf --timeout-per-page 30

  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run accessibility tests
        run: npx playwright test tests/e2e/accessibility.spec.js --project=chromium --reporter=line

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test videos
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-videos
          path: test-results/

      - name: Upload documentation screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: documentation-screenshots
          path: docs/screenshots/

  firefox-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Run Firefox smoke tests
        run: npx playwright test --project=firefox-smoke

      - name: Upload Firefox smoke report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-firefox-smoke
          path: playwright-report/

  webkit-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run WebKit smoke tests
        run: npx playwright test --project=webkit-smoke

      - name: Upload WebKit smoke report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-webkit-smoke
          path: playwright-report/
