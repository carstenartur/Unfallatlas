name: One-shot PR split cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: startsWith(github.head_ref, 'automation/split-pr-405-cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Delete temporary and superseded branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            automation/split-pr-405
            automation/split-pr-405-trigger-2
            automation/split-pr-405-trigger-3
            automation/split-pr-405-media-trigger
            automation/split-pr-405-cleanup-trigger
            split/405-4-reviewed-media-evidence
            fix/professional-qa-hardening
            fix/screenshot-map-context
          )
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch" || true
          done
