name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_extended_qa:
        description: 'Run cross-browser, context-data, JUnit/Testcontainers and Bonn/Hannover golden QA'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-storage:
    name: Repository storage budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the reviewed tree and its parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check repository storage against the explicit baseline
        shell: bash
        env:
          STORAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          STORAGE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Manual rehearsals compare with their real parent; write workflows and
          # pull requests must supply their event baseline and never initialize it.
          if [[ "$STORAGE_EVENT" == "workflow_dispatch" ]]; then
            STORAGE_BASE="$(git rev-parse HEAD^)"
          fi
          [[ "$STORAGE_BASE" =~ ^[0-9a-f]{40}$ && "$STORAGE_BASE" != 0000000000000000000000000000000000000000 ]] || {
            echo "Missing or invalid storage baseline" >&2
            exit 1
          }
          if ! git cat-file -e "$STORAGE_BASE^{commit}"; then
            git fetch --no-tags --depth=1 origin "$STORAGE_BASE"
          fi
          # Depth-two checkout contains both parents for the normal PR/merge path.
          # For multi-commit pushes, fetch the bounded ancestry needed by the check.
          if ! git merge-base --is-ancestor "$STORAGE_BASE" HEAD; then
            git fetch --no-tags --deepen=100 origin
          fi
          node scripts/check-repository-storage.js --base "$STORAGE_BASE" --head HEAD --report out/qa/repository-storage.json

      - name: Upload storage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-storage-evidence
          path: out/qa/repository-storage.json
          if-no-files-found: ignore
          retention-days: 30

  tests:
    name: Maven verify (Java 25, Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run the canonical repository build
        run: mvn -B -ntp clean verify -Ppages

      - name: Upload Maven and frontend test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-test-reports
          path: |
            analysis-service/target/surefire-reports/
            coverage/
            playwright-report/
            test-results/
            out/qa/
            _site/build-manifest.json
          if-no-files-found: ignore
          retention-days: 14

  extended-qa:
    name: Extended Maven QA (JUnit, Testcontainers, Playwright)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_extended_qa)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Normalize Ubuntu package sources for Playwright system dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Playwright's pinned WebKit runtime needs distribution packages that are not
          # preinstalled on GitHub's Ubuntu runner. Bypass an unreachable regional Azure
          # mirror before the explicit --with-deps installation inside the Maven build.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for apt_source in \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources; do
            [[ -f "$apt_source" ]] || continue
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "$apt_source"
          done

      - name: Run the canonical extended QA profiles
        shell: bash
        env:
          PLAYWRIGHT_INSTALL_SYSTEM_DEPS: '1'
        run: |
          set -o pipefail
          mkdir -p out/qa
          mvn -B -ntp clean verify -Pe2e,system-it,location-brief-golden,context-data-e2e \
            -Dcontext.city=Hannover \
            '-Dfailsafe.includes=**/*IT.java' \
            | tee out/qa/maven-extended-qa.log

      - name: Upload extended QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-maven-qa-evidence
          path: |
            out/qa/
            coverage/
            playwright-report/
            test-results/
            docs/screenshots/
            _site/build-manifest.json
            analysis-service/target/surefire-reports/
            qa-system-tests/target/failsafe-reports/
            qa-system-tests/target/testcontainers-logs/
          if-no-files-found: ignore
          retention-days: 14
