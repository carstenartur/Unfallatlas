name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_extended_qa:
        description: 'Run cross-browser, JUnit/Testcontainers and Bonn/Hannover golden QA'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Maven verify (Java 21, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the canonical repository build
        run: mvn -B -ntp clean verify -Ppages

      - name: Upload Maven and frontend test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canonical-test-reports
          path: |
            analysis-service/target/surefire-reports/
            coverage/
            playwright-report/
            test-results/
            out/qa/
          if-no-files-found: ignore
          retention-days: 14

  extended-qa:
    name: Extended Maven QA (JUnit, Testcontainers, Playwright)
    if: github.event_name == 'workflow_dispatch' && inputs.run_extended_qa
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the canonical extended QA profiles
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/qa
          mvn -B -ntp clean verify -Pe2e,system-it,location-brief-golden \
            | tee out/qa/maven-extended-qa.log

      - name: Upload extended QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extended-maven-qa-evidence
          path: |
            out/qa/
            coverage/
            playwright-report/
            test-results/
            docs/screenshots/
            analysis-service/target/surefire-reports/
            qa-system-tests/target/failsafe-reports/
            qa-system-tests/target/testcontainers-logs/
          if-no-files-found: ignore
          retention-days: 14
