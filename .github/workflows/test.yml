name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_extended_qa:
        description: 'Run cross-browser, context-data, JUnit/Testcontainers and Bonn/Hannover golden QA'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Maven verify (Java 21, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the canonical repository build
        run: mvn -B -ntp clean verify -Ppages

      - name: Upload Maven and frontend test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-test-reports
          path: |
            analysis-service/target/surefire-reports/
            coverage/
            playwright-report/
            test-results/
            out/qa/
            _site/build-manifest.json
          if-no-files-found: ignore
          retention-days: 14

  extended-qa:
    name: Extended Maven QA (JUnit, Testcontainers, Playwright)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_extended_qa)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the canonical extended QA profiles
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/qa
          mvn -B -ntp clean verify -Pe2e,system-it,location-brief-golden,context-data-e2e \
            -Dcontext.city=Hannover \
            '-Dfailsafe.includes=**/*IT.java' \
            | tee out/qa/maven-extended-qa.log

      - name: Upload extended QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-maven-qa-evidence
          path: |
            out/qa/
            coverage/
            playwright-report/
            test-results/
            docs/screenshots/
            _site/build-manifest.json
            analysis-service/target/surefire-reports/
            qa-system-tests/target/failsafe-reports/
            qa-system-tests/target/testcontainers-logs/
          if-no-files-found: ignore
          retention-days: 14
