name: Materialize source-manifest hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-source-manifest-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source-manifest branch
        uses: actions/checkout@v7
        with:
          ref: feat/source-manifest-core
          fetch-depth: 0

      - name: Extract and run reviewed patch script
        shell: bash
        run: |
          awk '
            /^          from pathlib import Path$/ { capture=1 }
            /^      - name: Run focused tests$/ { capture=0 }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-source-manifest-hardening.yml > /tmp/source-manifest-patch.py
          python /tmp/source-manifest-patch.py
          node --check js/ua.source_manifest.js
          node --check tests/unit/sourceManifest.test.js

      - name: Commit materialized hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ua.source_manifest.js tests/unit/sourceManifest.test.js
          git commit -m 'fix: harden source manifest validation'
          git push origin HEAD:feat/source-manifest-core
