name: Inspect restricted Ubuntu APT source

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-main-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-restricted-apt:
    name: Probe exact Docker APT command
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run exact restricted-source installation with full output
        shell: bash
        run: |
          set -o pipefail
          docker pull mcr.microsoft.com/playwright:v1.62.1-noble
          docker run --rm --user root mcr.microsoft.com/playwright:v1.62.1-noble \
            bash -lc '
              set -euxo pipefail
              ls -la /etc/apt /etc/apt/sources.list.d
              sed -n "1,240p" /etc/apt/sources.list.d/ubuntu.sources
              sed -n "1,120p" /etc/apt/sources.list.d/nodesource.list || true
              apt-get \
                -o Debug::pkgAcquire::Worker=1 \
                -o Acquire::Retries=5 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
                -o Dir::Etc::sourceparts=- \
                update
              apt-cache \
                -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
                -o Dir::Etc::sourceparts=- \
                policy ffmpeg imagemagick
              DEBIAN_FRONTEND=noninteractive apt-get \
                -o Acquire::Retries=5 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
                -o Dir::Etc::sourceparts=- \
                install -y --no-install-recommends ffmpeg imagemagick
              test -x /usr/bin/ffmpeg
              command -v convert
            ' 2>&1 | tee restricted-apt.log

      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restricted-apt-diagnostics
          path: restricted-apt.log
          if-no-files-found: error
          retention-days: 7
