name: Inspect current main CI

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-main-ci.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect-main:
    name: Inspect current main workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: List workflow runs and failed jobs for current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'

          def get(path):
              request = urllib.request.Request(
                  api + path,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'unfallwerkbank-main-ci-inspector',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          main = get(f'/repos/{repo}/branches/main')
          main_sha = main['commit']['sha']
          response = get(f'/repos/{repo}/actions/runs?branch=main&per_page=100')
          runs = [run for run in response.get('workflow_runs', []) if run.get('head_sha') == main_sha]

          print(f'CURRENT_MAIN_SHA={main_sha}')
          print(f'MATCHING_RUNS={len(runs)}')
          if not runs:
              raise SystemExit('No workflow runs found for current main commit')

          for run in sorted(runs, key=lambda item: item['id']):
              print('RUN ' + json.dumps({
                  'id': run['id'],
                  'name': run['name'],
                  'event': run['event'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'run_number': run['run_number'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
                  'html_url': run['html_url'],
              }, sort_keys=True))
              jobs = get(f'/repos/{repo}/actions/runs/{run["id"]}/jobs?per_page=100').get('jobs', [])
              for job in jobs:
                  failed_steps = [
                      {
                          'number': step['number'],
                          'name': step['name'],
                          'status': step['status'],
                          'conclusion': step['conclusion'],
                      }
                      for step in job.get('steps', [])
                      if step.get('conclusion') not in (None, 'success', 'skipped')
                  ]
                  print('JOB ' + json.dumps({
                      'id': job['id'],
                      'run_id': run['id'],
                      'name': job['name'],
                      'status': job['status'],
                      'conclusion': job['conclusion'],
                      'started_at': job['started_at'],
                      'completed_at': job['completed_at'],
                      'failed_steps': failed_steps,
                  }, sort_keys=True))
          PY
