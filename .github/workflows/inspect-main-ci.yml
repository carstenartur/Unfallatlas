name: Inspect cancelled Pages CI

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-main-ci.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect-pages-timeout:
    name: Inspect cancelled Pages build log
    runs-on: ubuntu-latest
    steps:
      - name: Download the complete Pages job log through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_JOB_ID: '96002218533'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${PAGES_JOB_ID}/logs" \
            --output pages-main-timeout.raw

          python - <<'PY'
          import io
          import pathlib
          import zipfile

          raw_path = pathlib.Path('pages-main-timeout.raw')
          raw = raw_path.read_bytes()
          if zipfile.is_zipfile(io.BytesIO(raw)):
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  chunks = []
                  for name in sorted(archive.namelist()):
                      if name.endswith('/'):
                          continue
                      chunks.append(archive.read(name))
                  raw = b'\n'.join(chunks)

          log_path = pathlib.Path('pages-main-timeout.log')
          log_path.write_bytes(raw)
          text = raw.decode('utf-8', errors='replace')
          lines = text.splitlines()
          print(f'PAGES_LOG_BYTES={len(raw)}')
          print(f'PAGES_LOG_LINES={len(lines)}')
          print('--- FINAL 700 LINES ---')
          print('\n'.join(lines[-700:]))
          PY

      - name: Upload complete Pages timeout log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-main-timeout-log
          path: pages-main-timeout.log
          if-no-files-found: error
          retention-days: 7
