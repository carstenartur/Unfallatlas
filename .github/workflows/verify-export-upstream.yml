name: Verify upstream export builds

on:
  pull_request:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-export-upstream.yml'
      - 'vendor/docx-build/**'
      - 'vendor/pdfmake-build/**'
      - 'vendor/leaflet-build/**'
      - 'vendor/provenance-policy.json'
      - 'licenses/vendor/Roboto-OFL-1.1.txt'
      - 'vendor/build-lock.recipe.json'
      - 'scripts/verify-*-upstream.sh'
      - 'scripts/verify-docx-runtime-sources.py'
      - 'scripts/reproduce-pdf-unicode.py'
      - 'scripts/pdf-unicode-data.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for the Roboto source build
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.15'
      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Rebuild the export and map libraries from their source releases
        run: mvn -B -ntp -N process-resources -Pvendor-upstream-rebuild
      - name: Record the SHA-256 values for the matching release bytes
        run: |
          mkdir -p out/qa
          sha256sum node_modules/docx/dist/index.iife.js \
            node_modules/pdfmake/build/{pdfmake.min.js,pdfmake.min.js.map,vfs_fonts.js} \
            node_modules/leaflet.heat/dist/leaflet-heat-global.js{,.map} \
            node_modules/leaflet-image/leaflet-image.js \
            > out/qa/vendor-upstream-sha256.txt
      - name: Preserve the independently reproduced release hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-export-rebuild-${{ github.run_id }}
          path: out/qa/vendor-upstream-sha256.txt
          if-no-files-found: error
          retention-days: 90
