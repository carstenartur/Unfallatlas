name: Rendered Document Poppler Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rendered-document-poppler.yml'
      - 'pom.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'js/ua.core.js'
      - 'js/ua.docx_pagination.js'
      - 'js/ua.docx_source_links.js'
      - 'js/ua.report_v2.js'
      - 'js/ua.utils.js'
      - 'scripts/deterministic-map-fixture.js'
      - 'scripts/document-golden-scenarios.js'
      - 'scripts/enrich-rendered-document-tables.js'
      - 'scripts/generate-document-golden-matrix.js'
      - 'scripts/generate-sample-docx.js'
      - 'scripts/generate-sample-pdf.js'
      - 'scripts/libreoffice-rendered-document.js'
      - 'scripts/poppler-rendered-document.js'
      - 'scripts/qa-sample-docx-rendered.js'
      - 'scripts/render-document-golden-matrix.js'
      - 'scripts/rendered-document-audit.js'
      - 'scripts/rendered-table-hints.js'
      - 'scripts/run-document-render-qa.js'
      - 'scripts/verify-document-golden-rendered-semantics.js'
      - 'scripts/verify-rendered-document-evidence.js'
      - 'tests/fixtures/rendered-document/ci-docx-contract.json'
      - 'tests/unit/deterministicMapFixture.test.js'
      - 'tests/unit/documentGoldenMatrix.test.js'
      - 'tests/unit/documentGoldenMatrixLongReport.test.js'
      - 'tests/unit/documentGoldenMatrixRegression.test.js'
      - 'tests/unit/documentGoldenRenderedSemantics.test.js'
      - 'tests/unit/docxPagination.test.js'
      - 'tests/unit/docxSourceLinks.test.js'
      - 'tests/unit/enrichRenderedDocumentTables.test.js'
      - 'tests/unit/generateSampleDocx.test.js'
      - 'tests/unit/libreOfficeRenderedDocument.test.js'
      - 'tests/unit/libreOfficeRenderedMapSemantics.test.js'
      - 'tests/unit/qaSampleDocxRendered.test.js'
      - 'tests/unit/renderDocumentGoldenMatrix.test.js'
      - 'tests/unit/renderedDocumentAudit.test.js'
      - 'tests/unit/renderedTableHints.test.js'
      - 'tests/unit/popplerRenderedDocument.test.js'
      - 'tests/unit/runtimeExportProvenanceLoader.test.js'
      - 'tests/unit/ciAptReliability.test.js'

permissions:
  contents: read

concurrency:
  group: rendered-document-poppler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rendered-document:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SAL_USE_VCLPLUGIN: svp

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install LibreOffice Writer, Poppler and document fonts
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Ubuntu image normally starts with an Azure mirror followed
          # by archive.ubuntu.com in apt-mirrors.txt. If the regional mirror is
          # unreachable, Acquire::Retries keeps retrying it until the outer
          # timeout expires. Use the canonical Ubuntu archive directly instead.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for apt_source in \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources; do
            [[ -f "$apt_source" ]] || continue
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "$apt_source"
          done

          APT_OPTIONS=(
            -o Acquire::Retries=5
            -o Acquire::ForceIPv4=true
            -o Acquire::Languages=none
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          timeout --signal=TERM 10m \
            sudo apt-get "${APT_OPTIONS[@]}" update
          timeout --signal=TERM 20m \
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get "${APT_OPTIONS[@]}" install -y --no-install-recommends \
                libreoffice-writer \
                poppler-utils \
                fonts-dejavu-core \
                fonts-liberation
          command -v libreoffice >/dev/null
          command -v pdftoppm >/dev/null
          command -v pdftotext >/dev/null
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Run repository-owned rendered-document QA
        run: mvn -B -ntp verify -Pdocument-render

      - name: Upload rendered-document evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-document-evidence
          path: |
            out/qa/rendered-document/poppler/
            out/qa/rendered-document/docx/
            out/qa/document-golden-matrix/
            analysis-service/target/surefire-reports/
          if-no-files-found: error
          retention-days: 14
