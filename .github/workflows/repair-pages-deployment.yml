name: Repair Pages deployment from validated profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pages-deployment.yml'

permissions:
  contents: read

concurrency:
  group: pages-repair-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build canonical site from checked-in verified data
        run: npm run build:site -- --input-dir out --poi-dir out --output-dir _site

      - name: Materialize provenance-complete public Pages profile
        run: npm run build:pages-profile -- --site _site

      - name: Validate exact deployable profile
        run: |
          node scripts/validate-static-data.js \
            --dir _site/out \
            --gzip-only \
            --require-cities-file cities.txt \
            --min-features 10
          node scripts/check-context-datasets.js _site
          npm run validate:media -- --report out/qa/pages-repair-documentation-media.json
          npm run validate:pages-profile -- --site _site
          test -f _site/vendor/leaflet/leaflet.js
          test -f _site/vendor/leaflet/leaflet.css
          test -f _site/vendor/leaflet.markercluster/leaflet.markercluster.js
          ! grep -q 'vendor/leaflet.heat/' _site/werkbank_v2.html
          ! grep -q 'vendor/leaflet-draw/' _site/werkbank_v2.html
          ! grep -q 'vendor/leaflet-image/' _site/werkbank_v2.html

      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages deployment
        uses: actions/configure-pages@v6

      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v5

  record-and-clean:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Record successful repair and remove one-shot workflow
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          mkdir -p .github
          cat > .github/pages-deploy-repair-complete.json <<JSON
          {
            "schemaVersion": 1,
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "sourceSha": "${GITHUB_SHA}",
            "pageUrl": "${PAGE_URL}",
            "completedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git rm -f .github/workflows/repair-pages-deployment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/pages-deploy-repair-complete.json
          git commit -m 'ci: complete one-shot Pages deployment repair'
          git push origin HEAD:main
