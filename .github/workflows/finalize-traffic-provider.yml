name: Finalize traffic provider QA

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/finalize-traffic-provider.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout traffic-provider branch
        uses: actions/checkout@v7
        with:
          ref: feat/traffic-provider-core
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Execute deterministic v2 patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^          from pathlib import Path$/ { capture=1 }
            /^      - name: Format and test$/ { capture=0 }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/finalize-traffic-provider-v2.yml > /tmp/traffic-provider-patch.py
          python /tmp/traffic-provider-patch.py
      - name: Format and test
        run: |
          npx --yes prettier@3.6.2 --write js/ua.traffic_provider.js tests/unit/trafficProvider.test.js
          node --check js/ua.traffic_provider.js
          npx jest --runInBand tests/unit/sourceManifest.test.js tests/unit/trafficProvider.test.js
      - name: Commit traffic-provider QA fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ua.traffic_provider.js tests/unit/trafficProvider.test.js
          git commit -m 'fix: harden traffic evidence time and road matching'
          git push origin HEAD:feat/traffic-provider-core
