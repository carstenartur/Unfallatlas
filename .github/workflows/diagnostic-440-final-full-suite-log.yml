name: Diagnostic common-grid serial video suite for 440

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  serial-suite:
    if: github.head_ref == 'diagnostic/440-final-full-suite-log'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/check-playwright-docker-version.js
      - run: npm ci
      - name: Apply diagnostic-only common 1fps evidence grid
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source_file = Path('server/video-source-evidence.js')
          source = source_file.read_text()
          old = 'const SOURCE_INSPECTION_FPS = 2;'
          new = "// Whole-second samples are shared by the 2fps GIF/APNG inspection and the 3fps WebP encoding.\nconst SOURCE_INSPECTION_FPS = 1;"
          if source.count(old) != 1:
              raise SystemExit('source fps insertion point not found exactly once')
          source_file.write_text(source.replace(old, new))

          test_file = Path('tests/unit/videoSourceEvidence.test.js')
          source = test_file.read_text()
          old = "'-vf', 'fps=2,scale=720:-1:flags=lanczos',"
          new = "'-vf', 'fps=1,scale=720:-1:flags=lanczos',"
          if source.count(old) != 1:
              raise SystemExit('source fps test insertion point not found exactly once')
          test_file.write_text(source.replace(old, new))
          PY
      - name: Verify source-evidence unit contract
        run: npx jest --runInBand tests/unit/videoSourceEvidence.test.js tests/unit/videoExportEncodingContract.test.js tests/unit/videoExportCodecWrapper.test.js
      - name: Expose structured media response
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/integration/videoExport.testcontainers.test.js')
          s = p.read_text()
          old = "    const { status, contentType, headers, body } = await postExportVideo(handle.baseUrl, request);\n    expect(status).toBe(200);"
          new = "    const { status, contentType, headers, body } = await postExportVideo(handle.baseUrl, request);\n    if (status !== 200) console.error('SERIAL_DIAGNOSTIC_BODY=' + body.toString('utf8'));\n    else console.error('SERIAL_DIAGNOSTIC_BYTES=' + body.length);\n    expect(status).toBe(200);"
          if s.count(old) != 1:
              raise SystemExit(f'diagnostic insertion point found {s.count(old)} times')
          p.write_text(s.replace(old, new))
          PY
      - name: Run complete serial Testcontainers suite
        id: suite
        continue-on-error: true
        shell: bash
        env:
          RUN_TESTCONTAINERS: '1'
        run: |
          set -o pipefail
          NODE_OPTIONS=--experimental-vm-modules npx jest \
            --config=tests/integration/jest.testcontainers.config.js \
            --runInBand \
            2>&1 | tee serial-suite.log
      - name: Upload complete serial output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: common-grid-serial-video-suite-log
          path: serial-suite.log
          if-no-files-found: error
      - name: Enforce suite result
        if: steps.suite.outcome != 'success'
        run: exit 1
