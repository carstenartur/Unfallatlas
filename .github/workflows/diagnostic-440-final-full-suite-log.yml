name: Diagnostic complete serial video suite for 440

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  serial-suite:
    if: github.head_ref == 'diagnostic/440-final-full-suite-log'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/check-playwright-docker-version.js
      - run: npm ci
      - name: Expose structured media response
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/integration/videoExport.testcontainers.test.js')
          s = p.read_text()
          old = "    const { status, contentType, headers, body } = await postExportVideo(handle.baseUrl, request);\n    expect(status).toBe(200);"
          new = "    const { status, contentType, headers, body } = await postExportVideo(handle.baseUrl, request);\n    if (status !== 200) console.error('SERIAL_DIAGNOSTIC_BODY=' + body.toString('utf8'));\n    else console.error('SERIAL_DIAGNOSTIC_BYTES=' + body.length);\n    expect(status).toBe(200);"
          if s.count(old) != 1:
              raise SystemExit(f'diagnostic insertion point found {s.count(old)} times')
          p.write_text(s.replace(old, new))
          PY
      - name: Run complete serial Testcontainers suite
        id: suite
        continue-on-error: true
        shell: bash
        env:
          RUN_TESTCONTAINERS: '1'
        run: |
          set -o pipefail
          NODE_OPTIONS=--experimental-vm-modules npx jest \
            --config=tests/integration/jest.testcontainers.config.js \
            --runInBand \
            2>&1 | tee serial-suite.log
      - name: Upload complete serial output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-serial-video-suite-log
          path: serial-suite.log
          if-no-files-found: error
      - name: Enforce suite result
        if: steps.suite.outcome != 'success'
        run: exit 1
