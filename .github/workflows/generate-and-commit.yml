name: Generate & Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Run converter once for all cities from cities.txt
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "cities.txt" ]]; then
            echo "cities.txt missing"
            exit 2
          fi

          # Read cities (1 per line), ignore blanks and comments
          mapfile -t CITIES < <(
            sed -e 's/\r$//' -e 's/#.*$//' -e 's/^[[:space:]]*//;s/[[:space:]]*$//' cities.txt \
            | awk 'NF'
          )

          if (( ${#CITIES[@]} == 0 )); then
            echo "No cities found in cities.txt"
            exit 2
          fi

          echo "Cities (${#CITIES[@]}):"
          printf ' - %s\n' "${CITIES[@]}"

          # Build args
          CITY_ARGS=()
          for c in "${CITIES[@]}"; do
            CITY_ARGS+=(--city "$c")
          done

          chmod +x ./convertAmt2gmaps.sh

          # One single call for all cities
          ./convertAmt2gmaps.sh \
            --limit 0 \
            "${CITY_ARGS[@]}" \
            --rad "" --pkw "" --fuss "" --krad ""

      - name: Validate GeoJSON outputs
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob("out/output_all_years_*.geojson"))
          if not files:
            print("No geojson files found")
            sys.exit(2)
          bad = []
          for f in files:
            try:
              with open(f,"r",encoding="utf-8") as fp:
                json.load(fp)
            except Exception as e:
              bad.append((f,str(e)))
          if bad:
            print("Invalid GeoJSON:")
            for f,e in bad:
              print(" -", f, "->", e)
            sys.exit(2)
          print("GeoJSON OK:", len(files))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Sync City-Registry (auto-fix Drift)
        run: node scripts/check-city-rollout.js --fix

      - name: Commit & Push changes
        run: |
          set -euo pipefail

          # niemals tmp-Dateien committen
          find out -type f -name '*.tmp' -print -delete || true

          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Automatisch erzeugte Dateien durch convertAmt2gmaps.sh (cities.txt)"
          git push origin HEAD:${{ github.ref_name }}