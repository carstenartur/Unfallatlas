name: Generate & Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Prepare build directories
        run: |
          set -euo pipefail
          rm -rf .build/raw
          mkdir -p .build/raw out

      - name: Generate accident data from cities.txt (restartable)
        run: |
          chmod +x ./convertAmt2gmaps.sh
          node scripts/generate-accident-data.js \
            --cities-file cities.txt \
            --out-dir out \
            --temp-root .build/raw \
            --min-features 10

      - name: Normalize static data artifacts to gzip-only
        run: node scripts/gzip-static-data.js --replace-raw --summary-json out/gzip-summary.json

      - name: Verify gzip-only artifact invariants
        run: node scripts/gzip-static-data.js --check --gzip-only

      - name: Validate all expected city GeoJSON files are present and complete
        run: node scripts/check-data-paths.js --gzip-only --min-features 10

      - name: Sync City-Registry (auto-fix Drift)
        run: node scripts/check-city-rollout.js --fix

      - name: Commit & Push changes
        run: |
          set -euo pipefail

          # niemals tmp-Dateien committen
          find out -type f -name '*.tmp' -print -delete || true
          rm -rf .build

          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Automatisch erzeugte Dateien durch convertAmt2gmaps.sh (cities.txt)"
          git push origin HEAD:${{ github.ref_name }}
