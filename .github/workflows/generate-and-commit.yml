name: Generate & Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Run das Shellscript
        run: |
          chmod +x ./convertAmt2gmaps.sh
          ./convertAmt2gmaps.sh --limit 0 --city hannover --city bonn --rad "" --pkw "" --fuss "" --krad ""

      - name: Validate GeoJSON outputs
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob("out/output_all_years_*.geojson")
          if not files:
            print("No geojson files found")
            sys.exit(2)
          bad = []
          for f in files:
            try:
              with open(f,"r",encoding="utf-8") as fp:
                json.load(fp)
            except Exception as e:
              bad.append((f,str(e)))
          if bad:
            print("Invalid GeoJSON:")
            for f,e in bad:
              print(" -", f, "->", e)
            sys.exit(2)
          print("GeoJSON OK:", len(files))
          PY

      - name: Commit & Push changes
        run: |
          # niemals tmp-Dateien committen
          find out -type f -name '*.tmp' -print -delete || true

          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Automatisch erzeugte Dateien durch generate.sh"
          git push origin HEAD:${{ github.ref_name }}