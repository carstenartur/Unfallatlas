name: Generate & Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Build city args from cities.txt
        id: cities
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "cities.txt" ]]; then
            echo "cities.txt missing"
            exit 2
          fi

          # Read cities (1 per line), ignore blanks and comments
          mapfile -t CITIES < <(sed -e 's/\r$//' -e 's/#.*$//' -e 's/^[[:space:]]*//;s/[[:space:]]*$//' cities.txt | awk 'NF')

          if (( ${#CITIES[@]} == 0 )); then
            echo "No cities found in cities.txt"
            exit 2
          fi

          echo "Cities (${#CITIES[@]}):"
          printf ' - %s\n' "${CITIES[@]}"

          # Build a single line with repeated --city "..."
          CITY_ARGS=()
          for c in "${CITIES[@]}"; do
            CITY_ARGS+=(--city "$c")
          done

          # Export as a single string for later steps (safe because we’ll eval via bash array below)
          # We store it line-by-line to avoid quoting hell:
          {
            echo "CITY_COUNT=${#CITIES[@]}"
            echo "CITY_ARGS<<'EOF'"
            printf '%q ' "${CITY_ARGS[@]}"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run converter once for all cities
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./convertAmt2gmaps.sh

          # Restore args
          # CITY_ARGS is a string of %q-escaped tokens, so we can safely parse into array
          read -r -a CITY_ARGS <<< "${{ steps.cities.outputs.CITY_ARGS }}"

          echo "Calling convertAmt2gmaps.sh once with ${#CITY_ARGS[@]} city-args tokens..."
          ./convertAmt2gmaps.sh \
            --limit 0 \
            "${CITY_ARGS[@]}" \
            --rad "" --pkw "" --fuss "" --krad ""

      - name: Validate GeoJSON outputs
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob("out/output_all_years_*.geojson"))
          if not files:
            print("No geojson files found")
            sys.exit(2)
          bad = []
          for f in files:
            try:
              with open(f,"r",encoding="utf-8") as fp:
                json.load(fp)
            except Exception as e:
              bad.append((f,str(e)))
          if bad:
            print("Invalid GeoJSON:")
            for f,e in bad:
              print(" -", f, "->", e)
            sys.exit(2)
          print("GeoJSON OK:", len(files))
          PY

      - name: Commit & Push changes
        run: |
          set -euo pipefail

          # niemals tmp-Dateien committen
          find out -type f -name '*.tmp' -print -delete || true

          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Automatisch erzeugte Dateien durch convertAmt2gmaps.sh (cities.txt)"
          git push origin HEAD:${{ github.ref_name }}