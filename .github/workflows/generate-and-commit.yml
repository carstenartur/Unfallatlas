name: "01 · Unfalldaten aktualisieren"

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Vorhandene Unfalldaten neu herunterladen und ersetzen'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: accident-data-refresh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Prepare build directories
        run: |
          set -euo pipefail
          rm -rf .build/raw
          mkdir -p .build/raw out

      - name: Download and generate accident data from cities.txt
        shell: bash
        env:
          FORCE_REFRESH: ${{ inputs.force }}
        run: |
          set -euo pipefail
          chmod +x ./convertAmt2gmaps.sh
          ARGS=(
            --cities-file cities.txt
            --out-dir out
            --temp-root .build/raw
            --min-features 10
          )
          if [[ "$FORCE_REFRESH" == "true" ]]; then
            ARGS+=(--force)
            echo "Forced refresh enabled: all configured cities will be downloaded and regenerated."
          else
            echo "Repair mode enabled: valid existing city artefacts may be skipped."
          fi
          node scripts/generate-accident-data.js "${ARGS[@]}"

      - name: Normalize static data artifacts to gzip-only
        run: node scripts/gzip-static-data.js --replace-raw --summary-json out/gzip-summary.json

      - name: Verify gzip-only artifact invariants
        run: node scripts/gzip-static-data.js --check --gzip-only

      - name: Validate all expected city GeoJSON files are present and complete
        run: node scripts/check-data-paths.js --gzip-only --min-features 10

      - name: Validate accident data against the real browser runtime contract
        run: npm run validate:accident-runtime

      - name: Run JUnit, browser and exact Pages compatibility before publishing data
        run: mvn -B -ntp clean verify -Ppages,system-it '-Dfailsafe.includes=**/CheckedInAccidentDataIT.java'

      - name: Upload accident-data compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accident-data-runtime-contract-${{ github.run_id }}
          path: |
            out/qa/accident-runtime-contract.json
            qa-system-tests/target/failsafe-reports/
            qa-system-tests/target/testcontainers-logs/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Sync City-Registry (auto-fix Drift)
        run: node scripts/check-city-rollout.js --fix

      - name: Commit & Push changes
        run: |
          set -euo pipefail

          # QA-/Build-Artefakte und temporäre Dateien dürfen niemals in den Datencommit geraten.
          find out -type f -name '*.tmp' -print -delete || true
          rm -rf .build _site target qa-system-tests/target analysis-service/target             node_modules test-results playwright-report coverage out/qa

          git add -A
          if git diff --cached --quiet; then
            echo "The forced download completed successfully, but the source data is byte-for-byte unchanged."
            exit 0
          fi
          git commit -m "Refresh official accident datasets"
          git push origin HEAD:${{ github.ref_name }}
