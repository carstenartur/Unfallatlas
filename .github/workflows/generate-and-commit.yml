name: Generate & Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Run converter once for all cities from cities.txt
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "cities.txt" ]]; then
            echo "cities.txt missing"
            exit 2
          fi

          # Read cities (1 per line), ignore blanks and comments
          mapfile -t CITIES < <(
            sed -e 's/\r$//' -e 's/#.*$//' -e 's/^[[:space:]]*//;s/[[:space:]]*$//' cities.txt \
            | awk 'NF'
          )

          if (( ${#CITIES[@]} == 0 )); then
            echo "No cities found in cities.txt"
            exit 2
          fi

          echo "Cities (${#CITIES[@]}):"
          printf ' - %s\n' "${CITIES[@]}"

          # Build args
          CITY_ARGS=()
          for c in "${CITIES[@]}"; do
            CITY_ARGS+=(--city "$c")
          done

          chmod +x ./convertAmt2gmaps.sh

          # One single call for all cities
          ./convertAmt2gmaps.sh \
            --limit 0 \
            "${CITY_ARGS[@]}" \
            --rad "" --pkw "" --fuss "" --krad ""

      - name: Validate GeoJSON outputs
        run: |
          python3 - <<'PY'
          import glob, gzip, json, os, sys
          files = sorted(glob.glob("out/output_all_years_*.geojson"))
          gz_files = sorted(glob.glob("out/output_all_years_*.geojson.gz"))
          seen = set()
          logical = []
          for f in files:
            slug = f[:-8]  # strip .geojson
            seen.add(slug)
            logical.append((slug, f, False))
          for f in gz_files:
            slug = f[:-11]  # strip .geojson.gz
            if slug in seen:
              continue
            logical.append((slug, f, True))
          if not files:
            if not gz_files:
              print("No geojson files found (.geojson or .geojson.gz)")
              sys.exit(2)
          bad = []
          for _, f, is_gz in logical:
            try:
              if is_gz:
                with gzip.open(f, "rt", encoding="utf-8") as fp:
                  json.load(fp)
              else:
                with open(f, "r", encoding="utf-8") as fp:
                  json.load(fp)
            except Exception as e:
              bad.append((f, str(e)))
          if bad:
            print("Invalid GeoJSON:")
            for f,e in bad:
              print(" -", f, "->", e)
            sys.exit(2)
          print("GeoJSON OK:", len(logical))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # ---------------------------------------------------------------
      # Enrichment (Tier-B done in CI, see docs/enrichment.md)
      #
      # The script reads OSM/DEM/Traffic source data from the dirs
      # named by the env vars below. No producer step is wired up yet
      # in this workflow, so by default the directories are absent and
      # every enrichment stage no-ops — the converter output is left
      # functionally unchanged. Adding `download-osm` /
      # `download-dem` / `download-traffic` steps that drop
      # `osm_<city>.json` / `dem_<city>.json` / `traffic_<city>.json`
      # into these dirs before "Run enrichment" is the planned
      # follow-up; once they exist, wrap them in `actions/cache` keyed
      # on the dataset version.
      # ---------------------------------------------------------------
      - name: Run enrichment
        env:
          ENRICH_OSM_DATA_DIR:     ${{ github.workspace }}/.enrichment-cache/osm
          ENRICH_DEM_DATA_DIR:     ${{ github.workspace }}/.enrichment-cache/dem
          ENRICH_TRAFFIC_DATA_DIR: ${{ github.workspace }}/.enrichment-cache/traffic
        run: node scripts/enrich_geojson.js

      - name: Normalize static data artifacts to gzip-only
        run: node scripts/gzip-static-data.js --replace-raw --summary-json out/gzip-summary.json

      - name: Verify gzip-only artifact invariants
        run: node scripts/gzip-static-data.js --check --gzip-only

      - name: Check enriched payload size budget
        env:
          UNFALLATLAS_DATA_MODE: gzip-only
        run: node scripts/check-enrichment-size.js

      - name: Validate v3 context-layer datasets
        env:
          UNFALLATLAS_DATA_MODE: gzip-only
        run: node scripts/check-context-datasets.js

      - name: Validate per-city slope plausibility
        env:
          UNFALLATLAS_DATA_MODE: gzip-only
        run: node scripts/check-slope-plausibility.js

      - name: Sync City-Registry (auto-fix Drift)
        run: node scripts/check-city-rollout.js --fix

      - name: Commit & Push changes
        run: |
          set -euo pipefail

          # niemals tmp-Dateien committen
          find out -type f -name '*.tmp' -print -delete || true

          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Automatisch erzeugte Dateien durch convertAmt2gmaps.sh (cities.txt)"
          git push origin HEAD:${{ github.ref_name }}