name: One-shot apply media tooling boundary fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: one-shot-media-tooling-boundary
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'automation/rechain-codec-media-stack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/rechain-codec-media-stack
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate and apply executable media tooling boundary
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/patch-media-tooling-boundary-runner.py
          bash scripts/apply-media-tooling-boundary-fix.sh 2>&1 | tee media-tooling-boundary-apply.log
      - name: Upload validation and application log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-tooling-boundary-apply-log
          path: media-tooling-boundary-apply.log
          if-no-files-found: error
      - name: Enforce successful validated application
        if: steps.apply.outcome != 'success'
        run: exit 1
