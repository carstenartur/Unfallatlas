name: Run one-shot split for PR 405

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  split:
    if: >-
      (github.event_name == 'issues' && github.event.issue.title == '[automation] Split PR 405') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.ref == 'automation/split-pr-405')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Load reviewed split script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/split-pr-405
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          text = subprocess.check_output([
              "git", "show",
              "origin/automation/split-pr-405:.github/workflows/split-pr-405.yml"
          ], text=True)
          marker = "        run: |\n"
          if marker not in text:
              raise SystemExit("split run block not found")
          block = text.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          path = Path("/tmp/split-pr-405.sh")
          path.write_text("\n".join(lines) + "\n")
          PY
          bash -n /tmp/split-pr-405.sh

      - name: Execute split
        shell: bash
        run: bash /tmp/split-pr-405.sh
