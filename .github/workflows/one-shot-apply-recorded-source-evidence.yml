name: One-shot apply recorded-source evidence fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/rechain-codec-media-stack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/rechain-codec-media-stack
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate and apply the recorded-source evidence repair
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/apply-recorded-source-evidence-fix.sh 2>&1 | tee recorded-source-apply.log
      - name: Upload validation and application log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recorded-source-evidence-apply-log
          path: recorded-source-apply.log
          if-no-files-found: error
      - name: Enforce successful validated application
        if: steps.apply.outcome != 'success'
        run: exit 1
