name: Live Pages Runtime Health

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-pages-runtime-health.yml'
      - '.github/workflows/deploy-pages-current-data.yml'
      - '.github/workflows/generate-data-deploy-pages.yml'
      - 'werkbank_v2.html'
      - 'vendor/**'
      - 'css/**'
      - 'js/**'
      - 'scripts/diagnose-published-werkbank.cjs'
      - 'scripts/documentation-deeplink-contract.cjs'
      - 'scripts/run-live-documentation-links.cjs'
      - 'tests/e2e/documentation-deeplinks.live.spec.js'
      - 'tests/unit/criticalRuntimeRecovery.test.js'
      - 'out/**'
      - 'data/**'
  workflow_run:
    workflows:
      - '04 · Aktuelle Daten veröffentlichen'
      - 'Generate Data and Deploy Pages'
    types: [completed]
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: live-pages-runtime-health-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  recovery-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify parser-blocking critical-script recovery
        run: npx jest tests/unit/criticalRuntimeRecovery.test.js --runInBand

  published-runtime:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout health-check contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Diagnose the reported Hannover deep link
        run: node scripts/diagnose-published-werkbank.cjs

      - name: Exercise the complete published application contract
        env:
          DOCUMENTATION_AUDIT_PUBLISHED: '1'
        run: node scripts/run-live-documentation-links.cjs

      - name: Upload live runtime diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: live-pages-runtime-health
          path: |
            out/qa/published-runtime-diagnostic/
            out/qa/documentation-live-links/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
