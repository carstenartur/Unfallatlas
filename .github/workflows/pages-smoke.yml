name: Live-Demo Smoke Test (GitHub Pages)

on:
  schedule:
    - cron: '0 6 * * *'   # täglich um 06:00 UTC
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build and Deploy Current Pages Data
    types:
      - completed

permissions:
  contents: read
  issues: write

concurrency:
  group: pages-smoke
  cancel-in-progress: false

jobs:
  pages-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Determine Pages URL
        id: pages_url
        shell: bash
        run: |
          URL="${PAGES_URL:-https://carstenartur.github.io/Unfallatlas/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}

      - name: Determine tested revision
        id: revision
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "source_run=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "source_run=" >> "$GITHUB_OUTPUT"
          fi

      # Capture the real Playwright exit code while keeping the job alive long
      # enough to upload diagnostics and update the alert issue. The final step
      # restores the correct failed workflow conclusion.
      - name: Run smoke tests against GitHub Pages
        id: smoke
        shell: bash
        run: |
          set +e
          mkdir -p out/pages-smoke
          npx playwright test \
            tests/e2e/smoke.spec.js \
            tests/e2e/pages-critical-path.spec.js \
            --project=chromium \
            2>&1 | tee out/pages-smoke/output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          BASE_URL: ${{ steps.pages_url.outputs.url }}
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/pages-smoke
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Open or update smoke-test issue
        if: steps.smoke.outputs.exit_code != '0'
        uses: actions/github-script@v9
        env:
          PAGES_URL: ${{ steps.pages_url.outputs.url }}
          SMOKE_EXIT_CODE: ${{ steps.smoke.outputs.exit_code }}
          TESTED_SHA: ${{ steps.revision.outputs.sha }}
          SOURCE_DEPLOY_RUN: ${{ steps.revision.outputs.source_run }}
        with:
          script: |
            const fs = require('node:fs');
            const logPath = 'out/pages-smoke/output.log';
            const raw = fs.existsSync(logPath)
              ? fs.readFileSync(logPath, 'utf8')
              : 'Kein Smoke-Test-Log erzeugt.';
            const tail = raw.slice(-6000).replaceAll('```', '`` `');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactName = `pages-smoke-${context.runId}-${context.runAttempt}`;
            const date = new Date().toISOString().slice(0, 10);
            const title = `🚨 Live-Demo Smoke-Test fehlgeschlagen (${date})`;
            const body = [
              '## Live-Demo Smoke-Test fehlgeschlagen',
              '',
              `**URL:** ${process.env.PAGES_URL}`,
              `**Workflow-Run:** ${runUrl}`,
              process.env.SOURCE_DEPLOY_RUN ? `**Pages-Deployment:** ${process.env.SOURCE_DEPLOY_RUN}` : null,
              `**Getesteter Commit:** \`${process.env.TESTED_SHA}\``,
              `**Exit-Code:** \`${process.env.SMOKE_EXIT_CODE}\``,
              `**Diagnose-Artefakt:** \`${artifactName}\``,
              '',
              '### Ende der Playwright-Ausgabe',
              '',
              '```text',
              tail,
              '```',
              '',
              'Der vollständige Playwright-Report und die Testartefakte sind am Workflow-Run hinterlegt.',
            ].filter(Boolean).join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'smoke-test-failure',
              per_page: 100,
            });
            const existing = issues
              .filter(issue => !issue.pull_request)
              .sort((left, right) => right.number - left.number)[0];

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['smoke-test-failure'],
              });
            }

      - name: Close recovered smoke-test issues
        if: steps.smoke.outputs.exit_code == '0'
        uses: actions/github-script@v9
        env:
          PAGES_URL: ${{ steps.pages_url.outputs.url }}
          TESTED_SHA: ${{ steps.revision.outputs.sha }}
          SOURCE_DEPLOY_RUN: ${{ steps.revision.outputs.source_run }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'smoke-test-failure',
              per_page: 100,
            });
            for (const issue of issues.filter(item => !item.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  '## Live-Demo wieder grün',
                  '',
                  `Der vollständige Smoke-Test gegen ${process.env.PAGES_URL} ist erfolgreich.`,
                  `Workflow-Run: ${runUrl}`,
                  process.env.SOURCE_DEPLOY_RUN ? `Pages-Deployment: ${process.env.SOURCE_DEPLOY_RUN}` : null,
                  `Getesteter Commit: \`${process.env.TESTED_SHA}\``,
                ].filter(Boolean).join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail workflow when smoke test failed
        if: steps.smoke.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Live-Demo smoke test failed with exit code ${{ steps.smoke.outputs.exit_code }}"
          exit 1
