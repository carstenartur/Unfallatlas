name: Live-Demo Smoke Test (GitHub Pages)

on:
  schedule:
    - cron: '0 6 * * *'   # täglich um 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # für automatisches Issue bei Fehlschlag

jobs:
  pages-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Determine Pages URL
        id: pages_url
        run: |
          # Repo-Variable PAGES_URL hat Vorrang; Fallback auf Standard-Pages-URL
          URL="${PAGES_URL:-https://carstenartur.github.io/Unfallatlas/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}

      - name: Run smoke tests against GitHub Pages
        run: npx playwright test tests/e2e/smoke.spec.js --project=chromium
        env:
          BASE_URL: ${{ steps.pages_url.outputs.url }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `🚨 Live-Demo Smoke-Test fehlgeschlagen (${new Date().toISOString().slice(0,10)})`;
            const body = [
              '## Live-Demo Smoke-Test fehlgeschlagen',
              '',
              `**URL:** ${process.env.PAGES_URL || 'https://carstenartur.github.io/Unfallatlas/'}`,
              `**Workflow-Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Bitte die GitHub Pages-Deployments und den Workflow-Log prüfen.',
            ].join('\n');

            // Kein Duplikat öffnen, wenn ein offenes Issue mit gleichem Titel existiert
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'smoke-test-failure',
            });
            const exists = issues.some(i => i.title === title);
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['smoke-test-failure'],
              });
            }
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
