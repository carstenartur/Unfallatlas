name: Checkout-local

on:
  push:
    branches:
      - agent/complete-ai-handoff
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkout-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Checkout-local ci
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checkout and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f pom.xml
          test -f package.json
          git diff --check
          test -z "$(git status --porcelain)"
