name: Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.js'
      - 'scripts/validate-doc-media.js'
      - 'scripts/validate-vendor-provenance.js'
      - 'server/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.js'
      - 'scripts/validate-doc-media.js'
      - 'scripts/validate-vendor-provenance.js'
      - 'server/**'
  workflow_dispatch:

jobs:
  main-smoke:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked Node dependencies
        run: npm ci

      - name: Build canonical site and validate checked-in media
        run: |
          npm run build:site
          npm run validate:media

      - name: Build container without publishing
        run: >-
          docker build
          --build-arg REQUIRE_COMPLETE_VENDOR_PROVENANCE=0
          --tag unfallatlas:main-smoke
          .

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked Node dependencies
        run: npm ci

      - name: Build and require complete vendor provenance
        run: |
          npm run build:site
          npm run validate:media
          npm run validate:vendor-provenance -- --require-complete

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/carstenartur/unfallatlas
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            REQUIRE_COMPLETE_VENDOR_PROVENANCE=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
