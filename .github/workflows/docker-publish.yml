name: Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.js'
      - 'scripts/validate-doc-media.js'
      - 'scripts/validate-vendor-provenance.js'
      - 'server/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.js'
      - 'scripts/validate-doc-media.js'
      - 'scripts/validate-vendor-provenance.js'
      - 'server/**'
  workflow_dispatch:

jobs:
  main-smoke:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked Node dependencies
        run: npm ci

      - name: Validate Playwright Docker contract
        run: npm run validate:playwright-docker

      - name: Build canonical site and validate checked-in media
        run: |
          npm run build:site
          npm run validate:media

      - name: Build container without publishing
        id: docker-smoke
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/unfallatlas-docker-build.log"
          if ! docker build \
            --progress=plain \
            --build-arg REQUIRE_COMPLETE_VENDOR_PROVENANCE=0 \
            --tag unfallatlas:main-smoke \
            . >"$log" 2>&1; then
            echo "::error::Docker smoke build failed; see the uploaded docker-smoke-build-log artifact."
            tail -n 160 "$log"
            exit 1
          fi

      - name: Upload Docker smoke diagnostics
        if: ${{ failure() && steps.docker-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-build-log
          path: ${{ runner.temp }}/unfallatlas-docker-build.log
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked Node dependencies
        run: npm ci

      - name: Build and require complete vendor provenance
        run: |
          npm run build:site
          npm run validate:media
          npm run validate:vendor-provenance -- --require-complete

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/carstenartur/unfallatlas
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            REQUIRE_COMPLETE_VENDOR_PROVENANCE=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
