name: Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  main-smoke:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked Node dependencies
        run: npm ci

      - name: Build canonical site and validate checked-in media
        run: |
          npm run build:site
          npm run validate:media

      - name: Build container without publishing
        run: >-
          docker build
          --build-arg REQUIRE_COMPLETE_VENDOR_PROVENANCE=0
          --tag unfallatlas:main-smoke
          .

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR is a public distribution channel, so tags and explicit manual
      # publication retain the complete-provenance gate from issue #406.
      # Normal main pushes run the non-publishing smoke job above instead of
      # creating an intentionally red branch status while publication is blocked.
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked Node dependencies
        run: npm ci

      - name: Build and require complete vendor provenance
        run: |
          npm run build:site
          npm run validate:media
          npm run validate:vendor-provenance -- --require-complete

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/carstenartur/unfallatlas
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Re-run the complete-provenance gate inside the image build after
          # `_site` has been materialized. The host preflight above is useful
          # diagnostics, but `_site` is deliberately excluded from the Docker
          # context and therefore cannot attest the bytes that are published.
          build-args: |
            REQUIRE_COMPLETE_VENDOR_PROVENANCE=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
