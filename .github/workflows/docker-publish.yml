name: Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'pom.xml'
      - 'qa-system-tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'bin/ffmpeg'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.js'
      - 'scripts/validate-doc-media.js'
      - 'scripts/validate-vendor-provenance.js'
      - 'server/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'pom.xml'
      - 'qa-system-tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'bin/ffmpeg'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.js'
      - 'scripts/validate-doc-media.js'
      - 'scripts/validate-vendor-provenance.js'
      - 'server/**'
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main-smoke:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Reclaim hosted-runner disk before production-container smoke
        shell: bash
        run: |
          set -euo pipefail
          # The smoke test needs Java/Maven plus Docker only. Removing unrelated
          # preinstalled SDKs before pulling the large Playwright image avoids
          # APT archive failures caused by the hosted runner's shared root disk.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force --volumes
          df -h /
          docker system df

      - name: Build and verify the exact production container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/qa
          # The repository-wide frontend and Pages gates run in the Tests
          # workflow. Execute Maven from the dedicated QA module so
          # Testcontainers receives a clean runner instead of duplicating
          # node_modules, _site and thousands of tests before pulling the
          # large Playwright image. Surefire may choose its own fork working
          # directory, therefore repository and evidence roots are absolute.
          pushd qa-system-tests >/dev/null
          mvn -B -ntp verify -Pvideo-export-it \
            -Dunfallatlas.repositoryRoot="${GITHUB_WORKSPACE}" \
            -Dunfallatlas.qaOutputDir="${GITHUB_WORKSPACE}/qa-system-tests/target/testcontainers-logs" \
            | tee ../out/qa/maven-video-export-it.log
          popd >/dev/null

      - name: Upload Docker system-test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-system-test-evidence
          path: |
            out/qa/maven-video-export-it.log
            qa-system-tests/target/failsafe-reports/
            qa-system-tests/target/testcontainers-logs/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build release site and require complete provenance
        run: mvn -B -ntp clean verify -Prelease-site

      - name: Reclaim build-only workspace before container packaging
        shell: bash
        run: |
          set -euo pipefail
          # Docker rebuilds all runtime dependencies and the site inside the
          # image. Keeping the host-side Maven/npm outputs would only compete
          # with the Playwright base image and APT layers for runner storage.
          rm -rf \
            node_modules \
            target \
            analysis-service/target \
            qa-system-tests/target \
            _site \
            .build \
            coverage \
            playwright-report \
            test-results
          docker system prune --all --force --volumes
          df -h /

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/carstenartur/unfallatlas
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          build-args: |
            REQUIRE_COMPLETE_VENDOR_PROVENANCE=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
