name: Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'pom.xml'
      - 'qa-system-tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.js'
      - 'scripts/validate-doc-media.js'
      - 'scripts/validate-vendor-provenance.js'
      - 'server/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'pom.xml'
      - 'qa-system-tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.js'
      - 'scripts/validate-doc-media.js'
      - 'scripts/validate-vendor-provenance.js'
      - 'server/**'
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main-smoke:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify the exact production container
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/qa
          mvn -B -ntp verify -Pvideo-export-it \
            | tee out/qa/maven-video-export-it.log

      - name: Upload Docker system-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-system-test-evidence
          path: |
            out/qa/maven-video-export-it.log
            qa-system-tests/target/failsafe-reports/
            qa-system-tests/target/testcontainers-logs/
            analysis-service/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build release site and require complete provenance
        run: mvn -B -ntp clean verify -Prelease-site

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/carstenartur/unfallatlas
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            REQUIRE_COMPLETE_VENDOR_PROVENANCE=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
