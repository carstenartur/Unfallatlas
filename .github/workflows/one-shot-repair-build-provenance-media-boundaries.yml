name: One-shot repair build/provenance/media boundaries

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'automation/repair-build-provenance-media-boundaries'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch with full history
        uses: actions/checkout@v7
        with:
          ref: automation/repair-build-provenance-media-boundaries
          fetch-depth: 0

      - name: Rebuild and prove executable PR boundaries locally
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/export-boundary-repair-plan.sh 2>&1 | tee boundary-repair.log
          git rev-parse 'origin/main^{tree}' > boundary-repair-plan/new-base-tree.txt

      - name: Stage proven commit objects without changing production refs
        if: steps.repair.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          final_commit="$(node -e "const p=require('./boundary-repair-plan/plan.json'); process.stdout.write(p.branches.find(b=>b.pr===442).localCommit)")"
          printf 'Attempting object transport for final proven commit %s\n' "$final_commit" | tee -a boundary-repair.log
          if git push origin "$final_commit:refs/heads/automation/object-staging-qa-stack" 2>&1 | tee -a boundary-repair.log; then
            echo 'OBJECT_STAGING_REF_CREATED=1' | tee -a boundary-repair.log
          else
            echo 'OBJECT_STAGING_REF_CREATED=0' | tee -a boundary-repair.log
            echo 'The protected workflow ref update was rejected as expected; uploaded Git objects remain addressable.' | tee -a boundary-repair.log
          fi

      - name: Upload complete repair plan and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executable-boundary-repair-plan
          path: |
            boundary-repair.log
            boundary-repair-plan/
          include-hidden-files: true
          if-no-files-found: error

      - name: Enforce successful protected rebuild
        if: steps.repair.outcome != 'success'
        run: exit 1
