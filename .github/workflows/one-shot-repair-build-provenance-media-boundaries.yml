name: One-shot repair build/provenance/media boundaries

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'automation/repair-build-provenance-media-boundaries'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch with full history
        uses: actions/checkout@v7
        with:
          ref: automation/repair-build-provenance-media-boundaries
          fetch-depth: 0

      - name: Rebuild and prove executable PR boundaries locally
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/export-runtime-boundary-repair-v3.sh 2>&1 | tee boundary-repair.log

      - name: Stage proven commit objects without changing production refs
        if: steps.repair.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          final_commit="$(node -e "const p=require('./boundary-repair-plan/plan.json'); process.stdout.write(p.branches.find(b=>b.pr===442).localCommit)")"
          printf 'Transporting final proven commit %s to temporary staging ref\n' "$final_commit" | tee -a boundary-repair.log
          git push --force origin "$final_commit:refs/heads/automation/object-staging-qa-stack" 2>&1 | tee -a boundary-repair.log
          echo 'OBJECT_STAGING_REF_UPDATED=1' | tee -a boundary-repair.log

      - name: Upload complete repair plan and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executable-boundary-repair-plan
          path: |
            boundary-repair.log
            boundary-repair-plan/
          include-hidden-files: true
          if-no-files-found: error

      - name: Enforce successful protected rebuild
        if: steps.repair.outcome != 'success'
        run: exit 1
