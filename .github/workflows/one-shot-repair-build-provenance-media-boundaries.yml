name: One-shot repair build/provenance/media boundaries

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'automation/repair-build-provenance-media-boundaries'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch with full history
        uses: actions/checkout@v7
        with:
          ref: automation/repair-build-provenance-media-boundaries
          fetch-depth: 0

      - name: Rebuild and prove executable PR boundaries locally
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/export-boundary-repair-plan.sh 2>&1 | tee boundary-repair.log
          git rev-parse 'origin/main^{tree}' > boundary-repair-plan/new-base-tree.txt

      - name: Upload complete repair plan and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executable-boundary-repair-plan
          path: |
            boundary-repair.log
            boundary-repair-plan/
          include-hidden-files: true
          if-no-files-found: error

      - name: Enforce successful protected rebuild
        if: steps.repair.outcome != 'success'
        run: exit 1
