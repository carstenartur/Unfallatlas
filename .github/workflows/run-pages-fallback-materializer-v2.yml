name: Run corrected Pages fallback materializer

# Rerun marker: static asset auditor fix.
on:
  push:
    branches: [fix/canonical-bast-cost-source]
    paths:
      - '.github/workflows/run-pages-fallback-materializer-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/run-pages-fallback-materializer-v2.yml'

permissions:
  contents: write

concurrency:
  group: materialize-pages-branch-fallback
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Generate and correct fallback candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/materialize-pages-branch-fallback.yml').read_text(encoding='utf-8')
          start_marker = "          node <<'NODE'\n"
          end_marker = "          NODE\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/materialize-pages-branch-fallback.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/materialize-pages-branch-fallback.js
          node /tmp/materialize-pages-branch-fallback.js
          rm -f .github/workflows/run-materialize-pages-branch-fallback.yml

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          bootstrap_path = Path('js/ua.vendor_bootstrap.js')
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          old_regex = r'/(?:^|\\.)github\\.io$/i'
          new_regex = r'/(?:^|\.)github\.io$/i'
          if bootstrap.count(old_regex) != 1:
              raise SystemExit(f'expected one over-escaped host regex, found {bootstrap.count(old_regex)}')
          bootstrap = bootstrap.replace(old_regex, new_regex, 1)

          public_preview = Path('js/ua.public-preview.js').read_text(encoding='utf-8')
          public_source_path = Path('pages-fallback/public-preview-source.js')
          public_source_path.write_text(
              'window.__UA_PUBLIC_PREVIEW_SOURCE__ = ' + json.dumps(public_preview, ensure_ascii=False) + ';\n',
              encoding='utf-8',
          )

          runtime_line = "    writeTag('<script src=\"pages-fallback/vendor-runtime.js?v=2026-07-24\"><\\/script>');"
          public_line = "    writeTag('<script src=\"pages-fallback/public-preview-source.js?v=2026-07-24\"><\\/script>');"
          if bootstrap.count(runtime_line) != 1:
              raise SystemExit('cannot locate fallback vendor runtime insertion point')
          bootstrap = bootstrap.replace(runtime_line, runtime_line + '\n' + public_line, 1)
          bootstrap_path.write_text(bootstrap, encoding='utf-8')

          html_path = Path('werkbank_v2.html')
          html = html_path.read_text(encoding='utf-8')
          old_block = '''  <script>
    if (window.__UA_BRANCH_PAGES_FALLBACK__) {
      document.write('<script src="' + 'js/ua.public-' + 'preview.js?v=branch-fallback-1' + '"><\\/script>');
    }
  </script>'''
          new_block = '''  <script>
    if (window.__UA_BRANCH_PAGES_FALLBACK__) {
      if (typeof window.__UA_PUBLIC_PREVIEW_SOURCE__ !== 'string') {
        throw new Error('Checked-in Pages public-preview source is unavailable');
      }
      (0, eval)(window.__UA_PUBLIC_PREVIEW_SOURCE__);
      delete window.__UA_PUBLIC_PREVIEW_SOURCE__;
    }
  </script>'''
          if html.count(old_block) != 1:
              raise SystemExit(f'cannot locate dynamic public-preview script block: {html.count(old_block)}')
          html = html.replace(old_block, new_block, 1)
          html_path.write_text(html, encoding='utf-8')

          test_path = Path('tests/unit/pagesBranchFallback.test.js')
          tests = test_path.read_text(encoding='utf-8')
          old_expect = "    expect(html).toContain(\"'js/ua.public-' + 'preview.js\");"
          new_expect = "    expect(html).toContain('__UA_PUBLIC_PREVIEW_SOURCE__');"
          if tests.count(old_expect) != 1:
              raise SystemExit('cannot update fallback HTML unit expectation')
          tests = tests.replace(old_expect, new_expect, 1)
          anchor = "    expect(read('pages-fallback/README.md')).toContain('integrity-pinned packages');"
          if tests.count(anchor) != 1:
              raise SystemExit('cannot extend fallback file contract')
          tests = tests.replace(
              anchor,
              anchor + "\n    expect(read('pages-fallback/public-preview-source.js')).toContain('__UA_PUBLIC_PREVIEW_SOURCE__');",
              1,
          )
          test_path.write_text(tests, encoding='utf-8')

          profile_test_path = Path('tests/unit/publicPagesProfile.test.js')
          profile_tests = profile_test_path.read_text(encoding='utf-8')
          anchor = "      expect(jobs.deploy).toContain('pages-fallback/vendor-runtime.js');"
          if profile_tests.count(anchor) != 1:
              raise SystemExit('cannot extend deployment fallback contract')
          profile_tests = profile_tests.replace(
              anchor,
              anchor + "\n      expect(jobs.deploy).toContain('pages-fallback/public-preview-source.js');",
              1,
          )
          profile_test_path.write_text(profile_tests, encoding='utf-8')

          for workflow_path in [
              Path('.github/workflows/deploy-pages-current-data.yml'),
              Path('.github/workflows/generate-data-deploy-pages.yml'),
          ]:
              workflow = workflow_path.read_text(encoding='utf-8')
              runtime_check = '"${base}/pages-fallback/vendor-runtime.js?${query}" >/dev/null && \\\n'
              source_check = '                   curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \\\n                     "${base}/pages-fallback/public-preview-source.js?${query}" >/dev/null && \\\n'
              if workflow.count(runtime_check) != 1:
                  raise SystemExit(f'cannot extend published fallback gate in {workflow_path}')
              workflow = workflow.replace(runtime_check, runtime_check + source_check, 1)
              workflow_path.write_text(workflow, encoding='utf-8')

          manifest_path = Path('build-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          digest = hashlib.sha256()
          for path in [bootstrap_path, html_path, public_source_path]:
              digest.update(path.as_posix().encode('utf-8'))
              digest.update(b'\0')
              digest.update(path.read_bytes())
              digest.update(b'\n')
          fingerprint = digest.hexdigest()
          manifest['buildFingerprint'] = fingerprint
          manifest['applicationFingerprint'] = fingerprint
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify generated JavaScript syntax and source boundary
        run: |
          node --check js/ua.vendor_bootstrap.js
          node --check pages-fallback/vendor-style.js
          node --check pages-fallback/vendor-runtime.js
          node --check pages-fallback/public-preview-source.js
          for file in pages-fallback/vendor-source-*.js; do node --check "$file"; done
          ! grep -Fq "document.write('<script src=\"' +" werkbank_v2.html
          grep -Fq '__UA_PUBLIC_PREVIEW_SOURCE__' werkbank_v2.html

      - name: Verify source-only fallback contract
        run: npx jest tests/unit/pagesBranchFallback.test.js --runInBand

      - name: Verify public profile workflow contract
        run: npx jest tests/unit/publicPagesProfile.test.js --runInBand

      - name: Verify canonical site build contract
        run: npx jest tests/unit/siteBuildContract.test.js --runInBand

      - name: Verify full and reduced site builds
        run: |
          npm run build:site -- --input-dir out --poi-dir out --output-dir _site
          npm run validate:media
          npm run build:pages-profile -- --site _site
          npm run validate:pages-profile -- --site _site
          test ! -e _site/pages-fallback

      - name: Commit verified fallback to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep legacy Pages publishing inside public profile'
          git push origin HEAD:main

      - name: Remove this temporary runner
        if: ${{ always() }}
        run: |
          git reset --hard
          git clean -fd
          git fetch origin fix/canonical-bast-cost-source
          git checkout -B cleanup-pages-fallback-v2 origin/fix/canonical-bast-cost-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/run-pages-fallback-materializer-v2.yml
          git commit -m 'ci: remove corrected Pages fallback runner'
          git push origin HEAD:fix/canonical-bast-cost-source
