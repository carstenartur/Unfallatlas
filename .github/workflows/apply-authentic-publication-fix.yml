name: Apply authentic publication screenshot fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/screenshot-map-context'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/screenshot-map-context
          fetch-depth: 0
      - run: |
          git config user.name "Unfallwerkbank QA"
          git config user.email "3164220+carstenartur@users.noreply.github.com"
      - name: Apply screenshot publication patch
        run: |
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path
          import json,re
          def read(p):return Path(p).read_text()
          def write(p,s):Path(p).write_text(s)
          def one(s,a,b,label):
            if s.count(a)!=1:raise SystemExit(f'{label}: expected one match, got {s.count(a)}')
            return s.replace(a,b,1)

          path='tests/e2e/screenshots.spec.js';s=read(path);start=s.index('const DETERMINISTIC_MAP_TILES = Object.freeze({');end=s.index('/**\n * Frame the fixed-height panel',start)
          replacement=r'''const SCREENSHOT_PROFILE = process.env.UA_SCREENSHOT_PROFILE === 'publication' ? 'publication' : 'regression';
