name: Apply authentic publication screenshot fix
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/screenshot-map-context'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/screenshot-map-context
          fetch-depth: 0
      - name: Apply implementation from repository patch script
        run: |
          git config user.name "Unfallwerkbank QA"
          git config user.email "3164220+carstenartur@users.noreply.github.com"
          node scripts/apply-authentic-screenshot-fix.cjs
          rm .github/workflows/apply-authentic-publication-fix.yml scripts/apply-authentic-screenshot-fix.cjs
          git add -A
          git commit -m "test: separate regression and publication screenshot contracts"
          git push origin HEAD:fix/screenshot-map-context
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:site
      - name: Generate authentic publication screenshots
        env:
          UA_SCREENSHOT_PROFILE: publication
          GITHUB_SHA: ${{ env.SOURCE_COMMIT }}
        run: |
          find docs/screenshots -maxdepth 1 -type f -name '*.png' -delete
          mkdir -p out/qa/screenshot-readiness
          find out/qa/screenshot-readiness -type f -delete
          npm run generate:screenshots:publication
      - name: Validate authentic evidence
        env:
          GITHUB_SHA: ${{ env.SOURCE_COMMIT }}
        run: |
          npm run validate:screenshot-evidence -- --require-authentic-basemap --report out/qa/screenshot-evidence.json
          npm run validate:media -- --candidate-screenshots --report out/qa/documentation-media.json
      - name: Adopt authentic evidence
        env:
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/adopt-authentic-screenshot-evidence.cjs
      - run: |
          git add docs/screenshots qa/screenshot-evidence docs/media-qa-2026-07-19.md
          git commit -m "docs: replace synthetic maps with authentic publication screenshots"
          git push origin HEAD:fix/screenshot-map-context
      - uses: actions/upload-artifact@v7
        with:
          name: publication-screenshots-reviewed-${{ github.run_id }}
          path: |
            out/qa/publication-screenshots-reviewed.zip
            docs/screenshots/*.png
            qa/screenshot-evidence/
          if-no-files-found: error
