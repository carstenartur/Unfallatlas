      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused policy tests
        run: |
          npm run test:unit -- --runInBand tests/unit/screenshotEvidencePolicy.test.js \
            tests/unit/docMediaPolicy.test.js tests/unit/screenshotWorkflowSafety.test.js

      - name: Build exact source commit
        run: npm run build:site

      - name: Generate authentic publication screenshots
        env:
          UA_SCREENSHOT_PROFILE: publication
          GITHUB_SHA: ${{ env.SOURCE_COMMIT }}
        run: |
          find docs/screenshots -maxdepth 1 -type f -name '*.png' -delete
          mkdir -p out/qa/screenshot-readiness
          find out/qa/screenshot-readiness -maxdepth 1 -type f -name '*.json' -delete
          npm run generate:screenshots:publication

      - name: Validate authentic screenshot evidence and media
        env:
          GITHUB_SHA: ${{ env.SOURCE_COMMIT }}
        run: |
          npm run validate:screenshot-evidence -- --require-authentic-basemap --report out/qa/screenshot-evidence.json
          npm run validate:media -- --candidate-screenshots --report out/qa/documentation-media.json

      - name: Adopt reviewed evidence and update QA record
        env:
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          rm -rf qa/screenshot-evidence/readiness
          mkdir -p qa/screenshot-evidence/readiness
          cp out/qa/screenshot-readiness/*.json qa/screenshot-evidence/readiness/
          cp out/qa/screenshot-evidence.json qa/screenshot-evidence/summary.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          root = Path('.')
          source_commit = os.environ['SOURCE_COMMIT']
          run_id = int(os.environ['WORKFLOW_RUN_ID'])
          sha_file = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          summary_path = root / 'qa/screenshot-evidence/summary.json'
          summary = json.loads(summary_path.read_text())
          readiness_files = sorted((root / 'qa/screenshot-evidence/readiness').glob('*.json'))
          build_manifest = json.loads((root / '_site/build-manifest.json').read_text())
          zip_path = root / 'out/qa/publication-screenshots-reviewed.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted((root / 'docs/screenshots').glob('*.png')): archive.write(path, path.as_posix())
              for path in readiness_files: archive.write(path, path.as_posix())
              archive.write(summary_path, summary_path.as_posix())
              archive.write(root / '_site/build-manifest.json', '_site/build-manifest.json')
          evidence_payload = ''.join(f"{entry['path']}\t{entry['sha256']}\t{entry['bytes']}\n" for entry in summary['screenshots'])
          readiness_payload = ''.join(f"{p.name}\t{sha_file(p)}\t{p.stat().st_size}\n" for p in readiness_files)
          provenance = {
            'schemaVersion': 1,
            'purpose': 'Durable binding for authentic publication screenshots generated on 2026-07-19.',
            'source': {'artifactName': f'publication-screenshots-reviewed-{run_id}', 'artifactId': run_id,
              'artifactZipSha256': sha_file(zip_path), 'evidenceRevision': source_commit,
              'evidenceStatus': 'valid', 'evidenceCount': len(summary['screenshots'])},
            'build': {'manifestSha256': summary['build']['sha256'], 'fingerprint': build_manifest['fingerprint'],
              'applicationFingerprint': build_manifest['application']['fingerprint'],
              'dataFingerprint': build_manifest['data']['fingerprint']},
            'summary': {'path': 'qa/screenshot-evidence/summary.json', 'sha256': sha_file(summary_path),
              'entriesSha256': hashlib.sha256(evidence_payload.encode()).hexdigest()},
            'readiness': {'directory': 'qa/screenshot-evidence/readiness', 'files': len(readiness_files),
              'bytes': sum(p.stat().st_size for p in readiness_files),
              'entriesSha256': hashlib.sha256(readiness_payload.encode()).hexdigest()}}
          (root / 'qa/screenshot-evidence/provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          current = {p.name: p.stat().st_size for p in sorted((root / 'docs/screenshots').glob('*.png'))}
          total_after = sum(current.values())
          lines = ['# Medien-QA: authentische Publikations-Screenshots (19.07.2026)', '',
            f'Quellcommit: `{source_commit}`; Workflow-Run: `{run_id}`.', '',
            '- Automatische PR-/E2E-Artefakte bleiben synthetische Regressionstests und sind keine Publikationsmedien.',
            '- Alle 21 eingecheckten Bilder binden echte Rasterantworten, Providerstatus und sichtbare Attribution.',
            '- SVG-/Fixture-Tiles sind für eingecheckte Dokumentationsmedien fail-closed ausgeschlossen.',
            '- PDF-QA hält die Karte aktiviert, scannt alle Seiten, prüft Unfallzahl und Rasterkartenoperation.', '',
            f'Screenshots gesamt: **{total_after} Byte**.', '',
            '## Freigabekriterien', '',
            '- Erkennbare reale Straßen bzw. amtliche Luftbilder.',
            '- Lesbare Unfallpunkte, Cluster, Heatmap, Auswahl und Bedienzustände.',
            '- Sichtbare Quellenangaben und Attribution.',
            '- Visuelle Prüfung des konkreten Bildsatzes vor Ready-for-review.', '']
          (root / 'docs/media-qa-2026-07-19.md').write_text('\n'.join(lines))
          PY
          npm run validate:media
          git add docs/screenshots qa/screenshot-evidence docs/media-qa-2026-07-19.md
          git commit -m "docs: replace synthetic maps with authentic publication screenshots"
          git push origin HEAD:fix/screenshot-map-context

      - name: Upload authentic reviewed candidate
        uses: actions/upload-artifact@v7
        with:
          name: publication-screenshots-reviewed-${{ github.run_id }}
          path: |
            out/qa/publication-screenshots-reviewed.zip
            docs/screenshots/*.png
            qa/screenshot-evidence/
            docs/media-qa-2026-07-19.md
          if-no-files-found: error
          retention-days: 30
