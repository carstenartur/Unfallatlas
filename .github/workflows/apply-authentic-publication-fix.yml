  if (url.hostname==='www.bonn.de' && url.pathname.startsWith('/stadtplan-wms/services/orthofoto/MapServer/WMSServer')) return { kind:'orthophoto', provider:'Bundesstadt Bonn', officialForExport:true };
  if (url.hostname==='www.wms.nrw.de' && url.pathname.startsWith('/geobasis/wms_nw_dop')) return { kind:'orthophoto', provider:'Geobasis NRW', officialForExport:true };
  if (url.hostname==='opendata.lgln.niedersachsen.de' && url.pathname.startsWith('/doorman/noauth/dop_wms')) return { kind:'orthophoto', provider:'LGLN Niedersachsen', officialForExport:true };
  if (url.hostname==='sg.geodatenzentrum.de' && url.pathname.startsWith('/wms_dop20')) return { kind:'orthophoto', provider:'BKG', officialForExport:true };
  if (url.hostname==='server.arcgisonline.com' && url.pathname.startsWith('/ArcGIS/rest/services/World_Imagery/MapServer/tile/')) return { kind:'orthophoto', provider:'Esri', officialForExport:false };
  return null;
}
function mapResponses(page) {
  const state=SCREENSHOT_NETWORK.get(page)||{responses:[]}; const grouped=new Map();
  for (const x of state.responses) { const k=[x.kind,x.provider,x.status,x.contentType,x.fixture].join('\t'); const y=grouped.get(k)||{...x,count:0}; y.count++; grouped.set(k,y); }
  return [...grouped.values()];
}
function raster(x){return x.status>=200&&x.status<300&&/^image\/(?:png|jpe?g|webp)(?:;|$)/i.test(x.contentType||'')&&x.fixture!==true;}
function assertBasemap(b, requirement, path) {
  const rs=b.responses||[], osm=/OpenStreetMap/i.test(String(b.attribution||''));
  const standard=rs.some(x=>x.kind==='standard'&&raster(x));
  const labels=rs.some(x=>x.kind==='labels'&&raster(x));
  const ortho=rs.some(x=>x.kind==='orthophoto'&&x.officialForExport===true&&raster(x));
  const failed=rs.some(x=>x.kind==='orthophoto'&&(x.status>=400||x.status===0));
  const ok=requirement==='standard'?standard&&osm:requirement==='orthophoto'?ortho:requirement==='hybrid'?ortho&&labels&&osm:requirement==='fallback'?failed&&standard&&osm:false;
  if(!ok) throw new Error(`Missing authentic ${requirement} basemap: ${path}\n${JSON.stringify(b,null,2)}`);
}
async function basemapCapture(page,requirement,path){
  const ui=await page.evaluate(()=>({attribution:(document.querySelector('.leaflet-control-attribution')?.textContent||'').trim(),mapLayerStatus:(document.querySelector('#mapLayerStatus')?.textContent||'').trim()}));
  const capture={profile:SCREENSHOT_PROFILE,basemap:{requirement,authentic:false,...ui,responses:mapResponses(page)}};
  if(SCREENSHOT_PROFILE==='publication'){assertBasemap(capture.basemap,requirement,path);capture.basemap.authentic=true;} return capture;
}
async function attachCapture(path,capture){
  const fs=await import('node:fs/promises'),p=await import('node:path');
  const file=p.resolve(process.cwd(),'out/qa/screenshot-readiness',`${p.basename(path,p.extname(path))}.json`);
