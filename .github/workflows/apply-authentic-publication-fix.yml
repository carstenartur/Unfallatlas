function classifyMapResource(rawUrl){const u=new URL(rawUrl);if(/(^|\.)tile\.openstreetmap\.org$/i.test(u.hostname))return{kind:'standard',provider:'OpenStreetMap',officialForExport:true};if(/(^|\.)basemaps\.cartocdn\.com$/i.test(u.hostname)&&u.pathname.startsWith('/light_only_labels/'))return{kind:'labels',provider:'CARTO / OpenStreetMap',officialForExport:true};if(u.hostname==='www.bonn.de'&&u.pathname.startsWith('/stadtplan-wms/services/orthofoto/MapServer/WMSServer'))return{kind:'orthophoto',provider:'Bundesstadt Bonn',officialForExport:true};if(u.hostname==='www.wms.nrw.de'&&u.pathname.startsWith('/geobasis/wms_nw_dop'))return{kind:'orthophoto',provider:'Geobasis NRW',officialForExport:true};if(u.hostname==='opendata.lgln.niedersachsen.de'&&u.pathname.startsWith('/doorman/noauth/dop_wms'))return{kind:'orthophoto',provider:'LGLN Niedersachsen',officialForExport:true};if(u.hostname==='sg.geodatenzentrum.de'&&u.pathname.startsWith('/wms_dop20'))return{kind:'orthophoto',provider:'BKG',officialForExport:true};if(u.hostname==='server.arcgisonline.com'&&u.pathname.startsWith('/ArcGIS/rest/services/World_Imagery/MapServer/tile/'))return{kind:'orthophoto',provider:'Esri',officialForExport:false};return null;}
