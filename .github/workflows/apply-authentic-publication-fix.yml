function assertAuthenticBasemap(b,req,path){const r=b.responses||[],standard=r.some(x=>x.kind==='standard'&&raster(x)),labels=r.some(x=>x.kind==='labels'&&raster(x)),ortho=r.some(x=>x.kind==='orthophoto'&&x.officialForExport===true&&raster(x)),failed=r.some(x=>x.kind==='orthophoto'&&(x.status>=400||x.status===0)),osm=/OpenStreetMap/i.test(String(b.attribution||''));const ok=req==='standard'?standard&&osm:req==='orthophoto'?ortho:req==='hybrid'?ortho&&labels&&osm:req==='fallback'?failed&&standard&&osm:false;if(!ok)throw new Error(`Authentic ${req} basemap missing for ${path}\n${JSON.stringify(b,null,2)}`);}
