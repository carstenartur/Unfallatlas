name: Apply authentic publication screenshot fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-authentic-publication-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/screenshot-map-context'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: fix/screenshot-map-context
          fetch-depth: 0

      - name: Configure Git author
        run: |
          git config user.name "Unfallwerkbank QA"
          git config user.email "3164220+carstenartur@users.noreply.github.com"

      - name: Patch screenshot publication architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          path = 'tests/e2e/screenshots.spec.js'
          text = read(path)
          start = text.index('const DETERMINISTIC_MAP_TILES = Object.freeze({')
          end = text.index('/**\n * Frame the fixed-height panel', start)
          replacement = r'''const SCREENSHOT_PROFILE = process.env.UA_SCREENSHOT_PROFILE === 'publication'
            ? 'publication'
            : 'regression';

          const DETERMINISTIC_MAP_TILES = Object.freeze({
            standard: readFileSync(resolve(process.cwd(), 'tests/e2e/fixtures/map-tiles/standard.svg')),
            orthophoto: readFileSync(resolve(process.cwd(), 'tests/e2e/fixtures/map-tiles/orthophoto.svg')),
            labels: readFileSync(resolve(process.cwd(), 'tests/e2e/fixtures/map-tiles/labels.svg'))
          });
          const DETERMINISTIC_EXTERNAL_DATA = Object.freeze({
            nominatim: Object.freeze({
              bonn: readFileSync(resolve(process.cwd(), 'tests/e2e/fixtures/network/nominatim-reverse-bonn.json')),
              hannover: readFileSync(resolve(process.cwd(), 'tests/e2e/fixtures/network/nominatim-reverse-hannover.json'))
            }),
            overpass: Object.freeze({
              bonn: readFileSync(resolve(process.cwd(), 'tests/e2e/fixtures/network/overpass-bonn.json')),
              hannover: readFileSync(resolve(process.cwd(), 'tests/e2e/fixtures/network/overpass-hannover.json'))
            })
          });
          const SCREENSHOT_NETWORK = new WeakMap();

          function classifyMapResource(rawUrl) {
            const url = new URL(rawUrl);
            if (/(^|\.)tile\.openstreetmap\.org$/i.test(url.hostname)) {
              return { kind: 'standard', provider: 'OpenStreetMap', officialForExport: true };
            }
            if (/(^|\.)basemaps\.cartocdn\.com$/i.test(url.hostname) &&
                url.pathname.startsWith('/light_only_labels/')) {
              return { kind: 'labels', provider: 'CARTO / OpenStreetMap', officialForExport: true };
            }
            if (url.hostname === 'www.bonn.de' &&
                url.pathname.startsWith('/stadtplan-wms/services/orthofoto/MapServer/WMSServer')) {
              return { kind: 'orthophoto', provider: 'Bundesstadt Bonn', officialForExport: true };
            }
            if (url.hostname === 'www.wms.nrw.de' && url.pathname.startsWith('/geobasis/wms_nw_dop')) {
              return { kind: 'orthophoto', provider: 'Geobasis NRW', officialForExport: true };
            }
            if (url.hostname === 'opendata.lgln.niedersachsen.de' &&
                url.pathname.startsWith('/doorman/noauth/dop_wms')) {
              return { kind: 'orthophoto', provider: 'LGLN Niedersachsen', officialForExport: true };
            }
            if (url.hostname === 'sg.geodatenzentrum.de' && url.pathname.startsWith('/wms_dop20')) {
              return { kind: 'orthophoto', provider: 'BKG', officialForExport: true };
            }
            if (url.hostname === 'server.arcgisonline.com' &&
                url.pathname.startsWith('/ArcGIS/rest/services/World_Imagery/MapServer/tile/')) {
              return { kind: 'orthophoto', provider: 'Esri', officialForExport: false };
            }
            return null;
          }

          function mapResponseSummary(page) {
            const state = SCREENSHOT_NETWORK.get(page) || { responses: [], unexpectedExternalRequests: [] };
            const grouped = new Map();
            for (const response of state.responses) {
              const key = [response.kind, response.provider, response.officialForExport,
                response.status, response.contentType, response.fixture].join('\t');
              const current = grouped.get(key) || { ...response, count: 0 };
              current.count += 1;
              grouped.set(key, current);
            }
            return Array.from(grouped.values()).sort((a, b) =>
              `${a.kind}\t${a.provider}\t${a.status}`.localeCompare(`${b.kind}\t${b.provider}\t${b.status}`));
          }

          function isRasterSuccess(response) {
            return response.status >= 200 && response.status < 300 &&
              /^image\/(?:png|jpe?g|webp)(?:;|$)/i.test(response.contentType || '') && response.fixture !== true;
          }

          function assertBasemapRequirement(capture, requirement, screenshotPath) {
            const responses = capture.responses || [];
            const standard = responses.some(response => response.kind === 'standard' && isRasterSuccess(response));
            const labels = responses.some(response => response.kind === 'labels' && isRasterSuccess(response));
            const officialOrthophoto = responses.some(response => response.kind === 'orthophoto' &&
              response.officialForExport === true && isRasterSuccess(response));
            const orthophotoFailure = responses.some(response => response.kind === 'orthophoto' &&
              (response.status >= 400 || response.status === 0));
            const attribution = String(capture.attribution || '');
            const hasOsmAttribution = /OpenStreetMap/i.test(attribution);
            let valid = false;
            if (requirement === 'standard') valid = standard && hasOsmAttribution;
            else if (requirement === 'orthophoto') valid = officialOrthophoto && attribution.length > 0;
            else if (requirement === 'hybrid') valid = officialOrthophoto && labels && hasOsmAttribution;
            else if (requirement === 'fallback') valid = orthophotoFailure && standard && hasOsmAttribution;
            else throw new Error(`Unknown basemap requirement ${requirement}: ${screenshotPath}`);
            if (!valid) throw new Error(`Publication screenshot lacks authentic ${requirement} basemap evidence: ${screenshotPath}\n` + JSON.stringify(capture, null, 2));
          }

          async function collectBasemapCapture(page, requirement, screenshotPath) {
            const ui = await page.evaluate(() => ({
              attribution: (document.querySelector('.leaflet-control-attribution')?.textContent || '').trim(),
              mapLayerStatus: (document.querySelector('#mapLayerStatus')?.textContent || '').trim()
            })).catch(() => ({ attribution: '', mapLayerStatus: '' }));
            const capture = { profile: SCREENSHOT_PROFILE, basemap: { requirement, authentic: false,
              attribution: ui.attribution, mapLayerStatus: ui.mapLayerStatus, responses: mapResponseSummary(page) } };
            if (SCREENSHOT_PROFILE === 'publication') {
              assertBasemapRequirement(capture.basemap, requirement, screenshotPath);
              capture.basemap.authentic = true;
            }
            return capture;
          }

          async function attachBasemapCapture(screenshotPath, capture) {
            const fs = await import('node:fs/promises');
            const path = await import('node:path');
            const sidecarPath = path.resolve(process.cwd(), 'out/qa/screenshot-readiness',
              `${path.basename(screenshotPath, path.extname(screenshotPath))}.json`);
            const sidecar = JSON.parse(await fs.readFile(sidecarPath, 'utf8'));
            sidecar.capture = capture;
            await fs.writeFile(sidecarPath, `${JSON.stringify(sidecar, null, 2)}\n`);
          }

          async function captureDocumentationScreenshot(page, options) {
            const snapshot = await captureDataScreenshot(page, options);
            await attachBasemapCapture(options.path,
              await collectBasemapCapture(page, options.basemap || 'standard', options.path));
            return snapshot;
          }

          async function setupScreenshotNetwork(page, options = {}) {
            const { orthophotoAvailable = true } = options;
            const state = { responses: [], unexpectedExternalRequests: [] };
            SCREENSHOT_NETWORK.set(page, state);
            page.on('response', response => {
              const mapResource = classifyMapResource(response.url());
              if (!mapResource) return;
              state.responses.push({ ...mapResource, status: response.status(),
                contentType: response.headers()['content-type'] || '', fixture: SCREENSHOT_PROFILE === 'regression',
                sampleUrl: response.url().split('?')[0] });
            });
            await page.route(/^https:\/\//, async route => {
              const request = route.request();
              const url = new URL(request.url());
              const mapResource = classifyMapResource(request.url());
              const nominatimFixture = classifyNominatimFixture(request.url());
              const overpassFixture = classifyOverpassFixture(request.url(), request.postDataBuffer() || request.postData());
              if (nominatimFixture) {
                await route.fulfill({ status: 200, contentType: 'application/json; charset=utf-8',
                  body: DETERMINISTIC_EXTERNAL_DATA.nominatim[nominatimFixture] }); return;
              }
              if (overpassFixture) {
                await route.fulfill({ status: 200, contentType: 'application/json; charset=utf-8',
                  body: DETERMINISTIC_EXTERNAL_DATA.overpass[overpassFixture] }); return;
              }
              if (url.hostname === 'pdfjs-test-cdn') { await route.fallback(); return; }
              if (mapResource) {
                if (!orthophotoAvailable && mapResource.kind === 'orthophoto') {
                  await route.fulfill({ status: 503, contentType: 'text/plain; charset=utf-8', body: 'Orthophoto unavailable' }); return;
                }
                if (SCREENSHOT_PROFILE === 'regression') {
                  const body = mapResource.kind === 'standard' ? DETERMINISTIC_MAP_TILES.standard
                    : mapResource.kind === 'labels' ? DETERMINISTIC_MAP_TILES.labels : DETERMINISTIC_MAP_TILES.orthophoto;
                  await route.fulfill({ status: 200, contentType: 'image/svg+xml', body }); return;
                }
                await route.continue(); return;
              }
              const postData = request.postDataBuffer();
              state.unexpectedExternalRequests.push(`${request.method()} ${request.resourceType()} ${request.url()}` +
                (postData ? ` body=${postData.toString('utf8').slice(0, 240)}` : ''));
              await route.abort('blockedbyclient');
            });
          }

          function assertNoUnexpectedExternalRequests(page) {
            const unexpected = (SCREENSHOT_NETWORK.get(page) || { unexpectedExternalRequests: [] }).unexpectedExternalRequests;
            if (unexpected.length) throw new Error(`Screenshot requested unapproved external resources:\n${unexpected.join('\n')}`);
          }

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('setupDeterministicBasemapTiles', 'setupScreenshotNetwork')
          text = text.replace('await captureDataScreenshot(page, {', 'await captureDocumentationScreenshot(page, {')

          def add_basemap_for_path(source, screenshot_path, requirement):
              pattern = re.compile(rf"(path:\s*'{re.escape(screenshot_path)}',[\s\S]*?layers:\s*\[[^\]]+\])")
              match = pattern.search(source)
              if not match: raise SystemExit(f'could not find screenshot block for {screenshot_path}')
              block = match.group(1)
              return source if 'basemap:' in block else source[:match.start(1)] + block + f",\n      basemap: '{requirement}'" + source[match.end(1):]

          for screenshot_path, requirement in [
              ('docs/screenshots/22-mapmode-orthophoto.png', 'orthophoto'),
              ('docs/screenshots/23-mapmode-hybrid.png', 'hybrid'),
              ('docs/screenshots/24-mapmode-analysis.png', 'orthophoto'),
              ('docs/screenshots/25-mapmode-orthophoto-fallback.png', 'fallback')]:
              text = add_basemap_for_path(text, screenshot_path, requirement)
          text = replace_once(text,
              "    const readinessSnapshot = await waitForScreenshotReady(page, { city: 'Bonn', layers: ['cluster'] });\n",
              "    const readinessSnapshot = await waitForScreenshotReady(page, { city: 'Bonn', layers: ['cluster'] });\n"
              "    const pdfBasemapCapture = await collectBasemapCapture(page, 'standard', 'docs/screenshots/15-export-pdf-rendered.png');\n",
              'capture PDF basemap provenance')
          text = replace_once(text,
              "    // Kartenausschnitt deaktivieren (vermeidet leaflet-image-Abhängigkeit)\n    await page.locator('#cbIncludeMap').uncheck();\n",
              "    // Die PDF-Belegseite muss den Kartenausschnitt tatsächlich enthalten.\n    await expect(page.locator('#cbIncludeMap')).toBeChecked();\n",
              'keep PDF map enabled')
          text = replace_once(text,
              "      const { getDocument, GlobalWorkerOptions } = await import('https://pdfjs-test-cdn/pdf.min.mjs');",
              "      const { getDocument, GlobalWorkerOptions, OPS } = await import('https://pdfjs-test-cdn/pdf.min.mjs');",
              'import PDF operator constants')
          old_pdf_scan = r'''      const expectedLocalAccidents = ${expectedLocalAccidents};
          const pageTexts = [];
          let renderedPageNumber = 1;
          for (let pageNumber = 1; pageNumber <= pdfDoc.numPages; pageNumber += 1) {
            const candidate = await pdfDoc.getPage(pageNumber);
            const textContent = await candidate.getTextContent();
            const text = textContent.items.map((item) => item.str || '').join(' ').replace(/\s+/g, ' ').trim();
            pageTexts.push(text);
            if (renderedPageNumber === 1) {
              const countPattern = new RegExp('(?:^|\\D)' + expectedLocalAccidents + '\\s+Unfälle', 'i');
              if (countPattern.test(text)) renderedPageNumber = pageNumber;
            }
          }
          const pdfPage = await pdfDoc.getPage(renderedPageNumber);'''
          new_pdf_scan = r'''      const expectedLocalAccidents = ${expectedLocalAccidents};
          const pageTexts = [];
          const pageImageCounts = [];
          let countPageNumber = 0;
          for (let pageNumber = 1; pageNumber <= pdfDoc.numPages; pageNumber += 1) {
            const candidate = await pdfDoc.getPage(pageNumber);
            const textContent = await candidate.getTextContent();
            const text = textContent.items.map((item) => item.str || '').join(' ').replace(/\s+/g, ' ').trim();
            pageTexts.push(text);
            const operatorList = await candidate.getOperatorList();
            const imageOperations = new Set([OPS.paintImageXObject, OPS.paintInlineImageXObject, OPS.paintImageMaskXObject]);
            pageImageCounts.push(operatorList.fnArray.filter(fn => imageOperations.has(fn)).length);
            if (countPageNumber === 0) {
              const countPattern = new RegExp('(?:^|\\D)' + expectedLocalAccidents + '\\s+Unfälle', 'i');
              if (countPattern.test(text)) countPageNumber = pageNumber;
            }
          }
          const renderedPageNumber = pageImageCounts.findIndex((count, index) =>
            count > 0 && /OpenStreetMap|Kartenausschnitt|Kartenquelle|Quelle:/i.test(pageTexts[index] || '')) + 1;
          if (renderedPageNumber < 1) throw new Error('PDF contains no identifiable rendered map page');
          if (countPageNumber < 1) throw new Error('PDF contains no page with the expected local accident count');
          const pdfPage = await pdfDoc.getPage(renderedPageNumber);'''
          text = replace_once(text, old_pdf_scan, new_pdf_scan, 'scan all PDF pages for map and count')
          text = replace_once(text, "      window.__pdfRenderedPageText = pageTexts[renderedPageNumber - 1] || '';\n",
              "      window.__pdfRenderedPageText = pageTexts[renderedPageNumber - 1] || '';\n"
              "      window.__pdfCountPage = countPageNumber;\n      window.__pdfCountPageText = pageTexts[countPageNumber - 1] || '';\n"
              "      window.__pdfPageImageCounts = pageImageCounts;\n", 'publish PDF diagnostics')
          text = replace_once(text, "      renderedPageText: window.__pdfRenderedPageText || ''\n",
              "      renderedPageText: window.__pdfRenderedPageText || '',\n      countPage: window.__pdfCountPage || 0,\n"
              "      countPageText: window.__pdfCountPageText || '',\n      pageImageCounts: window.__pdfPageImageCounts || []\n",
              'read PDF diagnostics')
          old_assertions = r'''    expect(pdfDiagnostics.renderedPage).toBeGreaterThan(0);
          expect(pdfDiagnostics.text).toContain('Unfälle');
          expect(pdfDiagnostics.text).toMatch(
            new RegExp(`(?:^|\D)${expectedLocalAccidents}\s+Unfälle`, 'i')
          );
          // The evidence page must begin with the complete executive-summary
          // reading block. This catches real pdfMake pagination, not only the
          // docDefinition's `unbreakable` declaration.
          expect(pdfDiagnostics.renderedPageText).toMatch(/^(?:BEGRÜNDUNG\s+)?KURZBEWERTUNG\b/);
          expect(pdfDiagnostics.renderedPageText).not.toMatch(/^(?:Wochentag\)\.|Schwerpunkt der Häufung:)/);

          // Screenshot der ersten PDF-Seite, auf der die zuvor aus dem Exportmodell
          // verifizierte lokale Unfallzahl tatsächlich genannt wird.'''
          new_assertions = r'''    expect(pdfDiagnostics.renderedPage).toBeGreaterThan(0);
          expect(pdfDiagnostics.countPage).toBeGreaterThan(0);
          expect(pdfDiagnostics.pageImageCounts[pdfDiagnostics.renderedPage - 1]).toBeGreaterThan(0);
          expect(pdfDiagnostics.renderedPageText).toMatch(/OpenStreetMap|Kartenausschnitt|Kartenquelle|Quelle:/i);
          expect(pdfDiagnostics.text).toContain('Unfälle');
          expect(pdfDiagnostics.text).toMatch(
            new RegExp(`(?:^|\D)${expectedLocalAccidents}\s+Unfälle`, 'i')
          );
          expect(pdfDiagnostics.countPageText).toMatch(/^(?:BEGRÜNDUNG\s+)?KURZBEWERTUNG\b/);
          expect(pdfDiagnostics.countPageText).not.toMatch(/^(?:Wochentag\)\.|Schwerpunkt der Häufung:)/);

          // Screenshot der ersten PDF-Seite mit einer tatsächlich gerenderten
          // Karten-/Bildoperation; Unfallzahl und alle Seiten wurden separat geprüft.'''
          text = replace_once(text, old_assertions, new_assertions, 'assert PDF map and count evidence')
          text = replace_once(text,
              "    await recordScreenshotEvidence(screenshotPath, afterCaptureSnapshot, {\n      city: 'Bonn',\n      layers: ['cluster']\n    });\n",
              "    await recordScreenshotEvidence(screenshotPath, afterCaptureSnapshot, {\n      city: 'Bonn',\n      layers: ['cluster']\n    });\n"
              "    await attachBasemapCapture(screenshotPath, pdfBasemapCapture);\n", 'attach PDF basemap evidence')
          write(path, text)

          path = 'scripts/validate-screenshot-evidence.js'
          text = read(path)
          text = replace_once(text, "  const args = { report: null };", "  const args = { report: null, requireAuthenticBasemap: false };", 'validator args')
          text = replace_once(text,
              "    if (argv[index] === '--report') args.report = argv[++index] || null;\n    else throw new Error(`[validate-screenshot-evidence] Unknown argument: ${argv[index]}`);",
              "    if (argv[index] === '--report') args.report = argv[++index] || null;\n"
              "    else if (argv[index] === '--require-authentic-basemap') args.requireAuthenticBasemap = true;\n"
              "    else throw new Error(`[validate-screenshot-evidence] Unknown argument: ${argv[index]}`);", 'validator authentic flag')
          marker = "function listFlatFiles(directory, suffix, label, options = {}) {"
          helper = r'''function validateAuthenticBasemap(evidence, screenshotPath, requirement, errors) {
            const capture = evidence && evidence.capture;
            const basemap = capture && capture.basemap;
            if (!capture || capture.profile !== 'publication' || !basemap || basemap.authentic !== true) {
              errors.push(`${screenshotPath}: publication evidence does not prove an authentic basemap`); return;
            }
            if (basemap.requirement !== requirement) errors.push(`${screenshotPath}: basemap requirement does not match ${requirement}`);
            const responses = Array.isArray(basemap.responses) ? basemap.responses : [];
            const isRasterSuccess = response => response && response.status >= 200 && response.status < 300 &&
              /^image\/(?:png|jpe?g|webp)(?:;|$)/i.test(String(response.contentType || '')) && response.fixture !== true;
            if (responses.some(response => /svg/i.test(String(response.contentType || '')) || response.fixture === true))
              errors.push(`${screenshotPath}: publication evidence contains synthetic/SVG map responses`);
            const standard = responses.some(response => response.kind === 'standard' && isRasterSuccess(response));
            const labels = responses.some(response => response.kind === 'labels' && isRasterSuccess(response));
            const officialOrthophoto = responses.some(response => response.kind === 'orthophoto' && response.officialForExport === true && isRasterSuccess(response));
            const orthophotoFailure = responses.some(response => response.kind === 'orthophoto' && (response.status >= 400 || response.status === 0));
            const attribution = String(basemap.attribution || '');
            const osmAttribution = /OpenStreetMap/i.test(attribution);
            let satisfied = requirement === 'standard' ? standard && osmAttribution
              : requirement === 'orthophoto' ? officialOrthophoto && attribution.length > 0
                : requirement === 'hybrid' ? officialOrthophoto && labels && osmAttribution
                  : requirement === 'fallback' ? orthophotoFailure && standard && osmAttribution : false;
            if (!satisfied) errors.push(`${screenshotPath}: authentic ${requirement} basemap requirement is not satisfied`);
          }

          '''
          text = text.replace(marker, helper + marker, 1)
          text = replace_once(text,
              "    const expectedScreenshots = (Array.isArray(mediaManifest.assets) ? mediaManifest.assets : [])\n      .map(asset => asset && asset.path)",
              "    const manifestAssets = Array.isArray(mediaManifest.assets) ? mediaManifest.assets : [];\n"
              "    const manifestAssetsByPath = new Map(manifestAssets.map(asset => [asset && asset.path, asset]));\n"
              "    const defaultBasemapRequirement = mediaManifest.defaults && mediaManifest.defaults.publicationBasemap || 'standard';\n"
              "    const expectedScreenshots = manifestAssets\n      .map(asset => asset && asset.path)", 'index manifest basemaps')
          text = replace_once(text, "        validateLifecycle(evidence, screenshotPath, rowErrors);\n",
              "        validateLifecycle(evidence, screenshotPath, rowErrors);\n"
              "        if (options.requireAuthenticBasemap === true) {\n"
              "          const manifestAsset = manifestAssetsByPath.get(screenshotPath) || {};\n"
              "          validateAuthenticBasemap(evidence, screenshotPath, manifestAsset.basemap || defaultBasemapRequirement, rowErrors);\n"
              "        }\n", 'validate publication basemap')
          text = replace_once(text, "  const report = validate({ root: ROOT });",
              "  const report = validate({ root: ROOT, requireAuthenticBasemap: args.requireAuthenticBasemap });", 'pass authentic flag')
          write(path, text)

          path = 'scripts/validate-doc-media.js'
          text = read(path)
          marker = "function validateScreenshotEvidenceLedger(repoRoot, manifest, assets) {"
          helper = r'''function validatePublicationBasemapSidecar(sidecar, expectedRequirement, label, errors) {
            const capture = sidecar && sidecar.capture;
            const basemap = capture && capture.basemap;
            if (!capture || capture.profile !== 'publication' || !basemap || basemap.authentic !== true) {
              errors.push(`${label}: checked-in documentation media lacks authentic publication-basemap evidence`); return;
            }
            if (basemap.requirement !== expectedRequirement) errors.push(`${label}: publication basemap requirement does not match the media manifest`);
            const responses = Array.isArray(basemap.responses) ? basemap.responses : [];
            const isRasterSuccess = response => response && response.status >= 200 && response.status < 300 &&
              /^image\/(?:png|jpe?g|webp)(?:;|$)/i.test(String(response.contentType || '')) && response.fixture !== true;
            if (responses.some(response => /svg/i.test(String(response.contentType || '')) || response.fixture === true))
              errors.push(`${label}: synthetic/SVG basemap responses cannot certify checked-in documentation`);
            const standard = responses.some(response => response.kind === 'standard' && isRasterSuccess(response));
            const labels = responses.some(response => response.kind === 'labels' && isRasterSuccess(response));
            const officialOrthophoto = responses.some(response => response.kind === 'orthophoto' && response.officialForExport === true && isRasterSuccess(response));
            const orthophotoFailure = responses.some(response => response.kind === 'orthophoto' && (response.status >= 400 || response.status === 0));
            const attribution = String(basemap.attribution || '');
            const osmAttribution = /OpenStreetMap/i.test(attribution);
            let satisfied = expectedRequirement === 'standard' ? standard && osmAttribution
              : expectedRequirement === 'orthophoto' ? officialOrthophoto && attribution.length > 0
                : expectedRequirement === 'hybrid' ? officialOrthophoto && labels && osmAttribution
                  : expectedRequirement === 'fallback' ? orthophotoFailure && standard && osmAttribution : false;
            if (!satisfied) errors.push(`${label}: authentic ${expectedRequirement} basemap requirement is not satisfied`);
          }

          '''
          text = text.replace(marker, helper + marker, 1)
          text = replace_once(text, "  const expectedPaths = assets\n",
              "  const requirePublicationBasemap = manifest && manifest.defaults && manifest.defaults.requirePublicationBasemapEvidence === true;\n"
              "  const defaultBasemapRequirement = manifest && manifest.defaults && manifest.defaults.publicationBasemap || 'standard';\n"
              "  const assetsByPath = new Map(assets.map(asset => [asset && asset.path, asset]));\n"
              "  const expectedPaths = assets\n", 'doc media basemap policy')
          text = replace_once(text, "    const shot = sidecar && sidecar.screenshot || {};\n",
              "    const shot = sidecar && sidecar.screenshot || {};\n"
              "    if (requirePublicationBasemap) {\n      const asset = assetsByPath.get(entryPath) || {};\n"
              "      validatePublicationBasemapSidecar(sidecar, asset.basemap || defaultBasemapRequirement, sidecarName, errors);\n    }\n",
              'enforce checked-in publication basemap')
          write(path, text)

          package = json.loads(read('package.json'))
          scripts = package['scripts']; ordered = {}
          for key, value in scripts.items():
              ordered[key] = value
              if key == 'test:e2e':
                  ordered['test:screenshots:regression'] = 'UA_SCREENSHOT_PROFILE=regression playwright test tests/e2e/screenshots.spec.js --project=chromium'
                  ordered['generate:screenshots:publication'] = 'UA_SCREENSHOT_PROFILE=publication playwright test tests/e2e/screenshots.spec.js --project=chromium'
          package['scripts'] = ordered
          write('package.json', json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          path = '.github/workflows/generate-screenshots.yml'; text = read(path)
          text = text.replace('name: Generate Documentation Screenshots', 'name: Generate Publication Screenshots', 1)
          text = replace_once(text, '      - name: Generate screenshots\n        run: npx playwright test tests/e2e/screenshots.spec.js --project=chromium',
              '      - name: Generate authentic publication screenshots\n        run: npm run generate:screenshots:publication', 'publication workflow command')
          text = replace_once(text, '        run: npm run validate:screenshot-evidence -- --report out/qa/screenshot-evidence.json',
              '        run: npm run validate:screenshot-evidence -- --require-authentic-basemap --report out/qa/screenshot-evidence.json', 'publication gate')
          text = text.replace('name: documentation-screenshots-${{ github.sha }}', 'name: publication-screenshots-${{ github.sha }}', 1)
          write(path, text)

          path = '.github/workflows/visual-check.yml'; text = read(path)
          text = replace_once(text, '      - name: Generate screenshots\n        run: npx playwright test tests/e2e/screenshots.spec.js --project=chromium',
              '      - name: Generate deterministic regression screenshots\n        run: npm run test:screenshots:regression', 'visual regression command')
          text = text.replace('name: pr-screenshots-${{ github.event.pull_request.number }}', 'name: pr-screenshot-regression-${{ github.event.pull_request.number }}', 1)
          text = text.replace('**pr-screenshots-${{ github.event.pull_request.number }}**', '**pr-screenshot-regression-${{ github.event.pull_request.number }}**', 1)
          write(path, text)

          path = '.github/workflows/test.yml'; text = read(path)
          text = replace_once(text, '      - name: Run E2E tests\n        run: npm run test:e2e',
              '      - name: Run E2E tests with deterministic regression maps\n        env:\n          UA_SCREENSHOT_PROFILE: regression\n        run: npm run test:e2e', 'test regression profile')
          text = text.replace('name: documentation-screenshots\n', 'name: screenshot-regression\n', 1)
          text = text.replace('name: documentation-media-report\n', 'name: screenshot-regression-media-report\n', 1)
          write(path, text)

          manifest = json.loads(read('docs/media-manifest.json'))
          manifest['defaults']['requirePublicationBasemapEvidence'] = True
          manifest['defaults']['publicationBasemap'] = 'standard'
          by_path = {a['path']: a for a in manifest['assets']}
          by_path['docs/screenshots/15-export-pdf-rendered.png']['purpose'] = 'Gerenderte PDF-Kartenseite; alle Seiten, die Unfallzahl und mindestens eine Rasterkartenoperation werden geprüft.'
          by_path['docs/screenshots/21-mapmode-standard.png']['purpose'] = 'Publikationsansicht des Standardkartenmodus mit echter OpenStreetMap-Grundkarte.'
          by_path['docs/screenshots/22-mapmode-orthophoto.png'].update(purpose='Publikationsansicht mit amtlichem Orthofoto.', basemap='orthophoto')
          by_path['docs/screenshots/23-mapmode-hybrid.png'].update(purpose='Publikationsansicht mit amtlichem Orthofoto und echtem Label-Layer.', basemap='hybrid')
          by_path['docs/screenshots/24-mapmode-analysis.png'].update(purpose='Analyseansicht auf amtlichem Orthofoto.', basemap='orthophoto')
          by_path['docs/screenshots/25-mapmode-orthophoto-fallback.png'].update(purpose='Orthofoto-Ausfall mit echter OSM-Fallbackkarte.', basemap='fallback')
          write('docs/media-manifest.json', json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          path = 'docs/screenshots/README.md'; text = read(path)
          text = replace_once(text, '| 21 | `21-mapmode-standard.png` | Kartenmodus `standard` (deterministische Tile-Mocks) |',
              '| 21 | `21-mapmode-standard.png` | Kartenmodus `standard` mit echter OpenStreetMap-Grundkarte |', 'README map 21')
          text = replace_once(text, '| 22 | `22-mapmode-orthophoto.png` | Kartenmodus `orthophoto` (deterministische Orthofoto-Tiles) |',
              '| 22 | `22-mapmode-orthophoto.png` | Kartenmodus `orthophoto` mit amtlichem Orthofoto |', 'README map 22')
          text = replace_once(text, '| 23 | `23-mapmode-hybrid.png` | Kartenmodus `hybrid` (Orthofoto + Label-Overlay) |',
              '| 23 | `23-mapmode-hybrid.png` | Kartenmodus `hybrid` mit amtlichem Orthofoto und echten Labels |', 'README map 23')
          text = replace_once(text, '| 24 | `24-mapmode-analysis.png` | Kartenmodus `analysis` (Heatmap/Analyse-Overlay auf Orthofoto) |',
              '| 24 | `24-mapmode-analysis.png` | Kartenmodus `analysis` mit Heatmap auf amtlichem Orthofoto |', 'README map 24')
          old_section = '''## Deterministische Grundkarte

Für sämtliche kanonischen Screenshots (`01`–`16` und `21`–`25`) werden OSM-,
Orthofoto- und Hybrid-Label-Anfragen vor dem ersten Seitenaufruf auf die
versionierten SVG-Fixtures unter `tests/e2e/fixtures/map-tiles/` geroutet.
Damit hängen die Review-Artefakte nicht von Live-Tiles, Provider-Verfügbarkeit,
Farbbalance oder Kacheländerungen ab. Screenshot `25` verwendet dieselbe lokale
Fixture-Schicht und dokumentiert den Orthofoto-Fehlerpfad explizit.
'''
          new_section = '''## Getrennte Regressions- und Publikationsverträge

Automatische PR-/E2E-Läufe nutzen synthetische SVG-Tiles ausschließlich als
pixelstabile Regressionstests. Diese Artefakte sind keine Publikationsmedien.
Eingecheckte Dokumentationsbilder müssen aus dem Publikationsprofil stammen:
allowlist-geprüfte echte Kartenanbieter, Raster-Content-Type, Providerstatus und
sichtbare Attribution werden in jedes Evidence-Sidecar gebunden; SVG-/Fixture-
Antworten werden fail-closed abgelehnt. Nominatim und Overpass bleiben lokale,
stadtbezogene Daten-Fixtures. Screenshot 25 provoziert nur den Orthofotoausfall
und muss anschließend eine echte OSM-Fallbackkarte nachweisen.
'''
          text = replace_once(text, old_section, new_section, 'README contracts')
          write(path, text)

          path = 'tests/unit/screenshotEvidencePolicy.test.js'; text = read(path)
          text = replace_once(text, "      criteria: { city: 'Hannover', layers: ['cluster'], requireCompleteCoverage: true },\n      lifecycle,\n",
              "      criteria: { city: 'Hannover', layers: ['cluster'], requireCompleteCoverage: true },\n"
              "      capture: { profile: 'publication', basemap: { requirement: 'standard', authentic: true,\n"
              "        attribution: '© OpenStreetMap-Mitwirkende', responses: [{ kind: 'standard', provider: 'OpenStreetMap',\n"
              "          officialForExport: true, status: 200, contentType: 'image/png', fixture: false, count: 1 }] } },\n      lifecycle,\n",
              'evidence fixture')
          write(path, text)

          path = 'tests/unit/docMediaPolicy.test.js'; text = read(path)
          text = replace_once(text, "      criteria: { city: 'Teststadt', layers: ['cluster'], requireCompleteCoverage: true },\n      lifecycle: {",
              "      criteria: { city: 'Teststadt', layers: ['cluster'], requireCompleteCoverage: true },\n"
              "      capture: { profile: 'publication', basemap: { requirement: 'standard', authentic: true,\n"
              "        attribution: '© OpenStreetMap-Mitwirkende', responses: [{ kind: 'standard', provider: 'OpenStreetMap',\n"
              "          officialForExport: true, status: 200, contentType: 'image/png', fixture: false, count: 1 }] } },\n      lifecycle: {",
              'media fixture')
          text = replace_once(text, "        screenshotTarget: target,\n",
              "        screenshotTarget: target,\n        requirePublicationBasemapEvidence: true,\n        publicationBasemap: 'standard',\n", 'fixture policy')
          write(path, text)
          json.loads(read('package.json')); json.loads(read('docs/media-manifest.json'))
          PY

          rm .github/workflows/apply-authentic-publication-fix.yml
          git add .github/workflows docs/media-manifest.json docs/screenshots/README.md package.json \
            scripts/validate-doc-media.js scripts/validate-screenshot-evidence.js tests/e2e/screenshots.spec.js \
            tests/unit/docMediaPolicy.test.js tests/unit/screenshotEvidencePolicy.test.js
          git commit -m "test: separate regression and publication screenshot contracts"
          git push origin HEAD:fix/screenshot-map-context
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused policy tests
        run: npm run test:unit -- --runInBand tests/unit/screenshotEvidencePolicy.test.js tests/unit/docMediaPolicy.test.js

      - name: Build exact source commit
        run: npm run build:site

      - name: Generate authentic publication screenshots
        env:
          UA_SCREENSHOT_PROFILE: publication
          GITHUB_SHA: ${{ env.SOURCE_COMMIT }}
        run: |
          find docs/screenshots -maxdepth 1 -type f -name '*.png' -delete
          mkdir -p out/qa/screenshot-readiness
          find out/qa/screenshot-readiness -maxdepth 1 -type f -name '*.json' -delete
          npm run generate:screenshots:publication

      - name: Validate authentic screenshot evidence and media
        env:
          GITHUB_SHA: ${{ env.SOURCE_COMMIT }}
        run: |
          npm run validate:screenshot-evidence -- --require-authentic-basemap --report out/qa/screenshot-evidence.json
          npm run validate:media -- --candidate-screenshots --report out/qa/documentation-media.json

      - name: Adopt authentic evidence and update QA record
        env:
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          rm -rf qa/screenshot-evidence/readiness
          mkdir -p qa/screenshot-evidence/readiness
          cp out/qa/screenshot-readiness/*.json qa/screenshot-evidence/readiness/
          cp out/qa/screenshot-evidence.json qa/screenshot-evidence/summary.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          root = Path('.'); source_commit = os.environ['SOURCE_COMMIT']; run_id = int(os.environ['WORKFLOW_RUN_ID'])
          sha = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          summary_path = root / 'qa/screenshot-evidence/summary.json'; summary = json.loads(summary_path.read_text())
          readiness = sorted((root / 'qa/screenshot-evidence/readiness').glob('*.json'))
          build = json.loads((root / '_site/build-manifest.json').read_text())
          archive_path = root / 'out/qa/publication-screenshots-reviewed.zip'
          with zipfile.ZipFile(archive_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for p in sorted((root / 'docs/screenshots').glob('*.png')): archive.write(p, p.as_posix())
              for p in readiness: archive.write(p, p.as_posix())
              archive.write(summary_path, summary_path.as_posix()); archive.write(root / '_site/build-manifest.json', '_site/build-manifest.json')
          entries = ''.join(f"{e['path']}\t{e['sha256']}\t{e['bytes']}\n" for e in summary['screenshots'])
          rentries = ''.join(f"{p.name}\t{sha(p)}\t{p.stat().st_size}\n" for p in readiness)
          provenance = {'schemaVersion': 1, 'purpose': 'Authentic publication screenshot binding.',
            'source': {'artifactName': f'publication-screenshots-reviewed-{run_id}', 'artifactId': run_id,
              'artifactZipSha256': sha(archive_path), 'evidenceRevision': source_commit, 'evidenceStatus': 'valid',
              'evidenceCount': len(summary['screenshots'])},
            'build': {'manifestSha256': summary['build']['sha256'], 'fingerprint': build['fingerprint'],
              'applicationFingerprint': build['application']['fingerprint'], 'dataFingerprint': build['data']['fingerprint']},
            'summary': {'path': 'qa/screenshot-evidence/summary.json', 'sha256': sha(summary_path),
              'entriesSha256': hashlib.sha256(entries.encode()).hexdigest()},
            'readiness': {'directory': 'qa/screenshot-evidence/readiness', 'files': len(readiness),
              'bytes': sum(p.stat().st_size for p in readiness), 'entriesSha256': hashlib.sha256(rentries.encode()).hexdigest()}}
          (root / 'qa/screenshot-evidence/provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          total = sum(p.stat().st_size for p in (root / 'docs/screenshots').glob('*.png'))
          (root / 'docs/media-qa-2026-07-19.md').write_text(
            '# Medien-QA: authentische Publikations-Screenshots\n\n'
            f'Quellcommit `{source_commit}`, Workflow-Run `{run_id}`, 21/21 Sidecars gültig.\n\n'
            'Automatische Screenshot-Artefakte bleiben synthetische Regressionstests. '
            'Eingecheckte Medien weisen echte Rasterkarten, Providerstatus und Attribution nach. '
            'Der PDF-Test lässt die Karte aktiviert und prüft alle Seiten.\n\n'
            f'Screenshots gesamt: {total} Byte.\n')
          PY
          npm run validate:media
          git add docs/screenshots qa/screenshot-evidence docs/media-qa-2026-07-19.md
          git commit -m "docs: replace synthetic maps with authentic publication screenshots"
          git push origin HEAD:fix/screenshot-map-context

      - name: Upload authentic candidate
        uses: actions/upload-artifact@v7
        with:
          name: publication-screenshots-reviewed-${{ github.run_id }}
          path: |
            out/qa/publication-screenshots-reviewed.zip
            docs/screenshots/*.png
            qa/screenshot-evidence/
            docs/media-qa-2026-07-19.md
          if-no-files-found: error
          retention-days: 30
