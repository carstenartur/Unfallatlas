async function attachCapture(path,capture){const fs=await import('node:fs/promises'),p=await import('node:path'),file=p.resolve(process.cwd(),'out/qa/screenshot-readiness',`${p.basename(path,p.extname(path))}.json`),sidecar=JSON.parse(await fs.readFile(file,'utf8'));sidecar.capture=capture;await fs.writeFile(file,`${JSON.stringify(sidecar,null,2)}\n`);}
async function captureDocumentationScreenshot(page,options){const snapshot=await captureDataScreenshot(page,options);await attachCapture(options.path,await basemapCapture(page,options.basemap||'standard',options.path));return snapshot;}
async function setupScreenshotNetwork(page,{orthophotoAvailable=true}={}){const state={responses:[],unexpected:[]};SCREENSHOT_NETWORK.set(page,state);page.on('response',response=>{const m=classifyMapResource(response.url());if(m)state.responses.push({...m,status:response.status(),contentType:response.headers()['content-type']||'',fixture:SCREENSHOT_PROFILE==='regression'});});await page.route(/^https:\/\//,async route=>{const request=route.request(),u=new URL(request.url()),m=classifyMapResource(request.url()),n=classifyNominatimFixture(request.url()),o=classifyOverpassFixture(request.url(),request.postDataBuffer()||request.postData());if(n){await route.fulfill({status:200,contentType:'application/json',body:DETERMINISTIC_EXTERNAL_DATA.nominatim[n]});return;}if(o){await route.fulfill({status:200,contentType:'application/json',body:DETERMINISTIC_EXTERNAL_DATA.overpass[o]});return;}if(u.hostname==='pdfjs-test-cdn'){await route.fallback();return;}if(m){if(!orthophotoAvailable&&m.kind==='orthophoto'){await route.fulfill({status:503,contentType:'text/plain',body:'Orthophoto unavailable'});return;}if(SCREENSHOT_PROFILE==='regression'){const body=m.kind==='standard'?DETERMINISTIC_MAP_TILES.standard:m.kind==='labels'?DETERMINISTIC_MAP_TILES.labels:DETERMINISTIC_MAP_TILES.orthophoto;await route.fulfill({status:200,contentType:'image/svg+xml',body});return;}await route.continue();return;}state.unexpected.push(`${request.method()} ${request.url()}`);await route.abort('blockedbyclient');});}
function assertNoUnexpectedExternalRequests(page){const x=(SCREENSHOT_NETWORK.get(page)||{unexpected:[]}).unexpected;if(x.length)throw new Error(`Unapproved external requests:\n${x.join('\n')}`);}

