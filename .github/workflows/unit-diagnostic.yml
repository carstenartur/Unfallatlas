name: Unit diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run unit tests with durable log
        shell: bash
        run: |
          set +e
          npm run test:unit -- --runInBand 2>&1 | tee unit-test.log
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-diagnostics-${{ github.event.pull_request.number }}
          path: unit-test.log
          if-no-files-found: error
          retention-days: 14
