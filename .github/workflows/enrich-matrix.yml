name: Enrich GeoJSONs (per-city matrix)

on:
  workflow_dispatch:
    inputs:
      max_parallel:
        description: 'Maximum concurrent city jobs'
        type: string
        default: '4'
      force:
        description: 'Rebuild OSM, slope and traffic producer data'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: enrich-context-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  list-cities:
    runs-on: ubuntu-latest
    outputs:
      cities: ${{ steps.list.outputs.cities }}
      smoke_city: ${{ steps.list.outputs.smoke_city }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: list
        name: Build city matrix
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(node - <<'NODE'
          const { readCitiesFile, slugify } = require('./scripts/lib/static-data-validation');
          const cities = readCitiesFile('cities.txt').map(name => ({ name, slug: slugify(name) }));
          process.stdout.write(JSON.stringify(cities));
          NODE
          )
          SMOKE_CITY=$(node -e "const c=JSON.parse(process.argv[1]); process.stdout.write(c[0].name)" "$JSON")
          echo "cities=$JSON" >> "$GITHUB_OUTPUT"
          echo "smoke_city=$SMOKE_CITY" >> "$GITHUB_OUTPUT"

  produce-city:
    needs: list-cities
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        city: ${{ fromJSON(needs.list-cities.outputs.cities) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore producer cache for ${{ matrix.city.slug }}
        uses: actions/cache@v6
        with:
          path: .enrichment-cache
          # Per-run suffix allows actions/cache to save producer updates even
          # when an earlier compatible cache was restored.
          key: context-matrix-${{ runner.os }}-${{ matrix.city.slug }}-${{ hashFiles('scripts/producers/*.js', 'scripts/generate-context-city.js') }}-${{ github.run_id }}
          restore-keys: |
            context-matrix-${{ runner.os }}-${{ matrix.city.slug }}-${{ hashFiles('scripts/producers/*.js', 'scripts/generate-context-city.js') }}-
            context-matrix-${{ runner.os }}-${{ matrix.city.slug }}-
          save-always: true

      - name: Generate verified context data for ${{ matrix.city.name }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --city "${{ matrix.city.name }}"
            --input-dir out
            --output-dir .build/generated/out
          )
          if [[ "${{ inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          node scripts/generate-context-city.js "${ARGS[@]}"

      - name: Upload verified city output
        uses: actions/upload-artifact@v7
        with:
          name: context-output-${{ matrix.city.slug }}
          path: .build/generated/out/
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: [list-cities, produce-city]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Download all verified city outputs
        uses: actions/download-artifact@v8
        with:
          pattern: context-output-*
          path: .artifacts
          merge-multiple: true

      - name: Install matrix output into checkout
        shell: bash
        run: |
          set -euo pipefail
          test -d .artifacts
          rsync -a .artifacts/ out/

      - name: Validate complete result
        env:
          UNFALLATLAS_DATA_MODE: gzip-only
        run: |
          node scripts/gzip-static-data.js --check --gzip-only
          node scripts/check-context-datasets.js
          node scripts/check-slope-plausibility.js
          node scripts/check-data-paths.js --gzip-only --min-features 10

      - name: Install integration-test dependencies
        run: npm ci

      - name: Verify matrix output in the real web page
        env:
          RUN_TESTCONTAINERS: '1'
          CONTEXT_E2E_REQUIRE_SHIPPED: '1'
          CONTEXT_E2E_CITY: ${{ needs.list-cities.outputs.smoke_city }}
        run: >-
          npm run test:integration:tc -- --runInBand
          -t "renders slope and traffic context for a real city in the browser"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- out/
          if git diff --cached --quiet; then
            echo "No context-data changes."
            exit 0
          fi
          git commit -m "Regenerate all verified context data"
          git push origin HEAD:${{ github.ref_name }}
