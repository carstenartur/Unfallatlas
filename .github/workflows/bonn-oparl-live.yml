name: Bonn political context live QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bonn-oparl-live.yml'
      - 'pom.xml'
      - 'scripts/qa-bonn-political-context-live.js'
      - 'scripts/lib/bonn-live-cache-evidence.js'
      - 'tests/unit/bonnLiveCacheEvidence.test.js'
      - 'tests/unit/bonnOparlAcceptanceContract.test.js'
      - 'tests/unit/bonnPoliticalContextLive.test.js'
      - 'js/ua.ris-catalogue.js'
      - 'server/political-context/providers/bonnAllrisProvider.js'
      - 'server/political-context/providers/bonnOparlCatalogueRecord.js'
      - 'server/political-context/providers/bonnOparlClient.js'
      - 'server/political-context/providers/bonnOparlHttp.js'
      - 'server/political-context/providers/_portalUtils.js'
      - 'server/political-context/services/portalSearchService.js'
      - 'server/political-context/services/portalNormalizationService.js'
      - 'server/political-context/services/risSnapshot.js'
      - 'server/political-context/services/risSnapshotSearch.js'
      - 'server/political-context/services/searchVariantBuilder.js'
      - 'server/political-context/schemas/politicalReferenceSearchResult.schema.json'
      - 'server/ai/proposalBriefValueAdd.js'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read

concurrency:
  group: bonn-political-context-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Official Bonn OParl / RIS evidence path
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          problem-matcher: true
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run the Maven-owned public OParl acceptance
        env:
          PORTAL_SEARCH_TIMEOUT_MS: '20000'
          BONN_OPARL_MAX_PAGES: '300'
          BONN_OPARL_PAGE_LIMIT: '100'
          BONN_OPARL_LOOKBACK_YEARS: '12'
        # The profile enables exactly one OParl test; HTML access checks are excluded.
        run: mvn -B -ntp -N test -Pbonn-oparl-live "-Dbonn.oparl.scope=${{ github.event_name == 'pull_request' && 'snapshot' || 'archive' }}"

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bonn-political-context-live-evidence
          path: |
            out/qa/bonn-political-context-live.json
            out/qa/bonn-ris-snapshot-live.json
          if-no-files-found: error
          retention-days: 14
