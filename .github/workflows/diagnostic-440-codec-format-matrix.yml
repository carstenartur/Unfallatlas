name: Diagnostic aligned WebP evidence for 440

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  unit:
    if: github.head_ref == 'diagnostic/440-codec-format-matrix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx jest --runInBand tests/unit/videoSourceEvidence.test.js tests/unit/videoExportEncodingContract.test.js

  webp-format:
    if: github.head_ref == 'diagnostic/440-codec-format-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: webp-body
            pattern: 'returns valid webp export \(body:webp\)'
          - id: webp-query
            pattern: 'returns valid webp export \(query:webp\)'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/check-playwright-docker-version.js
      - run: npm ci
      - name: Apply diagnostic-only q70 and aligned 3fps source sampling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          implementation = Path('server/video-export.js')
          source = implementation.read_text()
          old = 'const WEBP_QUALITY = 60;'
          new = 'const WEBP_QUALITY = 70;'
          if source.count(old) != 1:
              raise SystemExit('WebP quality insertion point not found exactly once')
          implementation.write_text(source.replace(old, new))

          evidence = Path('server/video-source-evidence.js')
          source = evidence.read_text()
          old = 'const SOURCE_INSPECTION_FPS = 2;'
          new = 'const SOURCE_INSPECTION_FPS = 3;'
          if source.count(old) != 1:
              raise SystemExit('source inspection fps insertion point not found exactly once')
          evidence.write_text(source.replace(old, new))
          PY
      - name: Expose structured codec response in diagnostic log
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/integration/videoExport.testcontainers.test.js')
          s = p.read_text()
          old = "    const { status, contentType, headers, body } = await postExportVideo(handle.baseUrl, request);\n    expect(status).toBe(200);"
          new = "    const { status, contentType, headers, body } = await postExportVideo(handle.baseUrl, request);\n    if (status !== 200) console.error('ALIGNED_WEBP_DIAGNOSTIC_BODY=' + body.toString('utf8'));\n    else console.error('ALIGNED_WEBP_BYTES=' + body.length);\n    expect(status).toBe(200);"
          if s.count(old) != 1:
              raise SystemExit('diagnostic insertion point not found exactly once')
          p.write_text(s.replace(old, new))
          PY
      - name: Run focused real-container WebP test
        id: codec
        continue-on-error: true
        shell: bash
        env:
          RUN_TESTCONTAINERS: '1'
          TEST_PATTERN: ${{ matrix.pattern }}
        run: |
          set -o pipefail
          NODE_OPTIONS=--experimental-vm-modules npx jest \
            --config=tests/integration/jest.testcontainers.config.js \
            --runInBand \
            --testNamePattern="$TEST_PATTERN" \
            2>&1 | tee "webp-${{ matrix.id }}.log"
      - name: Upload focused WebP log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aligned-webp-${{ matrix.id }}-log
          path: webp-${{ matrix.id }}.log
          if-no-files-found: error
      - name: Enforce WebP result
        if: steps.codec.outcome != 'success'
        run: exit 1
