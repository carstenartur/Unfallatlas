name: Apply corrected PR 641 review fixes

on:
  push:
    branches:
      - fix/bonn-oparl-provider-622
    paths:
      - '.github/workflows/pr641-final-review-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Fix redirect evidence and OParl business dates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bonn-oparl-provider-622
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply exact source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              value = path.read_text(encoding='utf-8')
              count = value.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}')
              path.write_text(value.replace(old, new, expected), encoding='utf-8')

          discovery = Path('scripts/qa-bonn-oparl-catalogue-discovery.js')
          replace_exact(
              discovery,
              'function requestText(urlValue, options = {}, redirectCount = 0) {',
              'function requestText(urlValue, options = {}, redirectCount = 0, trace = null) {'
          )
          replace_exact(
              discovery,
              """  const requestedUrl = new URL(urlValue);
          const transport = requestedUrl.protocol === 'http:' ? http : https;
          return new Promise((resolve, reject) => {
          """,
              """  const requestedUrl = new URL(urlValue);
          const transport = requestedUrl.protocol === 'http:' ? http : https;
          const requestTrace = trace || {
            requestedUrl: requestedUrl.href,
            redirectChain: [],
          };
          return new Promise((resolve, reject) => {
          """
          )
          replace_exact(
              discovery,
              """        requestText(new URL(response.headers.location, requestedUrl).href, options, redirectCount + 1)
                  .then(resolve, finishReject);
          """,
              """        const nextUrl = new URL(response.headers.location, requestedUrl).href;
                  const nextTrace = {
                    requestedUrl: requestTrace.requestedUrl,
                    redirectChain: [
                      ...requestTrace.redirectChain,
                      { status, from: requestedUrl.href, to: nextUrl },
                    ],
                  };
                  requestText(nextUrl, options, redirectCount + 1, nextTrace)
                    .then(resolve, finishReject);
          """
          )
          replace_exact(
              discovery,
              """          requestedUrl: requestedUrl.href,
                    finalUrl: requestedUrl.href,
                    status,
          """,
              """          requestedUrl: requestTrace.requestedUrl,
                    finalUrl: requestedUrl.href,
                    redirectChain: requestTrace.redirectChain,
                    status,
          """
          )

          value = discovery.read_text(encoding='utf-8')
          tail = value.index('main().catch(error => {')
          replacement_tail = """module.exports = {
            requestText,
            parseJson,
            normalizeUrl,
            collectJsonUrls,
            collectHtmlUrls,
            isProbeCandidate,
            responseEvidence,
          };

          if (require.main === module) {
            main().catch(error => {
              fs.mkdirSync(path.dirname(OUTPUT), { recursive: true });
              fs.writeFileSync(OUTPUT, JSON.stringify({
                schemaVersion: 'unfallwerkbank.bonnOparlCatalogueDiscovery.v1',
                completedAt: new Date().toISOString(),
                fatalError: safeError(error),
              }, null, 2) + '\\n', 'utf8');
              console.error('[bonn-oparl-catalogue-discovery] fatal:', error);
              process.exitCode = 1;
            });
          }
          """
          discovery.write_text(value[:tail] + replacement_tail, encoding='utf-8')

          replace_exact(
              Path('server/political-context/providers/bonnOparlClient.js'),
              "    date: paper.date || (paper.created ? String(paper.created).slice(0, 10) : null),",
              "    date: paper.date || (paper.modified ? String(paper.modified).slice(0, 10) : null),"
          )

          provider_test = Path('tests/unit/bonnOparlProvider.test.js')
          anchor = "  test('rejects cyclic pagination instead of silently looping', async () => {"
          regression = """  test('uses business date or modified, never Bonn placeholder created timestamps', () => {
            const matchedTerm = { value: 'Adenauerallee', normalized: 'adenauerallee' };
            const base = {
              name: 'Radverkehr in der Adenauerallee',
              web: 'https://www.bonn.sitzung-online.de/public/vo020?VOLFDNR=77',
            };

            expect(client.mapPaper({
              ...base,
              date: '2026-02-01',
              modified: '2026-03-04T10:20:30Z',
              created: '1900-01-01T00:00:00Z',
            }, matchedTerm).date).toBe('2026-02-01');

            expect(client.mapPaper({
              ...base,
              modified: '2026-03-04T10:20:30Z',
              created: '1900-01-01T00:00:00Z',
            }, matchedTerm).date).toBe('2026-03-04');

            expect(client.mapPaper({
              ...base,
              created: '1900-01-01T00:00:00Z',
            }, matchedTerm).date).toBeNull();
          });

          """
          replace_exact(provider_test, anchor, regression + anchor)
          PY

          cat > tests/unit/bonnOparlCatalogueDiscovery.test.js <<'EOF'
          'use strict';

          const http = require('http');
          const { requestText } = require('../../scripts/qa-bonn-oparl-catalogue-discovery.js');

          describe('Bonn OParl catalogue discovery redirect evidence', () => {
            test('retains the original request, final URL and every redirect hop', async () => {
              const server = http.createServer((request, response) => {
                if (request.url === '/start') {
                  response.writeHead(302, { Location: '/middle' });
                  response.end();
                  return;
                }
                if (request.url === '/middle') {
                  response.writeHead(301, { Location: '/final?ok=1' });
                  response.end();
                  return;
                }
                response.writeHead(200, { 'Content-Type': 'application/json' });
                response.end('{"ok":true}');
              });
              await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
              const { port } = server.address();
              const origin = `http://127.0.0.1:${port}`;

              try {
                const result = await requestText(`${origin}/start`, {
                  timeoutMs: 5_000,
                  maxBytes: 1_024,
                });
                expect(result.requestedUrl).toBe(`${origin}/start`);
                expect(result.finalUrl).toBe(`${origin}/final?ok=1`);
                expect(result.redirectChain).toEqual([
                  { status: 302, from: `${origin}/start`, to: `${origin}/middle` },
                  { status: 301, from: `${origin}/middle`, to: `${origin}/final?ok=1` },
                ]);
                expect(result.status).toBe(200);
                expect(JSON.parse(result.text)).toEqual({ ok: true });
              } finally {
                await new Promise((resolve, reject) => server.close(error =>
                  error ? reject(error) : resolve()
                ));
              }
            });
          });
          EOF
          sed -i 's/^          //' tests/unit/bonnOparlCatalogueDiscovery.test.js

          node --check scripts/qa-bonn-oparl-catalogue-discovery.js
          node --check server/political-context/providers/bonnOparlClient.js
          node --check tests/unit/bonnOparlCatalogueDiscovery.test.js
          node --check tests/unit/bonnOparlProvider.test.js
          git diff --check
          mvn -B -ntp test

      - name: Commit verified changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Unfallwerkbank CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            scripts/qa-bonn-oparl-catalogue-discovery.js \
            server/political-context/providers/bonnOparlClient.js \
            tests/unit/bonnOparlCatalogueDiscovery.test.js \
            tests/unit/bonnOparlProvider.test.js
          git rm .github/workflows/pr641-final-review-fix.yml

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/pr641-final-review-fix.yml
            scripts/qa-bonn-oparl-catalogue-discovery.js
            server/political-context/providers/bonnOparlClient.js
            tests/unit/bonnOparlCatalogueDiscovery.test.js
            tests/unit/bonnOparlProvider.test.js
          )
          [[ "${changed[*]}" == "${expected[*]}" ]] || {
            printf 'Unexpected staged paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          }

          git diff --cached --check
          git commit -m 'fix: preserve Bonn redirect provenance and business dates'
          git push origin HEAD:fix/bonn-oparl-provider-622
