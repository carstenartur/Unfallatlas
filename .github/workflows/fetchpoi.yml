name: Fetch POIs for cities.txt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-pois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Fetch POIs for all cities (skip if already present)
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "cities.txt" ]]; then
            echo "cities.txt missing"
            exit 2
          fi

          # === HIER anpassen: Pfad zu deinem Script ===
          POI_SCRIPT="./fetch_poi_osm.sh"
          # z.B. wenn es woanders liegt:
          # POI_SCRIPT="./scripts/fetch_poi_osm.sh"

          if [[ ! -f "$POI_SCRIPT" ]]; then
            echo "POI script not found: $POI_SCRIPT"
            exit 2
          fi
          chmod +x "$POI_SCRIPT"

          mkdir -p out

          slug() {
            # exakt wie in deinem Script
            echo "$1" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/ä/ae/g; s/ö/oe/g; s/ü/ue/g; s/ß/ss/g' \
              | sed -E 's/[^a-z0-9]+/_/g; s/^_+|_+$//g'
          }

          # Read cities (1 per line), ignore blanks and comments
          mapfile -t CITIES < <(
            sed -e 's/\r$//' -e 's/#.*$//' -e 's/^[[:space:]]*//;s/[[:space:]]*$//' cities.txt \
            | awk 'NF'
          )

          if (( ${#CITIES[@]} == 0 )); then
            echo "No cities found in cities.txt"
            exit 2
          fi

          echo "Cities (${#CITIES[@]}):"
          printf ' - %s\n' "${CITIES[@]}"

          for CITY in "${CITIES[@]}"; do
            CITY_SLUG="$(slug "$CITY")"
            OUTFILE="out/poi_${CITY_SLUG}.geojson"

            # Skip if either the raw or the already-normalized .gz file exists
            if [[ -f "$OUTFILE" || -f "${OUTFILE}.gz" ]]; then
              echo "SKIP (exists): $CITY -> $OUTFILE[.gz]"
              continue
            fi

            echo "RUN: $CITY -> $OUTFILE"
            "$POI_SCRIPT" "$CITY"

            # optional: etwas schonender ggü. Nominatim/Overpass
            sleep 1
          done

      - name: Validate POI GeoJSON outputs (basic)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, gzip, json, sys
          raw_files = sorted(glob.glob("out/poi_*.geojson"))
          gz_files  = sorted(glob.glob("out/poi_*.geojson.gz"))
          files = raw_files + gz_files
          if not files:
            print("No POI geojson files found (out/poi_*.geojson[.gz])")
            sys.exit(2)
          bad = []
          for f in files:
            try:
              opener = gzip.open if f.endswith('.gz') else open
              with opener(f, "rt", encoding="utf-8") as fp:
                j = json.load(fp)
              if j.get("type") != "FeatureCollection":
                raise ValueError("Not a FeatureCollection")
              if "features" not in j:
                raise ValueError("Missing features")
            except Exception as e:
              bad.append((f, str(e)))
          if bad:
            print("Invalid GeoJSON:")
            for f,e in bad:
              print(" -", f, "->", e)
            sys.exit(2)
          print("POI GeoJSON OK:", len(files))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Normalize POI artifacts to gzip-only
        run: node scripts/gzip-static-data.js --replace-raw --summary-json out/gzip-summary.json

      - name: Verify gzip-only artifact invariants
        run: node scripts/gzip-static-data.js --check --gzip-only

      - name: Commit & Push changes
        shell: bash
        run: |
          set -euo pipefail
          git add out/poi_*.geojson.gz out/gzip-summary.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update POI GeoJSONs (schools/kindergartens) for cities.txt"
          git push origin HEAD:${{ github.ref_name }}