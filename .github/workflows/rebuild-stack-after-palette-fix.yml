name: One-shot rebuild QA stack after palette fix

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rebuild:
    if: startsWith(github.head_ref, 'automation/rebuild-stack-after-palette-fix-trigger')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild reviewed stack with merged palette contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/rebuild-stack-after-palette-fix
          git show origin/automation/rebuild-stack-after-palette-fix:scripts/rebuild-stack-after-palette-fix.sh > /tmp/rebuild-stack-after-palette-fix.sh
          bash -n /tmp/rebuild-stack-after-palette-fix.sh
          bash /tmp/rebuild-stack-after-palette-fix.sh
