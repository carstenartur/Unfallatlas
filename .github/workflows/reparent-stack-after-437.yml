name: One-shot reparent stack after PR 437

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  reparent:
    if: startsWith(github.head_ref, 'automation/reparent-stack-after-437-trigger')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Load and execute reviewed reparenting script
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin automation/reparent-stack-after-437
          git show origin/automation/reparent-stack-after-437:scripts/reparent-stack-after-437.sh > /tmp/reparent-stack-after-437.sh
          bash -n /tmp/reparent-stack-after-437.sh
          set +e
          bash /tmp/reparent-stack-after-437.sh 2>&1 | tee /tmp/reparent.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## Exact stack reparenting failure'
              echo
              echo '```text'
              tail -n 180 /tmp/reparent.log
              echo '```'
            } > /tmp/reparent-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/reparent-comment.md
          fi
          exit "$status"
