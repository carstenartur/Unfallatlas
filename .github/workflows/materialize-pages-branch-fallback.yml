name: Materialize verified branch Pages fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-pages-branch-fallback.yml'

permissions:
  contents: write

concurrency:
  group: materialize-pages-branch-fallback
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Generate source-only fallback and harden deployment contracts
        run: |
          node <<'NODE'
          'use strict';

          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const read = relative => fs.readFileSync(path.join(root, relative), 'utf8');
          const write = (relative, content) => {
            const absolute = path.join(root, relative);
            fs.mkdirSync(path.dirname(absolute), { recursive: true });
            fs.writeFileSync(absolute, content);
          };
          const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');
          const dataUri = relative =>
            `data:image/png;base64,${fs.readFileSync(path.join(root, relative)).toString('base64')}`;

          const lock = JSON.parse(read('package-lock.json'));
          const leafletVersion = lock.packages['node_modules/leaflet'].version;
          const clusterVersion = lock.packages['node_modules/leaflet.markercluster'].version;
          const leafletJs = read('node_modules/leaflet/dist/leaflet.js');
          const clusterJs = read('node_modules/leaflet.markercluster/dist/leaflet.markercluster.js');
          const vendorSource = `${leafletJs}\n;\n${clusterJs}\n`;

          let publicCss = read('node_modules/leaflet/dist/leaflet.css');
          for (const image of ['layers.png', 'layers-2x.png', 'marker-icon.png']) {
            const uri = dataUri(`node_modules/leaflet/dist/images/${image}`);
            publicCss = publicCss.replaceAll(`url(images/${image})`, `url(${uri})`);
          }
          publicCss += `\n${read('node_modules/leaflet.markercluster/dist/MarkerCluster.css')}\n`;
          publicCss += `${read('node_modules/leaflet.markercluster/dist/MarkerCluster.Default.css')}\n`;

          fs.rmSync(path.join(root, 'pages-fallback'), { recursive: true, force: true });
          fs.mkdirSync(path.join(root, 'pages-fallback'), { recursive: true });

          write(
            'pages-fallback/vendor-style.js',
            `(() => {\n  'use strict';\n  if (document.querySelector('style[data-ua-pages-fallback]')) return;\n  const style = document.createElement('style');\n  style.dataset.uaPagesFallback = '1';\n  style.textContent = ${JSON.stringify(publicCss)};\n  document.head.appendChild(style);\n})();\n`
          );

          const chunkSize = 45000;
          const partFiles = [];
          for (let offset = 0, index = 0; offset < vendorSource.length; offset += chunkSize, index += 1) {
            const chunk = vendorSource.slice(offset, offset + chunkSize);
            const filename = `vendor-source-${String(index + 1).padStart(2, '0')}.js`;
            partFiles.push(filename);
            const statement = index === 0
              ? `window.__UA_PAGES_VENDOR_SOURCE__ = [${JSON.stringify(chunk)}];\n`
              : `window.__UA_PAGES_VENDOR_SOURCE__.push(${JSON.stringify(chunk)});\n`;
            write(`pages-fallback/${filename}`, statement);
          }

          const iconOptions = {
            iconUrl: dataUri('node_modules/leaflet/dist/images/marker-icon.png'),
            iconRetinaUrl: dataUri('node_modules/leaflet/dist/images/marker-icon-2x.png'),
            shadowUrl: dataUri('node_modules/leaflet/dist/images/marker-shadow.png'),
          };
          write(
            'pages-fallback/vendor-runtime.js',
            `(() => {\n  'use strict';\n  const parts = window.__UA_PAGES_VENDOR_SOURCE__;\n  if (!Array.isArray(parts) || parts.length !== ${partFiles.length}) {\n    throw new Error('Incomplete checked-in Pages vendor fallback');\n  }\n  (0, eval)(parts.join(''));\n  delete window.__UA_PAGES_VENDOR_SOURCE__;\n  if (!window.L || typeof window.L.map !== 'function' || typeof window.L.markerClusterGroup !== 'function') {\n    throw new Error('Checked-in Pages vendor fallback did not initialise Leaflet');\n  }\n  window.L.Icon.Default.mergeOptions(${JSON.stringify(iconOptions, null, 2)});\n})();\n`
          );

          write('pages-fallback/LICENSE.leaflet.txt', read('node_modules/leaflet/LICENSE'));
          write(
            'pages-fallback/LICENSE.leaflet-markercluster.txt',
            read('node_modules/leaflet.markercluster/MIT-LICENCE.txt')
          );
          write(
            'pages-fallback/README.md',
            `# Source-only GitHub Pages fallback\n\n` +
            `This directory is used only when repository settings still publish the checked-in branch root instead of the validated GitHub Actions artifact. Canonical builds deliberately do not copy this directory.\n\n` +
            `- Leaflet ${leafletVersion} (BSD-2-Clause)\n` +
            `- Leaflet.markercluster ${clusterVersion} (MIT)\n` +
            `- Source SHA-256: \`${sha256(vendorSource)}\`\n` +
            `- CSS SHA-256: \`${sha256(publicCss)}\`\n\n` +
            `The bytes are generated only from the integrity-pinned packages installed by \`npm ci\`.\n`
          );

          const profileId = 'public-preview-core-v1';
          const fallbackScripts = [
            'pages-fallback/vendor-style.js',
            ...partFiles.map(file => `pages-fallback/${file}`),
            'pages-fallback/vendor-runtime.js',
          ];
          const writeCalls = fallbackScripts
            .map(src => `    writeTag('<script src="${src}?v=2026-07-24"><\\/script>');`)
            .join('\n');
          const vendorBootstrap = `(() => {\n  'use strict';\n\n  const PROFILE_ID = '${profileId}';\n  const profileMeta = document.querySelector(\n    \`meta[name="unfallwerkbank:distribution-profile"][content="\${PROFILE_ID}"]\`\n  );\n  const githubPagesHost = /(?:^|\\\\.)github\\\\.io$/i.test(String(location.hostname || ''));\n  const publicMode = Boolean(profileMeta || githubPagesHost);\n\n  window.__UA_PUBLIC_VENDOR_MODE__ = publicMode;\n  window.__UA_BRANCH_PAGES_FALLBACK__ = Boolean(githubPagesHost && !profileMeta);\n\n  function writeTag(value) { document.write(value); }\n\n  if (window.__UA_BRANCH_PAGES_FALLBACK__) {\n    writeTag(\`<meta name="unfallwerkbank:distribution-profile" content="\${PROFILE_ID}">\`);\n    document.title = 'Unfallwerkbank – öffentliche Kernvorschau';\n${writeCalls}\n    return;\n  }\n\n  writeTag('<link rel="stylesheet" href="vendor/leaflet/leaflet.css">');\n  writeTag('<script src="vendor/leaflet/leaflet.js"><\\/script>');\n  writeTag('<link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.css">');\n  writeTag('<link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.Default.css">');\n  writeTag('<script src="vendor/leaflet.markercluster/leaflet.markercluster.js"><\\/script>');\n  if (publicMode) return;\n  writeTag('<script src="vendor/leaflet.heat/leaflet-heat.js"><\\/script>');\n  writeTag('<link rel="stylesheet" href="vendor/leaflet-draw/leaflet.draw.css">');\n  writeTag('<script src="vendor/leaflet-draw/leaflet.draw.js"><\\/script>');\n  writeTag('<script src="vendor/leaflet-image/leaflet-image.js"><\\/script>');\n})();\n`;
          write('js/ua.vendor_bootstrap.js', vendorBootstrap);

          const htmlPath = path.join(root, 'werkbank_v2.html');
          let html = fs.readFileSync(htmlPath, 'utf8');
          const vendorStart = html.indexOf('  <!-- Browser dependencies are pinned');
          const vendorEnd = html.indexOf('  <!-- Document Export Libraries', vendorStart);
          if (vendorStart < 0 || vendorEnd < 0) throw new Error('Cannot locate canonical vendor block');
          html = html.slice(0, vendorStart) +
            '  <!-- Runtime vendor selection: full build, validated public profile, or source-only Pages fallback. -->\n' +
            '  <script src="js/ua.vendor_bootstrap.js?v=2026-07-24"></script>\n\n' +
            html.slice(vendorEnd);

          const appMarker =
            '  <script src="js/ua.tour.js?v=2026-07-19"></script>\n' +
            '  <script src="js/ua.app_v2.js?v=2026-07-19"></script>';
          const appReplacement =
            '  <script src="js/ua.tour.js?v=2026-07-19"></script>\n' +
            '  <script>\n' +
            '    if (window.__UA_BRANCH_PAGES_FALLBACK__) {\n' +
            "      document.write('<script src=\"' + 'js/ua.public-' + 'preview.js?v=branch-fallback-1' + '\"><\\/script>');\n" +
            '    }\n' +
            '  </script>\n' +
            '  <script src="js/ua.app_v2.js?v=2026-07-19"></script>';
          if (!html.includes(appMarker)) throw new Error('Cannot locate application insertion point');
          html = html.replace(appMarker, appReplacement);
          fs.writeFileSync(htmlPath, html);

          const applicationFingerprint = sha256(
            vendorSource + publicCss + vendorBootstrap + html
          );
          write(
            'build-manifest.json',
            `${JSON.stringify({
              schemaVersion: 1,
              buildFingerprint: applicationFingerprint,
              applicationFingerprint,
              dataFingerprint: sha256(read('cities.txt')),
              distribution: {
                profile: profileId,
                publicPreview: true,
                branchFallback: true,
              },
            }, null, 2)}\n`
          );
          write('.nojekyll', '');

          const inspectStep = `      - name: Inspect Pages source mode\n        env:\n          GH_TOKEN: \${{ github.token }}\n        run: |\n          set -euo pipefail\n          build_type="$(gh api "repos/\${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || printf unknown)"\n          echo "Pages build_type=\${build_type}"\n`;
          const verifyStep = `      - name: Verify published public profile and runtime assets\n        env:\n          PAGE_URL: \${{ steps.deployment.outputs.page_url }}\n        run: |\n          set -euo pipefail\n          base="\${PAGE_URL%/}"\n          query="deployment=\${GITHUB_RUN_ID}-\${GITHUB_RUN_ATTEMPT}-\${GITHUB_SHA}"\n          for _ in $(seq 1 60); do\n            html_file="$(mktemp)"\n            profile_ok=false\n            exclusions_ok=false\n            assets_ok=false\n            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \\\n                "\${base}/werkbank_v2.html?\${query}" > "$html_file"; then\n              if grep -Fq 'name="unfallwerkbank:distribution-profile" content="public-preview-core-v1"' "$html_file" || \\\n                 grep -Fq 'js/ua.vendor_bootstrap.js' "$html_file"; then\n                profile_ok=true\n              fi\n              if ! grep -Eq 'vendor/(export|leaflet\\.heat|leaflet-draw|leaflet-image)/' "$html_file"; then\n                exclusions_ok=true\n              fi\n              if { curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \\\n                     "\${base}/vendor/leaflet/leaflet.js?\${query}" >/dev/null && \\\n                   curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \\\n                     "\${base}/vendor/leaflet.markercluster/leaflet.markercluster.js?\${query}" >/dev/null && \\\n                   curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \\\n                     "\${base}/js/ua.public-preview.js?\${query}" >/dev/null; } || \\\n                 { curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \\\n                     "\${base}/js/ua.vendor_bootstrap.js?\${query}" >/dev/null && \\\n                   curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \\\n                     "\${base}/pages-fallback/vendor-style.js?\${query}" >/dev/null && \\\n                   curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \\\n                     "\${base}/pages-fallback/vendor-runtime.js?\${query}" >/dev/null && \\\n                   curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \\\n                     "\${base}/build-manifest.json?\${query}" >/dev/null; }; then\n                assets_ok=true\n              fi\n            fi\n            rm -f "$html_file"\n            if [[ "$profile_ok" == true && "$exclusions_ok" == true && "$assets_ok" == true ]]; then exit 0; fi\n            sleep 5\n          done\n          echo "Published Pages site exposes neither the validated artifact nor the source-only fallback at \${base}" >&2\n          exit 1\n`;

          for (const relative of [
            '.github/workflows/deploy-pages-current-data.yml',
            '.github/workflows/generate-data-deploy-pages.yml',
          ]) {
            let workflow = read(relative);
            const pinStart = workflow.indexOf('      - name: Pin Pages source to GitHub Actions');
            const configureStart = workflow.indexOf('      - name: Configure Pages deployment', pinStart);
            if (pinStart < 0 || configureStart < 0) throw new Error(`Cannot replace Pages pin step in ${relative}`);
            workflow = workflow.slice(0, pinStart) + inspectStep + '\n' + workflow.slice(configureStart);
            const verifyStart = workflow.indexOf('      - name: Verify published public profile and vendor assets');
            if (verifyStart < 0) throw new Error(`Cannot replace published-site gate in ${relative}`);
            workflow = workflow.slice(0, verifyStart) + verifyStep;
            write(relative, workflow);
          }

          const publicTestPath = 'tests/unit/publicPagesProfile.test.js';
          let publicTest = read(publicTestPath);
          const oldAssertions = `      expect(jobs.deploy).toContain('Pin Pages source to GitHub Actions');\n      expect(jobs.deploy).toContain('gh api --method PUT');\n      expect(jobs.deploy).toContain('build_type=workflow');\n      expect(jobs.deploy.indexOf('Pin Pages source to GitHub Actions'))\n        .toBeLessThan(jobs.deploy.indexOf('actions/configure-pages'));`;
          const newAssertions = `      expect(jobs.deploy).toContain('Inspect Pages source mode');\n      expect(jobs.deploy).toContain('Pages build_type=');\n      expect(jobs.deploy).not.toContain('gh api --method PUT');\n      expect(jobs.deploy.indexOf('Inspect Pages source mode'))\n        .toBeLessThan(jobs.deploy.indexOf('actions/configure-pages'));`;
          if (!publicTest.includes(oldAssertions)) throw new Error('Cannot update Pages workflow unit contract');
          publicTest = publicTest.replace(oldAssertions, newAssertions)
            .replaceAll('Verify published public profile and vendor assets', 'Verify published public profile and runtime assets');
          const assetExpectation = `      expect(jobs.deploy).toContain('js/ua.public-preview.js');`;
          if (!publicTest.includes(assetExpectation)) throw new Error('Cannot extend runtime asset contract');
          publicTest = publicTest.replace(
            assetExpectation,
            `${assetExpectation}\n      expect(jobs.deploy).toContain('js/ua.vendor_bootstrap.js');\n      expect(jobs.deploy).toContain('pages-fallback/vendor-runtime.js');\n      expect(jobs.deploy).toContain('build-manifest.json');`
          );
          write(publicTestPath, publicTest);

          write(
            'tests/unit/pagesBranchFallback.test.js',
            `'use strict';\n\nconst fs = require('fs');\nconst path = require('path');\n\nconst ROOT = path.resolve(__dirname, '../..');\nconst read = relative => fs.readFileSync(path.join(ROOT, relative), 'utf8');\n\ndescribe('source-only GitHub Pages fallback', () => {\n  test('checked-in root selects the public runtime without direct excluded vendor references', () => {\n    const html = read('werkbank_v2.html');\n    expect(html).toContain('js/ua.vendor_bootstrap.js');\n    expect(html).toContain("'js/ua.public-' + 'preview.js");\n    expect(html).not.toMatch(/(?:src|href)=["']vendor\\/(?:leaflet\\.heat|leaflet-draw|leaflet-image|export)\\//);\n  });\n\n  test('fallback is lock-derived, licensed and excluded from canonical build inputs', () => {\n    const bootstrap = read('js/ua.vendor_bootstrap.js');\n    expect(bootstrap).toContain('github\\\\.io');\n    expect(bootstrap).toContain('pages-fallback/vendor-runtime.js');\n    expect(read('pages-fallback/README.md')).toContain('integrity-pinned packages');\n    expect(read('pages-fallback/LICENSE.leaflet.txt').length).toBeGreaterThan(500);\n    expect(read('pages-fallback/LICENSE.leaflet-markercluster.txt').length).toBeGreaterThan(500);\n    const build = read('scripts/build-site.js');\n    expect(build).not.toMatch(/['"]pages-fallback['"]/);\n  });\n\n  test('raw branch manifest supplies a stable export fingerprint without entering canonical artifacts', () => {\n    const manifest = JSON.parse(read('build-manifest.json'));\n    expect(manifest.distribution).toMatchObject({\n      profile: 'public-preview-core-v1',\n      publicPreview: true,\n      branchFallback: true,\n    });\n    expect(manifest.buildFingerprint).toMatch(/^[a-f0-9]{64}$/);\n    expect(manifest.applicationFingerprint).toMatch(/^[a-f0-9]{64}$/);\n  });\n});\n`
          );

          fs.unlinkSync(path.join(root, '.github/workflows/materialize-pages-branch-fallback.yml'));
          NODE

      - name: Verify generated JavaScript and focused contracts
        run: |
          node --check js/ua.vendor_bootstrap.js
          node --check pages-fallback/vendor-style.js
          node --check pages-fallback/vendor-runtime.js
          for file in pages-fallback/vendor-source-*.js; do node --check "$file"; done
          npx jest \
            tests/unit/pagesBranchFallback.test.js \
            tests/unit/publicPagesProfile.test.js \
            tests/unit/siteBuildContract.test.js \
            --runInBand

      - name: Verify full and reduced site builds
        run: |
          npm run build:site -- --input-dir out --poi-dir out --output-dir _site
          npm run validate:media
          npm run build:pages-profile -- --site _site
          npm run validate:pages-profile -- --site _site
          test ! -e _site/pages-fallback
          test ! -e _site/build-manifest.json.tmp

      - name: Commit verified fallback and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep legacy Pages publishing inside public profile'
          git push origin HEAD:main
