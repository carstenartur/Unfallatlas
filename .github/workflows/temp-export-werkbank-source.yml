name: Temporary reviewed source fix

on:
  push:
    branches:
      - agent/filing-readiness-reference-validation
    paths:
      - .github/workflows/temp-export-werkbank-source.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/filing-readiness-reference-validation
          fetch-depth: 0

      - name: Apply exact reviewed change and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/werkbank.spec.js')
          text = path.read_text(encoding='utf-8')
          old = "return text === 'Fertig.' || /^Fehler:/i.test(text);"
          new = "return text === 'Fertig.' || /^Fehler\\b/i.test(text);"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one reviewed expression, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='')
          Path('.github/workflows/temp-export-werkbank-source.yml').unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/werkbank.spec.js .github/workflows/temp-export-werkbank-source.yml
          git commit -m "Handle all report error states in browser QA"
          git push origin HEAD:agent/filing-readiness-reference-validation
