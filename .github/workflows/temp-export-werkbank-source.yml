name: Temporary reviewed source export

on:
  push:
    branches:
      - agent/filing-readiness-reference-validation
    paths:
      - .github/workflows/temp-export-werkbank-source.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload exact reviewed source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-werkbank-source
          path: tests/e2e/werkbank.spec.js
          if-no-files-found: error
          retention-days: 1
