name: PR 524 deterministic alignment

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr524-deterministic-alignment
  cancel-in-progress: true

jobs:
  align:
    if: github.head_ref == 'fix/pragmatic-public-browser-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pragmatic-public-browser-profile
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply deterministic policy alignment
        run: |
          set +e
          python scripts/pr524_align_public_profile.py > /tmp/pr524-align-simple.log 2>&1
          status=$?
          cat /tmp/pr524-align-simple.log
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          set -e
          node --check scripts/documentation-deeplink-contract.cjs
          node --check tests/e2e/documentation-deeplinks.live.spec.js
          node --check tests/e2e/smoke.spec.js
          node --check scripts/validate-public-pages-profile.js

      - name: Persist deterministic alignment failure
        if: failure()
        run: |
          cp /tmp/pr524-align-simple.log .github/pr524-alignment-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/pr524-alignment-error.txt
          git commit -m 'ci: persist deterministic PR 524 alignment failure' || true
          git push origin HEAD:fix/pragmatic-public-browser-profile

      - name: Verify focused policy, build and browser contracts
        run: |
          npm ci
          npx jest \
            tests/unit/publicPagesProfile.test.js \
            tests/unit/videoExportPublicProfile.test.js \
            tests/unit/vendorLicenseEvidence.test.js \
            tests/unit/siteBuildContract.test.js \
            --runInBand
          npm run build:site -- --input-dir out --poi-dir out --output-dir _site
          npm run build:pages-profile -- --site _site
          npm run validate:pages-profile -- --site _site

      - name: Commit verified alignment
        run: |
          rm -f .github/workflows/pr524-align-simple.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align public browser scope and provenance policy'
          git push origin HEAD:fix/pragmatic-public-browser-profile
