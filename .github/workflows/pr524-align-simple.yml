name: PR 524 deterministic alignment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr524-deterministic-alignment
  cancel-in-progress: true

jobs:
  align:
    if: github.head_ref == 'fix/pragmatic-public-browser-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pragmatic-public-browser-profile
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply deterministic policy alignment
        run: |
          python scripts/pr524_align_public_profile.py
          node --check scripts/documentation-deeplink-contract.cjs
          node --check tests/e2e/documentation-deeplinks.live.spec.js
          node --check tests/e2e/smoke.spec.js
          node --check scripts/validate-public-pages-profile.js

      - name: Verify focused policy, build and browser contracts
        run: |
          npm ci
          npx jest \
            tests/unit/publicPagesProfile.test.js \
            tests/unit/videoExportPublicProfile.test.js \
            tests/unit/vendorLicenseEvidence.test.js \
            tests/unit/siteBuildContract.test.js \
            --runInBand
          npm run build:site -- --input-dir out --poi-dir out --output-dir _site
          npm run build:pages-profile -- --site _site
          npm run validate:pages-profile -- --site _site

      - name: Package the exact verified working-tree result
        run: |
          set -euo pipefail
          result=/tmp/pr524-verified-alignment
          rm -rf "$result"
          mkdir -p "$result/files"
          while IFS= read -r -d '' file; do
            mkdir -p "$result/files/$(dirname "$file")"
            cp "$file" "$result/files/$file"
          done < <(git diff --name-only --diff-filter=ACMRT -z)
          git diff --name-only --diff-filter=D > "$result/deleted-paths.txt"
          git diff --binary > "$result/verified.patch"
          git status --short > "$result/status.txt"
          test -s "$result/verified.patch"

      - name: Upload verified alignment result
        uses: actions/upload-artifact@v7
        with:
          name: pr524-verified-alignment
          path: /tmp/pr524-verified-alignment
          if-no-files-found: error
          retention-days: 7
