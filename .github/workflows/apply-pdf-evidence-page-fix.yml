name: Apply PDF evidence page fix

on:
  push:
    branches:
      - agent/fix-pdf-evidence-page-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply exact regression fix
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64; exec(base64.b64decode(''))"
          git diff --check
          git diff -- tests/e2e/screenshots.spec.js

      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/screenshots.spec.js .github/workflows/apply-pdf-evidence-page-fix.yml
          git commit -m "test: align PDF evidence page with report sections"
          git push origin "HEAD:${GITHUB_REF_NAME}"
