name: Apply PR 625 review fix

on:
  push:
    branches:
      - agent/fix-pdf-evidence-page-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reuse the local accident count pattern
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/screenshots.spec.js')
          source = path.read_text(encoding='utf-8')
          old = r'''    expect(pdfDiagnostics.text).toMatch(
      new RegExp(`(?:^|\\D)${expectedLocalAccidents}\\s+Unfälle`, 'i')
    );
    // The rendered evidence page must contain the verified local count and
    // begin at a complete report-section boundary. This rejects continuation
    // pages while allowing the evidence-first Methodik/Antrag structure.
    expect(pdfDiagnostics.renderedPageText).toMatch(
      new RegExp(`(?:^|\\D)${expectedLocalAccidents}\\s+Unfälle`, 'i')
    );'''
          new = r'''    const localAccidentCountPattern =
      new RegExp(`(?:^|\\D)${expectedLocalAccidents}\\s+Unfälle`, 'i');
    expect(pdfDiagnostics.text).toMatch(localAccidentCountPattern);
    // The rendered evidence page must contain the verified local count and
    // begin at a complete report-section boundary. This rejects continuation
    // pages while allowing the evidence-first Methodik/Antrag structure.
    expect(pdfDiagnostics.renderedPageText).toMatch(localAccidentCountPattern);'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one review-fix anchor, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-pr625-review-fix.yml').unlink()
          PY
          git diff --check

      - name: Commit focused review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/screenshots.spec.js .github/workflows/apply-pr625-review-fix.yml
          git commit -m "test: reuse PDF accident count pattern"
          git push origin "HEAD:${GITHUB_REF_NAME}"
