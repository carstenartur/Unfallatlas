name: Agent source snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.17.0'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Package source tree and dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude=.build \
            --exclude=_site \
            --exclude=out \
            --exclude=coverage \
            --exclude=playwright-report \
            --exclude=test-results \
            -czf /tmp/unfallatlas-source-with-deps.tgz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-source-with-deps
          path: /tmp/unfallatlas-source-with-deps.tgz
          retention-days: 1
          if-no-files-found: error
