name: "03 · Straßen, Steigung und Verkehr aktualisieren"

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Optional single city; empty means every city in cities.txt'
        type: string
        required: false
      force:
        description: 'Rebuild OSM, slope and traffic producer data'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'cities.txt'
      - 'pom.xml'
      - 'qa-system-tests/**'
      - 'scripts/generate-context-city.js'
      - 'scripts/check-enrichment-inputs.js'
      - 'scripts/run-context-enrichment.js'
      - 'scripts/producers/**'
  workflow_run:
    workflows: ["01 · Unfalldaten aktualisieren"]
    types: [completed]
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: write

concurrency:
  group: enrich-context-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Restore producer cache
        uses: actions/cache@v6
        with:
          path: .enrichment-cache
          key: context-${{ runner.os }}-${{ hashFiles('scripts/producers/**', 'scripts/generate-context-city.js', 'scripts/check-enrichment-inputs.js') }}-${{ github.run_id }}
          restore-keys: |
            context-${{ runner.os }}-${{ hashFiles('scripts/producers/**', 'scripts/generate-context-city.js', 'scripts/check-enrichment-inputs.js') }}-
            context-${{ runner.os }}-
          save-always: true

      - name: Generate, validate and render selected context data
        env:
          REQUESTED_CITY: ${{ inputs.city }}
          FORCE_CONTEXT: ${{ inputs.force == true || github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'schedule' }}
        run: >-
          mvn -B -ntp verify -Pcontext-data-e2e
          -Dcontext.city="${REQUESTED_CITY:-}"
          -Dcontext.force="${FORCE_CONTEXT:-false}"

      - name: Upload context QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: context-data-maven-qa-${{ github.run_id }}
          path: |
            out/qa/
            qa-system-tests/target/failsafe-reports/
            qa-system-tests/target/testcontainers-logs/
            .build/context-selected-cities.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- out/
          if git diff --cached --quiet; then
            echo "No context-data changes."
            exit 0
          fi
          git commit -m "Regenerate verified context data"
          git push origin HEAD:${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref_name }}