name: Enrich GeoJSONs

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Optional single city; empty means every city in cities.txt'
        type: string
        required: false
      force:
        description: 'Rebuild OSM, slope and traffic producer data'
        type: boolean
        default: false
  workflow_run:
    workflows: ["Generate & Commit"]
    types: [completed]
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: write

concurrency:
  group: enrich-context-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Compute producer cache key
        id: cache-key
        shell: bash
        run: |
          set -euo pipefail
          OSM_VER=$(node -e "console.log(require('./scripts/producers/osm_producer').PRODUCER_VERSION)")
          DEM_VER=$(node -e "console.log(require('./scripts/producers/dem_producer').PRODUCER_VERSION)")
          TILE_VER=$(node -e "console.log(require('./scripts/producers/dem_tile_producer').PRODUCER_VERSION)")
          TRAFFIC_VER=$(node -e "console.log(require('./scripts/producers/traffic_producer').PRODUCER_VERSION)")
          ISO_WEEK=$(date -u +%G-W%V)
          echo "key=context-${OSM_VER}-${DEM_VER}-${TILE_VER}-${TRAFFIC_VER}-${ISO_WEEK}" >> "$GITHUB_OUTPUT"

      - name: Restore producer cache
        uses: actions/cache@v6
        with:
          path: .enrichment-cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            context-
          save-always: true

      - name: Select cities
        id: cities
        shell: bash
        env:
          REQUESTED_CITY: ${{ inputs.city }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_CITY:-}" ]]; then
            printf '%s\n' "$REQUESTED_CITY" > .build-context-cities.txt
          else
            sed -E 's/#.*$//' cities.txt | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' | awk 'NF' > .build-context-cities.txt
          fi
          test -s .build-context-cities.txt
          echo "Selected cities:"
          sed 's/^/ - /' .build-context-cities.txt

      - name: Generate context data atomically
        shell: bash
        env:
          FORCE_CONTEXT: ${{ inputs.force }}
        run: |
          set -euo pipefail
          while IFS= read -r city; do
            ARGS=(--city "$city")
            if [[ "${FORCE_CONTEXT:-false}" == "true" ]]; then ARGS+=(--force); fi
            node scripts/generate-context-city.js "${ARGS[@]}"
          done < .build-context-cities.txt

      - name: Verify producer inputs
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          while IFS= read -r city; do ARGS+=(--city "$city"); done < .build-context-cities.txt
          node scripts/check-enrichment-inputs.js "${ARGS[@]}"

      - name: Verify generated data
        env:
          UNFALLATLAS_DATA_MODE: gzip-only
        run: |
          node scripts/gzip-static-data.js --check --gzip-only
          node scripts/check-context-datasets.js
          node scripts/check-slope-plausibility.js
          node scripts/check-data-paths.js --gzip-only --min-features 10

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- out/
          if git diff --cached --quiet; then
            echo "No context-data changes."
            exit 0
          fi
          git commit -m "Regenerate verified context data"
          git push origin HEAD:${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref_name }}
