name: Enrich GeoJSONs

# Standalone wrapper around scripts/enrich_geojson.js. Runs the
# enrichment stage *without* re-running the heavy convertAmt2gmaps.sh
# step, so DEM tile refreshes or new traffic-count datasets can be
# picked up without rebuilding the accident GeoJSONs themselves.
#
# See docs/enrichment.md for the schema and the "Kontext nicht Ursache"
# disclaimer.

on:
  workflow_dispatch:
    inputs:
      skip_osm:
        description: 'Skip the OSM road-match stage'
        type: boolean
        default: false
      skip_dem:
        description: 'Skip the DEM elevation/slope stage'
        type: boolean
        default: false
      skip_traffic:
        description: 'Skip the traffic-volume stage'
        type: boolean
        default: false
      # Force flags re-run a producer even if a per-city output file is
      # already present in the (cached) output directory. Without these
      # flags the producers now resume — i.e. only generate the cities
      # that are still missing — so an interrupted, timed-out or
      # 429-throttled previous run is picked up where it left off.
      force_osm:
        description: 'Re-run OSM producer for every city even if cached output exists'
        type: boolean
        default: false
      force_dem:
        description: 'Re-run DEM producer for every city even if cached output exists'
        type: boolean
        default: false
      force_traffic:
        description: 'Re-run Traffic producer for every city even if cached output exists'
        type: boolean
        default: false
  schedule:
    # Every Sunday at 04:00 UTC. Note: cron's day-of-month and
    # day-of-week fields are OR-combined, so a "first Sunday of the
    # month" pattern would fire on any of days 1-7 *or* on every
    # Sunday — not the intended intersection. Weekly is cheap enough
    # because the script is fully idempotent.
    - cron: '0 4 * * 0'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Producer steps for OSM, DEM and Traffic source data. Each
      # producer's cache is keyed on its own version + the ISO week,
      # so we re-extract from upstream sources at most once per week —
      # well within fair-use policies and in line with the weekly
      # cron schedule above. Traffic depends on the OSM cache, so its
      # step runs after the OSM step. See docs/enrichment.md for the
      # schemas.
      - name: Compute producer cache keys
        id: producer_cache_keys
        run: |
          set -euo pipefail
          OSM_VER=$(node     -e "console.log(require('./scripts/producers/osm_producer.js').PRODUCER_VERSION)")
          DEM_VER=$(node     -e "console.log(require('./scripts/producers/dem_producer.js').PRODUCER_VERSION)")
          TILE_VER=$(node    -e "console.log(require('./scripts/producers/dem_tile_producer.js').PRODUCER_VERSION)")
          TRAFFIC_VER=$(node -e "console.log(require('./scripts/producers/traffic_producer.js').PRODUCER_VERSION)")
          ISO_WEEK=$(date -u +%G-W%V)
          YEAR=$(date -u +%Y)
          echo "osm=osm-${OSM_VER}-${ISO_WEEK}"             >> "$GITHUB_OUTPUT"
          echo "dem=dem-${DEM_VER}-${ISO_WEEK}"             >> "$GITHUB_OUTPUT"
          echo "dem_tiles=dem-tiles-${TILE_VER}-${YEAR}"    >> "$GITHUB_OUTPUT"
          # Traffic key includes the OSM key so a refreshed OSM cache
          # invalidates the traffic cache (its input changed).
          echo "traffic=traffic-${TRAFFIC_VER}-osm-${OSM_VER}-${ISO_WEEK}" >> "$GITHUB_OUTPUT"

      - name: Restore OSM producer cache
        if: ${{ inputs.skip_osm != true }}
        id: osm_cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.enrichment-cache/osm
          key: ${{ steps.producer_cache_keys.outputs.osm }}
          # Persist whatever the producer managed to generate even when
          # the job is cancelled or fails (e.g. Overpass timeout, 429
          # cool-down, runner timeout). Combined with the resume guard
          # in produceCity, the next run only fetches the cities that
          # are still missing.
          save-always: true

      - name: Produce OSM source data
        # Always run when not skipped. With `save-always: true`, a cache
        # hit may be partial (some cities missing because a previous
        # run was cancelled / 429-throttled), and a `force_osm` request
        # must take effect even when the cache key matches. The
        # per-city resume guard inside `produceCity` makes the no-op
        # case (everything already cached) cheap — a single existsSync
        # per city.
        if: ${{ inputs.skip_osm != true }}
        env:
          ENRICH_OSM_DATA_DIR: ${{ github.workspace }}/.enrichment-cache/osm
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ inputs.force_osm }}" == "true" ]]; then ARGS+=(--force); fi
          node scripts/producers/osm_producer.js "${ARGS[@]}"

      # DEM tile cache — SRTM tiles change essentially never, so we use
      # an annual cache key. `save-always: true` persists a partial
      # download so the next run only fetches the tiles that are still
      # missing. The tile downloader script is a separate step before
      # the DEM producer so it can be skipped independently.
      - name: Restore DEM tiles cache
        if: ${{ inputs.skip_dem != true }}
        id: dem_tiles_cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.enrichment-cache/dem-tiles
          key: ${{ steps.producer_cache_keys.outputs.dem_tiles }}
          save-always: true

      - name: Download DEM tiles
        if: ${{ inputs.skip_dem != true }}
        env:
          ENRICH_DEM_TILES_DIR: ${{ github.workspace }}/.enrichment-cache/dem-tiles
        run: |
          set -euo pipefail
          node scripts/producers/dem_tile_producer.js

      - name: Restore DEM producer cache
        if: ${{ inputs.skip_dem != true }}
        id: dem_cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.enrichment-cache/dem
          key: ${{ steps.producer_cache_keys.outputs.dem }}
          save-always: true

      - name: Produce DEM source data
        # See "Produce OSM source data" — same reasoning: partial
        # caches and `force_dem` both need the producer to run.
        # ENRICH_DEM_TILES_DIR activates local tile sampling by default,
        # so no Open-Meteo API calls are made in the hot path.
        if: ${{ inputs.skip_dem != true }}
        env:
          ENRICH_DEM_DATA_DIR:  ${{ github.workspace }}/.enrichment-cache/dem
          ENRICH_OSM_DATA_DIR:  ${{ github.workspace }}/.enrichment-cache/osm
          ENRICH_DEM_TILES_DIR: ${{ github.workspace }}/.enrichment-cache/dem-tiles
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ inputs.force_dem }}" == "true" ]]; then ARGS+=(--force); fi
          node scripts/producers/dem_producer.js "${ARGS[@]}"

      # Traffic depends on the OSM cache (it derives a DTV proxy from
      # each matched way's `highway` tag). When OSM is skipped, we
      # would otherwise either save an empty traffic cache under a
      # valid weekly key — which would then short-circuit subsequent
      # runs in the same week — or run the producer with no input.
      # Both restore and produce are therefore gated on `skip_osm`
      # as well.
      - name: Restore Traffic producer cache
        if: ${{ inputs.skip_traffic != true && inputs.skip_osm != true }}
        id: traffic_cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.enrichment-cache/traffic
          key: ${{ steps.producer_cache_keys.outputs.traffic }}
          save-always: true

      - name: Produce Traffic source data
        # See "Produce OSM source data" — same reasoning: partial
        # caches and `force_traffic` both need the producer to run.
        if: ${{ inputs.skip_traffic != true && inputs.skip_osm != true }}
        env:
          ENRICH_TRAFFIC_DATA_DIR: ${{ github.workspace }}/.enrichment-cache/traffic
          ENRICH_OSM_DATA_DIR:     ${{ github.workspace }}/.enrichment-cache/osm
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ inputs.force_traffic }}" == "true" ]]; then ARGS+=(--force); fi
          node scripts/producers/traffic_producer.js "${ARGS[@]}"

      - name: Run enrichment
        env:
          ENRICH_OSM_DATA_DIR:     ${{ github.workspace }}/.enrichment-cache/osm
          ENRICH_DEM_DATA_DIR:     ${{ github.workspace }}/.enrichment-cache/dem
          ENRICH_TRAFFIC_DATA_DIR: ${{ github.workspace }}/.enrichment-cache/traffic
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ inputs.skip_osm }}"     == "true" ]]; then ARGS+=(--no-osm); fi
          if [[ "${{ inputs.skip_dem }}"     == "true" ]]; then ARGS+=(--no-dem); fi
          if [[ "${{ inputs.skip_traffic }}" == "true" ]]; then ARGS+=(--no-traffic); fi
          node scripts/enrich_geojson.js "${ARGS[@]}"

      - name: Check enriched payload size budget
        run: node scripts/check-enrichment-size.js

      - name: Validate v3 context-layer datasets
        run: node scripts/check-context-datasets.js

      # Commit only when something other than the meta-sidecar
      # `generatedAt` timestamp changed. The sidecar is always
      # rewritten on every run, so committing it unconditionally would
      # produce a no-op commit on every weekly cron tick.
      - name: Commit & Push changes
        run: |
          set -euo pipefail
          # Stage everything but the meta sidecars first; only if there
          # are real diffs do we then also stage the sidecars.
          git add -A -- out/ ':!out/*.enrichment.meta.json'
          if git diff --cached --quiet; then
            echo "No enrichment changes other than meta timestamps; skipping commit."
            exit 0
          fi
          git add -A -- out/
          git commit -m "Re-run enrichment (scripts/enrich_geojson.js)"
          git push origin HEAD:${{ github.ref_name }}
