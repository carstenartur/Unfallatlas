name: "03 · Straßen, Steigung und Verkehr aktualisieren"

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Optional single city; empty means every city in cities.txt'
        type: string
        required: false
      force:
        description: 'Vorhandene OSM-, Steigungs- und Verkehrsdaten neu abrufen und ersetzen'
        required: true
        type: boolean
        default: true
      allow_stale_on_transient:
        description: 'Bei eindeutig temporärem Providerfehler den letzten vollständig validierten Stadtstand beibehalten'
        required: true
        type: boolean
        default: false
      require_hannover_dgm1:
        description: 'Für Hannover amtliches DGM1 erzwingen; ohne vollständig gepinnte Quelle fehlschlagen'
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'cities.txt'
      - 'pom.xml'
      - 'qa-system-tests/**'
      - 'scripts/generate-context-city.js'
      - 'scripts/apply-hannover-dgm1-road-profiles.js'
      - 'scripts/apply-qualitative-traffic-proxy.js'
      - 'scripts/check-enrichment-inputs.js'
      - 'scripts/run-context-enrichment.js'
      - 'scripts/providers/**'
      - 'scripts/producers/**'
  workflow_run:
    workflows: ["01 · Unfalldaten aktualisieren"]
    types: [completed]
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: write

concurrency:
  group: enrich-context-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Restore producer cache
        id: context-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .enrichment-cache
          key: context-${{ runner.os }}-${{ hashFiles('scripts/providers/**', 'scripts/producers/**', 'scripts/generate-context-city.js', 'scripts/apply-*-profiles.js', 'scripts/check-enrichment-inputs.js') }}-${{ github.run_id }}
          restore-keys: |
            context-${{ runner.os }}-${{ hashFiles('scripts/providers/**', 'scripts/producers/**', 'scripts/generate-context-city.js', 'scripts/apply-*-profiles.js', 'scripts/check-enrichment-inputs.js') }}-
            context-${{ runner.os }}-

      - name: Generate, validate and render selected context data
        env:
          REQUESTED_CITY: ${{ inputs.city }}
          FORCE_CONTEXT: ${{ inputs.force == true || github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'schedule' }}
          CONTEXT_ALLOW_STALE_ON_TRANSIENT: ${{ inputs.allow_stale_on_transient == true || github.event_name == 'workflow_run' || github.event_name == 'schedule' }}
          CONTEXT_REQUIRE_HANNOVER_DGM1: ${{ inputs.require_hannover_dgm1 == true || vars.CONTEXT_REQUIRE_HANNOVER_DGM1 == 'true' }}
          HANNOVER_DGM1_ROOT: ${{ vars.HANNOVER_DGM1_ROOT }}
          HANNOVER_DGM1_MANIFEST: ${{ vars.HANNOVER_DGM1_MANIFEST }}
          HANNOVER_DGM1_MANIFEST_SHA256: ${{ vars.HANNOVER_DGM1_MANIFEST_SHA256 }}
          HANNOVER_DGM1_PRECOMPUTED_PROFILES: ${{ vars.HANNOVER_DGM1_PRECOMPUTED_PROFILES }}
        run: >-
          mvn -B -ntp verify -Pcontext-data-e2e
          -Dcontext.city="${REQUESTED_CITY:-}"
          -Dcontext.force="${FORCE_CONTEXT:-false}"

      - name: Upload context QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context-data-maven-qa-${{ github.run_id }}
          path: |
            out/qa/
            qa-system-tests/target/failsafe-reports/
            qa-system-tests/target/testcontainers-logs/
            .build/context-selected-cities.txt
            .build/context-provider/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Save producer cache
        if: always() && steps.context-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .enrichment-cache
          key: context-${{ runner.os }}-${{ hashFiles('scripts/providers/**', 'scripts/producers/**', 'scripts/generate-context-city.js', 'scripts/apply-*-profiles.js', 'scripts/check-enrichment-inputs.js') }}-${{ github.run_id }}

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- out/ data/accident-data-release.json
          if git diff --cached --quiet; then
            echo "The context refresh completed successfully, but the resulting public data and release oracle are unchanged."
            exit 0
          fi
          git commit -m "Regenerate verified context data"
          git push origin HEAD:${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref_name }}
