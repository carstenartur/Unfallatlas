version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Renovate owns routine updates, including the npm/Docker Playwright group.
    # A zero version-update limit still permits Dependabot security updates.
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      minor-and-patch:
        exclude-patterns:
          - "testcontainers"
        update-types:
          - "minor"
          - "patch"
      testcontainers:
        patterns:
          - "testcontainers"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "maven"
    directory: "/analysis-service"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    # The root Playwright image must move with its npm packages via Renovate.
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
      day: "sunday"

  - package-ecosystem: "docker"
    directory: "/analysis-service"
    schedule:
      interval: "weekly"
      day: "sunday"
