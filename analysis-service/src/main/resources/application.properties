# ── Default-Konfiguration des Unfallatlas-Analyse-/Persistenzdienstes ───────
spring.application.name=unfallatlas-analysis-service
server.port=${PORT:8081}

# Default-Profil ist dev (H2 in-memory).  Für Produktion: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# JSON-Serialisierung: ISO-8601 für alle Zeitstempel
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Validation-Fehler vollständig ausgeben (für strukturierte Fehlermeldungen)
server.error.include-message=always
server.error.include-binding-errors=always

# ── Actuator: Health, Info, Metrics ─────────────────────────────────────────
# Standardmäßig nur Health/Info exponieren (sicher für Container-Health-
# Checks).  Weitere Endpunkte können per ENV/Profil hinzugeschaltet werden.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Optional persistence + read API for Unfallatlas LocationActionBriefs

# ── Flyway: Schema-Migrationen aktiv (sowohl dev/test als auch prod) ────────
# Migrationsskripte liegen unter classpath:db/migration/V*__*.sql
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ── Spring Batch ────────────────────────────────────────────────────────────
# Schema wird von Flyway angelegt (V3__spring_batch_schema.sql); Spring Batch
# soll seine Tabellen NICHT zusätzlich automatisch erzeugen.
spring.batch.jdbc.initialize-schema=never
# Wir starten keine Jobs beim Hochfahren der Anwendung – Auslösung erfolgt
# explizit über die REST-Endpunkte unter /api/batch/jobs/*.
spring.batch.job.enabled=false
