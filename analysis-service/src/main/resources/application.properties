# ── Default-Konfiguration des Unfallatlas-Analyse-/Persistenzdienstes ───────
spring.application.name=unfallatlas-analysis-service
server.port=${PORT:8081}

# Default-Profil ist dev (H2 in-memory).  Für Produktion: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# JSON-Serialisierung: ISO-8601 für alle Zeitstempel
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Validation-Fehler vollständig ausgeben (für strukturierte Fehlermeldungen)
server.error.include-message=always
server.error.include-binding-errors=always
