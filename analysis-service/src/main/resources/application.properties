# ── Default-Konfiguration des Unfallatlas-Analyse-/Persistenzdienstes ───────
spring.application.name=unfallatlas-analysis-service
server.port=${PORT:8081}

# Default-Profil ist dev (H2 in-memory).  Für Produktion: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# JSON-Serialisierung: ISO-8601 für alle Zeitstempel
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Validation-Fehler vollständig ausgeben (für strukturierte Fehlermeldungen)
server.error.include-message=always
server.error.include-binding-errors=always

# ── Actuator: Health, Info, Metrics ─────────────────────────────────────────
# Standardmäßig nur Health/Info exponieren (sicher für Container-Health-
# Checks).  Weitere Endpunkte können per ENV/Profil hinzugeschaltet werden.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.info.env.enabled=false
info.app.name=${spring.application.name}
info.app.description=Optional persistence + read API for Unfallatlas LocationActionBriefs

# ── Flyway: Schema-Migrationen aktiv (sowohl dev/test als auch prod) ────────
# Migrationsskripte liegen unter classpath:db/migration/V*__*.sql
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ── Spring Batch ────────────────────────────────────────────────────────────
# Auto-Run von Jobs beim Start ist über das Excludieren von
# `BatchJobLauncherAutoConfiguration` in {@code AnalysisServiceApplication}
# deaktiviert (die alte Property `spring.batch.job.enabled` ist in Boot 4
# entfallen).  Auslösung erfolgt explizit über die REST-Endpunkte unter
# {@code /api/batch/jobs/*}.
#
# Die Batch-Metadatentabellen werden durch Flyway angelegt (siehe
# V3__analysis_job_batch_link.sql), weil Spring Boot 4 keinen
# Auto-Initializer für Spring-Batch-Tabellen mehr mitbringt.

# ── Hibernate Search ────────────────────────────────────────────────────────
# Suchschicht über LocationActionBriefEntity, PoliticalReferenceSummaryEntity
# und CandidateMeasureAssessmentEntity (siehe @Indexed-Annotationen).
#
# Default-Backend: lokales Lucene-Filesystem.  Pfad ist überschreibbar über
# die Env `ANALYSIS_SEARCH_INDEX_DIR` (z. B. ein gemountetes Volume in
# Container-Setups).  Schema wird automatisch beim Boot angelegt; bestehende
# Daten werden über einen einmaligen Reindex bei Boot synchronisiert
# (siehe `de.unfallatlas.analysis.search.SearchBootstrapRunner`).
#
# Auto-Indexing: aktiviert.  Schreibvorgänge auf indizierte Entitäten
# (Ingest-API, Batch-Persistierung) propagieren sofort in den Index.
#
# Sicherheits-/Betriebs-Schalter:
#   analysis.search.enabled=true    → Search-Endpunkte aktiv
#   analysis.search.bootstrap-reindex=true → Reindex bei Boot, falls
#                                            Index leer (keine Datenmigration)
#
# Die Properties werden über `HibernateSearchPropertiesConfig`
# (HibernatePropertiesCustomizer) in die SessionFactory injiziert –
# das ist in Spring Boot 4 die zuverlässige Methode, weil
# `spring.jpa.properties.hibernate.search.*` für Hibernate Search nicht
# rechtzeitig im Bootstrap zur Verfügung stehen.
analysis.search.enabled=true
analysis.search.bootstrap-reindex=true
analysis.search.backend.type=lucene
analysis.search.backend.directory.type=local-filesystem
analysis.search.backend.directory.root=${ANALYSIS_SEARCH_INDEX_DIR:${java.io.tmpdir}/unfallatlas-search}
analysis.search.backend.lucene-version=LATEST
analysis.search.schema-management.strategy=create-or-update
analysis.search.indexing.listeners-enabled=true
analysis.search.analysis.configurer-bean=unfallatlasLuceneAnalysisConfigurer


# ── Logging: Correlation-ID in jeder Log-Zeile sichtbar ─────────────────────
# Der CorrelationIdFilter (de.unfallatlas.analysis.observability) legt
# pro Anfrage `correlationId` in MDC ab.  Wir setzen eigene Patterns für
# Konsole und Datei, die `%X{correlationId:-}` einbinden – damit trägt
# jede Log-Zeile (auch aus anderen Threads, solange MDC propagiert
# wird) das Tracing-Token.  Ist kein Wert gesetzt (z. B. Hintergrund-
# Tasks), bleibt das Feld leer.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] [%t] %-40.40logger{39} : %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] [%t] %-40.40logger{39} : %m%n%wEx
