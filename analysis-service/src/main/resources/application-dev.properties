# ── Dev-Profil: H2 in-memory mit Flyway-Migrationen ─────────────────────────
# H2 läuft im PostgreSQL-Kompatibilitätsmodus, damit dieselben Migrations-
# Skripte wie in Prod (PostgreSQL) verwendet werden können.
spring.datasource.url=jdbc:h2:mem:analysis;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway erstellt das Schema – Hibernate validiert nur noch.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
