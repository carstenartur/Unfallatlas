# ── Prod-Profil: PostgreSQL (optional PostGIS für spätere Geometrien) ───────
# Pflichtvariablen:
#   ANALYSIS_DB_URL      z. B. jdbc:postgresql://localhost:5432/unfallatlas
#   ANALYSIS_DB_USER     DB-Nutzer
#   ANALYSIS_DB_PASSWORD DB-Passwort
spring.datasource.url=${ANALYSIS_DB_URL}
spring.datasource.username=${ANALYSIS_DB_USER}
spring.datasource.password=${ANALYSIS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Schema-Migration läuft beim Boot über Flyway (Skripte in
# `db/migration/V*__*.sql`).  In Prod ist es bewusst nicht erlaubt, das
# Schema zu "cleanen".
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# PostGIS wird vom Persistenzschema dieser Iteration noch nicht benötigt;
# Geometrien werden vorerst nicht direkt gespeichert.
