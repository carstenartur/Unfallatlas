# ── Test-Profil: H2 in-memory mit Flyway-Migrationen ────────────────────────
# Wir verwenden bewusst dasselbe Setup wie Dev (PostgreSQL-Kompatibilitäts-
# Modus + Flyway-Migrationen), damit die Tests reproduzieren, was später
# auch im Prod-Betrieb gegen PostgreSQL läuft.
spring.datasource.url=jdbc:h2:mem:analysis-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── Hibernate Search: in-memory pro Test-Context ────────────────────────────
# Wir verwenden das `local-heap`-Backend, damit jeder Spring-Context im
# Test seinen eigenen Lucene-Index im JVM-Heap bekommt.  So gibt es keine
# Datei-Lock-Kollisionen, wenn Spring mehrere Contexts in derselben
# Surefire-JVM startet (z. B. JobConfig + Controller-Test).
analysis.search.backend.directory.type=local-heap
analysis.search.bootstrap-reindex=true

