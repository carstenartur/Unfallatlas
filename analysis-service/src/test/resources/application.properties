# ── Test-Profil: H2 in-memory mit Flyway-Migrationen ────────────────────────
# Wir verwenden bewusst dasselbe Setup wie Dev (PostgreSQL-Kompatibilitäts-
# Modus + Flyway-Migrationen), damit die Tests reproduzieren, was später
# auch im Prod-Betrieb gegen PostgreSQL läuft.
spring.datasource.url=jdbc:h2:mem:analysis-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── Hibernate Search: separater Index pro Testlauf ──────────────────────────
# Pro VM-PID und Test-Run einen eigenen Pfad, damit parallele Maven-Runs
# nicht auf denselben Index schreiben.  Bootstrap-Reindex bleibt aktiv,
# damit Tests mit existierenden Briefs den Index bei Bedarf füllen.
spring.jpa.properties.hibernate.search.backend.directory.root=${java.io.tmpdir}/unfallatlas-search-test-${user.name}-${spring.application.name:test}
analysis.search.bootstrap-reindex=true

