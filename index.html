<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unfallatlas – Webkarte</title>

  <!-- Leaflet (CDN) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; }
    .panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: white; padding: 10px 12px; border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      font: 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 320px;
    }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    label { font-weight: 600; }
    select, input { width: 100%; padding: 6px; }
    .muted { color: #666; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <div><strong>Unfallatlas – Webkarte</strong></div>

    <div class="row">
      <label for="year">Jahr</label>
      <select id="year">
        <option value="all">Alle</option>
      </select>
    </div>

    <div class="row">
      <label for="kat">Kategorie</label>
      <select id="kat">
        <option value="all">Alle</option>
        <option value="1">1 (Getötete)</option>
        <option value="2">2 (Schwer)</option>
        <option value="3">3 (Leicht)</option>
      </select>
    </div>

    <div class="row">
      <label for="limit">Max Punkte</label>
      <input id="limit" type="number" min="100" step="100" value="5000" />
    </div>

    <div class="muted">
      Datenquelle: <code>out/output_all_years.geojson</code><br/>
      Tipp: Große Datenmengen können mobil langsam sein.
    </div>
  </div>

  <script>
    // Karte initialisieren (Start: Hannover ungefähr)
    const map = L.map('map').setView([52.3759, 9.7320], 12);

    // Basiskarte (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap-Mitwirkende'
    }).addTo(map);

    let allFeatures = null;
    let layer = null;

    // einfache "Farblogik" nach UKATEGORIE
    function colorForKat(kat) {
      // Leaflet default colors vermeiden wir nicht explizit – wir geben nur unterschiedliche opacities/weights,
      // aber okay: wir nehmen hier einfach unterschiedliche Radiuswerte statt Farben, damit es neutral bleibt.
      // Wenn du Farben willst, sag Bescheid.
      return { radius: kat === "1" ? 8 : kat === "2" ? 6 : 4 };
    }

    function popupHtml(p) {
      const esc = (s) => String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
      return `
        <div style="font: 14px/1.25 system-ui;">
          <div><strong>${esc(p.name)}</strong></div>
          <div>Jahr: ${esc(p.year)}</div>
          <div>Kategorie: ${esc(p.ukategorie)}</div>
          <div>Uhrzeit: ${esc(p.ustunde)} / Wochentag: ${esc(p.uwochentag)} / Monat: ${esc(p.umonat)}</div>
          <div>Licht: ${esc(p.ulichtverh)}</div>
          <div>Straße: ${esc(p.strasse)}</div>
          <div>Straßenzustand: ${esc(p.strzustand)}</div>
        </div>
      `;
    }

    function buildYearOptions(features) {
      const years = new Set();
      for (const f of features) {
        if (f.properties && f.properties.year) years.add(String(f.properties.year));
      }
      const yearSel = document.getElementById('year');
      [...years].sort().forEach(y => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        yearSel.appendChild(opt);
      });
    }

    function applyFilter() {
      if (!allFeatures) return;

      const year = document.getElementById('year').value;
      const kat = document.getElementById('kat').value;
      const maxN = Math.max(100, parseInt(document.getElementById('limit').value || "5000", 10));

      // filtern + begrenzen
      const filtered = [];
      for (const f of allFeatures.features) {
        const p = f.properties || {};
        if (year !== "all" && String(p.year) !== year) continue;
        if (kat !== "all" && String(p.ukategorie) !== kat) continue;
        filtered.push(f);
        if (filtered.length >= maxN) break;
      }

      // Layer neu rendern
      if (layer) layer.remove();

      layer = L.geoJSON({ type: "FeatureCollection", features: filtered }, {
        pointToLayer: (feature, latlng) => {
          const p = feature.properties || {};
          const k = String(p.ukategorie || "");
          const r = colorForKat(k).radius;
          return L.circleMarker(latlng, { radius: r });
        },
        onEachFeature: (feature, l) => {
          l.bindPopup(popupHtml(feature.properties || {}));
        }
      }).addTo(map);

      // Karte grob passend zoomen
      if (filtered.length > 0) {
        try { map.fitBounds(layer.getBounds(), { padding: [20, 20] }); } catch {}
      }
    }

    async function main() {
      // GeoJSON laden (liegt im Repo)
      const resp = await fetch('out/output_all_years.geojson', { cache: "no-store" });
      if (!resp.ok) throw new Error("GeoJSON konnte nicht geladen werden: " + resp.status);

      allFeatures = await resp.json();
      buildYearOptions(allFeatures.features ? {features: allFeatures.features} : allFeatures);

      // initial
      applyFilter();

      // UI-Events
      document.getElementById('year').addEventListener('change', applyFilter);
      document.getElementById('kat').addEventListener('change', applyFilter);
      document.getElementById('limit').addEventListener('change', applyFilter);
    }

    main().catch(err => {
      console.error(err);
      alert(String(err));
    });
  </script>
</body>
</html>
