<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unfallatlas – Webkarte (Viewport + Cluster + Heatmap)</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- MarkerCluster -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    crossorigin=""
  ></script>

  <!-- Heatmap plugin -->
  <script
    src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"
    crossorigin=""
  ></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; }

    .panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 10px 12px; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.18);
      font: 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 380px;
    }

    .panelHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .panelTitle { font-weight: 800; }
    .panelSub { color:#666; font-weight:600; }

    .collapseBtn{
      border: 1px solid rgba(0,0,0,.15);
      background: rgba(250,250,250,.72);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      user-select:none;
      font-weight:700;
      line-height: 1;
    }
    .collapseBtn:hover { background: rgba(240,240,240,.82); }

    .panelBody { margin-top: 8px; }
    .panel.collapsed .panelBody { display:none; }
    .panel.collapsed { padding-bottom: 8px; }

    .row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin-top: 8px; }
    label { font-weight: 600; }
    select, input {
      width: 100%; padding: 6px 8px;
      border: 1px solid #ddd; border-radius: 8px;
      font: inherit;
      background: rgba(255,255,255,.76);
    }

    .toggles { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: rgba(250,250,250,.76);
      cursor: pointer;
      user-select: none;
      text-align: center;
      font-weight: 700;
    }
    .btn.active { background: rgba(233,242,255,.82); border-color: rgba(183,212,255,.95); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .chip {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      border: 1px solid #ddd;
      background: rgba(255,255,255,.76);
      border-radius: 999px;
      padding: 6px 10px;
      user-select: none;
    }
    .chip input { width: auto; }
    .chip span { font-weight: 700; }

    .muted { color: #666; font-size: 12px; margin-top: 8px; }
    .stat { margin-top: 8px; font-size: 12px; color: #333; }
    code { background: rgba(243,243,243,.82); padding: 1px 4px; border-radius: 6px; }

    .debugBox {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px dashed rgba(0,0,0,.25);
      border-radius: 10px;
      background: rgba(255,255,255,.62);
      font-size: 12px;
      color:#333;
    }
    .debugBox strong { font-weight: 800; }

    /* === Dual Range (wie ein Slider mit 2 Knöpfen) === */
    .rangeWrap { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .rangeLabel { font-size: 12px; color: #333; display:flex; justify-content:space-between; }
    .dualRange {
      position: relative;
      height: 26px;
    }
    .dualRange input[type="range"]{
      position: absolute;
      left: 0; right: 0;
      top: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      pointer-events: none; /* nur Thumb soll klickbar sein */
      -webkit-appearance: none;
      appearance: none;
      height: 26px;
    }
    .dualRange input[type="range"]::-webkit-slider-thumb{
      pointer-events: auto;
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.25);
      background: rgba(255,255,255,.95);
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    .dualRange input[type="range"]::-moz-range-thumb{
      pointer-events: auto;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.25);
      background: rgba(255,255,255,.95);
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }

    /* Track */
    .dualRangeTrack{
      position:absolute;
      left:0; right:0;
      top: 50%;
      transform: translateY(-50%);
      height: 6px;
      border-radius: 999px;
      background: rgba(0,0,0,.12);
    }
    .dualRangeFill{
      position:absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 6px;
      border-radius: 999px;
      background: rgba(120,170,255,.75);
      left: 0%;
      right: 0%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel" id="panel">
    <div class="panelHeader">
      <div>
        <div class="panelTitle">Unfallatlas</div>
        <div class="panelSub">(Viewport-Render)</div>
      </div>
      <div class="collapseBtn" id="collapseBtn" title="Ein-/Ausklappen">▾</div>
    </div>

    <div class="panelBody" id="panelBody">
      <div class="row">
        <label for="year">Jahr</label>
        <select id="year">
          <option value="all">Alle</option>
        </select>
      </div>

      <div class="row">
        <label for="kat">Kategorie</label>
        <select id="kat">
          <option value="all">Alle</option>
          <option value="1">1 (Getötete)</option>
          <option value="2">2 (Schwer)</option>
          <option value="3">3 (Leicht)</option>
        </select>
      </div>

      <div style="margin-top:10px; font-weight:800;">Beteiligung</div>
      <div class="chips" aria-label="Beteiligung Filter">
        <label class="chip"><input type="checkbox" id="tRad" checked> <span>🚲 Rad</span></label>
        <label class="chip"><input type="checkbox" id="tFuss" checked> <span>🚶 Fuß</span></label>
        <label class="chip"><input type="checkbox" id="tPKW" checked> <span>🚗 PKW</span></label>
        <label class="chip"><input type="checkbox" id="tKrad"> <span>🏍️ Krad</span></label>
        <label class="chip"><input type="checkbox" id="tGkfz"> <span>🚛 Gkfz</span></label>
        <label class="chip"><input type="checkbox" id="tSon"> <span>🚌 Sonst.</span></label>
      </div>

      <div class="toggles" aria-label="Beteiligungsmodus">
        <div id="modeOr" class="btn active" title="Mindestens eine der ausgewählten Beteiligungen muss zutreffen">ODER</div>
        <div id="modeAnd" class="btn" title="Alle ausgewählten Beteiligungen müssen zutreffen">UND</div>
        <div id="modeSolo" class="btn" title="Genau eine Beteiligungsart insgesamt (Rad/Fuß/PKW/Krad/Gkfz/Sonst.) – passend zu den Häkchen">Alleinunfall</div>
      </div>

      <div style="margin-top:10px; font-weight:800;">Zeit & Bedingungen</div>

      <!-- Stunde als Dual-Range (ein Slider mit 2 Knöpfen) -->
      <div class="row">
        <label>Stunde</label>
        <div class="rangeWrap">
          <div class="rangeLabel">
            <span>von: <strong id="hFromLbl">0</strong></span>
            <span>bis: <strong id="hToLbl">23</strong></span>
          </div>

          <div class="dualRange" aria-label="Stundenbereich">
            <div class="dualRangeTrack"></div>
            <div class="dualRangeFill" id="hourFill"></div>
            <input id="hFrom" type="range" min="0" max="23" step="1" value="0" />
            <input id="hTo" type="range" min="0" max="23" step="1" value="23" />
          </div>

          <div class="muted" style="margin-top:0;">
            (Kein Wrap-around mehr: Start ist immer ≤ Ende.)
          </div>
        </div>
      </div>

      <div class="row">
        <label for="weekend">Wochenende</label>
        <select id="weekend" title="UWOCHENTAG: Sa/So vs. Mo–Fr">
          <option value="all">Alle</option>
          <option value="weekend">Nur Wochenende (Sa/So)</option>
          <option value="weekday">Nur Werktag (Mo–Fr)</option>
        </select>
      </div>

      <div class="row">
        <label for="strz">Straßenzustand</label>
        <select id="strz" title="STRZUSTAND: 0 trocken, 1 nass/feucht, 2 winterglatt">
          <option value="all">Alle</option>
        </select>
      </div>

      <div class="row">
        <label for="maxn">Max Punkte</label>
        <input id="maxn" type="number" min="500" step="500" value="40000" />
      </div>

      <div class="row">
        <label for="pad">Viewport-Padding</label>
        <input id="pad" type="number" min="0" max="100" step="5" value="20" />
      </div>

      <div class="row">
        <label for="heatR">Heat Radius</label>
        <input id="heatR" type="number" min="5" max="60" step="1" value="25" />
      </div>

      <div class="toggles">
        <div id="toggleCluster" class="btn active">Cluster</div>
        <div id="toggleHeat" class="btn active">Heatmap</div>
      </div>

      <div class="stat" id="stat">Lade Daten…</div>

      <div class="debugBox" id="debugBox" style="display:none;">
        <strong>Debug (Daten enthalten):</strong><br/>
        <span id="dbgCounts">—</span>
      </div>

      <div class="muted">
        Quelle: <code>out/output_all_years.geojson</code><br/>
        Rendert nur Punkte im Kartenausschnitt (plus Padding).
      </div>
    </div>
  </div>

  <script>
    const map = L.map('map', { preferCanvas: true }).setView([52.3759, 9.7320], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap-Mitwirkende'
    }).addTo(map);

    const WEEKEND_SET = new Set(["1","7"]); // Sonntag + Samstag

    const STRZ_LABEL = {
      "0": "0 – trocken",
      "1": "1 – nass/feucht",
      "2": "2 – winterglatt",
      "":  "— unbekannt"
    };

    // Panel collapse
    const panelEl = document.getElementById('panel');
    const collapseBtn = document.getElementById('collapseBtn');

    function setCollapsed(on){
      panelEl.classList.toggle('collapsed', on);
      collapseBtn.textContent = on ? "▸" : "▾";
      try { localStorage.setItem("ua_panel_collapsed", on ? "1" : "0"); } catch {}
    }
    const savedCollapsed = (() => { try { return localStorage.getItem("ua_panel_collapsed"); } catch { return null; } })();
    if (savedCollapsed === "1") setCollapsed(true);
    collapseBtn.addEventListener('click', () => setCollapsed(!panelEl.classList.contains('collapsed')));

    // UI
    const yearEl = document.getElementById('year');
    const katEl = document.getElementById('kat');
    const maxEl = document.getElementById('maxn');
    const padEl = document.getElementById('pad');
    const heatREl = document.getElementById('heatR');
    const statEl = document.getElementById('stat');
    const btnCluster = document.getElementById('toggleCluster');
    const btnHeat = document.getElementById('toggleHeat');

    const tRadEl = document.getElementById('tRad');
    const tFussEl = document.getElementById('tFuss');
    const tPKWEl = document.getElementById('tPKW');
    const tKradEl = document.getElementById('tKrad');
    const tGkfzEl = document.getElementById('tGkfz');
    const tSonEl = document.getElementById('tSon');

    const btnModeOr = document.getElementById('modeOr');
    const btnModeAnd = document.getElementById('modeAnd');
    const btnModeSolo = document.getElementById('modeSolo');
    let involvementMode = "or";

    const hFromEl = document.getElementById('hFrom');
    const hToEl = document.getElementById('hTo');
    const hFromLbl = document.getElementById('hFromLbl');
    const hToLbl = document.getElementById('hToLbl');
    const hourFill = document.getElementById('hourFill');

    const weekendEl = document.getElementById('weekend');
    const strzEl = document.getElementById('strz');

    const debugBox = document.getElementById('debugBox');
    const dbgCounts = document.getElementById('dbgCounts');

    let showCluster = true;
    let showHeat = true;

    let all = null;
    let allPts = [];
    let filteredGlobal = [];
    let viewportPts = [];

    let clusterLayer = null;
    let heatLayer = null;

    function setBtnState(btn, on) { btn.classList.toggle('active', on); }

    function setMode(next){
      involvementMode = next;
      setBtnState(btnModeOr, next === "or");
      setBtnState(btnModeAnd, next === "and");
      setBtnState(btnModeSolo, next === "solo");
      applyGlobalFilter();
      applyViewportFilter();
      renderLayers();
    }

    function escHtml(s) {
      return String(s ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    }

    function involvementText(p) {
      const tags = [];
      if (String(p?.istrad) === "1") tags.push("🚲 Rad");
      if (String(p?.istfuss) === "1") tags.push("🚶 Fuß");
      if (String(p?.istpkw) === "1") tags.push("🚗 PKW");
      if (String(p?.istkrad) === "1") tags.push("🏍️ Krad");
      if (String(p?.istgkfz) === "1") tags.push("🚛 Gkfz");
      if (String(p?.istsonstig) === "1") tags.push("🚌 Sonst.");
      return tags.length ? tags.join(", ") : "—";
    }

    function strzText(code) {
      const k = String(code ?? "");
      return STRZ_LABEL[k] ?? (`Code ${k}`);
    }

    function popupHtml(p) {
      return `
        <div style="font: 14px/1.25 system-ui;">
          <div><strong>${escHtml(p.name)}</strong></div>
          <div>Jahr: ${escHtml(p.year)}</div>
          <div>Kategorie: ${escHtml(p.ukategorie)}</div>
          <div>Beteiligung: ${escHtml(involvementText(p))}</div>
          <div>Uhrzeit: ${escHtml(p.ustunde)} / Wochentag: ${escHtml(p.uwochentag)} / Monat: ${escHtml(p.umonat)}</div>
          <div>Straßenzustand: ${escHtml(strzText(p.strzustand))}</div>
          <div>Licht: ${escHtml(p.ulichtverh)}</div>
          <div>Straße: ${escHtml(p.strasse)}</div>
        </div>
      `;
    }

    function buildYearOptions(features) {
      const years = new Set();
      for (const f of features) {
        const y = f?.properties?.year;
        if (y !== undefined && y !== null && y !== "") years.add(String(y));
      }
      [...years].sort().forEach(y => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        yearEl.appendChild(opt);
      });
    }

    function buildStrzOptions(points) {
      const codes = new Set();
      for (const p of points) {
        const v = p?.props?.strzustand;
        if (v === undefined || v === null || v === "") { codes.add(""); continue; }
        codes.add(String(v));
      }
      const sorted = [...codes].sort((a,b) => {
        const ai = (a === "" ? 999 : parseInt(a,10));
        const bi = (b === "" ? 999 : parseInt(b,10));
        return ai - bi;
      });
      for (const c of sorted) {
        const opt = document.createElement('option');
        opt.value = (c === "" ? "__unknown__" : c);
        opt.textContent = strzText(c);
        strzEl.appendChild(opt);
      }
    }

    function extractPoints(geojson) {
      const pts = [];
      const feats = geojson?.features || [];
      for (const f of feats) {
        const g = f?.geometry;
        if (!g || g.type !== "Point" || !Array.isArray(g.coordinates)) continue;
        const [lon, lat] = g.coordinates;
        if (typeof lat !== "number" || typeof lon !== "number") continue;
        pts.push({ lat, lon, props: f.properties || {} });
      }
      return pts;
    }

    function getPaddedBounds() {
      const padPct = Math.max(0, Math.min(100, parseInt(padEl.value || "20", 10))) / 100.0;
      const b = map.getBounds();
      const latSpan = b.getNorth() - b.getSouth();
      const lonSpan = b.getEast() - b.getWest();
      const dLat = latSpan * padPct;
      const dLon = lonSpan * padPct;
      return L.latLngBounds(
        [b.getSouth() - dLat, b.getWest() - dLon],
        [b.getNorth() + dLat, b.getEast() + dLon]
      );
    }

    /* === Dual Range Logic: erzwingt start <= end + aktualisiert Fill/Labels === */
    function syncHourUI(changed){
      let a = parseInt(hFromEl.value, 10);
      let b = parseInt(hToEl.value, 10);

      if (changed === "from" && a > b) { b = a; hToEl.value = String(b); }
      if (changed === "to"   && b < a) { a = b; hFromEl.value = String(a); }

      hFromLbl.textContent = String(a);
      hToLbl.textContent = String(b);

      const min = parseInt(hFromEl.min,10);
      const max = parseInt(hFromEl.max,10);
      const span = (max - min) || 1;

      const leftPct = ((a - min) / span) * 100;
      const rightPct = 100 - ((b - min) / span) * 100;

      hourFill.style.left = `${leftPct}%`;
      hourFill.style.right = `${rightPct}%`;
    }

    function countInvolvement(points){
      let rad=0, fuss=0, pkw=0, krad=0, solo=0, radpkw=0;
      for (const p of points) {
        const pr = p.props || {};
        const isRad  = String(pr?.istrad)  === "1";
        const isFuss = String(pr?.istfuss) === "1";
        const isPKW  = String(pr?.istpkw)  === "1";
        const isKrad = String(pr?.istkrad) === "1";

        if (isRad) rad++;
        if (isFuss) fuss++;
        if (isPKW) pkw++;
        if (isKrad) krad++;

        const c = (isRad?1:0)+(isFuss?1:0)+(isPKW?1:0)+(isKrad?1:0);
        if (c === 1) solo++;
        if (isRad && isPKW) radpkw++;
      }
      return {rad,fuss,pkw,krad,solo,radpkw};
    }

    function updateDebugBox(){
      const c = countInvolvement(allPts);
      debugBox.style.display = "block";
      dbgCounts.textContent =
        `Rad: ${c.rad.toLocaleString()} | Fuß: ${c.fuss.toLocaleString()} | ` +
        `PKW: ${c.pkw.toLocaleString()} | Krad: ${c.krad.toLocaleString()} | ` +
        `Alleinunfälle (gesamt): ${c.solo.toLocaleString()} | ` +
        `Kombi Rad+PKW: ${c.radpkw.toLocaleString()}`;
    }

    function applyGlobalFilter() {
      if (!all) return;

      const wantYear = yearEl.value;
      const wantKat = katEl.value;
      const wantStrz = strzEl.value;

      const maxN = Math.max(500, parseInt(maxEl.value || "40000", 10));

      const hFrom = parseInt(hFromEl.value || "0", 10);
      const hTo   = parseInt(hToEl.value || "23", 10);

      const weekendMode = weekendEl.value;

      const sRad  = tRadEl.checked;
      const sFuss = tFussEl.checked;
      const sPKW  = tPKWEl.checked;
      const sKrad = tKradEl.checked;
      const sGkfz = tGkfzEl ? tGkfzEl.checked : false;
      const sSon  = tSonEl ? tSonEl.checked : false;
      const anySelected = sRad || sFuss || sPKW || sKrad || sGkfz || sSon;

      const out = [];
      for (const p of allPts) {
        const pr = p.props || {};

        if (wantYear !== "all" && String(pr.year) !== wantYear) continue;
        if (wantKat !== "all" && String(pr.ukategorie) !== wantKat) continue;

        if (wantStrz !== "all") {
          const z = String(pr.strzustand ?? "");
          if (wantStrz === "__unknown__") {
            if (z !== "" && z !== "null" && z !== "undefined") continue;
          } else {
            if (z !== String(wantStrz)) continue;
          }
        }

        if (weekendMode !== "all") {
          const wd = String(pr.uwochentag ?? "");
          const isWeekend = WEEKEND_SET.has(wd);
          if (weekendMode === "weekend" && !isWeekend) continue;
          if (weekendMode === "weekday" && isWeekend) continue;
        }

        const h = parseInt(pr.ustunde, 10);
        if (Number.isNaN(h)) continue;
        if (h < hFrom || h > hTo) continue; // KEIN wrap-around mehr

        const isRad  = String(pr?.istrad)  === "1";
        const isFuss = String(pr?.istfuss) === "1";
        const isPKW  = String(pr?.istpkw)  === "1";
        const isKrad = String(pr?.istkrad) === "1";
        const isGkfz = String(pr?.istgkfz) === "1";
        const isSon  = String(pr?.istsonstig) === "1";

        if (!anySelected) continue;

        if (involvementMode === "or") {
          const ok =
            (sRad  && isRad)  ||
            (sFuss && isFuss) ||
            (sPKW  && isPKW)  ||
            (sKrad && isKrad) ||
            (sGkfz && isGkfz) ||
            (sSon  && isSon);
          if (!ok) continue;
        } else if (involvementMode === "and") {
          if (sRad  && !isRad)  continue;
          if (sFuss && !isFuss) continue;
          if (sPKW  && !isPKW)  continue;
          if (sKrad && !isKrad) continue;
          if (sGkfz && !isGkfz) continue;
          if (sSon  && !isSon)  continue;
        } else if (involvementMode === "solo") {
          const involvedCount =
            (isRad  ? 1 : 0) +
            (isFuss ? 1 : 0) +
            (isPKW  ? 1 : 0) +
            (isKrad ? 1 : 0) +
            (isGkfz ? 1 : 0) +
            (isSon  ? 1 : 0);
          if (involvedCount !== 1) continue;

          const ok =
            (sRad  && isRad)  ||
            (sFuss && isFuss) ||
            (sPKW  && isPKW)  ||
            (sKrad && isKrad) ||
            (sGkfz && isGkfz) ||
            (sSon  && isSon);
          if (!ok) continue;
        }

        out.push(p);
        if (out.length >= maxN) break;
      }

      filteredGlobal = out;
    }

    function applyViewportFilter() {
      const vb = getPaddedBounds();
      const out = [];
      for (const p of filteredGlobal) {
        if (vb.contains([p.lat, p.lon])) out.push(p);
      }
      viewportPts = out;
    }

    function renderLayers() {
      if (clusterLayer) { clusterLayer.remove(); clusterLayer = null; }
      if (heatLayer) { heatLayer.remove(); heatLayer = null; }

      const pts = viewportPts;

      if (showCluster) {
        clusterLayer = L.markerClusterGroup({
          chunkedLoading: true,
          chunkInterval: 200,
          spiderfyOnMaxZoom: true,
          showCoverageOnHover: false
        });

        for (const p of pts) {
          const m = L.circleMarker([p.lat, p.lon], { radius: 4 });
          m.bindPopup(popupHtml(p.props));
          clusterLayer.addLayer(m);
        }
        clusterLayer.addTo(map);
      }

      if (showHeat) {
        const r = Math.max(5, Math.min(60, parseInt(heatREl.value || "25", 10)));
        const heatPts = pts.map(p => {
          const k = String(p.props?.ukategorie || "");
          const w = (k === "1") ? 1.0 : (k === "2") ? 0.7 : (k === "3") ? 0.4 : 0.5;
          return [p.lat, p.lon, w];
        });

        heatLayer = L.heatLayer(heatPts, {
          radius: r,
          blur: 18,
          maxZoom: 17
        }).addTo(map);
      }

      const activeTypes = [
        tRadEl.checked ? "Rad" : null,
        tFussEl.checked ? "Fuß" : null,
        tPKWEl.checked ? "PKW" : null,
        tKradEl.checked ? "Krad" : null,
        tGkfzEl && tGkfzEl.checked ? "Gkfz" : null,
        tSonEl && tSonEl.checked ? "Sonst." : null
      ].filter(Boolean).join(", ");

      const modeLabel =
        involvementMode === "or" ? "ODER" :
        involvementMode === "and" ? "UND" : "Alleinunfall";

      statEl.textContent =
        `Gesamt geladen: ${allPts.length.toLocaleString()} | ` +
        `Nach Filter: ${filteredGlobal.length.toLocaleString()} | ` +
        `Im Viewport: ${viewportPts.length.toLocaleString()} | ` +
        `Beteiligung: ${activeTypes || "—"} | ` +
        `Modus: ${modeLabel} | ` +
        `Stunden: ${hFromEl.value}–${hToEl.value}`;
    }

    let moveTimer = null;
    function scheduleViewportUpdate() {
      if (!all) return;
      if (moveTimer) clearTimeout(moveTimer);
      moveTimer = setTimeout(() => {
        applyViewportFilter();
        renderLayers();
      }, 150);
    }

    async function main() {
      const resp = await fetch('out/output_all_years.geojson', { cache: "no-store" });
      if (!resp.ok) throw new Error("GeoJSON konnte nicht geladen werden: " + resp.status);

      all = await resp.json();
      buildYearOptions(all.features || []);
      allPts = extractPoints(all);
      buildStrzOptions(allPts);

      updateDebugBox();

      // init hour UI
      syncHourUI();

      applyGlobalFilter();
      applyViewportFilter();
      renderLayers();

      for (const el of [yearEl, katEl, maxEl, strzEl, weekendEl]) {
        el.addEventListener('change', () => {
          applyGlobalFilter();
          applyViewportFilter();
          renderLayers();
        });
      }

      // Dual-range events
      hFromEl.addEventListener('input', () => {
        syncHourUI("from");
        applyGlobalFilter(); applyViewportFilter(); renderLayers();
      });
      hToEl.addEventListener('input', () => {
        syncHourUI("to");
        applyGlobalFilter(); applyViewportFilter(); renderLayers();
      });

      for (const el of [tRadEl, tFussEl, tPKWEl, tKradEl, tGkfzEl, tSonEl].filter(Boolean)) {
        el.addEventListener('change', () => {
          applyGlobalFilter();
          applyViewportFilter();
          renderLayers();
        });
      }

      btnModeOr.addEventListener('click', () => setMode("or"));
      btnModeAnd.addEventListener('click', () => setMode("and"));
      btnModeSolo.addEventListener('click', () => setMode("solo"));
      setMode("or");

      padEl.addEventListener('change', () => { applyViewportFilter(); renderLayers(); });
      heatREl.addEventListener('change', () => renderLayers());

      btnCluster.addEventListener('click', () => {
        showCluster = !showCluster;
        setBtnState(btnCluster, showCluster);
        renderLayers();
      });
      btnHeat.addEventListener('click', () => {
        showHeat = !showHeat;
        setBtnState(btnHeat, showHeat);
        renderLayers();
      });

      setBtnState(btnCluster, showCluster);
      setBtnState(btnHeat, showHeat);

      map.on('moveend zoomend', scheduleViewportUpdate);
    }

    main().catch(err => {
      console.error(err);
      statEl.textContent = String(err);
      alert(String(err));
    });
  </script>
</body>
</html>
